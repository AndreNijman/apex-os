name: release-shell

# Fast path for Rime Shell/config-only releases. The slow platform image keeps
# packages, Mesa, the NVIDIA and controller akmods and the initramfs stable; this
# workflow adds only the exact shell commit and republishes the user-facing tags.
#
# ONE image, FOUR names. This used to be a three-leg matrix, and leaving it that
# way after the editions collapsed would have been actively harmful: three legs
# building the same content produce three DIFFERENT digests, which would push
# `:daily`, `:gaming-mesa` and `:gaming-nvidia` apart again and break the
# invariant build-image.yml now asserts. One build, promoted to every name.
on:
  workflow_dispatch:
    inputs:
      shell_ref:
        description: "Exact rime-shell commit (blank resolves rime-shell/main)"
        type: string
        default: ""

concurrency:
  group: apex-image-publish  # rime-rename: keep (build-image.yml's group; see there)
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/andrenijman/rime-os
  # Every release is ALSO published under the pre-rebrand name, as
  # build-image.yml's last step does: machines that have not moved yet pull it.
  OLD_IMAGE: ghcr.io/andrenijman/apex-os  # rime-rename: keep (machines that have not moved pull this)
  # The shell repository under the name that resolves on both sides of the
  # GitHub rename (the old name redirects; the new one exists only after).
  SHELL_REPO: AndreNijman/apex-shell  # rime-rename: keep (works before and after the GitHub rename)
  REGISTRY: ghcr.io

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      shell_sha: ${{ steps.shell.outputs.sha }}
      shell_strict: ${{ steps.shell.outputs.strict }}
    steps:
      - id: shell
        env:
          REQUESTED: ${{ inputs.shell_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$REQUESTED"
          if [ -z "$sha" ]; then
            sha="$(gh api "repos/$SHELL_REPO/commits/main" --jq .sha)"
            strict=1
          else
            strict=0
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::shell_ref must resolve to a full commit SHA"; exit 1; }
          # Ensure a typo cannot produce a delayed clone failure in every matrix leg.
          gh api "repos/$SHELL_REPO/commits/$sha" --silent
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "strict=$strict" >> "$GITHUB_OUTPUT"
          echo "Releasing rime-shell $sha"

  release:
    needs: resolve
    runs-on: ubuntu-24.04
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        run: |
          echo "$GHCR_TOKEN" | sudo podman login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          cosign login "$REGISTRY" -u "$GHCR_USER" -p "$GHCR_TOKEN"

      - uses: docker/setup-buildx-action@v3

      - name: Resolve stable platform
        id: platform
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          echo '{}' > "$REGISTRY_AUTH_FILE"
          creds="$GHCR_USER:$GHCR_TOKEN"
          platform="$IMAGE:platform-rime"

          # One-time migration: snapshot the last green user image. Future full
          # platform builds refresh this tag explicitly. `platform-rime` is new
          # with the rebrand, so fall back to `platform-apex` (the same full (rime-rename: keep)
          # build under its pre-rebrand tag), then `platform-daily`, then the
          # user tags.
          if ! skopeo inspect --creds "$creds" "docker://$platform" >/dev/null 2>&1; then
            # Both spellings: an image built before the rebrand carries
            # org.apexos.release.kind, and reading only the new label would (rime-rename: keep)
            # take a shell release for a platform and stack shell layers.
            kind_label='{{ index .Labels "org.rimeos.release.kind" }}|{{ index .Labels "org.apexos.release.kind" }}'  # rime-rename: keep (read both label spellings)
            seed=""
            for cand in "$IMAGE:platform-apex" "$IMAGE:platform-daily" "$IMAGE:apex" "$IMAGE:daily"; do  # rime-rename: keep (pre-rebrand tags)
              skopeo inspect --creds "$creds" "docker://$cand" >/dev/null 2>&1 || continue
              existing_kind="$(skopeo inspect --creds "$creds" --format "$kind_label" \
                "docker://$cand" 2>/dev/null || true)"
              case "$existing_kind" in *shell*) existing_kind=shell ;; esac
              if [ "$existing_kind" = shell ]; then
                echo "::warning::$cand is already a shell release; not seeding from it"
                continue
              fi
              seed="$cand"; break
            done
            [ -n "$seed" ] || {
              echo "::error::$platform is missing and no full platform image was found to seed it from; refusing to stack shell layers"
              exit 1
            }
            echo "Initialising $platform from $seed"
            skopeo copy --retry-times 3 --src-creds "$creds" --dest-creds "$creds" \
              "docker://$seed" "docker://$platform"
          fi
          digest="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://$platform")"
          test -n "$digest"
          # Either repository name: a platform signed before the GitHub rename
          # names apex-os, one signed after it rime-os. Anchored both ends, and  (rime-rename: keep)
          # nothing but that one workflow on main matches.
          signer_re='^https://github\.com/AndreNijman/(apex|rime)-os/\.github/workflows/build-image\.yml@refs/heads/main$'  # rime-rename: keep (accepts the pre-rename repository)
          cosign verify \
            --certificate-identity-regexp "$signer_re" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE@$digest" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Using $platform@$digest"

      # BuildKit pushes directly to GHCR and preserves the platform's existing
      # compressed blob descriptors. Hosted-runner Podman 4.9 cannot reliably
      # do that for inherited zstd:chunked layers and may recompress all of them.
      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.release
          provenance: false
          build-args: |
            PLATFORM=${{ env.IMAGE }}@${{ steps.platform.outputs.digest }}
            RIME_SHELL_REF=${{ needs.resolve.outputs.shell_sha }}
            RIME_SHELL_STRICT=${{ needs.resolve.outputs.shell_strict }}
            RIME_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }}:rime-release-${{ github.run_id }},push=true,oci-mediatypes=true,compression=zstd,force-compression=false

      - name: Verify inherited layers and promote
        id: promote
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          echo '{}' > "$REGISTRY_AUTH_FILE"
          creds="$GHCR_USER:$GHCR_TOKEN"
          digest="${{ steps.build.outputs.digest }}"

          platform_json="$(skopeo inspect --raw --creds "$creds" \
            "docker://$IMAGE@${{ steps.platform.outputs.digest }}")"
          final_json="$(skopeo inspect --raw --creds "$creds" "docker://$IMAGE@$digest")"
          jq -e '.layers as $layers | ($layers | type == "array") and ($layers | length > 0)' \
            <<<"$platform_json" >/dev/null
          jq -e '.layers as $layers | ($layers | type == "array") and ($layers | length > 0)' \
            <<<"$final_json" >/dev/null
          mapfile -t platform_layers < <(jq -r '.layers[].digest' <<<"$platform_json")
          mapfile -t final_layers < <(jq -r '.layers[].digest' <<<"$final_json")
          [ "${#platform_layers[@]}" -gt 0 ]
          [ "${#final_layers[@]}" -ge "${#platform_layers[@]}" ]
          for i in "${!platform_layers[@]}"; do
            if [ "${platform_layers[$i]}" != "${final_layers[$i]}" ]; then
              echo "::error::Inherited layer $i was recompressed or replaced; refusing a full-fleet download"
              exit 1
            fi
          done

          # Either spelling of the label, whichever Containerfile.release writes.
          label='{{ index .Labels "org.rimeos.rime-shell.ref" }}|{{ index .Labels "org.apexos.apex-shell.ref" }}'  # rime-rename: keep (read both label spellings)
          got="$(skopeo inspect --creds "$creds" --format "$label" "docker://$IMAGE@$digest")"
          want_sha="${{ needs.resolve.outputs.shell_sha }}"
          [ "${got%%|*}" = "$want_sha" ] || [ "${got#*|}" = "$want_sha" ] \
            || { echo "::error::the image's shell-ref label is '$got', not $want_sha"; exit 1; }

          new_bytes="$(jq --argjson n "${#platform_layers[@]}" \
            '[.layers[$n:][]?.size] | add // 0' <<<"$final_json")"
          if [ "$new_bytes" -gt 157286400 ]; then
            echo "::error::Shell release adds $new_bytes compressed bytes; refusing an unexpectedly large update"
            exit 1
          fi

          # Sign before moving the user-facing tag: a signing failure must leave
          # every installed machine on the previous signed image.
          cosign sign --yes "$IMAGE@$digest"
          # EVERY user-facing name, or the machines still tracking an old one
          # stop updating. See build-image.yml's promotion step. `apex` is the (rime-rename: keep)
          # tag machines installed before the rebrand track; `rime` an alias.
          TAGS="apex rime daily gaming-mesa gaming-nvidia"  # rime-rename: keep (apex is a tag machines track)
          for t in $TAGS; do
            skopeo copy --retry-times 3 \
              --src-creds "$creds" --dest-creds "$creds" \
              "docker://$IMAGE@$digest" "docker://$IMAGE:$t"
          done
          # Read them back. skopeo exiting zero is not evidence a tag resolves.
          fail=0
          for t in $TAGS; do
            got="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://$IMAGE:$t" 2>/dev/null || echo MISSING)"
            [ "$got" = "$digest" ] && { echo "  ok   :$t"; continue; }
            echo "::error::tag :$t resolves to '$got', expected '$digest'"
            fail=1
          done
          [ "$fail" = 0 ] || exit 1

          # And under the pre-rebrand name, for every machine that has not
          # moved: the same digest (--preserve-digests, or the copy fails),
          # signed under that name (a cosign signature names its repository),
          # the same tags, read back. After the new name, so a failure here
          # leaves the machines that have moved updated and the run red.
          skopeo copy --retry-times 3 --preserve-digests \
            --src-creds "$creds" --dest-creds "$creds" \
            "docker://$IMAGE@$digest" "docker://$OLD_IMAGE:rime-release-${{ github.run_id }}"
          got="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' \
                   "docker://$OLD_IMAGE:rime-release-${{ github.run_id }}" 2>/dev/null || echo MISSING)"
          [ "$got" = "$digest" ] || { echo "::error::$OLD_IMAGE copy is '$got', not $digest"; exit 1; }
          cosign sign --yes "$OLD_IMAGE@$digest"
          for t in $TAGS; do
            skopeo copy --retry-times 3 --preserve-digests \
              --src-creds "$creds" --dest-creds "$creds" \
              "docker://$IMAGE@$digest" "docker://$OLD_IMAGE:$t"
          done
          for t in $TAGS; do
            got="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://$OLD_IMAGE:$t" 2>/dev/null || echo MISSING)"
            [ "$got" = "$digest" ] && { echo "  ok   $OLD_IMAGE:$t"; continue; }
            echo "::error::$OLD_IMAGE:$t resolves to '$got', expected '$digest' — machines still on the old name would stop updating"
            fail=1
          done
          [ "$fail" = 0 ] || exit 1

          revision_label='{{ index .Labels "org.opencontainers.image.revision" }}'
          platform_revision="$(skopeo inspect --creds "$creds" --format "$revision_label" \
            "docker://$IMAGE@${{ steps.platform.outputs.digest }}")"
          {
            echo "### rime shell release"
            echo "- Platform: \`${{ steps.platform.outputs.digest }}\` (revision \`$platform_revision\`)"
            echo "- Shell: \`${{ needs.resolve.outputs.shell_sha }}\`"
            echo "- New compressed bytes: \`$new_bytes\`"
            echo "- Final image: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "released at $digest as $TAGS, under $IMAGE and $OLD_IMAGE"
