name: build-image

# Build, sign (cosign keyless), and push the three APEX-OS images to GHCR.
#
#   base            → ghcr.io/andrenijman/apex-os-base
#   daily           → ghcr.io/andrenijman/apex-os:daily
#   gaming-mesa     → ghcr.io/andrenijman/apex-os:gaming-mesa
#   gaming-nvidia   → ghcr.io/andrenijman/apex-os:gaming-nvidia
#
# Speed design (GitHub-hosted runners, no persistent storage):
#   1. Base-gate — the ~45 min base (CachyOS kernel + Rust + desktop stack) is
#      REBUILT only when base-relevant files change (or on schedule / forced).
#      A flavor-only push skips it entirely; the flavors resolve the last-good
#      base digest from GHCR instead. Turns a flavor fix from ~50 min → ~15 min.
#   2. Registry layer cache — when the base DOES rebuild, unchanged layers are
#      pulled from a GHCR cache tag instead of recompiled (guarded: only used if
#      the runner's podman supports --cache-to/--cache-from). Bypassed on the
#      weekly schedule / force_base so upstream kernel/COPR updates are picked up.
#
# The base's immutable digest is passed to the flavor builds as
# --build-arg BASE=<base>@<digest> so every flavor is pinned to an exact base.
# Signing is keyless (Sigstore/Fulcio) via the runner's OIDC token.

on:
  push:
    branches: [main]
    paths:
      - "Containerfile*"
      - "files/**"
      - "apexd/**"
      - "config/**"
      - "kernel/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      build_qcow2:
        description: "Also build a daily qcow2 disk image (bootc-image-builder)"
        type: boolean
        default: false
      build_iso:
        description: "Build the daily APEX-OS installer ISO (anaconda-iso)"
        type: boolean
        default: false
      force_base:
        description: "Force a full, cache-bypassing base rebuild"
        type: boolean
        default: false
  schedule:
    # Weekly rebuild (Mon 06:00 UTC) to pick up upstream base / COPR / RPMFusion
    # security updates even without a source change. Bypasses the layer cache.
    - cron: "0 6 * * 1"

# Least privilege. id-token:write is required for cosign keyless (OIDC) signing;
# packages:write is required to push to GHCR (images + the layer-cache tag).
permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/andrenijman/apex-os-base
  IMAGE: ghcr.io/andrenijman/apex-os
  CACHE_REF: ghcr.io/andrenijman/apex-os-base:buildcache

jobs:
  # ── Job 0: change detection ───────────────────────────────────────────────
  # Decide whether the base must rebuild. On a push, only base-relevant paths
  # trigger a base rebuild; a flavor-only push reuses the last-good base. On
  # schedule / any non-ISO dispatch, base always rebuilds (handled in job 1's if).
  changes:
    runs-on: ubuntu-latest
    # Skip on an ISO-only dispatch (installer-iso pulls the published :daily).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2) }}
    outputs:
      base: ${{ steps.filter.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base:
              - 'Containerfile.base'
              - 'apexd/**'
              - 'config/**'
              - 'kernel/**'
              - 'files/**'
              - '.github/workflows/build-image.yml'

  # ── Job 1: shared base (gated) ────────────────────────────────────────────
  base:
    needs: changes
    runs-on: ubuntu-latest
    # Run when: NOT an ISO-only dispatch, AND (it is not a push → schedule/dispatch
    # always rebuild base) OR (it is a push and base-relevant files changed).
    if: >-
      ${{
        !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2)
        && (github.event_name != 'push' || needs.changes.outputs.base == 'true')
      }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The base image is large (CachyOS kernel + desktop stack ≈ several GB).
      # ubuntu-latest ships with ~14 GB free; reclaim space from toolchains we
      # do not use so the build + push has headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Rootful podman: the CachyOS kernel's %posttrans (rpm-ostree
      # kernel-install → dracut) and the NVIDIA akmod build need device access
      # (/dev/kmsg, loop) that rootless podman on the runner denies. This
      # matches the local build recipe. --isolation=chroot sidesteps nested
      # cgroup setup on the runner.
      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # cosign runs as the normal user, not under sudo, so it cannot see the
      # rootful podman auth above. Give cosign its own GHCR credential (written
      # to the user's docker config) so `cosign sign` can pull the digest to
      # sign it — the packages are private, so this pull needs auth.
      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Registry layer cache — reuse unchanged layers (kernel/Rust/desktop) from a
      # GHCR cache tag across runs. Guarded: only if this podman supports the
      # flags. Bypassed (fresh build) on schedule / force_base so upstream updates
      # land. --cache-to always runs (when supported) to keep the cache warm.
      - name: Compute cache args
        id: cache
        run: |
          FRESH=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force_base }}" = "true" ]; then
            FRESH=true
          fi
          ARGS=""
          if sudo podman build --help 2>/dev/null | grep -q -- '--cache-to'; then
            ARGS="--layers --cache-to $CACHE_REF"
            if [ "$FRESH" != "true" ]; then
              ARGS="$ARGS --cache-from $CACHE_REF"
            else
              ARGS="$ARGS --no-cache"
            fi
            echo "Layer cache enabled (fresh=$FRESH): $ARGS"
          else
            [ "$FRESH" = "true" ] && ARGS="--no-cache"
            echo "podman lacks --cache-to; caching disabled (fresh=$FRESH)"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build base
        run: |
          sudo podman build --isolation=chroot ${{ steps.cache.outputs.args }} \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            -f Containerfile.base \
            -t "$IMAGE_BASE:latest" \
            -t "$IMAGE_BASE:${{ github.sha }}" \
            .

      - name: Push base + capture digest
        id: push
        run: |
          sudo podman push "$IMAGE_BASE:${{ github.sha }}" \
            --digestfile=/tmp/base.digest
          sudo podman push "$IMAGE_BASE:latest"
          DIGEST="$(cat /tmp/base.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Base digest: $DIGEST"

      # Keyless signature over the immutable digest (never a tag). Uses the
      # runner's ambient OIDC identity; cosign v2 needs no COSIGN_EXPERIMENTAL.
      - name: Sign base (cosign keyless)
        run: |
          cosign sign --yes "$IMAGE_BASE@${{ steps.push.outputs.digest }}"

  # ── Job 2: flavors ────────────────────────────────────────────────────────
  # Run whenever base did not FAIL — so on a flavor-only push (base skipped) the
  # flavors still build, resolving the last-good base digest from GHCR.
  flavors:
    needs: [changes, base]
    if: >-
      ${{
        always() && !cancelled()
        && needs.base.result != 'failure'
        && !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2)
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: daily
            containerfile: Containerfile.daily
            build_args: ""
          - flavor: gaming-mesa
            containerfile: Containerfile.gaming
            build_args: "--build-arg GPU=mesa"
          - flavor: gaming-nvidia
            containerfile: Containerfile.gaming
            build_args: "--build-arg GPU=nvidia"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Resolve the base digest to pin FROM. If the base job ran this workflow,
      # use its output; if it was skipped (flavor-only push), resolve the digest
      # of the last-good :latest base from GHCR.
      - name: Resolve base digest
        id: base
        run: |
          D="${{ needs.base.outputs.digest }}"
          if [ -z "$D" ]; then
            echo "Base job skipped — resolving last-good $IMAGE_BASE:latest"
            sudo podman pull "$IMAGE_BASE:latest"
            D="$(sudo podman image inspect "$IMAGE_BASE:latest" \
                  --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          fi
          test -n "$D"
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "Using base digest: $D"

      # FROM the base pinned by digest — the exact base job 1 pushed and signed,
      # or the last-good published base when the base job was skipped.
      - name: Build ${{ matrix.flavor }}
        run: |
          sudo podman build --isolation=chroot \
            --build-arg BASE="$IMAGE_BASE@${{ steps.base.outputs.digest }}" \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            ${{ matrix.build_args }} \
            -f "${{ matrix.containerfile }}" \
            -t "$IMAGE:${{ matrix.flavor }}" \
            -t "$IMAGE:${{ matrix.flavor }}-${{ github.sha }}" \
            .

      - name: Push ${{ matrix.flavor }} + capture digest
        id: push
        run: |
          sudo podman push "$IMAGE:${{ matrix.flavor }}-${{ github.sha }}" \
            --digestfile=/tmp/flavor.digest
          sudo podman push "$IMAGE:${{ matrix.flavor }}"
          DIGEST="$(cat /tmp/flavor.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.flavor }} digest: $DIGEST"

      - name: Sign ${{ matrix.flavor }} (cosign keyless)
        run: |
          cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

  # ── Job 3: qcow2 (stretch, dispatch-gated, non-blocking) ─────────────────
  # Proves bootc-image-builder produces a bootable disk from the daily image.
  # GitHub runners have NO /dev/kvm, so the disk is NOT booted here — producing
  # the qcow2 is the check. Gated on manual dispatch (build_qcow2=true) and
  # continue-on-error so bib flakiness never fails the image pipeline.
  qcow2:
    needs: flavors
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_qcow2
    continue-on-error: true
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build daily qcow2 via bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs xfs --local \
            "$IMAGE:daily-${{ github.sha }}"
          ls -lh output/qcow2 || ls -lhR output

      - name: Upload qcow2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-os-daily-qcow2
          path: output/qcow2/*.qcow2
          if-no-files-found: warn
          retention-days: 7

  # ── Job 4: installer ISO (dispatch-gated) ─────────────────────────────────
  # Builds the APEX-OS Daily installer as an Anaconda ISO (bootc-image-builder
  # --type anaconda-iso) — a bootable USB that installs the signed daily image
  # to a target disk. The image is pulled into local storage first (each job is
  # a fresh runner; --local needs it present). Uploaded as an artifact for the
  # maintainer to write to a USB stick. Independent of base/flavors: it pulls
  # the already-published :daily, so it runs on an ISO-only dispatch.
  installer-iso:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Pull the latest green daily image into local storage
        run: sudo podman pull "$IMAGE:daily"

      - name: Build daily installer ISO via bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs --local \
            "$IMAGE:daily"
          ls -lhR output/bootiso || ls -lhR output

      - name: Upload installer ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-os-daily-installer-iso
          path: output/bootiso/*.iso
          if-no-files-found: warn
          retention-days: 7
