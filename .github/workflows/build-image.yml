name: build-image

# Build, sign (cosign keyless), and push the APEX-OS images to GHCR.
#
#   core            → ghcr.io/andrenijman/apex-os-core      (heavy, slow-moving)
#   base            → ghcr.io/andrenijman/apex-os-base      (thin, per-commit)
#   daily           → ghcr.io/andrenijman/apex-os:daily
#   gaming-mesa     → ghcr.io/andrenijman/apex-os:gaming-mesa
#   gaming-nvidia   → ghcr.io/andrenijman/apex-os:gaming-nvidia
#
# ═══ THE THREE-TIER SPLIT, AND WHY `apex update` USED TO PULL 5.3 GB ═══
#
# Everything used to live in one `base` image. That base was gated on a path
# filter covering files/**, apexd/** and config/** — i.e. essentially every
# commit — and it built with no layer cache, so every dnf/RUN layer got a fresh
# digest even when the installed bytes were identical. bootc reuses a layer only
# when it already holds that exact digest, so a one-line shell tweak invalidated
# all of them. Measured on the author's L16 against the live registry:
#
#     $ bootc upgrade --check
#     Total new layers: 153   Size: 5.3 GB
#     Removed layers:   152   Size: 5.4 GB
#
# 153 of 153 layers, every single update. The fix is the `core` tier: the
# slow-moving ~95% of the image is built once and consumed by the base as
# FROM apex-os-core@sha256:… . A digest-pinned FROM reuses those layer
# descriptors verbatim, so bootc already has the blobs and downloads none of
# them. A normal push now rebuilds only base + flavor — tens of MiB.
#
# It is also much faster to BUILD: a flavor- or base-only push skips the ~45 min
# core entirely.
#
# ── When each tier rebuilds ──
#   core    Containerfile.core / kernel/** changed · force_core · or the weekly
#           cron found a NEW fedora-bootc digest. That last condition matters:
#           an unconditional weekly rebuild would reissue ~5 GB of
#           byte-different, content-identical layers to the whole fleet every
#           Monday, which is the very cost this split exists to remove. The
#           digest core was built from is stamped on it as a label and compared.
#   base    Containerfile.base / apexd/** / config/** / files/** changed, or
#           core rebuilt.
#   flavor  every run (they are thin, and they must follow the base digest).
#
# The base's immutable digest is passed to the flavor builds as
# --build-arg BASE=<base>@<digest>, and core's as --build-arg CORE=<core>@<digest>,
# so every tier is pinned to an exact parent. Signing is keyless
# (Sigstore/Fulcio) via the runner's OIDC token.

on:
  push:
    branches: [main]
    paths:
      - "Containerfile*"
      - "files/**"
      - "apexd/**"
      - "config/**"
      - "kernel/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      build_qcow2:
        description: "Also build a daily qcow2 disk image (bootc-image-builder)"
        type: boolean
        default: false
      build_iso:
        description: "Build the daily APEX-OS installer ISO (anaconda-iso)"
        type: boolean
        default: false
      force_core:
        description: "Force a full, cache-bypassing CORE rebuild (~45 min; makes the next update a full download for every user)"
        type: boolean
        default: false
  schedule:
    # Weekly (Mon 06:00 UTC) to pick up upstream fedora-bootc / COPR / RPMFusion
    # security updates. This only rebuilds core when the upstream base image has
    # actually moved — see the gate in job 0.
    - cron: "0 6 * * 1"

# Least privilege. id-token:write is required for cosign keyless (OIDC) signing;
# packages:write is required to push to GHCR.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_CORE: ghcr.io/andrenijman/apex-os-core
  IMAGE_BASE: ghcr.io/andrenijman/apex-os-base
  IMAGE: ghcr.io/andrenijman/apex-os
  UPSTREAM_BASE: quay.io/fedora/fedora-bootc:43

jobs:
  # ── Job 0: what has to rebuild ────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    # Skip on an ISO-only dispatch (installer-iso pulls the published :daily).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2) }}
    outputs:
      core: ${{ steps.gate.outputs.core }}
      base: ${{ steps.filter.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'Containerfile.core'
              - 'kernel/**'
              - '.github/workflows/build-image.yml'
            base:
              - 'Containerfile.base'
              - 'apexd/**'
              - 'config/**'
              - 'files/**'
              - '.github/workflows/build-image.yml'

      # The whole point of the core tier is that it does NOT move for no reason:
      # every core rebuild is a full multi-GB download for every machine on the
      # fleet. So the weekly cron asks whether upstream actually changed instead
      # of assuming it did.
      - name: Decide whether core must rebuild
        id: gate
        run: |
          set -euo pipefail

          decide() { echo "core=$1" >> "$GITHUB_OUTPUT"; echo "core rebuild: $1 ($2)"; exit 0; }

          [ "${{ inputs.force_core }}" = "true" ] && decide true "force_core requested"
          [ "${{ steps.filter.outputs.core }}" = "true" ] && decide true "core sources changed"

          # Not a scheduled run and nothing core-relevant changed → reuse.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            decide false "no core-relevant change"
          fi

          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }

          # What upstream is at right now.
          UP="$(skopeo inspect --no-creds --format '{{.Digest}}' "docker://$UPSTREAM_BASE")"
          echo "upstream $UPSTREAM_BASE = $UP"

          # What the published core was built from. Missing image, missing label
          # or an unreadable registry all fall through to "rebuild" — failing
          # towards a rebuild is the safe direction for a security refresh.
          HAVE="$(skopeo inspect \
                    --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
                    --format '{{ index .Labels "org.apexos.fedora-bootc.digest" }}' \
                    "docker://$IMAGE_CORE:latest" 2>/dev/null || echo '')"
          echo "published core was built from = ${HAVE:-<none>}"

          [ -n "$HAVE" ] || decide true "no published core to reuse"
          [ "$HAVE" = "$UP" ] && decide false "upstream fedora-bootc has not moved since the last core"
          decide true "upstream fedora-bootc moved"

  # ── Job 1: Rust — fast gate on the apexd/apex workspace ───────────────────
  # apexd and apex are compiled INSIDE the base build, so a compile error used
  # to surface ~10 minutes into a container build with no test coverage at all
  # (the workspace has 100+ tests and CI ran none of them). This job takes ~2
  # min and blocks the base, so a broken CLI can never be published.
  rust:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2) }}
    defaults:
      run:
        working-directory: apexd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: rustup component add clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apexd/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apexd/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # NOTE: no `cargo fmt --all --check`. The workspace has never been
      # rustfmt'd — 24 of its source files differ — so adding that gate here
      # would fail on its first run and block every image build until someone
      # reformatted the whole tree. That reformat is a real change to code
      # unrelated to this release and belongs in its own commit, made
      # deliberately. Add the step back the same day `cargo fmt --all` lands.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # ── Job 2: core (heavy, gated) ────────────────────────────────────────────
  core:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.core == 'true' }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Rootful podman: the CachyOS kernel's %posttrans (rpm-ostree
      # kernel-install → dracut) needs device access (/dev/kmsg, loop) that
      # rootless podman on the runner denies. --isolation=chroot sidesteps
      # nested cgroup setup on the runner.
      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # cosign runs as the normal user, not under sudo, so it cannot see the
      # rootful podman auth above. Give cosign its own GHCR credential so
      # `cosign sign` can pull the digest to sign it — the packages are private.
      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Stamped onto the image as a label so job 0 can tell, next Monday,
      # whether upstream has actually moved. Without it the weekly cron would
      # reissue the whole image every week regardless.
      - name: Resolve upstream fedora-bootc digest
        id: upstream
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          # --no-creds: fedora-bootc is public, so ask anonymously. Without it
          # skopeo tries to resolve credentials and dies on
          # /run/user/<uid>/containers/auth.json, which the earlier
          # `sudo podman login` created ROOT-OWNED in this job's runtime dir —
          # the same rootful/rootless split the cosign login step above exists
          # for. It has nothing to log in to here anyway.
          D="$(skopeo inspect --no-creds --format '{{.Digest}}' "docker://$UPSTREAM_BASE")"
          test -n "$D"
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "fedora-bootc digest: $D"

      - name: Build core
        env:
          APEX_SB_KEY_B64: ${{ secrets.APEX_SB_KEY_B64 }}
          APEX_SB_CRT_B64: ${{ secrets.APEX_SB_CRT_B64 }}
        run: |
          # ── Secure Boot signing key ──────────────────────────────────────
          # Containerfile.core signs the CachyOS kernel with the APEX MOK only
          # when these build secrets are present, and otherwise stamps the image
          # `unsigned` and carries on. CI used to pass nothing, so every image
          # ever PUBLISHED to GHCR was unsigned: anyone installing from the
          # registry could not use Secure Boot at all, and enrolling the APEX
          # key would not have helped them, because their kernel did not carry
          # its signature. Only locally-built images were signed.
          #
          # The key lives only in $RUNNER_TEMP for the length of the build,
          # 0600, and is shredded afterwards. It is never in the repo, never in
          # a build ARG (those are visible in image history), and never in the
          # image — the Containerfile takes it as --secret, which is a tmpfs
          # mount that leaves no layer behind.
          #
          # Secrets are NOT exposed to workflows triggered by pull requests from
          # forks, which is what makes this safe on a public repo. It does mean
          # the key's security is the GitHub account's security: anyone able to
          # push to main or run workflow_dispatch can use it.
          #
          # NOTE: signing now happens once here, in core, and every tier
          # inherits the signed vmlinuz. The base and flavor jobs re-verify it
          # on the artefact users actually pull.
          SECDIR="$RUNNER_TEMP/apex-sb"
          mkdir -p "$SECDIR"; chmod 700 "$SECDIR"
          SECRET_ARGS=""
          if [ -n "${APEX_SB_KEY_B64:-}" ] && [ -n "${APEX_SB_CRT_B64:-}" ]; then
            printf '%s' "$APEX_SB_KEY_B64" | base64 -d > "$SECDIR/apex-mok.key"
            printf '%s' "$APEX_SB_CRT_B64" | base64 -d > "$SECDIR/apex-mok.crt"
            chmod 600 "$SECDIR"/apex-mok.*
            # Fail now rather than ship an unsigned image because a secret was
            # pasted in mangled. Silent degradation is how this shipped unsigned
            # for weeks in the first place.
            openssl rsa  -in "$SECDIR/apex-mok.key" -noout -check >/dev/null
            openssl x509 -in "$SECDIR/apex-mok.crt" -noout        >/dev/null
            k=$(openssl rsa  -in "$SECDIR/apex-mok.key" -noout -modulus | sha256sum)
            c=$(openssl x509 -in "$SECDIR/apex-mok.crt" -noout -modulus | sha256sum)
            [ "$k" = "$c" ] || { echo "FATAL: APEX_SB_KEY_B64 and APEX_SB_CRT_B64 are not a pair"; exit 1; }
            SECRET_ARGS="--secret id=apex_sb_key,src=$SECDIR/apex-mok.key --secret id=apex_sb_crt,src=$SECDIR/apex-mok.crt"
            echo "Secure Boot: signing key present — the kernel will be signed"
          else
            echo "Secure Boot: NO signing secret configured — the kernel will be UNSIGNED"
          fi

          # --no-cache on a forced or scheduled rebuild: those are exactly the
          # runs whose purpose is to pick up new upstream content.
          NOCACHE=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force_core }}" = "true" ]; then
            NOCACHE="--no-cache"
          fi

          sudo podman build --isolation=chroot $NOCACHE \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            --build-arg FEDORA_BOOTC_DIGEST="${{ steps.upstream.outputs.digest }}" \
            $SECRET_ARGS \
            -f Containerfile.core \
            -t "$IMAGE_CORE:latest" \
            -t "$IMAGE_CORE:${{ github.sha }}" \
            .

          shred -u "$SECDIR"/apex-mok.* 2>/dev/null || rm -f "$SECDIR"/apex-mok.*
          rmdir "$SECDIR" 2>/dev/null || true

      # Gate the push on the core actually being usable. Everything asserted
      # here has silently shipped broken at least once: hyprland-qtutils was
      # absent for weeks because dnf dropped an unsatisfiable weak dep without
      # failing the build (apex-logs 47), and the Fedora de-branding regressed
      # the same way. A green `podman build` is not evidence the image is right.
      - name: Verify core image
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          run() { sudo podman run --rm --entrypoint /bin/sh "$IMAGE_CORE:latest" -c "$1"; }

          # hyprland-qtutils, built from source against Qt 6.10 (the packaged
          # build links Qt 6.9 private API and cannot install here).
          for b in hyprland-dialog hyprland-donate-screen hyprland-update-screen; do
            run "command -v $b >/dev/null" || fail "$b missing from core image"
          done
          run 'test -d /usr/lib64/qt6/qml/org/hyprland/style' \
            || fail "hyprland QML style not installed"
          run '! ldd /usr/bin/hyprland-dialog | grep -q "not found"' \
            || fail "hyprland-dialog has unresolved libraries"

          # De-branding: ID=fedora is deliberate (dnf copr chroots derive from it);
          # it must be the ONLY Fedora string left in os-release.
          N=$(run 'grep -ci fedora /usr/lib/os-release')
          [ "$N" = "1" ] || fail "expected exactly 1 Fedora string in os-release, found $N"
          run 'grep -q "^PRETTY_NAME=\"APEX-OS\"" /usr/lib/os-release' \
            || fail "os-release not branded"
          run 'grep -q "^APEX-OS release" /etc/system-release' \
            || fail "/etc/system-release not branded (bootupd derives the EFI label from it)"

          # Things the BASE tier can no longer install for itself, because it
          # runs no dnf at all. If any of these regress, the base build fails
          # far less legibly than this does.
          run 'test -x /usr/sbin/efibootmgr -o -x /usr/bin/efibootmgr' \
            || fail "efibootmgr missing — the Windows-boot button cannot work"
          run 'command -v plymouth-set-default-theme >/dev/null' \
            || fail "plymouth engine missing — both flavors set a theme against it"
          run 'command -v setpriv >/dev/null' \
            || fail "setpriv missing — the greeter-wallpaper helper drops privileges with it"
          run 'command -v starship >/dev/null && command -v zsh >/dev/null' \
            || fail "zsh/starship missing"
          run 'command -v matugen >/dev/null' \
            || fail "matugen missing — the shell cannot theme without it"
          run 'command -v cargo >/dev/null' \
            || fail "cargo missing — Containerfile.base compiles apexd in a stage FROM this image"

          # Secure Boot: if a signing key is configured, the published kernel
          # MUST actually carry the signature. Containerfile.core degrades to
          # "unsigned" and keeps going when signing fails or the secret is
          # absent — good for local builds, unacceptable for the artefact other
          # people install. Assert both the marker and the real PE certificate
          # table, because the marker is only a claim.
          if [ -n "${{ secrets.APEX_SB_KEY_B64 }}" ]; then
            state=$(run 'cat /usr/share/apex-os/secureboot/kernel-signed 2>/dev/null || echo missing')
            [ "$state" = signed ] \
              || fail "signing key is configured but the image is stamped '$state' — refusing to publish an unsigned kernel"
            run 'test -s /usr/share/apex-os/secureboot/apex-mok.der' \
              || fail "kernel-signed=signed but apex-mok.der is missing — users would have nothing to enrol"
            sudo podman run --rm --entrypoint /bin/sh "$IMAGE_CORE:latest" -c \
              'dnf5 -y install -q sbsigntools >/dev/null 2>&1; sbverify --list /usr/lib/modules/$(cat /usr/lib/apex-kver)/vmlinuz' \
              | grep -qi 'signature certificates\|image signature issuers\|APEX' \
              || fail "sbverify found no signature on the shipped vmlinuz"
            echo "Secure Boot: verified — the published kernel is signed and apex-mok.der ships with it"
          else
            echo "::warning::No APEX_SB_KEY_B64 secret — this image ships an UNSIGNED kernel and cannot be used with Secure Boot"
          fi

          echo "core image verified"

      # Pushing a multi-gigabyte image to GHCR fails transiently. Observed on
      # run 30771778274: gaming-nvidia built clean, verified its signed kernel,
      # and then died with
      #   Error: writing blob: uploading layer chunked:
      #          received unexpected HTTP status: 502 Bad Gateway
      # after eight minutes of upload. There was no retry, so a green ~50-minute
      # build was thrown away by a registry hiccup. Three attempts with backoff.
      - name: Push helper
        run: |
          cat > /tmp/push-retry.sh <<'SH'
          #!/usr/bin/env bash
          # push-retry <image-ref> [--digestfile <path>]
          set -uo pipefail
          ref="$1"; shift
          for attempt in 1 2 3; do
            if sudo podman push --compression-format zstd:chunked "$ref" "$@"; then
              exit 0
            fi
            echo "::warning::push of $ref failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && break
            sleep $(( attempt * 30 ))
          done
          echo "::error::push of $ref failed after 3 attempts"
          exit 1
          SH
          chmod +x /tmp/push-retry.sh

      - name: Push core + capture digest
        id: push
        run: |
          # zstd:chunked instead of the default gzip (apex-logs 16). Two effects,
          # neither of which changes image CONTENT — only how it is packed:
          #   - zstd compresses this tree meaningfully smaller than gzip, and
          #     decompresses several times faster, so `apex update` spends less
          #     time both downloading and unpacking.
          #   - :chunked publishes a per-layer chunk manifest.
          # Requires an OCI manifest (podman already produces one here) and a
          # client that understands zstd; the fleet is bootc 1.16+/ostree 2026.2,
          # which does. `apex rollback` remains the escape hatch.
          /tmp/push-retry.sh "$IMAGE_CORE:${{ github.sha }}" --digestfile=/tmp/core.digest
          /tmp/push-retry.sh "$IMAGE_CORE:latest"
          DIGEST="$(cat /tmp/core.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Core digest: $DIGEST"

      - name: Sign core (cosign keyless)
        run: |
          cosign sign --yes "$IMAGE_CORE@${{ steps.push.outputs.digest }}"

  # ── Job 3: base (thin) ────────────────────────────────────────────────────
  # Runs whenever core did not FAIL, so a base-only push (core skipped) still
  # builds, resolving the last-good core digest from GHCR.
  base:
    needs: [changes, rust, core]
    if: >-
      ${{
        always() && !cancelled()
        && needs.rust.result == 'success'
        && needs.core.result != 'failure'
        && !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2)
      }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Resolve the core digest to build FROM. If the core job ran in this
      # workflow use its output; otherwise resolve the last-good published core.
      # Failing here is FATAL and says so: on the very first run after this
      # split there is no apex-os-core:latest yet, and silently falling through
      # to an unpinned tag (or to fedora-bootc) would produce a wrong image.
      - name: Resolve core digest
        id: core
        run: |
          set -euo pipefail
          D="${{ needs.core.outputs.digest }}"
          if [ -z "$D" ]; then
            echo "Core job skipped — resolving last-good $IMAGE_CORE:latest"
            if ! sudo podman pull "$IMAGE_CORE:latest"; then
              echo "::error::Cannot pull $IMAGE_CORE:latest and the core job did not run."
              echo "::error::If this is the first build after the core/base split, re-run this workflow with force_core=true."
              exit 1
            fi
            D="$(sudo podman image inspect "$IMAGE_CORE:latest" \
                  --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          fi
          if [ -z "$D" ]; then
            echo "::error::Resolved an empty core digest — refusing to build against an unpinned parent."
            exit 1
          fi
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "Using core digest: $D"

      - name: Build base
        run: |
          sudo podman build --isolation=chroot \
            --build-arg CORE="$IMAGE_CORE@${{ steps.core.outputs.digest }}" \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            -f Containerfile.base \
            -t "$IMAGE_BASE:latest" \
            -t "$IMAGE_BASE:${{ github.sha }}" \
            .

      - name: Verify base image
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          run() { sudo podman run --rm --entrypoint /bin/sh "$IMAGE_BASE:latest" -c "$1"; }

          # M6 + the per-user provisioner race fix.
          run 'test -x /usr/bin/apexd && test -x /usr/bin/apex' || fail "apexd/apex missing"
          run 'test -s /usr/share/apex/hypr/hyprland.conf' || fail "APEX hyprland template missing"
          run 'grep -q CRITICAL /usr/libexec/apex-shell-firstrun' \
            || fail "provisioner is missing the config-seeding race fix"
          run 'test ! -e /usr/share/wayland-sessions/hyprland-uwsm.desktop' \
            || fail "hyprland-uwsm.desktop present; it sorts first and bounce-loops"

          # The greeter must tolerate NVIDIA: sway exits(1) on nvidia-drm without
          # this flag, which means no login at all on a hybrid-graphics machine.
          run 'grep -q -- --unsupported-gpu /etc/greetd/config.toml' \
            || fail "greeter missing --unsupported-gpu"

          # `apex update` must refuse to run unprivileged, with a message that
          # names sudo. The container runs as root, so assert the refusal by
          # dropping to a non-root uid — testing it as root would prove nothing.
          out=$(sudo podman run --rm --user 1000:1000 --entrypoint /bin/sh \
                  "$IMAGE_BASE:latest" -c 'apex update --check 2>&1' || true)
          echo "$out" | grep -q 'sudo apex update --check' \
            || fail "apex update does not tell an unprivileged caller to use sudo (got: $out)"
          # …and the verbs the desktop drives as the session user must NOT be gated.
          run 'apex tier >/dev/null' \
            || fail "apex tier broke — APEX Shell's power tab calls it as the session user"

          # Greeter wallpaper: the helper, its sudoers rule, and both ends of the
          # wiring. This is the fix for "the lock screen keeps the default
          # wallpaper", and every part of it is silently skippable at runtime,
          # so it is asserted at build time instead.
          run 'test -x /usr/libexec/apex-greet-wallpaper' \
            || fail "greeter wallpaper helper missing"
          run 'test -f /etc/sudoers.d/030-apex-greet-wallpaper' \
            || fail "greeter wallpaper sudoers rule missing"
          run 'visudo -cf /etc/sudoers.d/030-apex-greet-wallpaper >/dev/null' \
            || fail "greeter wallpaper sudoers rule does not parse — sudo would refuse it at runtime"
          run 'grep -q "apex-greet/wallpapers" /usr/share/apex-greet/GreetContext.qml' \
            || fail "greeter no longer reads the published wallpaper"
          run '! grep -q "file:///usr/share/backgrounds/apex/default.jpg" /usr/share/apex-greet/GreetSurface.qml' \
            || fail "GreetSurface has gone back to the hardcoded default wallpaper"
          run 'grep -q apex-greet-wallpaper /usr/share/apex-shell/src/services/WallpaperService.qml' \
            || fail "vendored apex-shell does not publish the wallpaper on change"
          run 'grep -q apex-greet-wallpaper /usr/libexec/apex-shell-autostart' \
            || fail "session launcher does not publish the wallpaper on login"

          # Secure Boot, re-asserted on the tier that inherits it. The core job
          # is gated, so a push touching only files/** rebuilds this image FROM
          # THE LAST PUBLISHED CORE — if that core were unsigned, an unsigned
          # base would ship and core's assertion would never have run.
          if [ -n "${{ secrets.APEX_SB_KEY_B64 }}" ]; then
            state=$(run 'cat /usr/share/apex-os/secureboot/kernel-signed 2>/dev/null || echo missing')
            [ "$state" = signed ] \
              || fail "base is stamped '$state' — the core it was built from is not signed. Re-run with force_core=true."
          fi

          echo "base image verified"

      # Pushing a multi-gigabyte image to GHCR fails transiently. Observed on
      # run 30771778274: gaming-nvidia built clean, verified its signed kernel,
      # and then died with
      #   Error: writing blob: uploading layer chunked:
      #          received unexpected HTTP status: 502 Bad Gateway
      # after eight minutes of upload. There was no retry, so a green ~50-minute
      # build was thrown away by a registry hiccup. Three attempts with backoff.
      - name: Push helper
        run: |
          cat > /tmp/push-retry.sh <<'SH'
          #!/usr/bin/env bash
          # push-retry <image-ref> [--digestfile <path>]
          set -uo pipefail
          ref="$1"; shift
          for attempt in 1 2 3; do
            if sudo podman push --compression-format zstd:chunked "$ref" "$@"; then
              exit 0
            fi
            echo "::warning::push of $ref failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && break
            sleep $(( attempt * 30 ))
          done
          echo "::error::push of $ref failed after 3 attempts"
          exit 1
          SH
          chmod +x /tmp/push-retry.sh

      - name: Push base + capture digest
        id: push
        run: |
          /tmp/push-retry.sh "$IMAGE_BASE:${{ github.sha }}" --digestfile=/tmp/base.digest
          /tmp/push-retry.sh "$IMAGE_BASE:latest"
          DIGEST="$(cat /tmp/base.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Base digest: $DIGEST"

      - name: Sign base (cosign keyless)
        run: |
          cosign sign --yes "$IMAGE_BASE@${{ steps.push.outputs.digest }}"

  # ── Job 4: flavors ────────────────────────────────────────────────────────
  flavors:
    needs: [base]
    if: >-
      ${{
        always() && !cancelled()
        && needs.base.result == 'success'
        && !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2)
      }}
    runs-on: ubuntu-latest
    # The `secrets` context is NOT available in a step-level `if:` — only in
    # job-level env — so surface "is signing configured?" as a plain boolean
    # here and let the verify step below branch on it. Without this the step
    # would silently evaluate to false and never run, which is precisely the
    # class of quietly-skipped check it exists to prevent.
    env:
      APEX_SB_CONFIGURED: ${{ secrets.APEX_SB_KEY_B64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: daily
            containerfile: Containerfile.daily
            build_args: ""
          - flavor: gaming-mesa
            containerfile: Containerfile.gaming
            build_args: "--build-arg GPU=mesa"
          - flavor: gaming-nvidia
            containerfile: Containerfile.gaming
            build_args: "--build-arg GPU=nvidia"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # FROM the base pinned by digest — the exact base job 3 pushed and signed.
      - name: Build ${{ matrix.flavor }}
        run: |
          sudo podman build --isolation=chroot \
            --build-arg BASE="$IMAGE_BASE@${{ needs.base.outputs.digest }}" \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            ${{ matrix.build_args }} \
            -f "${{ matrix.containerfile }}" \
            -t "$IMAGE:${{ matrix.flavor }}" \
            -t "$IMAGE:${{ matrix.flavor }}-${{ github.sha }}" \
            .

      # Gate the PUSH on the edition actually carrying a signed kernel.
      #
      # sbverify against the real vmlinuz, not just the marker file: the marker
      # is a claim written by the build, and this project has been bitten
      # repeatedly by trusting claims over measurements.
      - name: Verify ${{ matrix.flavor }} kernel signature
        if: ${{ env.APEX_SB_CONFIGURED == 'true' }}
        run: |
          set -euo pipefail
          state=$(sudo podman run --rm --entrypoint /bin/sh "$IMAGE:${{ matrix.flavor }}" \
                    -c 'cat /usr/share/apex-os/secureboot/kernel-signed 2>/dev/null || echo missing')
          if [ "$state" != signed ]; then
            echo "::error::${{ matrix.flavor }} is stamped '$state' — refusing to publish an unsigned kernel."
            echo "::error::The core it was built from is not signed. Re-run with force_core=true."
            exit 1
          fi
          sudo podman run --rm --entrypoint /bin/sh "$IMAGE:${{ matrix.flavor }}" -c \
            'dnf5 -y install -q sbsigntools >/dev/null 2>&1; sbverify --list /usr/lib/modules/$(cat /usr/lib/apex-kver)/vmlinuz' \
            | grep -qi 'signature certificates\|image signature issuers\|APEX' \
            || { echo "::error::sbverify found no signature on ${{ matrix.flavor }}'s vmlinuz"; exit 1; }
          sudo podman run --rm --entrypoint /bin/sh "$IMAGE:${{ matrix.flavor }}" \
            -c 'test -s /usr/share/apex-os/secureboot/apex-mok.der' \
            || { echo "::error::${{ matrix.flavor }} has no apex-mok.der — users would have nothing to enrol"; exit 1; }
          echo "${{ matrix.flavor }}: kernel signed and apex-mok.der present"

      # Pushing a multi-gigabyte image to GHCR fails transiently. Observed on
      # run 30771778274: gaming-nvidia built clean, verified its signed kernel,
      # and then died with
      #   Error: writing blob: uploading layer chunked:
      #          received unexpected HTTP status: 502 Bad Gateway
      # after eight minutes of upload. There was no retry, so a green ~50-minute
      # build was thrown away by a registry hiccup. Three attempts with backoff.
      - name: Push helper
        run: |
          cat > /tmp/push-retry.sh <<'SH'
          #!/usr/bin/env bash
          # push-retry <image-ref> [--digestfile <path>]
          set -uo pipefail
          ref="$1"; shift
          for attempt in 1 2 3; do
            if sudo podman push --compression-format zstd:chunked "$ref" "$@"; then
              exit 0
            fi
            echo "::warning::push of $ref failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && break
            sleep $(( attempt * 30 ))
          done
          echo "::error::push of $ref failed after 3 attempts"
          exit 1
          SH
          chmod +x /tmp/push-retry.sh

      - name: Push ${{ matrix.flavor }} + capture digest
        id: push
        run: |
          # zstd:chunked — see the note on the core push. This is the one users
          # actually pull, so it is where the download saving lands.
          /tmp/push-retry.sh "$IMAGE:${{ matrix.flavor }}-${{ github.sha }}" --digestfile=/tmp/flavor.digest
          /tmp/push-retry.sh "$IMAGE:${{ matrix.flavor }}"
          DIGEST="$(cat /tmp/flavor.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.flavor }} digest: $DIGEST"

      - name: Sign ${{ matrix.flavor }} (cosign keyless)
        run: |
          cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

      # How much this push actually costs the fleet. The point of the core tier
      # is that this number is small; printing it into the run summary is what
      # turns "it should be small" into something anyone can check at a glance,
      # and what will make a regression obvious the week it happens.
      - name: Report update cost for ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          # Same trap as the core job: `sudo podman login` above left a
          # root-owned auth.json in this user's runtime dir, and skopeo reads it
          # before honouring --creds. Point it at one we own.
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          echo '{}' > "$REGISTRY_AUTH_FILE"
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          new=$(skopeo inspect --raw --creds "$creds" \
                  "docker://$IMAGE@${{ steps.push.outputs.digest }}")
          # Layers shared with the parent core are the ones bootc will NOT
          # download; anything else is new bytes on every machine.
          core=$(skopeo inspect --raw --creds "$creds" \
                  "docker://$IMAGE_CORE:latest" 2>/dev/null || echo '{}')
          python3 - "$new" "$core" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          new, core = json.loads(sys.argv[1]), json.loads(sys.argv[2] or '{}')
          nl = new.get('layers', [])
          shared = {l['digest'] for l in core.get('layers', [])}
          fresh = [l for l in nl if l['digest'] not in shared]
          mib = lambda b: b / 2**20
          print(f"### `${{ matrix.flavor }}` update cost")
          print()
          print(f"- total image: **{len(nl)} layers, {mib(sum(l['size'] for l in nl)):.0f} MiB**")
          print(f"- inherited from core (not re-downloaded): "
                f"**{len(nl) - len(fresh)} layers, {mib(sum(l['size'] for l in nl) - sum(l['size'] for l in fresh)):.0f} MiB**")
          print(f"- NOT inherited from core: "
                f"**{len(fresh)} layers, {mib(sum(l['size'] for l in fresh)):.0f} MiB**")
          print()
          print("The last figure is an UPPER BOUND on what `apex update` downloads: "
                "base/flavor layers that happen to be unchanged since the previous "
                "push are also reused, but are counted as new here. Before the "
                "core/base split this number was the whole image (153 layers, 5.3 GB).")
          PY

  # ── Job 5: qcow2 (stretch, dispatch-gated, non-blocking) ─────────────────
  # Proves bootc-image-builder produces a bootable disk from the daily image.
  # GitHub runners have NO /dev/kvm, so the disk is NOT booted here — producing
  # the qcow2 is the check. Gated on manual dispatch (build_qcow2=true) and
  # continue-on-error so bib flakiness never fails the image pipeline.
  qcow2:
    needs: flavors
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_qcow2
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build daily qcow2 via bootc-image-builder
        run: |
          mkdir -p output
          sudo podman pull "$IMAGE:daily-${{ github.sha }}"
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs xfs --local \
            "$IMAGE:daily-${{ github.sha }}"
          ls -lh output/qcow2 || ls -lhR output

      - name: Upload qcow2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-os-daily-qcow2
          path: output/qcow2/*.qcow2
          if-no-files-found: warn
          retention-days: 7

  # ── Job 6: installer ISO (dispatch-gated) ─────────────────────────────────
  # Builds the APEX-OS Daily installer as an Anaconda ISO (bootc-image-builder
  # --type anaconda-iso) — a bootable USB that installs the signed daily image
  # to a target disk. The image is pulled into local storage first (each job is
  # a fresh runner; --local needs it present). Uploaded as an artifact for the
  # maintainer to write to a USB stick. Independent of core/base/flavors: it
  # pulls the already-published :daily, so it runs on an ISO-only dispatch.
  installer-iso:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso
    steps:
      # Needed for installer/bib-config.toml (the interactive kickstart).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Pull the latest green daily image into local storage
        run: sudo podman pull "$IMAGE:daily"

      # The installer config (installer/bib-config.toml) is mounted at
      # /config.toml so bootc-image-builder applies our INTERACTIVE kickstart
      # instead of its destructive default (clearpart --all + locked root). See
      # that file's header and docs. Without it the ISO wipes the target disk
      # unattended and locks the user out — the two bugs this fixes.
      - name: Build daily installer ISO via bootc-image-builder
        run: |
          mkdir -p output
          test -f installer/bib-config.toml  # fail loudly if the config is missing
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output":/output \
            -v "$(pwd)/installer/bib-config.toml":/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs --local \
            "$IMAGE:daily"
          ls -lhR output/bootiso || ls -lhR output

      # Guard: extract the embedded kickstart from the built ISO and FAIL the
      # build if the destructive defaults ever reappear (clearpart/autopart) or
      # a root password / user got baked in. Cheap insurance against a future
      # bib change silently restoring the unattended wipe. Uses the runner's own
      # xorriso (no mount) to pull the kickstart files from the ISO root.
      - name: Verify embedded kickstart is non-destructive
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xorriso
          iso=$(ls output/bootiso/*.iso | head -1)
          echo "Inspecting $iso"
          rm -rf ksdump && mkdir ksdump
          # Extract EVERY kickstart on the ISO (not just the two known names) so a
          # renamed/extra ks carrying a destructive directive can't slip past. List
          # the ISO tree, pull each *.ks. (apex-logs 36 — hardened after Fable review.)
          xorriso -osirrox on -indev "$iso" -find / -name '*.ks' 2>/dev/null \
            | sed -n "s/^'\(.*\)'.*/\1/p" > ks.list || true
          # Fallback to the known names if -find gave nothing.
          if [ ! -s ks.list ]; then printf '/osbuild.ks\n/osbuild-base.ks\n' > ks.list; fi
          while read -r k; do
            [ -n "$k" ] || continue
            out="ksdump/$(echo "$k" | tr '/' '_')"
            xorriso -osirrox on -indev "$iso" -extract "$k" "$out" 2>/dev/null || true
          done < ks.list
          cat ksdump/* > extracted.ks 2>/dev/null || true
          echo "----- kickstart files on ISO -----"; cat ks.list
          echo "----- embedded kickstart -----"; cat extracted.ks; echo "------------------------------"
          if [ ! -s extracted.ks ]; then
            echo "::error::Could not extract any kickstart from the ISO — cannot verify"; exit 1
          fi
          # Storage: nothing that can partition/format/mount without the operator.
          if grep -Eiq '^[[:space:]]*(clearpart|autopart|part|reqpart|ignoredisk|zerombr|raid|volgroup|logvol|btrfs)([[:space:]]|$)' extracted.ks; then
            echo "::error::A storage directive was found in the kickstart (must be interactive)"; exit 1
          fi
          # Accounts: no baked user/root credential.
          if grep -Eiq '^[[:space:]]*(rootpw|user[[:space:]]+--|sshkey)([[:space:]]|$)' extracted.ks; then
            echo "::error::A baked user/rootpw/sshkey was found (must be interactive)"; exit 1
          fi
          # No unattended-completion or auto-reboot, and no %pre that could wipe.
          if grep -Eiq '^[[:space:]]*(autostep|reboot|poweroff|halt|shutdown)([[:space:]]|$)|^%pre\b' extracted.ks; then
            echo "::error::An unattended/%pre directive was found in the kickstart"; exit 1
          fi
          # Bootloader cmdline must not force a non-interactive install.
          rm -rf grubdump && mkdir grubdump
          for g in /EFI/BOOT/grub.cfg /boot/grub2/grub.cfg /isolinux/isolinux.cfg /EFI/fedora/grub.cfg; do
            xorriso -osirrox on -indev "$iso" -extract "$g" "grubdump/$(echo "$g" | tr '/' '_')" 2>/dev/null || true
          done
          if grep -Eiq 'inst\.(text|cmdline|noninteractive|ks\.all)' grubdump/* 2>/dev/null; then
            echo "::error::Boot cmdline forces a non-interactive/auto install"; exit 1
          fi
          echo "OK: kickstart has no storage/account/unattended directives; install is interactive."

      - name: Upload installer ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-os-daily-installer-iso
          path: output/bootiso/*.iso
          if-no-files-found: warn
          retention-days: 7
