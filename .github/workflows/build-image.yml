name: build-image

# Build, sign (cosign keyless), and push the APEX-OS images to GHCR.
#
#   core            → ghcr.io/andrenijman/apex-os:core   (heavy, slow-moving)
#   base            → ghcr.io/andrenijman/apex-os:base   (thin, per-commit)
#   the image       → ghcr.io/andrenijman/apex-os:apex
#                     …and :daily, :gaming-mesa, :gaming-nvidia, which are the
#                     SAME MANIFEST DIGEST under their old names.
#
# ═══ ONE IMAGE, AND WHY THE OLD TAGS MUST NEVER STOP RESOLVING ═══
#
# APEX published three images that were one operating system with different
# payloads. That forced a choice at install time — pick Daily on a gaming laptop
# and you had no GPU driver — so it is now a single image: NVIDIA and the
# xone/xpadneo controller modules are built and SIGNED into it (a kernel module
# cannot be installed at runtime under Secure Boot, because signing needs the MOK
# private key that never leaves CI), while Steam, gamescope, MangoHud, Sunshine
# and OBS install on demand through `apex install`.
#
# Every machine already deployed has bootc pointed at ONE of `:daily`,
# `:gaming-mesa` or `:gaming-nvidia`. A tag that stops being updated does not
# error — `bootc upgrade` simply keeps reporting "no update available" forever,
# and the machine silently stops receiving security updates. So all three are
# promoted to the same digest on every run, and the `Assert every published tag
# resolves` step below fails the run if any of them does not. Retagging (rather
# than a manifest list or a redirect) is what GHCR actually supports, costs one
# manifest write each because the blobs are already there, and needs nothing
# from the installed machines.
#
# ═══ THE THREE-TIER SPLIT, AND WHY `apex update` USED TO PULL 5.3 GB ═══
#
# Everything used to live in one `base` image. That base was gated on a path
# filter covering files/**, apexd/** and config/** — i.e. essentially every
# commit — and it built with no layer cache, so every dnf/RUN layer got a fresh
# digest even when the installed bytes were identical. bootc reuses a layer only
# when it already holds that exact digest, so a one-line shell tweak invalidated
# all of them. Measured on the author's L16 against the live registry:
#
#     $ bootc upgrade --check
#     Total new layers: 153   Size: 5.3 GB
#     Removed layers:   152   Size: 5.4 GB
#
# 153 of 153 layers, every single update. The fix is the `core` tier: the
# slow-moving ~95% of the image is built once and consumed by the base as
# FROM apex-os-core@sha256:… . A digest-pinned FROM reuses those layer
# descriptors verbatim, so bootc already has the blobs and downloads none of
# them. A normal push now rebuilds only base + flavor — tens of MiB.
#
# It is also much faster to BUILD: a flavor- or base-only push skips the ~45 min
# core entirely.
#
# ── When each tier rebuilds ──
#   core    Containerfile.core / kernel/** changed · force_core · or the weekly
#           cron found a NEW fedora-bootc digest. That last condition matters:
#           an unconditional weekly rebuild would reissue ~5 GB of
#           byte-different, content-identical layers to the whole fleet every
#           Monday, which is the very cost this split exists to remove. The
#           digest core was built from is stamped on it as a label and compared.
#   base    Containerfile.base / apexd/** / config/** / files/** changed, or
#           core rebuilt.
#   image   every run (it is thin, and it must follow the base digest).
#
# The base's immutable digest is passed to the image build as
# --build-arg BASE=<base>@<digest>, and core's as --build-arg CORE=<core>@<digest>,
# so every tier is pinned to an exact parent. Signing is keyless
# (Sigstore/Fulcio) via the runner's OIDC token.

on:
  push:
    branches: [main]
    paths:
      - "Containerfile*"
      - "files/**"
      - "apexd/**"
      - "config/**"
      - "kernel/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      build_qcow2:
        description: "Also build a qcow2 disk image (bootc-image-builder)"
        type: boolean
        default: false
      build_iso:
        description: "Build the APEX-OS installer ISO (anaconda-iso)"
        type: boolean
        default: false
      force_core:
        description: "Force a full, cache-bypassing CORE rebuild (~45 min; makes the next update a full download for every user)"
        type: boolean
        default: false
  schedule:
    # Weekly (Mon 06:00 UTC) to pick up upstream fedora-bootc / COPR / RPMFusion
    # security updates. This only rebuilds core when the upstream base image has
    # actually moved — see the gate in job 0.
    - cron: "0 6 * * 1"

concurrency:
  group: apex-image-publish
  cancel-in-progress: false

# Least privilege. id-token:write is required for cosign keyless (OIDC) signing;
# packages:write is required to push to GHCR.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  # ONE repository for every tier, distinguished by tag (core and base used to be
  # separate repos: apex-os-core / apex-os-base).
  #
  # HONEST NOTE ON WHY: this was done expecting the registry to skip blobs it
  # already held — a registry dedups only WITHIN a repository, so pushing :daily
  # was re-uploading ~4.7 GB of layers inherited from core while identical blobs
  # sat in apex-os-core. That expectation was WRONG, and measuring it locally
  # against a throwaway registry:2 showed why:
  #
  #   push core (zstd:chunked) ................. 99 blobs copied,  0 skipped
  #   push base into the same repo ............ 159 blobs copied,  0 skipped
  #   push the IDENTICAL core ref again ........ 99 blobs copied,  0 skipped
  #   same with skopeo, and with no --compression-format at all: 0 skipped
  #
  # Nothing is ever reused, because compressing out of containers-storage only
  # yields the blob digest AFTER compression — there is no digest to check the
  # registry for beforehand. Only a registry-to-registry copy knows its digests
  # up front and can skip, which is exactly why the tag step below is fast and
  # the main push is not.
  #
  # The consolidation is kept anyway: it costs nothing, keeps every tier's tags
  # in one place, and the user-facing tags (:daily, :gaming-mesa, :gaming-nvidia)
  # are UNCHANGED so every installed machine keeps tracking the same reference —
  # which now matters far more than it did, because those three names are the
  # ONLY thing keeping already-deployed machines updating after the collapse to a
  # single image. But it is NOT a speed optimisation, and should not be cited as one.
  IMAGE: ghcr.io/andrenijman/apex-os
  CACHE_PREFIX: ghcr.io/andrenijman/apex-os-build-cache
  TAG_CORE: core
  TAG_BASE: base
  # Transitional: where core/base lived before the consolidation. The base job
  # copies core across on the first run so this does NOT force a core rebuild —
  # which would have meant 55 minutes of CI and a full ~5 GB download for every
  # machine, to change a name.
  LEGACY_CORE: ghcr.io/andrenijman/apex-os-core
  UPSTREAM_BASE: quay.io/fedora/fedora-bootc:43

jobs:
  # ── Job 0: what has to rebuild ────────────────────────────────────────────
  changes:
    runs-on: ubuntu-24.04
    # Skip on an ISO-only dispatch (installer-iso pulls the published :daily).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2) }}
    outputs:
      core: ${{ steps.gate.outputs.core }}
      base: ${{ steps.filter.outputs.base }}
      shell_sha: ${{ steps.shell.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pin apex-shell
        id: shell
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/AndreNijman/apex-shell refs/heads/main | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve apex-shell/main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned apex-shell: $sha"

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'Containerfile.core'
              - 'kernel/**'
              # DELIBERATELY NOT build-image.yml. It was here at first, and the
              # very next CI-only commit — adding a push retry — triggered a
              # 55-minute core rebuild and reissued the whole ~5 GB image to
              # every machine on the fleet, for a change that could not affect
              # core's CONTENT by even one byte. Rebuilding core is the single
              # most expensive thing this workflow can do, so it must be driven
              # by core's actual inputs, not by edits to the file that drives it.
              #
              # The trade: a workflow change that genuinely alters how core is
              # built (a new --build-arg, a different base tag) will NOT rebuild
              # it on its own. Run the workflow with force_core=true for that —
              # an explicit action for the rare case, instead of a multi-gigabyte
              # download for the common one.
            base:
              - 'Containerfile.base'
              - 'Containerfile.apex'
              - 'apexd/**'
              - 'config/**'
              - 'files/**'
              - '.github/workflows/build-image.yml'

      # The whole point of the core tier is that it does NOT move for no reason:
      # every core rebuild is a full multi-GB download for every machine on the
      # fleet. So the weekly cron asks whether upstream actually changed instead
      # of assuming it did.
      - name: Decide whether core must rebuild
        id: gate
        run: |
          set -euo pipefail

          decide() { echo "core=$1" >> "$GITHUB_OUTPUT"; echo "core rebuild: $1 ($2)"; exit 0; }

          [ "${{ inputs.force_core }}" = "true" ] && decide true "force_core requested"
          [ "${{ steps.filter.outputs.core }}" = "true" ] && decide true "core sources changed"

          # Not a scheduled run and nothing core-relevant changed → reuse.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            decide false "no core-relevant change"
          fi

          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }

          # What upstream is at right now.
          UP="$(skopeo inspect --no-creds --format '{{.Digest}}' "docker://$UPSTREAM_BASE")"
          echo "upstream $UPSTREAM_BASE = $UP"

          # What the published core was built from. Missing image, missing label
          # or an unreadable registry all fall through to "rebuild" — failing
          # towards a rebuild is the safe direction for a security refresh.
          label='{{ index .Labels "org.apexos.fedora-bootc.digest" }}'
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          HAVE="$(skopeo inspect --creds "$creds" --format "$label" \
                    "docker://$IMAGE:$TAG_CORE" 2>/dev/null || echo '')"
          # Transitional fallback: before the repo consolidation core lived at
          # $LEGACY_CORE:latest. Without this the first run after the rename would
          # see "no published core", rebuild it for 55 minutes, and hand every
          # machine a full ~5 GB download — to change a name.
          if [ -z "$HAVE" ]; then
            HAVE="$(skopeo inspect --creds "$creds" --format "$label" \
                      "docker://$LEGACY_CORE:latest" 2>/dev/null || echo '')"
            [ -n "$HAVE" ] && echo "(resolved from the legacy $LEGACY_CORE)"
          fi
          echo "published core was built from = ${HAVE:-<none>}"

          [ -n "$HAVE" ] || decide true "no published core to reuse"
          [ "$HAVE" = "$UP" ] && decide false "upstream fedora-bootc has not moved since the last core"
          decide true "upstream fedora-bootc moved"

  # ── Job 1: Rust — fast gate on the apexd/apex workspace ───────────────────
  # apexd and apex are compiled INSIDE the base build, so a compile error used
  # to surface ~10 minutes into a container build with no test coverage at all
  # (the workspace has 100+ tests and CI ran none of them). This job takes ~2
  # min and blocks the base, so a broken CLI can never be published.
  rust:
    runs-on: ubuntu-24.04
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2) }}
    defaults:
      run:
        working-directory: apexd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: rustup component add clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apexd/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apexd/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # NOTE: no `cargo fmt --all --check`. The workspace has never been
      # rustfmt'd — 24 of its source files differ — so adding that gate here
      # would fail on its first run and block every image build until someone
      # reformatted the whole tree. That reformat is a real change to code
      # unrelated to this release and belongs in its own commit, made
      # deliberately. Add the step back the same day `cargo fmt --all` lands.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # ── Job 2: core (heavy, gated) ────────────────────────────────────────────
  core:
    needs: changes
    runs-on: ubuntu-24.04
    # The push helper tags in-registry with skopeo, which needs its own
    # credentials: `sudo podman login` is root's, and cosign's is the user's
    # docker config, neither of which skopeo picks up here.
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: ${{ needs.changes.outputs.core == 'true' }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Rootful podman: the CachyOS kernel's %posttrans (rpm-ostree
      # kernel-install → dracut) needs device access (/dev/kmsg, loop) that
      # rootless podman on the runner denies. --isolation=chroot sidesteps
      # nested cgroup setup on the runner.
      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # cosign runs as the normal user, not under sudo, so it cannot see the
      # rootful podman auth above. Give cosign its own GHCR credential so
      # `cosign sign` can pull the digest to sign it — the packages are private.
      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Stamped onto the image as a label so job 0 can tell, next Monday,
      # whether upstream has actually moved. Without it the weekly cron would
      # reissue the whole image every week regardless.
      - name: Resolve upstream fedora-bootc digest
        id: upstream
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          # --no-creds: fedora-bootc is public, so ask anonymously. Without it
          # skopeo tries to resolve credentials and dies on
          # /run/user/<uid>/containers/auth.json, which the earlier
          # `sudo podman login` created ROOT-OWNED in this job's runtime dir —
          # the same rootful/rootless split the cosign login step above exists
          # for. It has nothing to log in to here anyway.
          D="$(skopeo inspect --no-creds --format '{{.Digest}}' "docker://$UPSTREAM_BASE")"
          test -n "$D"
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "fedora-bootc digest: $D"

      - name: Build core
        env:
          APEX_SB_KEY_B64: ${{ secrets.APEX_SB_KEY_B64 }}
          APEX_SB_CRT_B64: ${{ secrets.APEX_SB_CRT_B64 }}
        run: |
          # ── Secure Boot signing key ──────────────────────────────────────
          # Containerfile.core signs the CachyOS kernel with the APEX MOK only
          # when these build secrets are present, and otherwise stamps the image
          # `unsigned` and carries on. CI used to pass nothing, so every image
          # ever PUBLISHED to GHCR was unsigned: anyone installing from the
          # registry could not use Secure Boot at all, and enrolling the APEX
          # key would not have helped them, because their kernel did not carry
          # its signature. Only locally-built images were signed.
          #
          # The key lives only in $RUNNER_TEMP for the length of the build,
          # 0600, and is shredded afterwards. It is never in the repo, never in
          # a build ARG (those are visible in image history), and never in the
          # image — the Containerfile takes it as --secret, which is a tmpfs
          # mount that leaves no layer behind.
          #
          # Secrets are NOT exposed to workflows triggered by pull requests from
          # forks, which is what makes this safe on a public repo. It does mean
          # the key's security is the GitHub account's security: anyone able to
          # push to main or run workflow_dispatch can use it.
          #
          # NOTE: signing now happens once here, in core, and every tier
          # inherits the signed vmlinuz. The base and flavor jobs re-verify it
          # on the artefact users actually pull.
          SECDIR="$RUNNER_TEMP/apex-sb"
          mkdir -p "$SECDIR"; chmod 700 "$SECDIR"
          SECRET_ARGS=""
          if [ -n "${APEX_SB_KEY_B64:-}" ] && [ -n "${APEX_SB_CRT_B64:-}" ]; then
            printf '%s' "$APEX_SB_KEY_B64" | base64 -d > "$SECDIR/apex-mok.key"
            printf '%s' "$APEX_SB_CRT_B64" | base64 -d > "$SECDIR/apex-mok.crt"
            chmod 600 "$SECDIR"/apex-mok.*
            # Fail now rather than ship an unsigned image because a secret was
            # pasted in mangled. Silent degradation is how this shipped unsigned
            # for weeks in the first place.
            openssl rsa  -in "$SECDIR/apex-mok.key" -noout -check >/dev/null
            openssl x509 -in "$SECDIR/apex-mok.crt" -noout        >/dev/null
            k=$(openssl rsa  -in "$SECDIR/apex-mok.key" -noout -modulus | sha256sum)
            c=$(openssl x509 -in "$SECDIR/apex-mok.crt" -noout -modulus | sha256sum)
            [ "$k" = "$c" ] || { echo "FATAL: APEX_SB_KEY_B64 and APEX_SB_CRT_B64 are not a pair"; exit 1; }
            SECRET_ARGS="--secret id=apex_sb_key,src=$SECDIR/apex-mok.key --secret id=apex_sb_crt,src=$SECDIR/apex-mok.crt"
            echo "Secure Boot: signing key present — the kernel will be signed"
          else
            echo "Secure Boot: NO signing secret configured — the kernel will be UNSIGNED"
          fi

          # --no-cache on a forced or scheduled rebuild: those are exactly the
          # runs whose purpose is to pick up new upstream content.
          NOCACHE=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force_core }}" = "true" ]; then
            NOCACHE="--no-cache"
          fi

          sudo podman build --isolation=chroot $NOCACHE \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            --build-arg FEDORA_BOOTC_DIGEST="${{ steps.upstream.outputs.digest }}" \
            $SECRET_ARGS \
            -f Containerfile.core \
            -t "$IMAGE:$TAG_CORE-${{ github.sha }}" \
            .

          shred -u "$SECDIR"/apex-mok.* 2>/dev/null || rm -f "$SECDIR"/apex-mok.*
          rmdir "$SECDIR" 2>/dev/null || true

      # Gate the push on the core actually being usable. Everything asserted
      # here has silently shipped broken at least once: hyprland-qtutils was
      # absent for weeks because dnf dropped an unsatisfiable weak dep without
      # failing the build (apex-logs 47), and the Fedora de-branding regressed
      # the same way. A green `podman build` is not evidence the image is right.
      - name: Verify core image
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          run() { sudo podman run --rm --entrypoint /bin/sh "$IMAGE:$TAG_CORE-${{ github.sha }}" -c "$1"; }

          # hyprland-qtutils, built from source against Qt 6.10 (the packaged
          # build links Qt 6.9 private API and cannot install here).
          for b in hyprland-dialog hyprland-donate-screen hyprland-update-screen; do
            run "command -v $b >/dev/null" || fail "$b missing from core image"
          done
          run 'test -d /usr/lib64/qt6/qml/org/hyprland/style' \
            || fail "hyprland QML style not installed"
          run '! ldd /usr/bin/hyprland-dialog | grep -q "not found"' \
            || fail "hyprland-dialog has unresolved libraries"

          # De-branding: ID=fedora is deliberate (dnf copr chroots derive from it);
          # it must be the ONLY Fedora string left in os-release.
          N=$(run 'grep -ci fedora /usr/lib/os-release')
          [ "$N" = "1" ] || fail "expected exactly 1 Fedora string in os-release, found $N"
          run 'grep -q "^PRETTY_NAME=\"APEX-OS\"" /usr/lib/os-release' \
            || fail "os-release not branded"
          run 'grep -q "^APEX-OS release" /etc/system-release' \
            || fail "/etc/system-release not branded (bootupd derives the EFI label from it)"

          # Things the BASE tier can no longer install for itself, because it
          # runs no dnf at all. If any of these regress, the base build fails
          # far less legibly than this does.
          run 'test -x /usr/sbin/efibootmgr -o -x /usr/bin/efibootmgr' \
            || fail "efibootmgr missing — the Windows-boot button cannot work"
          run 'command -v plymouth-set-default-theme >/dev/null' \
            || fail "plymouth engine missing — both flavors set a theme against it"
          run 'command -v setpriv >/dev/null' \
            || fail "setpriv missing — the greeter-wallpaper helper drops privileges with it"
          run 'command -v starship >/dev/null && command -v zsh >/dev/null' \
            || fail "zsh/starship missing"
          run 'command -v matugen >/dev/null' \
            || fail "matugen missing — the shell cannot theme without it"
          run 'command -v cargo >/dev/null' \
            || fail "cargo missing — Containerfile.base compiles apexd in a stage FROM this image"

          # Secure Boot: if a signing key is configured, the published kernel
          # MUST actually carry the signature. Containerfile.core degrades to
          # "unsigned" and keeps going when signing fails or the secret is
          # absent — good for local builds, unacceptable for the artefact other
          # people install. Assert both the marker and the real PE certificate
          # table, because the marker is only a claim.
          if [ -n "${{ secrets.APEX_SB_KEY_B64 }}" ]; then
            state=$(run 'cat /usr/share/apex-os/secureboot/kernel-signed 2>/dev/null || echo missing')
            [ "$state" = signed ] \
              || fail "signing key is configured but the image is stamped '$state' — refusing to publish an unsigned kernel"
            run 'test -s /usr/share/apex-os/secureboot/apex-mok.der' \
              || fail "kernel-signed=signed but apex-mok.der is missing — users would have nothing to enrol"
            sudo podman run --rm --entrypoint /bin/sh "$IMAGE:$TAG_CORE-${{ github.sha }}" -c \
              'dnf5 -y install -q sbsigntools >/dev/null 2>&1; sbverify --list /usr/lib/modules/$(cat /usr/lib/apex-kver)/vmlinuz' \
              | grep -qi 'signature certificates\|image signature issuers\|APEX' \
              || fail "sbverify found no signature on the shipped vmlinuz"
            echo "Secure Boot: verified — the published kernel is signed and apex-mok.der ships with it"
          else
            echo "::warning::No APEX_SB_KEY_B64 secret — this image ships an UNSIGNED kernel and cannot be used with Secure Boot"
          fi

          echo "core image verified"

      # ── Push once, then tag in-registry ──────────────────────────────────
      # Two problems this solves, both measured on run 30775672845.
      #
      # 1. Every image was uploaded TWICE. `podman push :x-<sha>` followed by
      #    `podman push :x` re-sent the whole thing: 166 blobs, then 166 more,
      #    with ZERO reported as already present. ~7 minutes per image thrown
      #    away. So the friendly tag is now made with an in-registry copy, which
      #    finds every blob already there and writes only a manifest.
      # 2. Pushes fail transiently. Run 30771778274 lost a green 50-minute
      #    gaming-nvidia build to `502 Bad Gateway` eight minutes into the
      #    upload, with nothing retrying.
      - name: Push helper
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          cat > /tmp/push-retry.sh <<'SH'
          #!/usr/bin/env bash
          # push-and-tag <repo> <sha-tag> <friendly-tag> <digestfile>
          set -uo pipefail
          repo="$1"; sha_tag="$2"; friendly="$3"; digestfile="$4"
          for attempt in 1 2 3; do
            sudo podman push --compression-format zstd:chunked \
              "$repo:$sha_tag" --digestfile="$digestfile" && break
            echo "::warning::push of $repo:$sha_tag failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && { echo "::error::push failed after 3 attempts"; exit 1; }
            sleep $(( attempt * 30 ))
          done
          digest="$(cat "$digestfile")"
          # skopeo, not `podman push` again: same repository, so every blob is
          # already present and this is a manifest write. `podman push` does not
          # take that shortcut — it re-uploads.
          #
          # --creds explicitly, and REGISTRY_AUTH_FILE pointed somewhere we own:
          # `sudo podman login` leaves a root-owned auth.json in this user's
          # runtime dir, and skopeo reads it before honouring anything else.
          export REGISTRY_AUTH_FILE="${RUNNER_TEMP}/skopeo-auth.json"
          [ -f "$REGISTRY_AUTH_FILE" ] || echo '{}' > "$REGISTRY_AUTH_FILE"
          for attempt in 1 2 3; do
            skopeo copy --retry-times 3 \
              --src-creds "$GHCR_USER:$GHCR_TOKEN" \
              --dest-creds "$GHCR_USER:$GHCR_TOKEN" \
              "docker://$repo@$digest" "docker://$repo:$friendly" && exit 0
            echo "::warning::tagging $repo:$friendly failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && break
            sleep $(( attempt * 15 ))
          done
          echo "::error::could not tag $repo:$friendly"
          exit 1
          SH
          chmod +x /tmp/push-retry.sh

      - name: Push core + capture digest
        id: push
        run: |
          # zstd:chunked instead of the default gzip (apex-logs 16). Two effects,
          # neither of which changes image CONTENT — only how it is packed:
          #   - zstd compresses this tree meaningfully smaller than gzip, and
          #     decompresses several times faster, so `apex update` spends less
          #     time both downloading and unpacking.
          #   - :chunked publishes a per-layer chunk manifest.
          # Requires an OCI manifest (podman already produces one here) and a
          # client that understands zstd; the fleet is bootc 1.16+/ostree 2026.2,
          # which does. `apex rollback` remains the escape hatch.
          /tmp/push-retry.sh "$IMAGE" "$TAG_CORE-${{ github.sha }}" "$TAG_CORE" /tmp/core.digest
          DIGEST="$(cat /tmp/core.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Core digest: $DIGEST"

      - name: Sign core (cosign keyless)
        run: |
          cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

  # ── Job 3: base (thin) ────────────────────────────────────────────────────
  # Runs whenever core did not FAIL, so a base-only push (core skipped) still
  # builds, resolving the last-good core digest from GHCR.
  base:
    needs: [changes, rust, core]
    if: >-
      ${{
        always() && !cancelled()
        && needs.rust.result == 'success'
        && needs.core.result != 'failure'
        && !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2)
      }}
    runs-on: ubuntu-24.04
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Resolve the core digest to build FROM. If the core job ran in this
      # workflow use its output; otherwise resolve the last-good published core.
      # Failing here is FATAL and says so: on the very first run after this
      # split there is no apex-os-core:latest yet, and silently falling through
      # to an unpinned tag (or to fedora-bootc) would produce a wrong image.
      - name: Resolve core digest
        id: core
        run: |
          set -euo pipefail
          D="${{ needs.core.outputs.digest }}"
          if [ -z "$D" ]; then
            command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
            creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
            export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
            [ -f "$REGISTRY_AUTH_FILE" ] || echo '{}' > "$REGISTRY_AUTH_FILE"

            # ONE-TIME MIGRATION. core used to live at $LEGACY_CORE:latest. Copy
            # it to $IMAGE:$TAG_CORE rather than rebuilding: a rebuild is 55
            # minutes of CI and a full ~5 GB download for every machine, to change
            # a name. Both refs are on the same registry, so this is a blob mount,
            # not a transfer.
            if ! skopeo inspect --creds "$creds" --format '{{.Digest}}' \
                   "docker://$IMAGE:$TAG_CORE" >/dev/null 2>&1; then
              echo "$IMAGE:$TAG_CORE absent — migrating from $LEGACY_CORE:latest"
              skopeo copy --retry-times 3 --src-creds "$creds" --dest-creds "$creds" \
                "docker://$LEGACY_CORE:latest" "docker://$IMAGE:$TAG_CORE" \
                || { echo "::error::No core image at $IMAGE:$TAG_CORE and none to migrate from."
                     echo "::error::Re-run this workflow with force_core=true to build one."
                     exit 1; }
            fi

            echo "Core job skipped — resolving last-good $IMAGE:$TAG_CORE"
            if ! sudo podman pull "$IMAGE:$TAG_CORE"; then
              echo "::error::Cannot pull $IMAGE:$TAG_CORE and the core job did not run."
              echo "::error::Re-run this workflow with force_core=true to build one."
              exit 1
            fi
            D="$(sudo podman image inspect "$IMAGE:$TAG_CORE" \
                  --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          fi
          if [ -z "$D" ]; then
            echo "::error::Resolved an empty core digest — refusing to build against an unpinned parent."
            exit 1
          fi
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "Using core digest: $D"

      # ── One cheap question the logs have never answered ─────────────────
      # `base` spends ~90s-4m per layer on layers whose commands take seconds,
      # and nothing has ever recorded WHY. The first suspect is the storage
      # driver: `vfs` copies the whole rootfs for every layer, which for a
      # multi-GB core parent is exactly the observed constant cost, whereas
      # `overlay` writes a diff. Two seconds to print it, and it turns the next
      # round of this investigation from inference into a reading.
      - name: Report podman storage driver
        run: |
          sudo podman info --format 'graph driver: {{.Store.GraphDriverName}}'
          sudo podman info --format 'graph root:   {{.Store.GraphRoot}}'
          sudo podman info --format 'backing fs:   {{.Store.GraphStatus.Backing_Filesystem}}'
          sudo podman info --format 'native overlay diff: {{.Store.GraphStatus.Native_Overlay_Diff}}'
          df -h /var/lib/containers 2>/dev/null || df -h /

      - name: Build base
        run: |
          # ── A cache-push failure must not fail a build that made an image ──
          #
          # `--cache-to` writes intermediate layers to ghcr so the NEXT build is
          # fast. It is an optimisation, not the deliverable. podman runs it
          # inside the build command, so its failure exits 125 and takes the
          # build with it — which happened twice in a row on the final image
          # build, both times AFTER apexd, apex, apex-agentd and apex-aid had
          # compiled and been installed:
          #
          #   Error: failed pushing cache ... reading blob sha256:3c29356a...:
          #   locating image with ID "e2dd7f77...": image not known
          #
          # Measured rather than assumed: `podman build --cache-to <unreachable
          # repo>` exits 125 AND leaves the image tagged and present. So a 125
          # can be forgiven — but only after checking the image exists, never by
          # inferring it.
          #
          # This is the narrow exception AGENTS.md allows for a tolerated
          # upstream defect, with the hard postcondition it requires.
          set +e
          sudo podman build --isolation=chroot --layers=true \
            --cache-from "$CACHE_PREFIX-base" \
            --cache-ttl=336h \
            --build-arg CORE="$IMAGE@${{ steps.core.outputs.digest }}" \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            --build-arg APEX_SHELL_REF="${{ needs.changes.outputs.shell_sha }}" \
            --build-arg APEX_SHELL_STRICT=1 \
            -f Containerfile.base \
            -t "$IMAGE:$TAG_BASE-${{ github.sha }}" \
            .
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            if sudo podman image exists "$IMAGE:$TAG_BASE-${{ github.sha }}"; then
              echo "::warning::podman exited $rc but the base image exists — treating it as a cache-push failure. The next build will be slower; this image is unaffected."
            else
              echo "::error::base build failed with $rc and produced no image"
              exit "$rc"
            fi
          fi

          # Unconditional: whatever podman reported, this job may not succeed
          # without the image it exists to produce.
          sudo podman image exists "$IMAGE:$TAG_BASE-${{ github.sha }}" \
            || { echo "::error::no base image after build"; exit 1; }

      - name: Verify base image
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          run() { sudo podman run --rm --entrypoint /bin/sh "$IMAGE:$TAG_BASE-${{ github.sha }}" -c "$1"; }

          # M6 + the per-user provisioner race fix.
          run 'test -x /usr/bin/apexd && test -x /usr/bin/apex' || fail "apexd/apex missing"
          run 'test -s /usr/share/apex/hypr/hyprland.conf' || fail "APEX hyprland template missing"
          run 'grep -q CRITICAL /usr/libexec/apex-shell-firstrun' \
            || fail "provisioner is missing the config-seeding race fix"
          run 'test ! -e /usr/share/wayland-sessions/hyprland-uwsm.desktop' \
            || fail "hyprland-uwsm.desktop present; it sorts first and bounce-loops"

          # ── labwc as a third user session ──────────────────────────────
          # The stock labwc.desktop must stay deleted: it launches labwc bare,
          # with no APEX Shell and no config, and labwc is simultaneously the
          # greeter's fallback HOST compositor, so offering the stock entry is a
          # login hazard. Ours is a separate file.
          run 'test -e /usr/share/wayland-sessions/apex-labwc.desktop' \
            || fail "apex-labwc.desktop missing; labwc session not offered"
          run 'test ! -e /usr/share/wayland-sessions/labwc.desktop' \
            || fail "stock labwc.desktop present; it starts labwc with no shell"
          run 'command -v labwc >/dev/null' \
            || fail "labwc binary missing but a labwc session is offered"
          # labwc has no IPC socket, so zwlr-output-power-management-v1 (wlopm)
          # is the only way the idle timer can turn the display off there. The
          # listener used to fire into nothing and report success.
          run 'command -v wlopm >/dev/null' \
            || fail "wlopm missing; idle screen-off is a silent no-op on the labwc session"

          # The session is worthless without its config: labwc has no IPC, so
          # everything the compositor does for the shell is declared in rc.xml
          # up front, and a missing or malformed file yields a bare grey screen.
          for f in rc.xml menu.xml autostart environment; do
            run "test -s /usr/share/apex/labwc/$f" \
              || fail "labwc template $f missing from the image"
          done
          run 'xmllint --noout /usr/share/apex/labwc/rc.xml' \
            || fail "labwc rc.xml is not well-formed; labwc would silently use defaults"
          run 'grep -q apex-shell-autostart /usr/share/apex/labwc/autostart' \
            || fail "labwc autostart does not start APEX Shell"
          run 'grep -q "^XDG_CURRENT_DESKTOP=labwc" /usr/share/apex/labwc/environment' \
            || fail "labwc environment does not identify the compositor to the shell"

          # ── apex shell wrapper ─────────────────────────────────────────
          # The labwc keybinds and root menu invoke `apex shell <verb>`. If that
          # verb is missing, or qs is not installed, every popup binding in the
          # session is a silent no-op that looks like a broken keyboard.
          run 'apex shell list >/dev/null' \
            || fail "apex shell is missing; labwc keybinds would silently do nothing"
          run 'command -v qs >/dev/null' \
            || fail "qs missing; apex shell has nothing to call"
          run 'grep -q "apex shell" /usr/share/apex/labwc/rc.xml' \
            || fail "labwc rc.xml no longer uses apex shell"
          # A read-only session verb must not have become root-only.
          run 'apex shell list >/dev/null' \
            || fail "apex shell list requires privileges it should not need"
          # labwc is the only authority on whether an action name and its
          # arguments are real: xmllint cannot know that `Focus` takes no
          # `direction`, and labwc answers a bad action by logging it and
          # carrying on with that binding silently dropped.
          #
          # It parses rc.xml BEFORE trying to open a backend, so this works in a
          # container with no seat and no display — verified: an invalid action
          # still reports, and a valid config prints nothing at all. The
          # non-zero exit from failing to start a compositor is expected and
          # deliberately ignored; only config diagnostics are inspected.
          run 'out=$(labwc -C /usr/share/apex/labwc 2>&1 || true); \
               ! printf "%s\n" "$out" | grep -qiE "invalid argument for action|invalid action|unexpected element"' \
            || fail "labwc rejected something in rc.xml; that binding would be silently dropped"

          # ── portal backends, per session, BY NAME ──────────────────────
          # Screen sharing, file pickers and screenshots all route through
          # portals, so a session whose backends are decided by resolution order
          # is a user-visible failure that looks like flakiness. niri shipped for
          # three releases with no APEX configuration at all — its packaged
          # `default=gnome;gtk` handed FileChooser to the GNOME implementation
          # while labwc and Hyprland both reached gtk — and no assertion here
          # could see it, because nothing enumerated the other sessions.
          #
          # portals.conf(5) looks up xdg-desktop-portal/<desktop>-portals.conf
          # for each name in XDG_CURRENT_DESKTOP, lower-cased, /etc before
          # /usr/share. So the check is per DESKTOP NAME, not per file.
          for d in hyprland niri labwc; do
            out=$(run "c=; for p in /etc/xdg-desktop-portal/$d-portals.conf /usr/share/xdg-desktop-portal/$d-portals.conf; do if [ -s \"\$p\" ]; then c=\$p; break; fi; done; [ -n \"\$c\" ] || exit 1; echo \"\$c\"; grep -qE '^[[:space:]]*default=.*[*]' \"\$c\" && exit 2; exit 0") \
              || fail "$d has no portals.conf, or resolves its backends through a wildcard (got: $out)"
            echo "portals: $d -> $out"
          done
          # The two APEX pins specifically, so a silent revert to the packaged
          # file fails rather than passing the loop above.
          run 'grep -qE "^default=gtk$" /etc/xdg-desktop-portal/labwc-portals.conf' \
            || fail "labwc portal config lost its gtk pin"
          run 'grep -qE "^default=gtk;gnome$" /etc/xdg-desktop-portal/niri-portals.conf' \
            || fail "niri portal config lost its gtk-first ordering"
          # niri drives capture through the Mutter API, so the gnome backend is
          # not interchangeable with the wlroots one labwc uses.
          run 'grep -qE "^org\.freedesktop\.impl\.portal\.ScreenCast=gnome$" /etc/xdg-desktop-portal/niri-portals.conf' \
            || fail "niri ScreenCast is no longer pinned to the gnome backend"
          run 'test -x /usr/libexec/xdg-desktop-portal-gnome' \
            || fail "xdg-desktop-portal-gnome missing; the niri session would have no screen sharing"
          # The filename is only matched because the session announces this name.
          run 'grep -q "^DesktopNames=niri$" /usr/share/wayland-sessions/niri.desktop' \
            || fail "niri.desktop no longer announces DesktopNames=niri; niri-portals.conf is inert"

          # The power menu and the idle timer both source apex-shell's
          # src/scripts/compositor.sh and run every action through its
          # apex_run(). A vendored tree that has the source line but not the
          # file is a power menu where nothing works at all — worse than the
          # labwc no-ops the adapter exists to fix, and silent.
          run 'P=/usr/share/apex-shell/src/scripts/PowerControl.sh;
               grep -qE "^[[:space:]]*\.[[:space:]].*compositor\.sh" "$P" || exit 0;
               test -s /usr/share/apex-shell/src/scripts/compositor.sh' \
            || fail "apex-shell sources compositor.sh but the vendored tree has no such file"

          # The greeter must tolerate NVIDIA: sway exits(1) on nvidia-drm without
          # this flag, which means no login at all on a hybrid-graphics machine.
          run 'grep -q -- --unsupported-gpu /etc/greetd/config.toml' \
            || fail "greeter missing --unsupported-gpu"

          # `apex update` must refuse to run unprivileged, with a message that
          # names sudo. The container runs as root, so assert the refusal by
          # dropping to a non-root uid — testing it as root would prove nothing.
          out=$(sudo podman run --rm --user 1000:1000 --entrypoint /bin/sh \
                  "$IMAGE:$TAG_BASE-${{ github.sha }}" -c 'apex update --check 2>&1' || true)
          echo "$out" | grep -q 'sudo apex update --check' \
            || fail "apex update does not tell an unprivileged caller to use sudo (got: $out)"
          # …and the verbs the desktop drives as the session user must NOT be gated.
          run 'apex tier >/dev/null' \
            || fail "apex tier broke — APEX Shell's power tab calls it as the session user"

          # The package engine is a shell script, so a broken code path shows up
          # only when a user runs it. These assert, in the image that will
          # actually ship, that `apex install` advertises the local-.rpm form and
          # enforces it — the advertisement matters because a feature nobody can
          # discover is not shipped, and the refusal matters because it is the
          # step that runs before anything is copied into /var.
          run 'apex install --help | grep -q "\.rpm"' \
            || fail "apex install --help does not mention installing a local .rpm file"
          run 'apex install --help | grep -q allow-unsigned' \
            || fail "apex install --help does not offer the unverified-RPM opt-in"
          run '/usr/libexec/apex-pkg --help | grep -q allow-unsigned' \
            || fail "apex-pkg --help does not mention --allow-unsigned"
          # The container is root, so this reaches the engine's real argument
          # handling. It must refuse by name and exit non-zero without creating
          # any state — a silent success here would mean a rebuild later failing
          # on a cached file that was never written.
          out=$(run '/usr/libexec/apex-pkg install /nonexistent/apex-ci.rpm 2>&1; echo "rc=$?"')
          grep -q 'no such file: /nonexistent/apex-ci.rpm' <<<"$out" \
            || fail "apex-pkg does not refuse a missing .rpm path by name (got: $out)"
          grep -q 'rc=1' <<<"$out" \
            || fail "apex-pkg exits 0 on a missing .rpm path (got: $out)"
          # A reverse-DNS id ending in .rpm is a FILE, not a Flatpak. Getting this
          # order wrong sends a file the user pointed at to Flathub.
          run '/usr/libexec/apex-pkg install org.foo.Bar.rpm 2>&1 | grep -q "no such file"' \
            || fail "apex-pkg routes org.foo.Bar.rpm to Flatpak instead of treating it as a file"
          run 'test ! -e /var/lib/apex/pkg/requested' \
            || fail "a refused install wrote to the requested list"
          # The dependency resolution for a local file is the one thing that is
          # neither rpm nor a shell builtin; losing it would break only that path.
          run 'dnf5 repoquery --installed --whatprovides bash --qf "%{name}\n" | grep -q bash' \
            || fail "dnf5 repoquery --installed --whatprovides is unavailable — local .rpm dependency resolution would fail"

          # Greeter wallpaper: the helper, its sudoers rule, and both ends of the
          # wiring. This is the fix for "the lock screen keeps the default
          # wallpaper", and every part of it is silently skippable at runtime,
          # so it is asserted at build time instead.
          run 'test -x /usr/libexec/apex-greet-wallpaper' \
            || fail "greeter wallpaper helper missing"
          run 'test -f /etc/sudoers.d/030-apex-greet-wallpaper' \
            || fail "greeter wallpaper sudoers rule missing"
          run 'visudo -cf /etc/sudoers.d/030-apex-greet-wallpaper >/dev/null' \
            || fail "greeter wallpaper sudoers rule does not parse — sudo would refuse it at runtime"
          run 'grep -q "apex-greet/wallpapers" /usr/share/apex-greet/GreetContext.qml' \
            || fail "greeter no longer reads the published wallpaper"
          run '! grep -q "file:///usr/share/backgrounds/apex/default.jpg" /usr/share/apex-greet/GreetSurface.qml' \
            || fail "GreetSurface has gone back to the hardcoded default wallpaper"
          run 'grep -q apex-greet-wallpaper /usr/share/apex-shell/src/services/WallpaperService.qml' \
            || fail "vendored apex-shell does not publish the wallpaper on change"
          run 'grep -q apex-greet-wallpaper /usr/libexec/apex-shell-autostart' \
            || fail "session launcher does not publish the wallpaper on login"

          # Secure Boot, re-asserted on the tier that inherits it. The core job
          # is gated, so a push touching only files/** rebuilds this image FROM
          # THE LAST PUBLISHED CORE — if that core were unsigned, an unsigned
          # base would ship and core's assertion would never have run.
          if [ -n "${{ secrets.APEX_SB_KEY_B64 }}" ]; then
            state=$(run 'cat /usr/share/apex-os/secureboot/kernel-signed 2>/dev/null || echo missing')
            [ "$state" = signed ] \
              || fail "base is stamped '$state' — the core it was built from is not signed. Re-run with force_core=true."
          fi

          echo "base image verified"

      # ── Push once, then tag in-registry ──────────────────────────────────
      # Two problems this solves, both measured on run 30775672845.
      #
      # 1. Every image was uploaded TWICE. `podman push :x-<sha>` followed by
      #    `podman push :x` re-sent the whole thing: 166 blobs, then 166 more,
      #    with ZERO reported as already present. ~7 minutes per image thrown
      #    away. So the friendly tag is now made with an in-registry copy, which
      #    finds every blob already there and writes only a manifest.
      # 2. Pushes fail transiently. Run 30771778274 lost a green 50-minute
      #    gaming-nvidia build to `502 Bad Gateway` eight minutes into the
      #    upload, with nothing retrying.
      - name: Push helper
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          cat > /tmp/push-retry.sh <<'SH'
          #!/usr/bin/env bash
          # push-and-tag <repo> <sha-tag> <friendly-tag> <digestfile>
          set -uo pipefail
          repo="$1"; sha_tag="$2"; friendly="$3"; digestfile="$4"
          for attempt in 1 2 3; do
            sudo podman push --compression-format zstd:chunked \
              "$repo:$sha_tag" --digestfile="$digestfile" && break
            echo "::warning::push of $repo:$sha_tag failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && { echo "::error::push failed after 3 attempts"; exit 1; }
            sleep $(( attempt * 30 ))
          done
          digest="$(cat "$digestfile")"
          # skopeo, not `podman push` again: same repository, so every blob is
          # already present and this is a manifest write. `podman push` does not
          # take that shortcut — it re-uploads.
          #
          # --creds explicitly, and REGISTRY_AUTH_FILE pointed somewhere we own:
          # `sudo podman login` leaves a root-owned auth.json in this user's
          # runtime dir, and skopeo reads it before honouring anything else.
          export REGISTRY_AUTH_FILE="${RUNNER_TEMP}/skopeo-auth.json"
          [ -f "$REGISTRY_AUTH_FILE" ] || echo '{}' > "$REGISTRY_AUTH_FILE"
          for attempt in 1 2 3; do
            skopeo copy --retry-times 3 \
              --src-creds "$GHCR_USER:$GHCR_TOKEN" \
              --dest-creds "$GHCR_USER:$GHCR_TOKEN" \
              "docker://$repo@$digest" "docker://$repo:$friendly" && exit 0
            echo "::warning::tagging $repo:$friendly failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && break
            sleep $(( attempt * 15 ))
          done
          echo "::error::could not tag $repo:$friendly"
          exit 1
          SH
          chmod +x /tmp/push-retry.sh

      - name: Push base + capture digest
        id: push
        run: |
          /tmp/push-retry.sh "$IMAGE" "$TAG_BASE-${{ github.sha }}" "$TAG_BASE" /tmp/base.digest
          DIGEST="$(cat /tmp/base.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Base digest: $DIGEST"

      - name: Sign base (cosign keyless)
        run: |
          cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

  # ── Job 4: flavors ────────────────────────────────────────────────────────
  # ── Job 4: THE image ──────────────────────────────────────────────────────
  # Was a three-leg matrix (daily / gaming-mesa / gaming-nvidia). There is one
  # image now, so there is one job, and the three old names are applied to its
  # digest as tags in the promotion step below.
  image:
    needs: [base]
    if: >-
      ${{
        always() && !cancelled()
        && needs.base.result == 'success'
        && !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2)
      }}
    runs-on: ubuntu-24.04
    # The `secrets` context is NOT available in a step-level `if:` — only in
    # job-level env — so surface "is signing configured?" as a plain boolean
    # here and let the verify step below branch on it. Without this the step
    # would silently evaluate to false and never run, which is precisely the
    # class of quietly-skipped check it exists to prevent.
    env:
      APEX_SB_CONFIGURED: ${{ secrets.APEX_SB_KEY_B64 != '' }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # FROM the base pinned by digest — the exact base job 3 pushed and signed.
      - name: Build the image
        run: |
          sudo podman build --isolation=chroot --layers=true \
            --build-arg BASE="$IMAGE@${{ needs.base.outputs.digest }}" \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            -f Containerfile.apex \
            -t "$IMAGE:apex" \
            -t "$IMAGE:apex-${{ github.sha }}" \
            .

      # Gate the PUSH on the image actually carrying a signed kernel AND signed
      # out-of-tree modules.
      #
      # The module half is new, and it closes a real hole: the NVIDIA akmod used
      # to be built in Containerfile.gaming, i.e. in the FLAVOR job — which is
      # never passed `--secret id=apex_sb_key`, so nothing could have signed it
      # there and nothing did. This check ran `sbverify` against vmlinuz only, so
      # nothing caught it either. Both halves are now measured against the built
      # artifact: the marker file is read, and then ignored in favour of the
      # signature actually present in the kernel image and in every module.
      - name: Verify the Secure Boot chain (kernel AND modules)
        if: ${{ env.APEX_SB_CONFIGURED == 'true' }}
        run: |
          set -euo pipefail
          state=$(sudo podman run --rm --entrypoint /bin/sh "$IMAGE:apex" \
                    -c 'cat /usr/share/apex-os/secureboot/kernel-signed 2>/dev/null || echo missing')
          if [ "$state" != signed ]; then
            echo "::error::the image is stamped '$state' — refusing to publish an unsigned kernel."
            echo "::error::The core it was built from is not signed. Re-run with force_core=true."
            exit 1
          fi
          sudo podman run --rm --entrypoint /bin/sh "$IMAGE:apex" -c \
            'dnf5 -y install -q sbsigntools >/dev/null 2>&1; sbverify --list /usr/lib/modules/$(cat /usr/lib/apex-kver)/vmlinuz' \
            | grep -qi 'signature certificates\|image signature issuers\|APEX' \
            || { echo "::error::sbverify found no signature on the shipped vmlinuz"; exit 1; }
          sudo podman run --rm --entrypoint /bin/sh "$IMAGE:apex" \
            -c 'test -s /usr/share/apex-os/secureboot/apex-mok.der' \
            || { echo "::error::no apex-mok.der — users would have nothing to enrol"; exit 1; }

          # Out-of-tree modules. Written so it CANNOT pass on an empty set: a
          # loop over zero modules succeeds, and "there were no modules" is the
          # exact failure this exists to catch.
          sudo podman run --rm --entrypoint /bin/sh "$IMAGE:apex" -c '
            set -eu
            KVER=$(cat /usr/lib/apex-kver)
            MODDIR=/usr/lib/modules/$KVER
            [ "$(cat /usr/share/apex-os/secureboot/modules-signed 2>/dev/null || echo missing)" = signed ] \
              || { echo "modules-signed marker is not \"signed\""; exit 1; }
            SIGNER=$(cat /usr/share/apex-os/secureboot/module-signer)
            OOT=""
            for d in extra updates; do [ -d "$MODDIR/$d" ] && OOT="$OOT $MODDIR/$d"; done
            [ -n "$OOT" ] || { echo "no out-of-tree module directory"; exit 1; }
            n=0
            for m in $(find $OOT -type f -name "*.ko*"); do
              got=$(modinfo -F signer "$m" 2>/dev/null || true)
              [ "$got" = "$SIGNER" ] || { echo "$m signer=\"$got\" expected=\"$SIGNER\""; exit 1; }
              n=$((n + 1))
            done
            [ "$n" -gt 0 ] || { echo "zero out-of-tree modules found — vacuous pass"; exit 1; }
            for pat in nvidia xone xpadneo; do
              [ "$(find $OOT -type f -name "*$pat*.ko*" | wc -l)" -gt 0 ] \
                || { echo "no $pat module in the image"; exit 1; }
            done
            echo "modules: $n out-of-tree, all signed by \"$SIGNER\""
          ' || { echo "::error::out-of-tree kernel modules are unsigned, missing, or signed by the wrong key"; exit 1; }
          echo "kernel and modules signed; apex-mok.der present"

      # The payload split is a product promise, so it is checked rather than
      # assumed: the drivers a user cannot install themselves must be present,
      # and the userspace they can install must NOT be baked in (baking it would
      # quietly undo the whole point of collapsing the editions).
      - name: Verify the payload split
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint /bin/sh "$IMAGE:apex" -c '
            set -eu
            for b in gamescope steam mangohud sunshine obs; do
              ! command -v "$b" >/dev/null 2>&1 || { echo "$b is baked in; it must be on-demand"; exit 1; }
            done
            test -e /usr/lib64/libGLX_nvidia.so.0 || { echo "nvidia userspace missing"; exit 1; }
            test -e /usr/lib64/libGLX_mesa.so.0   || { echo "mesa GLX missing"; exit 1; }
            test -e /usr/lib64/libEGL_mesa.so.0   || { echo "mesa EGL missing"; exit 1; }
            owner=$(rpm -qf --qf "%{NAME}" /usr/lib64/libGL.so.1)
            case "$owner" in libglvnd*) ;; *) echo "libGL.so.1 owned by $owner, not libglvnd"; exit 1 ;; esac
            grep -q "^VARIANT_ID=apex$" /usr/lib/os-release || { echo "VARIANT_ID is not apex"; exit 1; }
            echo "payload split OK: drivers in, gaming userspace out, glvnd intact"
          '

      # ── Push once, then tag in-registry ──────────────────────────────────
      # Two problems this solves, both measured on run 30775672845.
      #
      # 1. Every image was uploaded TWICE. `podman push :x-<sha>` followed by
      #    `podman push :x` re-sent the whole thing: 166 blobs, then 166 more,
      #    with ZERO reported as already present. ~7 minutes per image thrown
      #    away. So the friendly tag is now made with an in-registry copy, which
      #    finds every blob already there and writes only a manifest.
      # 2. Pushes fail transiently. Run 30771778274 lost a green 50-minute
      #    gaming-nvidia build to `502 Bad Gateway` eight minutes into the
      #    upload, with nothing retrying.
      - name: Push helper
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          cat > /tmp/push-retry.sh <<'SH'
          #!/usr/bin/env bash
          # push-image <repo> <sha-tag> <digestfile>
          set -euo pipefail
          repo="$1"; sha_tag="$2"; digestfile="$3"
          rm -f "$digestfile"
          for attempt in 1 2 3; do
            sudo podman push --compression-format zstd:chunked \
              "$repo:$sha_tag" --digestfile="$digestfile" && break
            echo "::warning::push of $repo:$sha_tag failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && { echo "::error::push failed after 3 attempts"; exit 1; }
            sleep $(( attempt * 30 ))
          done
          test -s "$digestfile"
          SH
          chmod +x /tmp/push-retry.sh

      - name: Push the image + capture digest
        id: push
        run: |
          # zstd:chunked — see the note on the core push. This is the one users
          # actually pull, so it is where the download saving lands.
          /tmp/push-retry.sh "$IMAGE" "apex-${{ github.sha }}" /tmp/image.digest
          DIGEST="$(cat /tmp/image.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image digest: $DIGEST"

      - name: Sign the image (cosign keyless)
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

      # EVERY published name, all pointing at the one digest.
      #
      #   apex / apex-<sha>              the canonical name going forward
      #   daily / gaming-mesa / gaming-nvidia   MIGRATION. Machines in the field
      #       have bootc pointed at these. If one stops moving, `bootc upgrade`
      #       reports "no update" forever and that machine silently stops getting
      #       security updates. They are not deprecated aliases, they are live
      #       references owned by other people's laptops.
      #   platform-*                     stable inputs for shell-only releases
      #       (release-shell.yml builds Containerfile.release FROM a platform tag,
      #       and its own dispatch still offers the three flavor names).
      #   daily-<sha>                    consumed by the qcow2 job.
      - name: Promote to every published tag
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          echo '{}' > "$REGISTRY_AUTH_FILE"
          creds="$GHCR_USER:$GHCR_TOKEN"
          digest="${{ steps.push.outputs.digest }}"
          promote() {
            skopeo copy --retry-times 3 --src-creds "$creds" --dest-creds "$creds" \
              "docker://$IMAGE@$digest" "docker://$IMAGE:$1"
          }
          # Platform + per-SHA tags first; the names installed machines actually
          # track are moved LAST, so any earlier registry failure leaves the
          # fleet on the previous signed release rather than half-migrated.
          for f in apex daily gaming-mesa gaming-nvidia; do
            promote "platform-$f-${{ github.sha }}"
            promote "platform-$f"
            promote "$f-${{ github.sha }}"
          done
          for f in apex daily gaming-mesa gaming-nvidia; do
            promote "$f"
          done

      # The migration promise, measured. Reading the digest back out of the
      # registry is the only thing that proves a machine tracking `:gaming-mesa`
      # will actually receive this build; the promotion step succeeding only
      # proves skopeo exited zero.
      - name: Assert every published tag resolves to this digest
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          echo '{}' > "$REGISTRY_AUTH_FILE"
          creds="$GHCR_USER:$GHCR_TOKEN"
          want="${{ steps.push.outputs.digest }}"
          fail=0
          for t in apex daily gaming-mesa gaming-nvidia \
                   platform-apex platform-daily platform-gaming-mesa platform-gaming-nvidia \
                   "daily-${{ github.sha }}"; do
            got="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://$IMAGE:$t" 2>/dev/null || echo MISSING)"
            if [ "$got" = "$want" ]; then
              echo "  ok   :$t -> $got"
            else
              echo "::error::tag :$t resolves to '$got', expected '$want' — machines tracking it would stop updating"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # How much this push actually costs the fleet. The point of the core tier
      # is that this number is small; printing it into the run summary is what
      # turns "it should be small" into something anyone can check at a glance,
      # and what will make a regression obvious the week it happens.
      - name: Report update cost
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          # Same trap as the core job: `sudo podman login` above left a
          # root-owned auth.json in this user's runtime dir, and skopeo reads it
          # before honouring --creds. Point it at one we own.
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          echo '{}' > "$REGISTRY_AUTH_FILE"
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          new=$(skopeo inspect --raw --creds "$creds" \
                  "docker://$IMAGE@${{ steps.push.outputs.digest }}")
          # Layers shared with the parent core are the ones bootc will NOT
          # download; anything else is new bytes on every machine.
          core=$(skopeo inspect --raw --creds "$creds" \
                  "docker://$IMAGE:$TAG_CORE" 2>/dev/null || echo '{}')
          python3 - "$new" "$core" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          new, core = json.loads(sys.argv[1]), json.loads(sys.argv[2] or '{}')
          nl = new.get('layers', [])
          shared = {l['digest'] for l in core.get('layers', [])}
          fresh = [l for l in nl if l['digest'] not in shared]
          mib = lambda b: b / 2**20
          print("### `apex` update cost")
          print()
          print(f"- total image: **{len(nl)} layers, {mib(sum(l['size'] for l in nl)):.0f} MiB**")
          print(f"- inherited from core (not re-downloaded): "
                f"**{len(nl) - len(fresh)} layers, {mib(sum(l['size'] for l in nl) - sum(l['size'] for l in fresh)):.0f} MiB**")
          print(f"- NOT inherited from core: "
                f"**{len(fresh)} layers, {mib(sum(l['size'] for l in fresh)):.0f} MiB**")
          print()
          print("The last figure is an UPPER BOUND on what `apex update` downloads: "
                "base/image layers that happen to be unchanged since the previous "
                "push are also reused, but are counted as new here. Before the "
                "core/base split this number was the whole image (153 layers, 5.3 GB). "
                "The NVIDIA driver and the controller modules are in `core`, so they "
                "are inside the inherited figure and are downloaded once, ever.")
          PY

  # ── Job 5: qcow2 (stretch, dispatch-gated, non-blocking) ─────────────────
  # Proves bootc-image-builder produces a bootable disk from the published image.
  # GitHub runners have NO /dev/kvm, so the disk is NOT booted here — producing
  # the qcow2 is the check. Gated on manual dispatch (build_qcow2=true) and
  # continue-on-error so bib flakiness never fails the image pipeline.
  qcow2:
    needs: image
    runs-on: ubuntu-24.04
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.build_qcow2 }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build the qcow2 via bootc-image-builder
        run: |
          mkdir -p output
          sudo podman pull "$IMAGE:apex-${{ github.sha }}"
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs xfs --local \
            "$IMAGE:apex-${{ github.sha }}"
          ls -lh output/qcow2 || ls -lhR output

      - name: Upload qcow2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-os-qcow2
          path: output/qcow2/*.qcow2
          if-no-files-found: warn
          retention-days: 7

  # ── Job 6: installer ISO (dispatch-gated) ─────────────────────────────────
  # Builds the APEX-OS installer as an Anaconda ISO (bootc-image-builder --type
  # anaconda-iso) — a bootable USB that installs the signed image to a target
  # disk. The image is pulled into local storage first (each job is a fresh
  # runner; --local needs it present). Uploaded as an artifact for the maintainer
  # to write to a USB stick. Independent of core/base/image: it pulls the
  # already-published tag, so it runs on an ISO-only dispatch. There is one ISO
  # now, because there is one image.
  installer-iso:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso
    steps:
      # Needed for installer/bib-config.toml (the interactive kickstart).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Pull the latest green image into local storage
        run: sudo podman pull "$IMAGE:apex"

      # The installer config (installer/bib-config.toml) is mounted at
      # /config.toml so bootc-image-builder applies our INTERACTIVE kickstart
      # instead of its destructive default (clearpart --all + locked root). See
      # that file's header and docs. Without it the ISO wipes the target disk
      # unattended and locks the user out — the two bugs this fixes.
      - name: Build the installer ISO via bootc-image-builder
        run: |
          mkdir -p output
          test -f installer/bib-config.toml  # fail loudly if the config is missing
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output":/output \
            -v "$(pwd)/installer/bib-config.toml":/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs --local \
            "$IMAGE:apex"
          ls -lhR output/bootiso || ls -lhR output

      # Guard: extract the embedded kickstart from the built ISO and FAIL the
      # build if the destructive defaults ever reappear (clearpart/autopart) or
      # a root password / user got baked in. Cheap insurance against a future
      # bib change silently restoring the unattended wipe. Uses the runner's own
      # xorriso (no mount) to pull the kickstart files from the ISO root.
      - name: Verify embedded kickstart is non-destructive
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xorriso
          iso=$(ls output/bootiso/*.iso | head -1)
          echo "Inspecting $iso"
          rm -rf ksdump && mkdir ksdump
          # Extract EVERY kickstart on the ISO (not just the two known names) so a
          # renamed/extra ks carrying a destructive directive can't slip past. List
          # the ISO tree, pull each *.ks. (apex-logs 36 — hardened after Fable review.)
          xorriso -osirrox on -indev "$iso" -find / -name '*.ks' 2>/dev/null \
            | sed -n "s/^'\(.*\)'.*/\1/p" > ks.list || true
          # Fallback to the known names if -find gave nothing.
          if [ ! -s ks.list ]; then printf '/osbuild.ks\n/osbuild-base.ks\n' > ks.list; fi
          while read -r k; do
            [ -n "$k" ] || continue
            out="ksdump/$(echo "$k" | tr '/' '_')"
            xorriso -osirrox on -indev "$iso" -extract "$k" "$out" 2>/dev/null || true
          done < ks.list
          cat ksdump/* > extracted.ks 2>/dev/null || true
          echo "----- kickstart files on ISO -----"; cat ks.list
          echo "----- embedded kickstart -----"; cat extracted.ks; echo "------------------------------"
          if [ ! -s extracted.ks ]; then
            echo "::error::Could not extract any kickstart from the ISO — cannot verify"; exit 1
          fi
          # Storage: nothing that can partition/format/mount without the operator.
          if grep -Eiq '^[[:space:]]*(clearpart|autopart|part|reqpart|ignoredisk|zerombr|raid|volgroup|logvol|btrfs)([[:space:]]|$)' extracted.ks; then
            echo "::error::A storage directive was found in the kickstart (must be interactive)"; exit 1
          fi
          # Accounts: no baked user/root credential.
          if grep -Eiq '^[[:space:]]*(rootpw|user[[:space:]]+--|sshkey)([[:space:]]|$)' extracted.ks; then
            echo "::error::A baked user/rootpw/sshkey was found (must be interactive)"; exit 1
          fi
          # No unattended-completion or auto-reboot, and no %pre that could wipe.
          if grep -Eiq '^[[:space:]]*(autostep|reboot|poweroff|halt|shutdown)([[:space:]]|$)|^%pre\b' extracted.ks; then
            echo "::error::An unattended/%pre directive was found in the kickstart"; exit 1
          fi
          # Bootloader cmdline must not force a non-interactive install.
          rm -rf grubdump && mkdir grubdump
          for g in /EFI/BOOT/grub.cfg /boot/grub2/grub.cfg /isolinux/isolinux.cfg /EFI/fedora/grub.cfg; do
            xorriso -osirrox on -indev "$iso" -extract "$g" "grubdump/$(echo "$g" | tr '/' '_')" 2>/dev/null || true
          done
          if grep -Eiq 'inst\.(text|cmdline|noninteractive|ks\.all)' grubdump/* 2>/dev/null; then
            echo "::error::Boot cmdline forces a non-interactive/auto install"; exit 1
          fi
          echo "OK: kickstart has no storage/account/unattended directives; install is interactive."

      - name: Upload installer ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-os-installer-iso
          path: output/bootiso/*.iso
          if-no-files-found: warn
          retention-days: 7
