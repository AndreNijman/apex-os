name: sbom-probe

# TEMPORARY — a measurement, not a product. Delete this file once the SBOM step
# in build-image.yml is green.
#
# Run 35433705393 lost `image` at *Generate and attest the SBOM*: syft 1.52.0
# was SIGKILLed (137) 209 s into cataloguing ghcr.io/andrenijman/apex-os, with
# 86 GB of disk and 14.9 GB of memory free at the prune immediately before. The
# OOM killer is the obvious reading of a SIGKILL under those conditions, and
# every record of it so far is INFERRED FROM THE SHAPE — nobody has read a
# kernel message. This workflow reads one.
#
# It costs ~10 minutes instead of the ~1 hour a build-image run costs, because
# the image it catalogues already exists in GHCR: the failing run pushed and
# signed it before the SBOM step ran. Same runner class (ubuntu-24.04, 4 cores,
# 16 GB), same pinned syft, same command.
#
# ═══ ROUND 1 (run 35437908023) ANSWERED THE QUESTION THIS FILE WAS FOR ═══
#
# Seven arms, one variable. Every arm WITHOUT GOMEMLIMIT drove the runner to
# ~15.9 GB used with all 3 GB of swap consumed and lost the VM; both arms WITH
# GOMEMLIMIT=10GiB produced an identical 9830-package SBOM with both Electron
# trees in it. `registry:` and `oci-dir:` died alike, so the source is not the
# cause; parallelism 1 died like parallelism 4, so the "it ran the full fifteen
# minutes" history in build-image.yml was a memory death too. `oom_kill` was 0
# throughout and dmesg was clean: these VMs swap-thrashed until the host
# cancelled them rather than being OOM-killed.
#
# ═══ ROUND 2 IS ABOUT THE MARGIN, NOT THE CAUSE ═══
#
# Both survivors peaked at 14.65-14.72 GiB RSS on a 16 GB box, with 188 MB and
# 125 MB left. GOMEMLIMIT is soft and syft overshot it by ~4.7 GiB. Round 1's
# hedge never ran: `swap32` called fallocate on the runner's active /swapfile
# and got `Text file busy` in 0 s.
#
#   gml10-swap32  the candidate — the measured-working limit plus 32 GB of real
#                 swap on the 86 GB of free disk.
#   swap32-only   the control — is the limit needed once swap exists?
#   gml6, gml4    does a lower limit move peak RSS, or is the overshoot
#                 non-heap and immovable?
#
# Triggered by pushing THIS FILE to task/sbom-oom. `paths` keeps later commits
# to build-image.yml from re-running it.
on:
  push:
    branches: [task/sbom-oom]
    paths: [".github/workflows/sbom-probe.yml"]

permissions:
  contents: read
  packages: read

env:
  # The digest run 35433705393 pushed, signed, and then failed to catalogue.
  REF: ghcr.io/andrenijman/apex-os@sha256:be3bdd0c63848811fbbd3a76f17a50f40e90b1eeb8614b93993ec69419f3aafb

jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode:
          - gml10-swap32
          - swap32-only
          - gml6
          - gml4
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install syft (pinned to the version that died)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.52.0
          syft --version

      - name: Ensure GNU time (peak RSS is the measurement)
        run: |
          set -euo pipefail
          if ! [ -x /usr/bin/time ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq time
          fi
          /usr/bin/time --version 2>&1 | head -1

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Catalogue, and measure what runs out
        run: |
          # NOT set -e: syft dying is the measurement, not the end of the step.
          set -uo pipefail
          MODE='${{ matrix.mode }}'

          echo "── runner ──"
          nproc; free -m; df -h /; swapon --show || true
          echo "systemd-oomd: $(systemctl is-active systemd-oomd 2>&1) / $(systemctl is-enabled systemd-oomd 2>&1)"
          OOM0="$(awk '/oom_kill/{print $2}' /proc/vmstat)"; OOM0="${OOM0:-0}"
          echo "vmstat oom_kill before: $OOM0"

          # A sample every 5 s. A step that dies saying which resource ran out is
          # worth more than one that is merely fixed.
          (
            while true; do
              echo "[sample $(date +%T)] $(free -m | awk '/^Mem:/{printf "mem_used=%sM mem_avail=%sM", $3, $7} /^Swap:/{printf " swap_used=%sM", $3}') root_avail=$(df -BM --output=avail / | tail -1 | tr -d ' ') tmp=$(du -sm /tmp 2>/dev/null | cut -f1)M"
              sleep 5
            done
          ) & SPID=$!
          trap 'kill $SPID 2>/dev/null || true' EXIT

          PAR=4
          GML=""
          SRC="registry:$REF"
          # ROUND 2. Round 1 settled the cause: every arm without GOMEMLIMIT
          # died, both arms with it produced the same 9830-package SBOM, and
          # neither the source (registry: vs oci-dir:) nor the parallelism
          # (4 vs 1) changed that. Those arms are gone; they have their answer.
          #
          # What round 1 did NOT settle is the MARGIN. Both survivors peaked at
          # 14.65-14.72 GiB RSS on a 16 GB box and bottomed out at 188 MB and
          # 125 MB available. GOMEMLIMIT is a SOFT limit — syft went through the
          # 10 GiB setting by ~4.7 GiB — so "it passed twice at 1% headroom" is
          # a fix for today's image, not for the next package added to it.
          #
          # Round 1's hedge for exactly this never ran: the `swap32` arm called
          # `fallocate -l 32G /swapfile` on the runner's ALREADY-ACTIVE swapfile
          # and got `Text file busy` in 0 s. A new file at a new path fixes it.
          #
          #   gml10-swap32  the candidate: the measured-working limit plus real
          #                 swap on the 86 GB of free disk, so the transient
          #                 spike at the filetree squash has somewhere to go.
          #   swap32-only   the control. If this passes, the limit is belt over
          #                 braces and swap alone is the simpler fix. If it
          #                 dies, GOMEMLIMIT is load-bearing and swap is only
          #                 the margin.
          #   gml6 / gml4   does a LOWER limit actually lower peak RSS, or is
          #                 the ~4.7 GiB of overshoot non-heap and immovable?
          #                 If gml4 peaks at 14.7 GiB too, tightening the number
          #                 is not a lever and nobody should try it again.
          add_swap() {
            # NOT /swapfile — that one is mounted. A second swap file, on root,
            # where round 1 measured 86 GB free.
            sudo fallocate -l 32G /swapfile.probe
            sudo chmod 600 /swapfile.probe
            sudo mkswap /swapfile.probe >/dev/null
            sudo swapon /swapfile.probe
            echo "── swap after add ──"; swapon --show; free -m; df -h /
          }
          case "$MODE" in
            gml10-swap32)  GML=10GiB; add_swap ;;
            swap32-only)   add_swap ;;
            gml6)          GML=6GiB ;;
            gml4)          GML=4GiB ;;
          esac

          ENVS=(SYFT_PARALLELISM="$PAR")
          if [ -n "$GML" ]; then ENVS+=(GOMEMLIMIT="$GML"); fi
          echo "── syft: mode=$MODE parallelism=$PAR gomemlimit=${GML:-unset} source=$SRC ──"
          _t0=$(date +%s)
          timeout 2700 /usr/bin/time -v -o /tmp/time.txt \
            env "${ENVS[@]}" syft "$SRC" -o spdx-json \
            > /tmp/sbom.spdx.json
          rc=$?
          _el=$(( $(date +%s) - _t0 ))
          kill $SPID 2>/dev/null || true

          echo "════ mode=$MODE rc=$rc elapsed=${_el}s ════"
          grep -E 'Maximum resident|Command terminated|Elapsed \(wall|Major|Swaps' /tmp/time.txt || cat /tmp/time.txt || true

          OOM1="$(awk '/oom_kill/{print $2}' /proc/vmstat)"; OOM1="${OOM1:-0}"
          echo "vmstat oom_kill after: $OOM1  (delta $(( OOM1 - OOM0 )))"

          # Unconditional, on success too: if this arm passes but something ELSE
          # on the runner was OOM-killed, that is worth seeing.
          echo "── dmesg ──"
          sudo dmesg -T | grep -iE 'out of memory|killed process|oom-kill|oom_reaper' | tail -20 \
            || echo "NO OOM LINES IN DMESG"
          echo "── journal (systemd-oomd kills leave nothing in dmesg) ──"
          sudo journalctl --since '-30 min' --no-pager 2>/dev/null \
            | grep -iE 'oomd|out of memory|killed process|memory pressure' | tail -20 \
            || echo "NO OOM LINES IN JOURNAL"

          echo "── result ──"
          ls -l /tmp/sbom.spdx.json || true
          if [ "$rc" = 0 ]; then
            echo "SBOM packages: $(jq '.packages | length' /tmp/sbom.spdx.json)"
            jq -r '[.packages[].name] | length as $n | "distinct names: \($n)"' /tmp/sbom.spdx.json
            # Did the Electron trees survive? They are the whole reason the
            # cataloguers are not restricted.
            jq -r '[.packages[] | select(.name|test("electron|chatgpt|claude";"i")) | .name] | unique | join(", ")' \
              /tmp/sbom.spdx.json
          fi
          free -m; df -h /
          exit 0
