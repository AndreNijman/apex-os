name: sbom-probe

# TEMPORARY — a measurement, not a product. Delete this file once the SBOM step
# in build-image.yml is green.
#
# ═══ WHAT IS ALREADY SETTLED — DO NOT RE-MEASURE ANY OF IT ═══
#
# Rounds 1-2 (runs 35437908023, 35447488777): GOMEMLIMIT=10GiB is the fix for
# syft's memory death; the source, the parallelism and a swapfile are all
# irrelevant. Verified in build 35450175806: 742 s, peak RSS 15,303,652 KB,
# 9830 packages.
#
# Round 3 (run 35455459788) established two more things and then threw the rest
# away on a bug in its own harness:
#
#  - THE REKOR CEILING HOLDS FROM A GITHUB RUNNER, not just from one home
#    connection: body 25,000,000 B -> HTTP 400, fully uploaded and processed;
#    body 25,166,008 B -> HTTP 502, size_upload=0, 0.26 s. The boundary is
#    25,165,824 B, exactly 24 MiB, and the refusal is at header time.
#  - The `full` arm ran clean: rc=0, 915 s, peak RSS 15,449,996 KB.
#  - Then: `line 39: name: unbound variable`. `local name="$1" f="…${name}…"`
#    expands ALL its words before it assigns ANY of them, so under `set -u` the
#    second initialiser reads `name` while it is still unbound. 915 s of syft
#    measurement, lost to a one-line bash rule. Every `local` below assigns on
#    its own line.
#
# ═══ ROUND 4: ONE ARM, THE ONE THE BUILD ACTUALLY USES ═══
#
# Round 3's arms were designed before the knobs were understood, and three of
# the four are now known to be the wrong thing to run. Measured locally against
# alpine:3.20 with this same pinned syft 1.52.0:
#
#   default                            packages=15 files=77 rels=125  87,692 B
#   FILE_METADATA_SELECTION=none       packages=15 files=77 rels=125  76,227 B
#   RELATIONSHIPS_..._OWNERSHIP=false  packages=15 files=2  rels=48   31,767 B
#   both                               packages=15 files=1  rels=48   31,130 B
#
# So FILE_METADATA_SELECTION=none is NOT the lever — it drops each file's
# DIGESTS, not the file rows, and saves 13%. The rows go with
# RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP=false, at 64%. And the third switch,
# ..._OWNERSHIP_OVERLAP=false, makes syft exit 1 outright:
#
#   invalid application config: cannot enable exclude-binary-overlap-by-ownership
#   without enabling package-file-ownership-overlap
#
# — and the knob it demands in exchange changes the PACKAGE set, which is the
# one thing this step must never do quietly. It stays on.
#
# This round therefore runs exactly ONE arm: the two switches build-image.yml
# now sets, against the digest a failing build already pushed. It answers the
# only open question — does the real document fit under 24 MiB once cosign has
# wrapped it, and does Rekor accept it — in about fifteen minutes and one
# runner, independently of the verification build (35456273175) running the
# same configuration end to end.
#
# The upload is proved with `cosign attest-blob`, NOT `cosign attest` against
# the image digest: the latter would write a real `.att` signed by THIS
# workflow's identity onto a real digest, which `apex trust` reads as a
# provenance check that FAILED — and a failed provenance check is refused even
# at `provenance=warn`. attest-blob walks the identical DSSE/Rekor path with the
# identical body size and touches no image.
on:
  push:
    branches: [task/sbom-attest]
    paths: [".github/workflows/sbom-probe.yml"]

permissions:
  contents: read
  packages: read
  # cosign keyless: attest-blob mints a Fulcio certificate exactly as the real
  # step does, so the upload path under test is the real one.
  id-token: write

env:
  # The digest build 35450175806 pushed, signed, and then failed to attest.
  # A per-SHA tag from a task branch: nothing tracks it.
  REF: ghcr.io/andrenijman/apex-os@sha256:86225e1bc87a912624252fe4f81e33f1ac50646effdb0562dbb78a27ef9454c4
  REKOR_CEILING: 25165824

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install syft (pinned to the version the build uses)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.52.0
          syft --version

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Ensure GNU time
        run: |
          set -euo pipefail
          if ! [ -x /usr/bin/time ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq time
          fi
          /usr/bin/time --version 2>&1 | head -1

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Catalogue with the configuration build-image.yml uses
        run: |
          # -e is ON by default (`bash -e {0}`) and saying "NOT set -e" in a
          # comment does not clear it. syft dying is the measurement.
          set +e
          set -uo pipefail
          mkdir -p /tmp/sbom
          echo "── runner ──"; nproc; free -m; df -h /

          ( while true; do
              echo "[sample $(date +%T)] $(free -m | awk '/^Mem:/{printf "mem_used=%sM mem_avail=%sM", $3, $7}') root_avail=$(df -BM --output=avail / | tail -1 | tr -d ' ')"
              sleep 30
            done ) & SPID=$!

          t0=$(date +%s)
          timeout 2700 /usr/bin/time -v -o /tmp/time.txt \
            env SYFT_PARALLELISM=4 GOMEMLIMIT=10GiB \
                SYFT_FILE_METADATA_SELECTION=none \
                SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP=false \
            syft "registry:$REF" -o spdx-json > /tmp/sbom/ownership.json
          rc=$?
          kill $SPID 2>/dev/null

          echo "──── ownership: rc=${rc} elapsed=$(( $(date +%s) - t0 ))s"
          grep -E 'Maximum resident|Command terminated|Elapsed \(wall' /tmp/time.txt
          if [ "$rc" != 0 ]; then
            echo "::error::syft failed (rc=$rc); nothing to measure"
            exit 1
          fi

          jq -c . /tmp/sbom/ownership.json > /tmp/sbom/ownership.min.json
          # Each `local`-free, each on its own line: see the header.
          PRETTY=$(stat -c%s /tmp/sbom/ownership.json)
          COMPACT=$(stat -c%s /tmp/sbom/ownership.min.json)
          PKGS=$(jq '.packages | length' /tmp/sbom/ownership.json)
          FILES=$(jq '(.files // []) | length' /tmp/sbom/ownership.json)
          RELS=$(jq '(.relationships // []) | length' /tmp/sbom/ownership.json)
          DSSE=$(( (COMPACT + 2) / 3 * 4 ))

          echo "RESULT packages=${PKGS} files=${FILES} relationships=${RELS}"
          echo "RESULT pretty=${PRETTY}B compact=${COMPACT}B dsse=${DSSE}B ceiling=${REKOR_CEILING}B"
          if [ "$DSSE" -lt "$REKOR_CEILING" ]; then
            echo "RESULT FITS — at $(( DSSE * 100 / REKOR_CEILING ))% of the ceiling"
          else
            echo "RESULT OVER by $(( DSSE - REKOR_CEILING ))B"
          fi
          # A smaller document that lost packages is the one outcome worse than
          # a red step, so the package count is the first thing printed and the
          # Electron trees are named individually.
          echo "RESULT electron trees: $(jq -r '[.packages[] | select(.name|test("^(electron|chatgpt)$|claude-code";"i")) | .name] | unique | join(", ")' /tmp/sbom/ownership.json)"
          echo "RESULT relationship types: $(jq -c '[.relationships[].relationshipType] | group_by(.) | map({(.[0]): length}) | add' /tmp/sbom/ownership.json)"
          df -h /; free -m
          exit 0

      - name: Post it to the real Rekor
        if: always()
        run: |
          # -e off: a REFUSAL is the result this step exists to record.
          set +e
          set -uo pipefail
          F=/tmp/sbom/ownership.min.json
          if ! [ -s "$F" ]; then echo "no document to post"; exit 0; fi
          echo "the blob is irrelevant; the predicate is the payload" > /tmp/subject.txt
          echo "════ cosign attest-blob with a $(stat -c%s "$F")B predicate ════"
          t0=$(date +%s)
          cosign attest-blob --yes --type spdxjson \
            --predicate "$F" --bundle /tmp/bundle.json /tmp/subject.txt 2>&1 | tail -20
          rc=${PIPESTATUS[0]}
          echo "──── cosign rc=${rc} after $(( $(date +%s) - t0 ))s"
          # rc=0 is the proof. The bundle's shape varies by cosign version, so a
          # missing index is not a refusal.
          if [ "$rc" = 0 ]; then
            echo "REKOR: ACCEPTED"
            jq -r '.. | .logIndex? // empty' /tmp/bundle.json 2>/dev/null | head -1
          else
            echo "REKOR: REFUSED (rc=${rc})"
          fi
          exit 0

      - name: Keep the document
        if: always()
        run: |
          set +e
          mkdir -p /tmp/out
          [ -s /tmp/sbom/ownership.min.json ] && gzip -9 -c /tmp/sbom/ownership.min.json > /tmp/out/ownership.min.json.gz
          ls -l /tmp/out
          exit 0

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-size-probe
          path: /tmp/out
          if-no-files-found: warn
          retention-days: 14
