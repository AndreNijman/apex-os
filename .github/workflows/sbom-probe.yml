name: sbom-probe

# TEMPORARY — a measurement, not a product. Delete this file once the SBOM step
# in build-image.yml is green.
#
# Run 35433705393 lost `image` at *Generate and attest the SBOM*: syft 1.52.0
# was SIGKILLed (137) 209 s into cataloguing ghcr.io/andrenijman/apex-os, with
# 86 GB of disk and 14.9 GB of memory free at the prune immediately before. The
# OOM killer is the obvious reading of a SIGKILL under those conditions, and
# every record of it so far is INFERRED FROM THE SHAPE — nobody has read a
# kernel message. This workflow reads one.
#
# It costs ~10 minutes instead of the ~1 hour a build-image run costs, because
# the image it catalogues already exists in GHCR: the failing run pushed and
# signed it before the SBOM step ran. Same runner class (ubuntu-24.04, 4 cores,
# 16 GB), same pinned syft, same command.
#
# Four arms, in parallel:
#   repro                the exact failing command — registry:, parallelism 4
#   ocidir               skopeo copy to an OCI layout on disk, then oci-dir:
#   ocidir-decompressed  the same with the layers decompressed on the way in;
#                        all 113 layers are zstd:chunked, so if oci-dir dies the
#                        same way this arm separates "where the bytes live" from
#                        "how they are compressed"
#   registry-par1        answers the open question in build-image.yml's own
#                        comment: at parallelism 1 the step ran the full fifteen
#                        minutes and was killed by the timeout, which is why the
#                        timeout was raised to 45. Was that slowness or was it
#                        swap thrash?
#
# Triggered by pushing THIS FILE to task/sbom-oom. `paths` keeps later commits
# to build-image.yml from re-running it.
on:
  push:
    branches: [task/sbom-oom]
    paths: [".github/workflows/sbom-probe.yml"]

permissions:
  contents: read
  packages: read

env:
  # The digest run 35433705393 pushed, signed, and then failed to catalogue.
  REF: ghcr.io/andrenijman/apex-os@sha256:be3bdd0c63848811fbbd3a76f17a50f40e90b1eeb8614b93993ec69419f3aafb

jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [repro, ocidir, ocidir-decompressed, registry-par1]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install syft (pinned to the version that died)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.52.0
          syft --version

      - name: Ensure GNU time (peak RSS is the measurement)
        run: |
          set -euo pipefail
          if ! [ -x /usr/bin/time ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq time
          fi
          /usr/bin/time --version 2>&1 | head -1

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Catalogue, and measure what runs out
        run: |
          # NOT set -e: syft dying is the measurement, not the end of the step.
          set -uo pipefail
          MODE='${{ matrix.mode }}'

          echo "── runner ──"
          nproc; free -m; df -h /; swapon --show || true
          echo "systemd-oomd: $(systemctl is-active systemd-oomd 2>&1) / $(systemctl is-enabled systemd-oomd 2>&1)"
          OOM0="$(awk '/oom_kill/{print $2}' /proc/vmstat)"; OOM0="${OOM0:-0}"
          echo "vmstat oom_kill before: $OOM0"

          # A sample every 5 s. A step that dies saying which resource ran out is
          # worth more than one that is merely fixed.
          (
            while true; do
              echo "[sample $(date +%T)] $(free -m | awk '/^Mem:/{printf "mem_used=%sM mem_avail=%sM", $3, $7} /^Swap:/{printf " swap_used=%sM", $3}') root_avail=$(df -BM --output=avail / | tail -1 | tr -d ' ') tmp=$(du -sm /tmp 2>/dev/null | cut -f1)M"
              sleep 5
            done
          ) & SPID=$!
          trap 'kill $SPID 2>/dev/null || true' EXIT

          PAR=4
          case "$MODE" in
            repro)               SRC="registry:$REF" ;;
            registry-par1)       SRC="registry:$REF"; PAR=1 ;;
            ocidir|ocidir-decompressed)
              DEC=""
              [ "$MODE" = ocidir-decompressed ] && DEC="--dest-decompress"
              _c0=$(date +%s)
              skopeo copy --retry-times 3 $DEC "docker://$REF" "oci:/tmp/oci:apex"
              echo "skopeo copy ($MODE) took $(( $(date +%s) - _c0 ))s"
              du -sh /tmp/oci; df -h /
              SRC="oci-dir:/tmp/oci"
              ;;
          esac

          echo "── syft: mode=$MODE parallelism=$PAR source=$SRC ──"
          _t0=$(date +%s)
          timeout 2700 /usr/bin/time -v -o /tmp/time.txt \
            env SYFT_PARALLELISM="$PAR" syft "$SRC" -o spdx-json \
            > /tmp/sbom.spdx.json
          rc=$?
          _el=$(( $(date +%s) - _t0 ))
          kill $SPID 2>/dev/null || true

          echo "════ mode=$MODE rc=$rc elapsed=${_el}s ════"
          grep -E 'Maximum resident|Command terminated|Elapsed \(wall|Major|Swaps' /tmp/time.txt || cat /tmp/time.txt || true

          OOM1="$(awk '/oom_kill/{print $2}' /proc/vmstat)"; OOM1="${OOM1:-0}"
          echo "vmstat oom_kill after: $OOM1  (delta $(( OOM1 - OOM0 )))"

          # Unconditional, on success too: if this arm passes but something ELSE
          # on the runner was OOM-killed, that is worth seeing.
          echo "── dmesg ──"
          sudo dmesg -T | grep -iE 'out of memory|killed process|oom-kill|oom_reaper' | tail -20 \
            || echo "NO OOM LINES IN DMESG"
          echo "── journal (systemd-oomd kills leave nothing in dmesg) ──"
          sudo journalctl --since '-30 min' --no-pager 2>/dev/null \
            | grep -iE 'oomd|out of memory|killed process|memory pressure' | tail -20 \
            || echo "NO OOM LINES IN JOURNAL"

          echo "── result ──"
          ls -l /tmp/sbom.spdx.json || true
          if [ "$rc" = 0 ]; then
            echo "SBOM packages: $(jq '.packages | length' /tmp/sbom.spdx.json)"
            jq -r '[.packages[].name] | length as $n | "distinct names: \($n)"' /tmp/sbom.spdx.json
            # Did the Electron trees survive? They are the whole reason the
            # cataloguers are not restricted.
            jq -r '[.packages[] | select(.name|test("electron|chatgpt|claude";"i")) | .name] | unique | join(", ")' \
              /tmp/sbom.spdx.json
          fi
          free -m; df -h /
          exit 0
