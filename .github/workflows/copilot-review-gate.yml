name: Copilot review gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  record:
    name: Record Copilot review result
    runs-on: ubuntu-24.04
    steps:
      - name: Require a clean Copilot review of the current commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          reviews="$(gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews")"
          review="$(jq -c --arg sha "$HEAD_SHA" '
            [ flatten[]
              | select((.user.login | ascii_downcase | contains("copilot")) and .commit_id == $sha)
            ] | sort_by(.submitted_at) | last // empty
          ' <<<"$reviews")"

          state=failure
          description="Waiting for Copilot to review the current commit"

          if [ -n "$review" ]; then
            review_id="$(jq -r .id <<<"$review")"
            body="$(jq -r '.body // "" | ascii_downcase' <<<"$review")"
            findings="$(gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/comments" \
              --jq "[flatten[] | select(.pull_request_review_id == $review_id and (.user.login | ascii_downcase | contains(\"copilot\")))] | length")"

            if grep -Eq 'unable to review|quota|could not review|cannot review|failed to review' <<<"$body"; then
              description="Copilot did not complete its review"
            elif [ "$findings" -gt 0 ]; then
              description="Copilot found $findings issue(s); push fixes for a new review"
            else
              state=success
              description="Copilot reviewed the current commit with no findings"
            fi
          fi

          gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="Copilot review gate" \
            -f description="$description" \
            -f target_url="${{ github.event.pull_request.html_url }}"

          echo "$description"
