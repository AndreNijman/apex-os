name: Free disk space
description: >-
  Ensure a bootc image build has disk headroom on a GitHub-hosted runner.
  Cheap by default; only actually cleans when space is genuinely short.

# ── WHY THIS BARELY DOES ANYTHING ANY MORE ───────────────────────────────────
# This step used to unconditionally delete every preinstalled toolchain, and for
# a while also ran `apt-get remove` over a dozen package globs. It was written
# against the old runner spec — "ubuntu-latest ships with ~14 GB free" — and that
# is simply no longer true. Measured on the base job of run 30779542368:
#
#   --- before ---
#   /dev/root  145G   58G   88G  40% /
#   --- after ---
#   /dev/root  145G   27G  119G  19% /
#
# 88 GB free BEFORE cleaning, for a job that needs ~13 GB of core plus a ~5 GB
# base. The sweep reclaimed 31 GB nobody was going to use and cost 4.2 minutes,
# in SEVEN jobs — and on the critical path (core -> base -> flavors) that is
# ~12 minutes of wall clock spent making room that already existed.
#
# So: report the space, and sweep only if it is actually tight. The threshold is
# deliberately generous — the point is to keep working if GitHub shrinks the
# runners again, not to shave bytes.

inputs:
  required-gb:
    description: Sweep only if fewer than this many GB are available on /.
    default: "60"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        REQUIRED_GB: ${{ inputs.required-gb }}
      run: |
        avail_gb() { df --output=avail -BG / | tail -1 | tr -dc '0-9'; }
        before="$(avail_gb)"
        echo "available on /: ${before} GB (want ${REQUIRED_GB} GB)"

        if [ "$before" -ge "$REQUIRED_GB" ]; then
          echo "plenty of room — skipping the cleanup entirely"
          exit 0
        fi

        echo "::warning::only ${before} GB free — sweeping preinstalled toolchains"
        # Directory deletes only. No `apt-get remove`: it resolves dependencies
        # and runs maintainer scripts to reclaim space these `rm -rf`s already
        # take. Every `|| true` is deliberate — the exact set of preinstalled
        # software changes between runner images, and a job must not fail because
        # a directory GitHub used to ship has been renamed or dropped.
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/share/swift \
          /usr/local/lib/android \
          /usr/local/share/powershell \
          /usr/local/share/boost \
          /usr/local/.ghcup \
          /opt/ghc \
          /opt/hostedtoolcache \
          "$AGENT_TOOLSDIRECTORY" || true
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        sudo apt-get clean || true

        after="$(avail_gb)"
        echo "available on /: ${after} GB (reclaimed $(( after - before )) GB)"
        # Fail loudly rather than letting the build die deep inside podman with a
        # confusing ENOSPC.
        if [ "$after" -lt 20 ]; then
          echo "::error::only ${after} GB free after cleaning; this build needs more"
          exit 1
        fi
