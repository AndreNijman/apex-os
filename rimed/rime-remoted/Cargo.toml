[package]
name = "rime-remoted"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rime-remote-core = { path = "../rime-remote-core" }
rime-agent-core = { path = "../rime-agent-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true

# The end-to-end suite drives both daemons over their real sockets and reads
# the replies as the daemon's own types, so `claude-remote-control` and the
# protocol revision are checked against the vocabulary rather than against
# string literals a test could get wrong.
[dev-dependencies]
rime-agent-core = { path = "../rime-agent-core" }

# The TLS half of a relay dial is proved by terminating a real TLS connection
# on loopback, so the test needs a SERVER. Already in the lock through
# rime-remote-core, so naming it here adds no crate: `cargo tree` and the
# package count are unchanged.
rustls = { version = "0.23.42", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
