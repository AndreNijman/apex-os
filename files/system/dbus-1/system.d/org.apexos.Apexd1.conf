<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (the apexd service user) may own the name. -->
  <policy user="root">
    <allow own="org.apexos.Apexd1"/>
  </policy>

  <!-- Any local user may call the service; per-method authorization is
       delegated to polkit (see org.apexos.apexd.policy). Reads (properties,
       fingerprint, metrics) are unrestricted; the mutating methods
       (SetTier, SetChargeThresholds, ...) are gated by polkit inside apexd. -->
  <policy context="default">
    <allow send_destination="org.apexos.Apexd1"/>
    <allow receive_sender="org.apexos.Apexd1"/>
  </policy>
</busconfig>
