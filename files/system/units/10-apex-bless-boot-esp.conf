# Run the boot blessing in the domain that is allowed to write the ESP.
#
# systemd-bless-boot renames /boot/loader/entries/<entry>+N-M.conf to strip the
# boot counter once boot-complete.target is reached. On the composefs +
# systemd-boot path the ESP IS /boot, so that file is dosfs_t, and PID 1
# executing /usr/lib/systemd/systemd-bless-boot (init_exec_t) leaves the
# process in init_t, which Fedora 43's policy allows no rename on dosfs_t.
# Measured, with the AVC, in ROADMAP/evidence/sdboot-image-20260920-decision.md.
#
# bootupd_t is the domain Fedora built for writing bootloader state onto a FAT
# ESP; the one permission the transition was missing is granted by the
# apex_sdboot policy module (files/system/selinux/apex_sdboot.te).
#
# The `-` prefix covers exactly one family of failure, and it is worth being
# precise about which, because the wrong belief here is dangerous.
# systemd.exec(5): with the dash, "failing to set the SELinux security context
# will be ignored, but it's still possible that the subsequent execve() may
# fail when the security policy doesn't allow the transition."
#
#   SELinux disabled or permissive  -> setexeccon fails -> ignored -> the
#                                      blessing runs unconfined. Covered.
#   a policy with no bootupd_t      -> same. Covered.
#   the apex_sdboot module MISSING,
#   SELinux enforcing               -> setexeccon SUCCEEDS and the kernel then
#                                      denies execve on the entrypoint. The
#                                      unit fails, the counter is never
#                                      stripped, and the machine rolls itself
#                                      back on the fourth boot. NOT covered.
#
# What guards that last case is Containerfile.base asserting, across the tier
# boundary, that `semodule -l` still lists apex_sdboot — not this dash.
[Service]
SELinuxContext=-system_u:system_r:bootupd_t:s0
