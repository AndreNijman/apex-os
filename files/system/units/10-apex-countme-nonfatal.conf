# rpm-ostree's "Count Me" telemetry must never report the machine as broken.
#
# rpm-ostree-countme.service is a WEEKLY timer that pings the Fedora mirrors so
# Fedora can count installations. If the machine happens to be offline, on a
# captive portal, or the mirror errors when that timer fires, `rpm-ostree
# countme` exits non-zero, the unit fails, systemd marks the whole system
# degraded — and it stays that way until the timer next fires, up to a week
# later. The user is then told their system has a failed unit every time they
# open a terminal, for anonymous statistics that have no effect on anything they
# are doing.
#
# Clearing ExecStart and re-adding it with a `-` prefix keeps the telemetry
# running exactly as before when it works, and makes a failed report a logged
# non-event instead of a user-visible fault. This is the correct posture for
# optional telemetry: it is allowed to fail, it is not allowed to lie about the
# health of the system.
[Service]
ExecStart=
ExecStart=-rpm-ostree countme
