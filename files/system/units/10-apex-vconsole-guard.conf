# Repair an unusable /etc/vconsole.conf before loadkeys/setfont are run with it.
#
# Without this, a keymap or font that is not installed makes this unit fail,
# systemd reports the machine as degraded, and the user is told about a failed
# unit every time they open a terminal — over a virtual-console setting that
# does not affect their graphical session. /etc/vconsole.conf is machine-local,
# so no image update could ever fix it.
#
# The `-` prefix is load-bearing: even a bug in the guard itself must never be
# able to fail console setup or hold up the boot.
[Service]
ExecStartPre=-/usr/libexec/apex-vconsole-guard
