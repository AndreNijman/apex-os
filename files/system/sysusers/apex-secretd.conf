# The account apex-secretd runs as (roadmap §11).
#
# A system account with no shell and no login. That is the whole point: the
# credential store is protected from a managed agent by living under a uid no
# human user has, so this account must not be one anybody can become.
#
# The uid is allocated by systemd-sysusers at first boot rather than pinned
# here. /var is machine-local and empty in the image, and a baked uid would
# collide with whatever an existing host already gave that number to.
#
# The home directory is the store. systemd creates it as StateDirectory= before
# ExecStart, so this line only records where the account belongs.
u apex-secret - "APEX protected secret service" /var/lib/apex-secretd /usr/sbin/nologin
