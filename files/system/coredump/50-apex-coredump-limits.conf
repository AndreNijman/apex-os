# APEX-OS: bound what a crash LOOP can cost an ostree machine's /var.
#
# WHY THIS FILE EXISTS, measured on katana 2026-09-19
# (ROADMAP/evidence/katana-image-qual-20260919.md §3.4). A single crashing
# process — mangoapp, respawned by gamescopereaper at roughly 2 Hz — produced
# 15 376 core dumps in one boot and 144 187 journal lines for ONE session, and
# left 4.0 GB of stored dumps behind on a /var that was already 94 % full.
#
# The important half of that reading is what it was NOT: systemd's vacuum was
# working correctly the whole time. `MaxUse=` defaults to 10 % of the
# filesystem **capped at 4 GiB**, and `KeepFree=` to 15 % capped at 4 GiB
# (coredump.conf(5)); katana's /var is 954 GB, so the effective cap was 4 GiB
# and 4.0 GB is exactly it. Nothing was broken. The default is simply the wrong
# size for this operating system.
#
# APEX is an ostree/bootc system. /var is the only writable filesystem on the
# machine: it holds every container image, every flatpak, the system extension
# `apex-pkg` builds, and the user's home. Filling it does not merely lose core
# dumps — it breaks `apex update`, `apex install` and the next boot's sysext
# rebuild. Four gigabytes of crash dumps is never the best use of the last four
# gigabytes of that filesystem, and a machine that a user can actually recover
# matters more than a dump nobody will read.
#
# 256 MiB still holds dozens of ordinary dumps, which is what a developer or a
# bug report needs; it just cannot hold a 2 Hz crash loop. KeepFree=2G is the
# hard floor: a machine with less than 2 GB free deletes dumps before it takes
# more, whatever MaxUse says.
#
# This bounds the DISK, and that is all it can do. It does not slow a crash
# loop down (systemd has no per-executable rate limit, and gamescopereaper's
# `--respawn` has no backoff) and it does not stop one filling the journal.
# Those are the crasher's problem; this is the guard that keeps the crasher
# from taking the machine with it.
[Coredump]
MaxUse=256M
KeepFree=2G
