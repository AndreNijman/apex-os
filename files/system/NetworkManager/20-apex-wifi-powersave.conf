# APEX: keep Wi-Fi power save off.
#
# MT7925 (mt7925e) on this machine comes back from s2idle with its receive path
# wedged: the signal reads fine (-45 dBm) while the rx rate is pinned to the
# lowest VHT rate and a third to two thirds of packets to the local gateway are
# lost. Power save is not the whole story — turning it off alone took packet
# loss from 66% to 50% — but it is a contributing factor and costs nothing on a
# machine that is usually on AC or in use.
#
# 2 = disable. (3 = enable, 0 = use the default.)
[connection]
wifi.powersave = 2
