# APEX-OS: connectivity checking, which is what makes a captive portal visible.
#
# NetworkManager ships with this off, and Fedora Workstation turns it on through
# a package (NetworkManager-config-connectivity-fedora) that APEX did not
# install. With it off, NM has exactly two opinions about a connection: it is up
# or it is down. A hotel, airport or campus network that has associated you, given
# you an address, and will answer nothing until you accept its terms reads as
# "connected" — so the desktop says the network is fine while nothing loads, and
# the person has no way to reach the login page except by guessing at a URL.
#
# Turning it on gives NM a third state, `portal`, which is the one that can be
# acted on: `nmcli networking connectivity` reports it, and `apex devices
# network` says which network is holding the connection and what to open.
#
# ── The cost, stated rather than buried ─────────────────────────────────────
# This is an outbound HTTP request to a third party every `interval` seconds,
# from every APEX machine, whenever a connection is up. That is a real privacy
# decision and it belongs in a file somebody can read and delete, which is why it
# is here rather than pulled in as a dependency.
#
# The endpoint is Fedora's own. It is a deliberate choice over NetworkManager's
# upstream default: this image is already a Fedora derivative that talks to
# Fedora infrastructure for every update, so the check adds no party that did not
# already know this machine exists. Pointing it at a service run by anybody else
# would.
#
# `response=OK` is not a formality. The check has to distinguish the real
# document from a portal's interception of it, and a portal will happily return
# 200 with its own login page — so the body is compared, not the status code.
#
# To turn it off: `enabled=false` here, or drop a later-numbered file in
# /etc/NetworkManager/conf.d that sets it. Nothing else in APEX depends on it
# being on; the diagnostics say the check is disabled rather than reporting a
# network with no portal.
[connectivity]
enabled=true
uri=http://fedoraproject.org/static/hotspot.txt
response=OK
interval=300
