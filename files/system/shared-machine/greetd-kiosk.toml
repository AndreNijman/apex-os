# APEX-OS — greetd config for a KIOSK machine (P2-016 criterion 3).
#
# A RECIPE, not a shipped default. It installs to
# /usr/share/apex/shared-machine/greetd-kiosk.toml and is never
# /etc/greetd/config.toml unless somebody puts it there. The shipped login
# config is files/desktop/apex-greet/greetd-config.toml, which has no
# auto-login of any kind — tests/test-apex-shared-machine.sh asserts that
# absence, because "kiosk policy is possible WITHOUT weakening ordinary
# desktop use" is a claim about the ordinary config, not about this one.
#
# ── Why default_session and not initial_session ─────────────────────────────
#
# greetd has an auto-login stanza, `[initial_session]`, and it is the wrong one
# for a kiosk. From greetd(5) as shipped on this machine (greetd 0.10.3):
#
#     The initial session will only be executed during the first run of greetd
#     since boot in order to ensure signing out works properly ... This is
#     checked through the presence of the runfile.
#
# So `[initial_session]` logs in once per BOOT. A kiosk whose app exits — the
# user closes it, it crashes, a watchdog restarts it — would then drop to the
# greeter and stay there until somebody power-cycles the machine, which is the
# one thing a kiosk must never do.
#
# `[default_session]` is restarted by greetd "whenever no session is running",
# which is exactly the kiosk loop. Setting `user` on it runs the session as the
# kiosk account rather than the greeter account.
#
# ── What this costs, stated plainly ─────────────────────────────────────────
#
# There is no authentication on this path. Anyone who can see the screen is the
# kiosk user. That is what a kiosk IS, and it is why the kiosk account must be
# a purpose-made one that is not in wheel, holds no credentials, and is not the
# machine owner. It is also why this file is a recipe: a machine that acquired
# it by accident would have turned its login screen off.

[terminal]
vt = 1

[default_session]
# --unsupported-gpu for the same reason the greeter config carries it: sway
# 1.11's detect_proprietary() exits(EXIT_FAILURE) on any machine where
# nvidia-drm is present, and APEX bakes the NVIDIA driver into one image.
command = "sway --unsupported-gpu -c /usr/share/apex/shared-machine/sway-kiosk.conf"
# The kiosk account. Create it WITHOUT wheel:
#   useradd --system-ish -m -s /usr/sbin/nologin apex-kiosk   (see README)
user = "apex-kiosk"

# Deliberately NO [initial_session]. See above — it would fire once per boot
# and leave the machine at a greeter for the rest of the day.
