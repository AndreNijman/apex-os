# APEX-OS — sway host for a kiosk session (P2-016 criterion 3).
#
# The same shape as the greeter's host config
# (files/desktop/apex-greet/sway-greet.conf) and for the same reasons: a
# standalone, keybind-free compositor that runs exactly one client and exits
# when it does. The greeter proved that shape works; a kiosk is that shape with
# a different single client.
#
# Set APEX_KIOSK_APP in the unit or the environment to the command to run.
# There is deliberately no default: a kiosk with no app configured must fail
# visibly rather than start something arbitrary.

### The one and only client ###################################################
# Exit sway when the app exits, so greetd restarts the whole session rather
# than leaving a blank compositor nobody can escape from. greetd restarts
# default_session whenever no session is running, which is the kiosk loop.
exec "${APEX_KIOSK_APP}; swaymsg exit"

### Output ####################################################################
output * bg #000000 solid_color

### Input #####################################################################
# No keyboard layout is set here, for the reason sway-greet.conf documents: the
# APEX keymap generator supplies XKB_DEFAULT_LAYOUT from the system keymap, and
# hardcoding `us` broke non-US machines.
input type:touchpad {
    tap disabled
    natural_scroll disabled
}

### Chrome ####################################################################
default_border none
default_floating_border none
hide_edge_borders both
for_window [app_id=".*"] border none

### Hardening #################################################################
# This config does NOT `include /etc/sway/config.d/*`, so none of sway's
# default keybindings exist: no terminal, no launcher, no exec binding, no
# workspace switching. That is the kiosk boundary, and it is a boundary made of
# absent configuration rather than of a lockdown applied to everyone — the
# ordinary APEX desktops are untouched by this file existing.
xwayland disable
focus_follows_mouse no
