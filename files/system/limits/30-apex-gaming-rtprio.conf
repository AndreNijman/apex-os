# APEX-OS Gaming — allow realtime scheduling priorities for the desktop user.
#
# WHY THIS FILE EXISTS
# `gamescope --rt` asks for SCHED_RR so the compositor thread cannot be starved
# by the game it is presenting. That call needs either CAP_SYS_NICE on the binary
# or a non-zero RLIMIT_RTPRIO for the calling user. Verified on APEX-OS:
#
#   $ getcap /usr/bin/gamescope      -> nothing; Fedora sets no file caps
#   $ ulimit -Hr                     -> 0
#
# So `--rt` silently failed to acquire realtime scheduling. gamescope logs it and
# carries on at normal priority, which is exactly the kind of quiet degradation
# that makes a "performance" feature do nothing.
#
# WHY rlimits AND NOT setcap
# A file capability on gamescope would grant CAP_SYS_NICE to every invocation of
# it by anyone, and has to survive an OCI layer -> ostree round-trip to work at
# all. An rlimit is applied by pam_limits at login, is scoped to real login
# sessions, and needs no privileged binary. Verified that the path works here:
# /etc/pam.d/greetd includes system-auth in its session stack, and that stack
# has `session required pam_limits.so` — so a greetd-started session, which is
# how both the desktop and Gaming Mode start, picks this up.
#
# WHY @wheel AND NOT EVERYONE
# Realtime priority is a denial-of-service primitive: a runaway SCHED_RR thread
# can lock out normal scheduling. wheel is the interactive-owner group the APEX
# installer puts the primary account in, matching the posture of the
# Windows-boot rule. A shared machine's non-admin accounts do not get it.
#
# 20 rather than PipeWire's 70: gamescope only needs to outrank ordinary
# SCHED_OTHER work, and staying well below the audio stack means a busy
# compositor can never preempt PipeWire and cause crackle. nice -19 covers
# gamescope's non-RT threads and `apex game`'s reniced helpers.
@wheel   -   rtprio   20
@wheel   -   nice     -19
