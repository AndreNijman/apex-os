# APEX-OS — xdg-desktop-portal backends for the niri session.
#
# Overrides /usr/share/xdg-desktop-portal/niri-portals.conf, which the niri
# package ships as:
#
#     [preferred]
#     default=gnome;gtk;
#     org.freedesktop.impl.portal.Access=gtk;
#     org.freedesktop.impl.portal.Notification=gtk;
#     org.freedesktop.impl.portal.Secret=gnome-keyring;
#
# WHAT THAT ACTUALLY DOES, AND WHY IT IS NOT WHAT APEX WANTS
# It is NOT the `*`-wildcard fallback labwc-portals.conf exists to eliminate —
# niri does ship a config, XDG_CURRENT_DESKTOP is `niri`, and portals.conf(5)
# resolves `<desktop>-portals.conf` before the non-desktop-specific file, so
# that config is found and nothing is left to backend resolution order.
#
# The problem is quieter than that: `default=gnome;gtk` sends FileChooser,
# AppChooser, Print and Settings to xdg-desktop-portal-gnome, because gnome.portal
# lists all four. So "Open File" in a Flatpak is a GNOME dialog on niri and a GTK
# dialog on the other two sessions APEX ships — labwc pins `default=gtk`, and
# hyprland-portals.conf's `default=hyprland;gtk` reaches gtk for the same
# interfaces because the Hyprland backend implements only capture and shortcuts.
# §24 asks niri for shell and settings parity with Hyprland; a different file
# chooser, a different print dialog and a heavier dependency on a shell that is
# not running is not parity.
#
# THE ORDER IS REVERSED, NOT THE LIST
# `default=gtk;gnome`: a key is a semi-colon separated list searched IN ORDER
# for an implementation of the requested interface (portals.conf(5)), so gtk
# answers everything it implements — FileChooser, AppChooser, Print,
# Notification, Access, Inhibit, Settings, Account, Email, DynamicLauncher —
# and gnome answers everything gtk does not: GlobalShortcuts, RemoteDesktop,
# Background, Clipboard, Wallpaper, Lockdown, Usb, InputCapture. Nothing is
# stranded, and nothing is left to lexicographic order.
#
# This keeps the two pins the niri package is right about — Access and
# Notification on gtk — without having to name them, and it does not lose the
# interfaces only gnome implements, which a bare `default=gtk` would.

[preferred]
default=gtk;gnome

# Screen capture is xdg-desktop-portal-gnome and NOT the wlroots backend, which
# is the opposite of the labwc answer and is deliberate. niri implements the
# Mutter D-Bus API — `strings /usr/bin/niri` contains
# org.gnome.Mutter.ScreenCast, its .Session and .Stream interfaces, and
# /org/gnome/Shell/Screenshot — which is what xdg-desktop-portal-gnome drives.
# xdg-desktop-portal-wlr does not claim niri either: wlr.portal ships
# `UseIn=wlroots;sway;Wayfire;river;phosh;Hyprland;` with no niri in it.
#
# Stated explicitly rather than left to `default=gtk;gnome` (which would resolve
# to gnome anyway, since gtk.portal implements neither) because screen sharing
# is the interface that is most often quietly broken and the one nobody notices
# until they join a call. An explicit line is also something the build can
# assert.
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome

# gnome-keyring is the only Secret implementation installed, and it is what the
# session already runs for credential storage. It has to be named: it is not in
# the `default` list, so without this line Secret would have no backend at all.
org.freedesktop.impl.portal.Secret=gnome-keyring
