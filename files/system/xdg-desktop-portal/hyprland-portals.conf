# APEX-OS — xdg-desktop-portal backends for the Hyprland session.
#
# Overrides /usr/share/xdg-desktop-portal/hyprland-portals.conf, which the
# xdg-desktop-portal-hyprland package ships as:
#
#     [preferred]
#     default=hyprland;gtk
#
# WHAT WAS WRONG WITH THAT, AND WHAT WAS NOT
# Most of it is right, and this file keeps it. `default` is a semi-colon
# separated list searched IN ORDER for an implementation of the requested
# interface (portals.conf(5)), so hyprland answers Screenshot, ScreenCast,
# GlobalShortcuts and InputCapture — the four interfaces hyprland.portal
# declares — and gtk answers FileChooser, AppChooser, Print, Notification,
# Inhibit, Access, Account, Email, DynamicLauncher and Settings. There is no
# wildcard and nothing is left to backend resolution order. That is exactly the
# arrangement labwc-portals.conf and niri-portals.conf were written to produce.
#
# THE GAP: THIS SESSION HAD NO SECRET PORTAL AT ALL
# Neither hyprland.portal nor gtk.portal implements
# org.freedesktop.impl.portal.Secret. Only gnome-keyring.portal does, and it is
# not in the `default` list — so a Flatpak asking for the Secret portal on
# APEX's DEFAULT session got nothing, while the same Flatpak on the niri session
# got gnome-keyring, because niri-portals.conf names it and this file did not
# exist. Measured on a live machine: introspecting
# org.freedesktop.portal.Desktop in a Hyprland session found no
# org.freedesktop.portal.Secret interface, and also no Usb and no
# RemoteDesktop.
#
# gnome-keyring.portal additionally carries `UseIn=gnome`, so it is not
# reachable by any default list in a Hyprland session either. Naming a backend
# explicitly is what overrides that, and it was verified rather than assumed: a
# test backend carrying `UseIn=gnome` was resolved in a session announcing
# XDG_CURRENT_DESKTOP=Hyprland when a `<interface>=<backend>` line named it, and
# was NOT resolved when the same fixture left it to `default`. That is the
# mechanism niri-portals.conf's Secret pin already relies on; this file relies
# on it for the same reason.

[preferred]
# Unchanged from the packaged file, and stated here rather than inherited,
# because a config in /etc replaces the one in /usr/share wholesale — it does
# not merge with it. Dropping this line would strand FileChooser.
default=hyprland;gtk

# Screen capture is xdg-desktop-portal-hyprland. This is what `default` already
# resolves to, since hyprland.portal is first in the list and implements both,
# but it is written out for the reason the niri file writes its own out: screen
# sharing is the interface most often quietly broken and the one nobody notices
# until they join a call, and an explicit line is something the build can
# assert. hyprland.portal also declares `UseIn=wlroots;Hyprland;sway;…`, so
# without an explicit choice a Hyprland session could be answered by
# xdg-desktop-portal-wlr, which advertises the same UseIn list.
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland

# The gap this file exists to close. gnome-keyring is the only Secret
# implementation installed, and it is what the session already runs for
# credential storage.
org.freedesktop.impl.portal.Secret=gnome-keyring

# NOT ADDED, DELIBERATELY: `gnome` on the end of the default list.
# That would also reach Usb, RemoteDesktop, Background, Clipboard, Wallpaper
# and Lockdown, which gnome.portal implements and nothing else installed here
# does — and which the niri session consequently has and this one does not.
# It is a bigger behavioural change than closing the Secret gap: it starts
# xdg-desktop-portal-gnome in a session with no GNOME shell behind it, for
# interfaces whose backends talk to Mutter. Whether those answer usefully
# outside a GNOME session was not measured, and shipping an interface that
# exists but cannot answer is worse than an interface that is honestly absent —
# the permissions model reports the second as "no primitive on this session"
# and would report the first as a broker that is really there.
#
# docs/app-permissions.md §2.1 records the consequence: the set of capabilities
# that can be brokered at all differs between APEX's own sessions, and a
# permissions page has to read it from the running session rather than from a
# table of constants.
