# APEX-OS — xdg-desktop-portal backends for the labwc (APEX Floating) session.
#
# Overrides /usr/share/xdg-desktop-portal/labwc-portals.conf, which the labwc
# package ships as:
#
#     [preferred]
#     default=wlr;*
#     org.freedesktop.impl.portal.Inhibit=none
#
# WHY THAT IS NOT GOOD ENOUGH
# xdg-desktop-portal-wlr implements exactly two interfaces, ScreenCast and
# Screenshot. For everything else — FileChooser above all — `wlr` cannot answer,
# so the `*` wildcard picks whichever installed backend the daemon happens to
# resolve first. This image installs BOTH xdg-desktop-portal-gtk and
# xdg-desktop-portal-gnome, so "Open File" in a Flatpak could get either one,
# and the GNOME implementation outside a GNOME session is both heavier and
# visually inconsistent with the rest of the desktop.
#
# A file chooser that depends on backend resolution order is the kind of defect
# that looks like it works on the developer's machine and reads as flakiness to
# everyone else. This pins every interface that matters.
#
# The shape is deliberately the same as the sway-portals.conf that ships with
# sway: labwc and sway are both wlroots compositors with the same portal story,
# and sway's config is the proven one.
#
# /etc, not /usr/share: portals.conf(5) documents /etc as the location for a
# vendor or administrator override, and it takes precedence over the package's
# own file without conflicting with it on upgrade.
#
# Note the session sets XDG_CURRENT_DESKTOP=labwc:wlroots, so this file is
# matched on the first component before wlroots-portals.conf is considered.

[preferred]
# gtk for the ordinary desktop interfaces: FileChooser, AppChooser, Print,
# Notification, Settings. It is the toolkit-native implementation and the one
# the rest of the session already looks like.
default=gtk

# Screen capture is the wlroots backend. This is the specific thing the roadmap
# calls out — use the wlroots portal rather than assuming the Hyprland one.
# xdg-desktop-portal-hyprland also advertises UseIn=wlroots, so without an
# explicit choice a labwc session can end up driven by Hyprland's portal.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

# gnome-keyring is the only Secret implementation installed, and it is what the
# session already runs for credential storage.
org.freedesktop.impl.portal.Secret=gnome-keyring

# labwc implements no idle-inhibit portal. `none` makes that explicit, so a
# request fails fast instead of hanging on a backend that will never answer.
# Carried over from the packaged config, which is right about this.
org.freedesktop.impl.portal.Inhibit=none
