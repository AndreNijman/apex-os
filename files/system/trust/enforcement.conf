# What this machine refuses to deploy. Read by `apex update` and `apex trust`.
#
# Two settings, each one of: enforce, warn, off.
#
#   enforce   anything short of a verified check stops the update
#   warn      a check that FAILS stops the update; one that is missing, or
#             that could not be made, prints a warning and the update goes on
#   off       report, never refuse
#
# The asymmetry in `warn` is deliberate: a signature that verifies WRONGLY is
# the signature of an attack, and no amount of "the network was flaky" makes
# it not one. A signature that is missing, or that could not be fetched, is a
# gap, and warning about a gap is proportionate.
#
# This file is the IMAGE's default and is replaced on every update. To change
# what your machine enforces, write only the keys you want to change to
# /etc/apex/trust.conf, which is read afterwards and wins per key. See
# docs/trust-enforcement.md.

# Every published APEX image is cosign-signed under the release workflow's
# keyless GitHub identity, and always has been, so refusing an unsigned one
# costs nothing and is the entire point.
signature=enforce

# Not enforce, and that is a fact about the publisher rather than caution. No
# published APEX image has an SBOM attestation: the `cosign attest` step
# exists on roadmap/v2.2 and has never run on main, so the `.att` artifact is
# `manifest unknown` for every digest in the registry today. Shipping
# `enforce` would refuse every update on every machine on the grounds that the
# publisher has not caught up, which is an outage dressed as a security
# control. It becomes `enforce` in the image build that first publishes an
# attestation, and not before.
provenance=warn
