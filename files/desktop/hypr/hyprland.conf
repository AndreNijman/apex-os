# ─────────────────────────────────────────────────────────────────────────────
#  APEX-OS — default Hyprland config (seeded per-user by apex-shell-firstrun;
#  @HOME@ is substituted with the user's home at seed time). apex-logs 16.
#  Replaces the generic Hyprland example config the provisioner had seeded.
#  APEX Shell (Quickshell) draws the bar/UI; this file owns the compositor,
#  autostart, and keybinds. Keybinds trigger APEX Shell popups over its IPC.
# ─────────────────────────────────────────────────────────────────────────────

################
### MONITORS ###
################
# Fully generic, and it must STAY generic — this file is seeded into every
# user's home on every machine, so it may not name a specific output or mode.
#   ""        → match every monitor, however many, whatever they are called
#   preferred → the panel's own native mode, read from EDID
#   auto      → automatic placement (side by side, in probe order)
#   1.0       → no scaling
#
# Scale is a deliberate fixed 1.0 rather than `auto`. Hyprland's `auto` scale
# rejects ratios it cannot resolve to an integer buffer size for the given
# resolution and errors the monitor rule out entirely, which is a worse
# failure (no output configured) than a small UI. On a HiDPI panel the UI will
# look small at 1.0 — raise it per machine with `hyprctl keyword monitor` or by
# editing this line to 1.25 / 1.5; it is your file now, edits here persist.
monitor = , preferred, auto, 1.0

#####################
### PROGRAM VARS  ###
#####################
$terminal    = alacritty
$browser     = firefox
$fileManager = thunar
# APEX Shell IPC entrypoint (the shell runs as `quickshell -c <this dir>`).
$shellDir = /usr/share/apex-shell
# Kept for hand-written binds that need a raw IPC call; the APEX popups below go
# through `apex shell`, which hides the install path and survives an IPC rename.
$qsIpc    = qs -p /usr/share/apex-shell ipc call

#################
### AUTOSTART ###
#################

# APEX Shell autostarts
# awww-daemon by absolute path (belt-and-suspenders vs the PATH fix above) so the
# wallpaper is restored at boot regardless of PATH resolution timing.
exec-once = awww-daemon
# hypridle + APEX Shell are started by /usr/libexec/apex-shell-autostart rather
# than by two exec-once lines of their own. It resolves hypridle's config (image
# copy by default, ~/.config/hypr/hypridle.conf as an explicit override) and is
# idempotent, so it is also safe to run by hand to repair a live session.
#
# $shellDir is /usr/share/apex-shell: the shell ships INSIDE the image (apex-logs
# 56). It used to be cloned per-user into ~/.local/src/apex-shell on first login,
# which meant these autostarts fired 2-5s before the clone finished and died —
# a first login with no bar, no popups and no idle management (apex-logs 51).
# Vendoring the shell makes that race structurally impossible: it is present
# before the compositor is ever exec'd. It also means the UI and the OS move
# together on ONE update channel (`apex update`), instead of the shell having its
# own in-app git-pull updater.
exec-once = /usr/libexec/apex-shell-autostart
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Input method (fcitx5, baked into the image). greetd execs Hyprland directly,
# so nothing here processes /etc/xdg/autostart — the IME has to be started by
# the compositor or CJK/Indic/Cyrillic users cannot type at all. Guarded so the
# line is a silent no-op if fcitx5 is ever absent. `-d` daemonises, `-r`
# replaces a stale instance on config reload.
exec-once = command -v fcitx5 >/dev/null && fcitx5 -d -r

#############################
### ENVIRONMENT VARIABLES ###
#############################
# The greetd-launched session PATH is /usr/local/bin:/usr/bin:/usr/local/sbin and
# does NOT include ~/.local/bin — which is where the awww/awww-daemon wallpaper
# shims live. Without this, the wallpaper daemon isn't found at boot and the
# shell's `awww img` calls fail. Prepend it for the whole session (shell + execs).
env = PATH,@HOME@/.local/bin:/usr/local/bin:/usr/bin:/usr/local/sbin
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#############
### INPUT ###
#############
# The kb_layout / kb_variant values below are substituted by apex-shell-firstrun
# from the SYSTEM keymap (/etc/X11/xorg.conf.d/00-keyboard.conf, i.e. whatever
# `localectl set-x11-keymap` or the installer recorded), falling back to `us`
# when the system has no keymap set. Hardcoding `us` here meant a German,
# French or Spanish user got a US layout in their session no matter what they
# chose at install time — and had to type their password on the wrong layout.
#
# This comment deliberately does NOT name the placeholder tokens, and does not
# quote the value localectl prints for an unset keymap either. Two reasons, both
# learned the hard way:
#   1. the seeding `sed` is a plain global substitution, so writing the tokens
#      here got them replaced in the COMMENT too, and every seeded config
#      carried the bug's own value pasted into its own documentation;
#   2. apex-shell-firstrun's postcondition greps seeded configs for that
#      placeholder value, so quoting it verbatim here made a correct, brand-new
#      install fail its own provisioning check (apex-logs 14).
# The check now strips comments before matching, but keeping the string out of
# the file entirely means neither mistake can come back.
input {
    kb_layout   = @KB_LAYOUT@
    kb_variant  = @KB_VARIANT@
    follow_mouse = 1
    sensitivity  = 0
    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

# Touchpad workspace swipe (Hyprland 0.51 syntax).
gesture = 3, horizontal, workspace

###################
### LOOK & FEEL ###
###################
general {
    gaps_in     = 5
    gaps_out    = 10
    border_size = 2
    # active border colour is re-tinted from the wallpaper by APEX Shell's
    # matugen pipeline (WallpaperService.updateBorders → hyprctl keyword).
    col.active_border   = rgba(a1c999ee) rgba(8d748cee) 45deg
    col.inactive_border = rgba(252733aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size    = 6
        passes  = 2
    }
    shadow {
        enabled = true
        range   = 8
        render_power = 3
    }
}

animations {
    enabled = true
    bezier  = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows,     1, 4, ease
    animation = fade,        1, 4, ease
    animation = workspaces,  1, 4, ease
    animation = border,      1, 6, ease
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo   = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0
}

#################
### KEYBINDS  ###
#################
$mainMod = SUPER

# ── Apps / WM binds (as requested) ───────────────────────────────────────────
# NOTE: APEX Shell popup binds (launcher, dashboard, notifications, wallpaper,
# clipboard, audio, network, power menu, screen-record) are owned by the SHELL,
# not here. It generates ~/.config/apex-shell/ApexShellKeybinds.conf from
# ~/.config/apex-shell/src/user_data/keybinds.json and `source`s it at the bottom
# of this file. Binding them here too caused double-fires (e.g. SUPER+Q ran both
# killactive AND the launcher). The launcher is mapped to ALT+SPACE via
# keybinds.json; wallpaper picker moved off SUPER+W to SUPER+SHIFT+W there.
bind = $mainMod, T, exec, $terminal      # terminal
bind = $mainMod, Q, killactive           # quit window
bind = $mainMod, W, exec, $browser       # browser
bind = $mainMod, E, exec, $fileManager   # file manager

# Lock — not an APEX Shell default keybind, so bound here.
bind = $mainMod, L, exec, apex shell lock

# ── Screenshots (grimblast) ──────────────────────────────────────────────────
bind = , Print,          exec, bash /usr/share/apex-shell/src/scripts/screenshot.sh area
bind = $mainMod, Print,  exec, bash /usr/share/apex-shell/src/scripts/screenshot.sh screen

# ── Window management ────────────────────────────────────────────────────────
bind = $mainMod,       F,     fullscreen, 0
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod,       P,     pseudo
bind = $mainMod,       J,     layoutmsg, togglesplit

# Focus (arrow keys). Vim hjkl focus was removed: SUPER+l collided with
# SUPER+L (lock), and letter keys are better left free for app/popup binds.
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move windows
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad / special workspace
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Cycle workspaces with the mouse wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Mouse drag move/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media / brightness keys
# CTRL+SUPER equivalents for keyboards without these keys are shell defaults,
# so they arrive through the generated file sourced at the bottom of this one.
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume  @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume  @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute    @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute    @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
# Transport keys. These were only in the labwc session, which the two configs
# are meant to keep in step.
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

###################
### WINDOW RULES ##
###################
# `suppress_event` / `match:` — the syntax of Hyprland 0.54+. Containerfile.core
# builds against the sdegler COPR, which now serves 0.56.2, and 0.56.2 REJECTS
# the older `suppressevent` / `nofocus` / `class:` spellings.
#
# These two lines were briefly "corrected" to the older forms after checking the
# PUBLISHED core image, which was stale at Hyprland 0.51.1 and did reject these.
# That was the wrong authority: the question is what Containerfile.core BUILDS,
# not what happens to be on ghcr. A local core rebuild produced 0.56.2 and
# settled it.
#
# The `Hyprland --verify-config` assertion in Containerfile.base is the real
# guard, because it runs against the Hyprland in the image being built. It is
# what will fail — loudly, at build time — if these ever drift apart again.
windowrule = suppress_event maximize, match:class .*
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_focus on

# Generated input settings (APEX Settings -> Input). Sourced AFTER the input
# block above so the generated values win; the block above is the fallback for a
# machine where the generator has never run.
source = @HOME@/.config/hypr/apex-input.conf

# Generated display layout (APEX Settings -> Display). This is what makes a
# layout survive a logout: `hyprctl keyword monitor` is runtime-only, so
# apex-display-apply writes the same model here as well.
#
# Hyprland treats a `source =` with no matching file as a FATAL config error, so
# apex-shell-firstrun pre-creates this empty. Do not add a source line here
# without adding the matching pre-create.
source = @HOME@/.config/hypr/apex-display.conf

# ApexShellKeybinds
source = @HOME@/.config/apex-shell/ApexShellKeybinds.conf
