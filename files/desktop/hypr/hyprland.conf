# ─────────────────────────────────────────────────────────────────────────────
#  APEX-OS — default Hyprland config (seeded per-user by apex-shell-firstrun;
#  @HOME@ is substituted with the user's home at seed time). apex-logs 16.
#  Replaces the generic Hyprland example config the provisioner had seeded.
#  APEX Shell (Quickshell) draws the bar/UI; this file owns the compositor,
#  autostart, and keybinds. Keybinds trigger APEX Shell popups over its IPC.
# ─────────────────────────────────────────────────────────────────────────────

################
### MONITORS ###
################
# eDP-1 is 1920x1200; scale 1.0 (was 1.5, which made the shell "way too big").
# Bump to 1.25 if the UI ends up too small.
monitor = , preferred, auto, 1.0

#####################
### PROGRAM VARS  ###
#####################
$terminal    = alacritty
$browser     = firefox
$fileManager = thunar
# APEX Shell IPC entrypoint (the shell runs as `quickshell -c <this dir>`).
$shellDir = @HOME@/.local/src/apex-shell
$qsIpc    = qs -p @HOME@/.local/src/apex-shell ipc call

#################
### AUTOSTART ###
#################

# APEX Shell autostarts
# awww-daemon by absolute path (belt-and-suspenders vs the PATH fix above) so the
# wallpaper is restored at boot regardless of PATH resolution timing.
exec-once = awww-daemon
exec-once = hypridle -c @HOME@/.local/src/apex-shell/src/config/hypridle.conf
exec-once = quickshell -c @HOME@/.local/src/apex-shell
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

#############################
### ENVIRONMENT VARIABLES ###
#############################
# The greetd-launched session PATH is /usr/local/bin:/usr/bin:/usr/local/sbin and
# does NOT include ~/.local/bin — which is where the awww/awww-daemon wallpaper
# shims live. Without this, the wallpaper daemon isn't found at boot and the
# shell's `awww img` calls fail. Prepend it for the whole session (shell + execs).
env = PATH,@HOME@/.local/bin:/usr/local/bin:/usr/bin:/usr/local/sbin
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#############
### INPUT ###
#############
input {
    kb_layout   = us
    follow_mouse = 1
    sensitivity  = 0
    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

# Touchpad workspace swipe (Hyprland 0.51 syntax).
gesture = 3, horizontal, workspace

###################
### LOOK & FEEL ###
###################
general {
    gaps_in     = 5
    gaps_out    = 10
    border_size = 2
    # active border colour is re-tinted from the wallpaper by APEX Shell's
    # matugen pipeline (WallpaperService.updateBorders → hyprctl keyword).
    col.active_border   = rgba(a1c999ee) rgba(8d748cee) 45deg
    col.inactive_border = rgba(252733aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size    = 6
        passes  = 2
    }
    shadow {
        enabled = true
        range   = 8
        render_power = 3
    }
}

animations {
    enabled = true
    bezier  = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows,     1, 4, ease
    animation = fade,        1, 4, ease
    animation = workspaces,  1, 4, ease
    animation = border,      1, 6, ease
}

dwindle {
    pseudotile     = true
    preserve_split = true
}

misc {
    disable_hyprland_logo   = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0
}

#################
### KEYBINDS  ###
#################
$mainMod = SUPER

# ── Apps / WM binds (as requested) ───────────────────────────────────────────
# NOTE: APEX Shell popup binds (launcher, dashboard, notifications, wallpaper,
# clipboard, audio, network, power menu, screen-record) are owned by the SHELL,
# not here. It generates ~/.config/apex-shell/ApexShellKeybinds.conf from
# ~/.config/apex-shell/src/user_data/keybinds.json and `source`s it at the bottom
# of this file. Binding them here too caused double-fires (e.g. SUPER+Q ran both
# killactive AND the launcher). The launcher is mapped to ALT+SPACE via
# keybinds.json; wallpaper picker moved off SUPER+W to SUPER+SHIFT+W there.
bind = $mainMod, T, exec, $terminal      # terminal
bind = $mainMod, Q, killactive           # quit window
bind = $mainMod, W, exec, $browser       # browser
bind = $mainMod, E, exec, $fileManager   # file manager

# Lock — not an APEX Shell default keybind, so bound here.
bind = $mainMod, L, exec, $qsIpc lockscreen lock

# ── Screenshots (grimblast) ──────────────────────────────────────────────────
bind = , Print,          exec, grimblast copy area
bind = $mainMod, Print,  exec, grimblast copy screen

# ── Window management ────────────────────────────────────────────────────────
bind = $mainMod,       F,     fullscreen, 0
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod,       P,     pseudo
bind = $mainMod,       J,     togglesplit

# Focus (arrow keys). Vim hjkl focus was removed: SUPER+l collided with
# SUPER+L (lock), and letter keys are better left free for app/popup binds.
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move windows
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad / special workspace
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Cycle workspaces with the mouse wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Mouse drag move/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media / brightness keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume  @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume  @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute    @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

###################
### WINDOW RULES ##
###################
windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# ApexShellKeybinds
source = @HOME@/.config/apex-shell/ApexShellKeybinds.conf
