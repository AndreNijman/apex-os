# APEX-OS default mpv config.
#
# Hardware video decode via the GPU. On the AMD 780M (Ryzen laptop / Daily) this
# is VA-API through RADV; it works only because the APEX-OS base bakes full
# ffmpeg + the codec-enabled VA drivers (mesa-va-drivers-freeworld on Daily,
# Terra mesa on Gaming) — stock Fedora ships crippled mesa/ffmpeg where H.264/
# H.265 decode is disabled. `auto-safe` uses HW decode when the driver advertises
# it and falls back to software otherwise, so this is safe on any GPU.
vo=gpu
hwdec=auto-safe
keep-open=yes
