# APEX-OS greeter — /etc/greetd/config.toml
#
# greetd starts on a VT and runs `default_session.command` as the greetd
# session user. That command is a Wayland compositor hosting quickshell with
# the apex-greet config. quickshell speaks to greetd over the UNIX socket
# greetd hands its child via $GREETD_SOCK (Quickshell.Services.Greetd). On a
# successful authentication apex-greet calls Greetd.launch(...); greetd tears
# the greeter down and starts the user's session on the same VT.

[terminal]
# Run the greeter on VT 1. Adjust if another unit owns tty1.
vt = 1

[default_session]
# Compositor host = sway (M0 spike A finding). cage 0.2.0 does NOT serve
# wlr-layer-shell to quickshell 0.3.0, so the greeter cannot paint under cage;
# sway 1.11 (and labwc 0.9.6, both installed in the base as alternatives) do
# layer-shell v4. sway-greet.conf runs quickshell as sway's only client.
#   Fallback reference (insufficient — kept only for provenance):
#     command = "cage -ds -- qs -p /usr/share/apex-greet/shell.qml"
command = "sway --config /usr/share/apex-greet/sway-greet.conf"
# Fedora's greetd package provisions a `greetd` system user (sysusers.d); there
# is no `greeter` user. logind grants this user the seat/DRM access the greeter
# needs for the duration of the greet session.
user = "greetd"
