# APEX-OS greeter — example /etc/greetd/config.toml
#
# greetd starts on a VT and runs `default_session.command` as the
# `greetd` user. Here that command is `sway` (a full wlroots compositor)
# running quickshell — via sway-greet.conf — with the apex-greet config.
#
# WHY sway, NOT cage (M0 spike A): cage 0.2.0 does NOT expose wlr-layer-shell
# to quickshell 0.3.0 ("Failed to initialize layershell integration"), so
# apex-greet's PanelWindow never gets a surface — the greeter launches but
# never paints. sway implements wlr-layer-shell natively, so the layer
# surface is allowed and maps. See docs/m0-results.md "Spike A" and
# apex-greet/README.md "Compositor host". labwc is the documented fallback
# host (files/desktop/apex-greet/labwc-greet/).
#
# quickshell speaks to greetd over the UNIX socket greetd hands to its
# child via $GREETD_SOCK — this is what Quickshell.Services.Greetd uses.
# On a successful authentication apex-greet calls Greetd.launch(...),
# greetd tears the greeter (this sway process) down and starts the user's
# session on the same VT.

[terminal]
# Run the greeter on VT 1. Adjust if another unit owns tty1.
vt = 1

[default_session]
# sway hosts the greeter via a purpose-built, keybind-free config that
# launches quickshell as its only client and exits when quickshell quits.
#
# --unsupported-gpu is REQUIRED, not optional (apex-logs 46).
# sway 1.11's detect_proprietary() walks EVERY DRM backend, matches `nvidia-drm`,
# and calls exit(EXIT_FAILURE) unless this flag is passed. It fires even when
# sway would render on an Intel/AMD iGPU and the NVIDIA card is merely present —
# so on any hybrid-graphics machine the greeter dies before it paints and there
# is NO way to log in, on any display.
#
# This used to be described as insurance for the non-NVIDIA editions, which
# "carry the same latent bug the moment they meet an NVIDIA GPU". It is not
# latent any more: APEX ships ONE image and the NVIDIA driver is baked into it,
# so `nvidia-drm` is present on every machine and binds on every machine that
# has the hardware. The flag is load-bearing on all of them, and it stays in the
# shared greeter config because it is a no-op where the driver never binds.
#
# `labwc` (installed, see the fallback note below) has no such gate.
# apex-greet-session is a WRAPPER, not a different host. It gives the greet
# session a D-Bus session bus and an accessibility bus and then EXECS the
# compositor, so the PID greetd holds — and terminates on a successful login —
# is still sway's own. Without it the greeter's accessibility markup reaches
# nobody: Qt's AT-SPI bridge resolves org.a11y.Bus on the session bus like every
# other desktop application, and this session had no session bus at all, so a
# screen reader received zero nodes from a login screen that is fully marked up.
#
# It is written so that every step it takes is optional. A missing dbus-daemon,
# a missing at-spi-bus-launcher, an unmakeable runtime directory — each is
# survived and the compositor still starts. The only unconditional line in it is
# the exec. tests/test-apex-greet-session-bus.sh takes each piece away in turn
# and requires the greeter's own client to run regardless.
command = "/usr/libexec/apex-greet-session sway --unsupported-gpu -c /usr/share/apex-greet/sway-greet.conf"
#
# ABANDONED host (M0 spike A) — cage 0.2.0 does not serve quickshell's
# layer-shell, so the greeter never paints under it. Kept ONLY as a labelled
# record of what was tried; do NOT re-enable without confirming a cage build
# that exposes wlr-layer-shell to quickshell:
#   command = "cage -ds -- qs -p /usr/share/apex-greet/shell.qml"
#
# FALLBACK host — labwc (also native wlr-layer-shell). Swap the command above
# for this line if sway misbehaves on some hardware (see labwc-greet/README.md).
# Note the wrapper is on this line too: a machine that took the fallback would
# otherwise have a login screen no screen reader can hear, and nothing to say so.
#   command = "/usr/libexec/apex-greet-session labwc -C /usr/share/apex-greet/labwc-greet"
#
# Fedora's greetd package provisions a `greetd` system user (sysusers.d);
# there is no `greeter` user. logind grants this user the seat/DRM access
# the greeter needs for the duration of the greet session.
user = "greetd"
