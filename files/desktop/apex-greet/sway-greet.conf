# APEX-OS greeter — sway host config for apex-greet.
#
# M0 spike A found that cage 0.2.0 does NOT expose wlr-layer-shell to quickshell
# 0.3.0, so the greeter's PanelWindow never gets a surface and nothing paints.
# sway 1.11 implements layer-shell v4, so it is the greeter's compositor host.
# This config runs quickshell as sway's ONLY client, kiosk-style.
#
# NOT YET RENDER-VERIFIED. Headless QEMU (this repo's local env) and GitHub CI
# runners have no GL, so live pixel rendering of the greeter must still be
# confirmed on real hardware or a GPU/virgl-capable runner (M1 open item).

# No decorations, no gaps — the greeter owns the whole output.
default_border none
default_floating_border none
titlebar_padding 1
gaps inner 0
gaps outer 0

# Solid black backdrop behind the greeter's own blurred wallpaper.
output * bg #000000 solid_color

# XWayland is not needed by the greeter; disabling it trims attack surface and
# startup cost. (Re-enable if a session picker target needs Xwayland at greet.)
xwayland disable

# Hide the pointer until moved.
seat * hide_cursor 8000

# Launch the greeter. When quickshell exits — either because Greetd.launch()
# handed off to the user session (greetd then tears this compositor down
# anyway) or because the greeter was cancelled — exit sway so greetd sees the
# session end and returns to a clean state.
exec "qs -p /usr/share/apex-greet/shell.qml; swaymsg exit"
