# APEX-OS greeter — sway host config (/usr/share/apex-greet/sway-greet.conf)
#
# Purpose-built to host the apex-greet quickshell greeter and NOTHING else.
# greetd launches this as `sway -c /usr/share/apex-greet/sway-greet.conf`
# (user `greetd`, see greetd-config.toml).
#
# Why sway, not cage:  M0 spike A proved cage 0.2.0 does NOT expose
# wlr-layer-shell to quickshell 0.3.0 ("Failed to initialize layershell
# integration"), so apex-greet's PanelWindow (Overlay layer, exclusive
# keyboard) never gets a surface and the greeter launches but never paints.
# sway implements wlr-layer-shell natively (that is the whole point of this
# swap), so the layer surface is allowed and maps.  See docs/m0-results.md
# "Spike A".
#
# This is a STANDALONE config: it does NOT `include /etc/sway/config.d/*`,
# so none of sway's default keybindings, bars, or app launchers exist here.
# The greeter is keyboard-only and its own client owns all input; the host
# is deliberately bare.

### The one and only client ###################################################
# Launch quickshell as sway's sole client, then tear sway down the moment it
# quits.  Two exit paths:
#   1. Success: apex-greet calls Greetd.launch(argv); greetd terminates the
#      greeter (this whole sway process) and starts the user session.
#   2. Cancel / crash: quickshell exits on its own; the trailing
#      `swaymsg exit` brings sway down so greetd never sees a blank host.
# (Mirrors the abandoned `cage -ds -- qs …` behaviour, where cage exited
#  with its child.)
exec "qs -p /usr/share/apex-greet/shell.qml; swaymsg exit"

### Output ####################################################################
# Resolution / mode / scale are left to sway's autodetection — do NOT
# hardcode; real panels vary.  Only paint an opaque black root as a fallback
# for the instant before the greeter's own (opaque black) PanelWindow maps,
# so there is never a bright flash or wallpaper-less desktop.
output * bg #000000 solid_color

### Input #####################################################################
# Sane US keyboard.  Adjust xkb_layout per locale at image-build time if
# needed; kept minimal here.
input type:keyboard {
    xkb_layout us
}
# Touchpad: tap-to-click OFF.  The greeter is keyboard-driven; a stray tap
# must not fire a click.  (Pointer motion still works for the session picker
# arrows, but no tap events.)
input type:touchpad {
    tap disabled
    natural_scroll disabled
}

### Chrome / decorations ######################################################
# No titlebars, no borders, on anything.  The greeter is a layer-shell
# surface (no server-side decoration regardless), but these keep any stray
# xdg-toplevel borderless too.
default_border none
default_floating_border none
hide_edge_borders both
for_window [app_id=".*"] border none

### Cursor ####################################################################
# Hide the pointer when idle (8 s) and while typing — a greeter should not
# show a floating cursor sitting on the auth pill.
seat * hide_cursor 8000
seat * hide_cursor when-typing enable

### Hardening #################################################################
# No X11 clients in the greeter; skip Xwayland entirely (faster start, smaller
# surface).  quickshell 0.3.0 is a pure Wayland client.
xwayland disable
# Pointer should not steal focus from the exclusive-keyboard layer surface.
focus_follows_mouse no

# NOTE (no-GPU last resort): on a machine with no working GL, sway can be run
# with WLR_RENDERER=pixman (software).  That is set in the ENVIRONMENT, not
# here — see apex-greet/README.md "No-GPU render fallback".  It is UNTESTED
# for this greeter and a real-HW / GL-runner verify item.
