[package]
name = "apex"
description = "APEX-OS control CLI: power tiers, battery, profile, fingerprint, update/rollback/pin, doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "apex"
path = "src/main.rs"

[dependencies]
apex-secret-core = { path = "../apex-secret-core" }
apexd-core = { path = "../apexd-core" }
apex-agent-core = { path = "../apex-agent-core" }
apex-remote-core = { path = "../apex-remote-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# `apex channel` reads ~/.config/apex/channel.toml, which is where every other
# user-facing APEX config lives. Already in the build graph through apexd-core,
# so the direct edge costs nothing but says what this crate actually uses.
toml.workspace = true
libc.workspace = true
zbus.workspace = true
zvariant.workspace = true
tokio.workspace = true
clap.workspace = true
