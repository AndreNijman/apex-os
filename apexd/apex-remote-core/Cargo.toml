[package]
name = "apex-remote-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
apex-agent-core = { path = "../apex-agent-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
snow = "0.9.6"
data-encoding = "2.11.1"
rand = "0.9.5"
# RFC 6455 names SHA-1 for the WebSocket accept value. It is a protocol
# constant there, not a security primitive, and the crate is already in the
# lock through snow, so this edge costs nothing new to build or to audit.
sha1 = "0.10.7"
sha2 = "0.10.9"
