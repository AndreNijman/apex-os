# APEX-OS system profile: intel-hybrid
#
# CPU-class profile for Intel hybrid (P-core / E-core) parts driven by
# intel_pstate in active/HWP mode. Selected when the CPU vendor is Intel and a
# P/E hybrid topology is detected, unless a device profile (e.g.
# msi-katana-gf76) overrides it.
#
# intel_pstate active mode exposes the same governor names (performance,
# powersave) and the same EPP strings as amd-pstate-epp, so the three-knob
# table is identical in shape. Note that intel_pstate refuses an EPP write
# while the `performance` governor is selected; the writer treats that refusal
# as a skip rather than a failure, so the tier still applies.
#
# Every Intel hybrid part gets P-core pinning and IRQ steering for free — both
# are derived at runtime from the topology ladder in `topology.rs`, so no
# per-machine CPU numbers appear here, and a BIOS with E-cores disabled simply
# degrades to "all CPUs". GPU clock locking is deliberately NOT enabled at the
# class level (persistence only): a class profile cannot know what dGPU, if
# any, is fitted, and locking clocks is a device-specific decision. See
# msi-katana-gf76.toml for the device-level version.

id = "intel-hybrid"
kind = "class"
description = "Intel hybrid P/E (intel_pstate HWP)"

[defaults]
ac = "performance"
battery = "balanced"

[tiers.performance]
governor = "performance"
epp = "performance"
platform_profile = "performance"

[tiers.balanced]
governor = "powersave"
epp = "balance_power"
platform_profile = "balanced"

[tiers.power-saver]
governor = "powersave"
epp = "power"
platform_profile = "low-power"

[gamemode]
enabled = true
tier = "performance"
cpuset = "p-cores"
irq = "away-from-game"
irq_pin_to_game = ["nvidia", "amdgpu"]

[gamemode.nvidia]
enabled = true
persistence = true
# No graphics_clock / memory_clock: nothing is locked at the class level.
