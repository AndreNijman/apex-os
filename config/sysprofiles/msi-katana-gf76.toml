# APEX-OS system profile: msi-katana-gf76
#
# Device profile for the MSI Katana GF76 (Intel i7-12700H P/E hybrid + NVIDIA
# RTX 3070 Laptop, Iris Xe iGPU). Matched on DMI product_name/family containing
# "Katana". Supersedes the intel-hybrid class profile on this machine.
#
# This is an always-on-AC gaming laptop, so the AC default is the top tier.
# NVIDIA clock locks, P/E cpuset pinning and IRQ affinity are M6 (game
# orchestration) concerns and are intentionally NOT here yet. platform_profile
# is omitted because MSI's EC (msi-ec) does not reliably export the ACPI
# platform_profile interface; the real SysWriter would skip it anyway.
# Charge thresholds use the msi-ec 60/80 longevity window.

id = "msi-katana-gf76"
kind = "device"
description = "MSI Katana GF76 (Intel i7-12700H, RTX 3070 Laptop)"

[defaults]
ac = "ultra"
battery = "performance"

[tiers.ultra-max]
governor = "performance"
epp = "performance"

[tiers.ultra]
governor = "performance"
epp = "performance"

[tiers.performance]
governor = "performance"
epp = "balance_performance"

[tiers.balanced]
governor = "powersave"
epp = "balance_power"

[tiers.power-saver]
governor = "powersave"
epp = "power"

[charge]
start = 60
stop = 80
start_path = "/sys/class/power_supply/BAT1/charge_control_start_threshold"
end_path = "/sys/class/power_supply/BAT1/charge_control_end_threshold"
