# Versions resolved from each project's own published metadata on 2026-09-12,
# not from memory. `./gradlew dependencies` is the check that they still hold.
[versions]
kotlin = "2.4.20"
agp = "9.4.0"
# The lightweight API only: `org.bouncycastle.crypto.*`, never a JCA provider.
# Android ships a stripped BouncyCastle under the `BC` name and Conscrypt owns
# the JCA slots the stripped one used to hold, so `Cipher.getInstance` on a
# phone reaches an implementation nobody here chose. The lightweight classes
# are plain objects with no provider registration and behave identically on a
# JVM and on a device.
bouncycastle = "1.83"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
junit = "5.14.0"

# AndroidX, each resolved from its own maven-metadata.xml on 2026-09-12.
# `biometric` is 1.1.0 because that is still the newest stable release; the
# 1.2.0 line has been in alpha for years and an alpha is not what gates a
# device key.
androidxCore = "1.18.0"
activityCompose = "1.12.4"
composeBom = "2026.06.01"
lifecycle = "2.10.0"
biometric = "1.1.0"

# `fragment` is pinned even though nothing in this app imports it, and the
# reason is a DEFECT the first release build ever attempted found.
#
# `androidx.biometric:1.1.0` drags in `fragment:1.1.0`, which resolves up to
# 1.2.5 and no further, because nothing else in the graph asks for more.
# `MainActivity` is a `FragmentActivity` and uses `registerForActivityResult`,
# and FragmentActivity did not call `super.onRequestPermissionsResult()` or use
# valid request codes until **1.3.0**. So the permission result for
# `POST_NOTIFICATIONS` — and every other activity result this app takes — was
# landing on a FragmentActivity that mishandles it.
#
# `assembleDebug` never said so. `lintVitalRelease` runs only on a release
# build, this project had never produced one, and the check is
# `InvalidFragmentVersionForActivityResult`. Pinned here so the floor is stated
# rather than inherited from whatever a transitive dependency happens to want.
fragment = "1.8.9"
camera = "1.5.3"
navigationCompose = "2.9.8"
# The QR decoder. `core` only: the `android-*` helper artifacts drag in an
# Activity and a layout, and this app owns its own camera surface.
zxing = "3.5.4"

[libraries]
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.14.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# The icons this app uses are the handful Material ships in `core`; the
# `extended` artifact is several thousand vectors and a measurable slice of an
# APK for the sake of not drawing three shapes.
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# `collectAsStateWithLifecycle`, which is the only correct way to read a flow in
# a composable: `collectAsState` keeps collecting while the app is in the
# background, and this app's flows are backed by a socket.
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
