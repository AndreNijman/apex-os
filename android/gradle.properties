# 512 MiB is Gradle 9's default and it is not enough to dex an Android app with
# Compose in it: the daemon spent the whole build in the garbage collector and
# then expired. Measured on this machine, not copied from a template.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# AndroidX rather than the 2018 support library. Required by every dependency
# this app has.
android.useAndroidX=true

org.gradle.parallel=true
org.gradle.caching=true
