    parent is world-writable (every other root is under $HOME or /run/user/<uid>; the disposable-capsule root is
    under XDG state on purpose; the sandbox gives a session its own tmpfs /tmp), and no third copy of the
    create_dir_all-then-chmod pattern exists. apex-agentd and apex-remoted are both per-user systemd USER
