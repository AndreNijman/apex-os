    targets' prints no refusal it does not mean. SSH (c914d569, 7acd3e77): target/ssh.rs with the argument list as
    the security property, public and pinned by a test - -F /dev/null, IdentityAgent=none, IdentitiesOnly=yes,
    BatchMode=yes, StrictHostKeyChecking=yes, env_clear on the child - so Andre's ~/.ssh and his agent are
    unreachable by construction and one test asserts no argument anywhere contains '.ssh/'. The remote side is a
    short sh script per operation rather than cat, because 'cat missing' and 'cat unreadable' exit the same: exit
    10 absent, 11 denied, 12 no root, and ssh's own 255 is never produced by the script.
    tests/test-apex-backup-ssh.sh drives init/run/list/verify --deep/restore plus a diff -r against a REAL
    unprivileged sshd on a kernel-chosen port with fixture keys, 32 passed / 0 failed; mutating
    StrictHostKeyChecking to no turns the host-key refusal red (30/1). S3 (5054be77, 755bee24): providers/s3 with
    a SigV4 signer whose FIVE TEST VECTORS WERE ALL GENERATED BY botocore 1.43.71's S3SigV4Auth with a pinned
    timestamp, not written from memory - the first generation used botocore's GENERIC SigV4Auth, which re-encodes
    the path, and disagreed on a percent-encoded key, which is exactly the detail a signer written from the
    general description gets wrong. The secret access key is spent inside the daemon in a curl config on the
    child's stdin, never on an argument list. A TRUNCATED LISTING IS AN ERROR AND NEVER A SHORT LIST: continuation
    tokens to 20 pages then a refusal naming how many keys it is withholding. target/r2.rs becomes
    target/bucket.rs - R2 and S3 differ in exactly three strings - so one BucketTarget serves both rather than two
    modules that agree until one is fixed. tests/test-apex-backup-s3.sh runs a REAL apex-secretd against
    tests/s3-double.py, which recomputes the signature from what arrives using only Python hmac/hashlib and 403s a
    mismatch: 27 passed / 0 failed, including a request signed with a DIFFERENT secret refused by the double's own
    arithmetic. A DEFECT THE SUITE FOUND: about one run in three 'apex backup restore latest' restored the FIRST
    of two snapshots taken inside one second, because the stamp was second-accurate and the tail was eight random
    hex digits, so order inside a second was the order of two random numbers - and lexical order is the whole
    reason the id is shaped as it is. The first three hex digits are the millisecond now; shape unchanged, parse
    untouched, old ids still sort. CRITERIA 2 AND 3 unchanged from round 1:
    no_byte_written_to_the_target_holds_the_plaintext plus a canary sweep over EVERY byte including object names,
    repeated over the ssh and s3 transports; three_versions_of_a_tree_restore_to_the_three_things_they_were.
    Branch-tip counts: workspace 3132 passed / 0 failed, clippy clean, shellcheck clean on all three backup
    suites, test-apex-backup.sh 63/0, -ssh 32/0, -s3 27/0. STILL OPEN AND NOT A CRITERION: key escrow does not
    exist; mtime is recorded and never applied; a local or NAS restore leaves no audit line; on a bucket target an
    interrupted write reads as CouldNotRun rather than 'interrupted'; and check_declared is called in run and not
    in init, which is a UX gap and not a security one because the refusal that matters holds.
