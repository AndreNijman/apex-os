- id: BASE-009
  title: Preserve Gaming Mode and Performance Lab
  priority: P0
  status: partial
  area: foundation
  depends_on: []
  acceptance:
  - Controller-first gaming path works where supported
  - Desktop/Gaming transitions work
  - Performance metrics remain accurate
  gates:
  - tests
  - stop_slop
  evidence: >-
    Preserve Gaming Mode and Performance Lab. THREE REACHABLE STRANDS CLOSED AND LANDED 2026-09-12 (apex-os merge
    59245497, apex-shell merge cd324ec), and both of the fixes are product defects rather than test gaps. (1) The
    gamingmode argv is now pinned, taking the backends suite 42 -> 47/0. (2) THE GREETER LOCKOUT: a remembered
    session that no longer exists made the picker fall back to SORT ORDER, so a machine whose last session was
    gone could land on a different desktop than the user chose - fixed at 541c9505, greet-sessions 34 -> 41/0, and
    restoring the return prints the lockout verbatim: 'want [hyprland] got [apex-labwc]'. (3) THE POWERMENU GATE:
    Gaming Mode was offered without honouring the same TryExec gate the greeter honours, so it appeared on
    machines with no gamescope at all - fixed at c035671, 12/0. Perf metric accuracy was already proven live (vram
    matched nvidia-smi; frame time honestly unmeasurable). RE-VERIFIED ON THE CURRENT TIP (round 13, 2026-09-12,
    apex-os 4ae4cf22 / apex-shell bdfb056): test-apex-greet-sessions.sh 41 passed 0 failed 0 skipped locally AND
    on the GitHub runner (run 34635660418, job 'Package engine'); check-compositor-backends.sh 47/0;
    check-gaming-mode-gate.sh 12/0. No drift. MISSING, NAMED RATHER THAN FAKED, and it is hardware and not effort:
    the live Desktop->Gaming switch and the controller-first path. apex-session-select --switch IS loginctl
    terminate-user, so exercising it ends the session running the test, and this laptop has neither gamescope nor
    steam installed (re-checked this round: both ABSENT on the L16; steam exists only as a Flatpak, which
    apex-gaming-session's `command -v steam` does not satisfy). Installing them here would still not help, because
    the switch itself cannot be run on the machine hosting the agent. TO UNBLOCK: a machine with gamescope and
    steam installed, idle, with no session that matters, where `loginctl terminate-user` may be run - and a human
    present to see the switch land, since the test necessarily kills its own session. katana is that machine and
    is off-limits by Andre's instruction of 2026-09-11.
- id: BASE-010
  title: Preserve local AI service abstraction
  priority: P0
  status: partial
  area: foundation
  depends_on: []
  acceptance:
  - Local model service can route supported runtimes
  - Model storage/VRAM lifecycle works
  - Applications are not tied to one backend
  gates:
  - tests
  - stop_slop
  evidence: >-
    Preserve local AI service abstraction. THREE DEFECTS FIXED AND LANDED 2026-09-12 (apex-os merge 59245497), and
    the second is the interesting one. (1) layers.max(1) at 8a6cdab7: 0 means UNKNOWN, so the old code silently
    turned 'I could not tell how many layers' into 'one layer' - the permission-denied-is-not-absence class again,
    in its sixteenth location. (2) THREE VACUOUS RESOLVER TESTS MADE REAL by having locate() honour Roots - it was
    the one function that ignored the fixture prefix while deciding which binary actually gets EXECUTED, so three
    tests had been asserting against the developer's real machine rather than the fixture. Restoring
    locate(runtime_kind) reddens exactly those three, which IS the proof that the two pre-existing ones now assert
    something. (3) A third defect found inside that fix: 'fit: 999 layer(s)' printed the all-layers sentinel as a
    layer count - the same lie in the other direction - fixed at 532d5b8e. RTX 3070 detection, the accel list, the
    VRAM budget, the per-user socket and the TCP refusal were already proven live at 44/0. RE-VERIFIED ON THE
    CURRENT TIP (round 13, 2026-09-12, apex-os 4ae4cf22): cargo test --locked --workspace 3032 passed, 0 failed,
    across the whole workspace - up from 2346 as other units landed, and with zero failures, including the grants
    test that had been flaky at round 12. MISSING and named rather than simulated: placement onto a live GPU, and
    idle-unload actually releasing VRAM. THE UNBLOCK CONDITION IS NOW EXACT rather than 'needs a model'. It is not
    enough to install llama-cpp and pull a model here: this laptop is an AMD APU and apexd reads it as 'device 0
    card1 - 1024 MiB total, 806 used, 0 spendable', so pick_device() filters it out (it requires budget_mib() >
    VRAM_OVERHEAD_MIB, which is 256) and select_backend() falls through to Backend::Cpu BY DESIGN. ai.rs:240-260
    already records this as a stated limitation: on an APU, VRAM is system RAM, mem_info_vram_total reports only
    the BIOS carveout, and GTT is not portably accountable - so the planner underestimates in the safe direction.
    A CPU placement would prove the supervisor's bookkeeping, not the claim 'the model was placed on the GPU and
    unloading released its VRAM', so it was not built and no install was attempted. TO UNBLOCK: a machine whose
    apexd reports a device with non-zero spendable VRAM - in practice a DISCRETE card, not an APU - with
    llama-server installed and a model in the store. katana's RTX 3070 is such a machine and is off-limits.
