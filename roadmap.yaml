- id: P1-037
  title: Agent disposable capsule integration
  priority: P1
  status: done
  area: capsules
  depends_on: []
  acceptance:
  - Agent task can run in disposable capsule and discard state
  gates:
  - tests
  - stop_slop
  evidence: >-
    Disposable capsules for agent sessions. LANDED on apex-os roadmap/v2.2 2026-09-11 as merge c3e29af2 (branch
    tip feb336e). tests/test-agent-disposable.sh 46 -> 58 passed / 0 failed, re-verified 58/0 by the orchestrator
    ON THE LANDED TIP, not taken from the branch. The twelve new assertions are the daemon-death section, six per
    death, and each case runs on its own daemon, runtime dir, disposable root and capsule log - because sharing
    the suite's log lets an earlier session's rm line satisfy a later grep, so the assertion passes without
    testing anything. Mutation 9 (the engine ignores SIGHUP) KILLED at 50/8, four named assertions red per death,
    engine restored byte-identical and verified with git diff --quiet. ISOLATION IS STATED HONESTLY, not implied:
    a capsule shares the real HOME and gets /run/host read-write as the user, so isolation here means the
    read-only OS layer and not a security sandbox. THE MEASUREMENT THAT MATTERS, and it corrects two earlier
    written claims: BOTH daemon deaths tear the capsule down by the SAME route - the kernel's SIGHUP to the
    orphaned PTY's foreground group when the dead daemon's master fd closes - and apex-agentd's own SIGTERM
    shutdown DOES NOT RUN AT ALL. The inherited diagnosis (that threads do not inherit the signal mask) was wrong
    and so was its first correction: apex-agentd-sig's SigBlk=0 is a DISPLAY ARTIFACT of sitting in
    rt_sigtimedwait, which parks the waited-for bits out of blocked while it sleeps. Proved with a three-thread
    probe: before-mask sleeping 0, after-mask sleeping 0x4003, after-mask in sigwait 0. Exactly one thread is
    genuinely unmasked, apex-agentd-gra, spawned at main.rs:164 before the mask is applied at 169, and the whole
    fix is that one-line re-order - measured: grants inherits 0x4003, exit status 0 instead of 143, the log prints
    'signal 15, stopping sessions', and the socket is removed. NOT THIS ITEM'S TO FIX and carried forward: that
    re-order, the stale control socket left on disk because remove_file never runs, and the fact that the mutation
    promised as the guard on the fix does not guard it - measured still surviving 58/0 on a fixed build, because
    shutdown() is followed by process::exit and the kernel's SIGHUP arrives regardless.
