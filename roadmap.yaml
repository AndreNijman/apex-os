    unplug-test.sh uses headless sway's create_output and `output <name> unplug`, 17 assertions, and found two
    defects. First: the guard wrote `state reverted` whether or not the restore had worked, so an engine that
    failed during the countdown left the machine on an unconfirmed layout with a record saying it had been put
    back, and reconcile at the next start believed it. It records revert-failed now, retries, and the Display page
    says the screen was never confirmed. Second: a rollback naming an output unplugged during the countdown made
    wlr-randr reject the whole invocation, so EVERY other output kept the unconfirmed layout; restore now prunes
    the rollback against a fresh enumeration first. Criterion 5 is a whole-enumeration comparison across four
    fields and two outputs, not one scale value. The watchdog is apex-display-guard.sh, spawned by _begin() BEFORE
    the engine is called, so a dialog that fails to construct cannot affect it. Still open, and not fixable from
