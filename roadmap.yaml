- id: P1-007
  title: Cloudflare DNS capability set
  priority: P1
  status: partial
  area: cloudflare
  depends_on:
  - P1-002
  acceptance:
  - read/create/update/delete separated
  - Bound zone/record constraints supported
  - Registrar/nameserver/DNSSEC-root changes require elevated class
  gates:
