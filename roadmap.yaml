    workspace 2380/0, clippy PASS. TWO ROWS DISAGREE BETWEEN CI AND THE LIVE HALF, which is the argument for
    having both: B12 is caught ONLY by the live half, so CI does not protect that behaviour, and B11 is its mirror
    - red in CI, green live - because its code path exists only for a login-session daemon. 635b683 is a real
    defect the battery exposed: a daemon running inside a login session was refused its own user manager.
