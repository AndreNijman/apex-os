  - stop_slop
  evidence: >-
    Landed on roadmap/v2.2 (583698b). The six dimensions of ROADMAP.md section 3.1 were three, with nothing at all
    for the agent's own permission mode, root, secrets or origin. policy.rs now holds NativeMode, SystemAccess,
    SecretPolicy, NetworkPolicy and OriginPolicy beside SandboxPolicy, with six independent defaults and flags,
    and the section 4 modes expressed as presets over them rather than as a closed enum, so a preset is a starting
    point that flags apply on top of. --unshare-net follows the network dimension, with strict forcing offline as
    a floor, which is where P0-008 puts allowlist and brokered. Every managed session now runs with
    PR_SET_NO_NEW_PRIVS, including the unconfined ones, so unrestricted-user-does-not-imply-root is a kernel fact
    rather than a field comparison, and sudo comes up unprivileged inside a session. --secrets none is enforced in
    the broker from the policy recorded at fork time. The three invariants are tests over whole value sets in
    tests/policy_invariants.rs, not sentences in a doc.
