- id: P2-009
  title: Disposable VM agent execution
  priority: P2
  status: partial
  area: virtualization
  depends_on:
  - P2-008
  acceptance:
  - Agent task can run in disposable VM with explicit file egress
  gates:
  - tests
  - stop_slop
  evidence: >-
    LANDED on apex-os roadmap/v2.2 2026-09-12 as merge 14650ca3. apex vm run verified live by
    tests/vmlab/run-vmlab's egress flow on the L16, 16 observations, 0 failed. The security half is what is
    proven, hostilely: the task writes report.json AND an unnominated leak.txt, the guest's own task log
    (nominated, so it comes out through the boundary under test) shows leak.txt really was created inside the VM,
    and it does not arrive on the host - a refusal rather than an absence. The falsifying control is inside the
    flow: the engine is copied, its egress loop turned around to iterate the CONTENTS of the volume instead of the
    nominations - the exact defect the shipped loop's comment says it exists not to have - the same task is
    re-run, and the unnominated file DOES then leak. Two more properties proven from inside the guest rather than
    from the XML the lab itself wrote: the copy-in volume refuses the guest's write (so a task cannot rewrite its
    own task.sh), and the guest sees only lo. That last one is only meaningful because virtio_net is in the lab
    guest's initramfs AND the create flow asserts the same guest sees eth0 on a --network user VM - without that
    control, lo-only would have passed on a domain that had an interface, which is how the first lab guest
    behaved. Default-deny confirmed both ways: without --egress-to nothing leaves however much is nominated, and
    no destination is invented. Nothing survives teardown: no domain, no directory, no volumes. One defect found
    and fixed: teardown deleted the VM directory including the serial log, so the documented outcome for a guest
    that never mounted APEXIN - an empty egress and a timeout warning - came with no way to find out why;
    --console-to FILE saves it, opt-in and validated like --egress-to, and it had to be added to
    apexd/apex/src/vm.rs as well because that clap surface enumerates its flags and would have refused a flag the
    engine and the docs both had. PARTIAL rather than done because no guest image carrying an agent CLI exists:
    what is verified is the BOUNDARY - the read-only copy-in volume, nomination-only egress, no network, and
    teardown - with an arbitrary command as the task. docs/virtualization.md states that building a guest that
    carries claude or codex is separate work. Branch task/p2-virt-2.
