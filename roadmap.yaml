- id: P0-001
  title: Qualify current integrated image on real hardware
  priority: P0
  status: partial
  area: qualification
  depends_on: []
  acceptance:
  - Daily and Gaming images build cleanly
  - Fresh install and upgrade succeed
  - Rollback succeeds
  - Hyprland/niri/Floating boot and basic workflows pass
  - NVIDIA/AMD/Intel baseline tested
  - Suspend/resume, Wi-Fi, Bluetooth, audio, multi-monitor, portals, Steam and recovery tested
  notes: Do not add large new architecture until the currently merged image is proven.
  gates:
  - tests
  - stop_slop
  evidence: >-
    Probed on both machines 2026-09-06, evidence in ROADMAP/evidence/P0-001-hardware-qualification.md. Both boot
    digest sha256:308127d9 from different tags with the same ostree checksum, which is direct evidence the one-
    image collapse and tag promotion work on real hardware; zero failed units on either; all three GPU vendors
    clean at driver level, with the Optimus pair live on katana; WiFi, Bluetooth, audio and portals all working;
    Steam and gamescope correctly absent, since the one-image design installs them on demand. Outstanding and
    honestly so: fresh install needs a wipe and cannot be attempted; multi-monitor needs physical displays; per-
    compositor workflow passes are unrecorded. The rollback reboot remains unverified for two reasons, katana has
    been in use for gaming whenever it was free, and its rollback slot currently holds the same digest as the
    booted one because the hotfix unlock created a second deployment of the same commit, so a reboot into it would
    prove very little. Two findings stand: Secure Boot is disabled on katana against the stated end-state of both
    machines enforcing, and suspend has never run there against 40 resumes on the L16.
- id: P0-002
  title: Introduce protected apex-secretd service
  priority: P0
  status: partial
  area: secrets
  depends_on: []
  acceptance:
  - Secrets are no longer stored in agent-readable home paths
  - Normal API cannot return raw secret values
  - Broker can execute credential-backed operations
  - Audit entries exist for secret use
  - Service is separate from apex-agentd and broad apexd responsibilities
  gates:
  - tests
  - stop_slop
  evidence: >-
    Landed on roadmap/v2.2. Two new crates, apex-secret-core and apex-secretd; apex-agent-core/src/secret.rs
    deleted rather than emptied. Store is /var/lib/apex-secretd/users/<uid>/ at 0700 root-owned with the value in
    its own 0600 file and metadata separate; grants and the audit trail moved behind the same boundary, where both
    had been user-writable, so a session could previously grant itself a capability and then rewrite its own
    audit. Criterion 2 is a type-system property rather than a policy: SecretValue implements neither Serialize
    nor Deserialize while Response derives Serialize, so a reply carrying a credential does not compile, and three
    tests hold it as the API grows including one pinning the response variant list. Criterion 3 is proved end to
    end against a real git smart-HTTP server on loopback that 401s without auth, asserting the server received the
    credential while no reply, output or audit line contained it. The daemon runs as root and drops privileges per
    child with setgroups, setgid and setuid in pre_exec plus a getuid verification, because the store must be
    unreadable by the user's uid while git must run as the user. Peer identity is SO_PEERCRED uid, with the pid
    pinned as a /proc dirfd at accept so pid reuse fails closed. Partial because the daemon has never actually run
    as root in testing, so the at-rest half of criterion 1 is argued from the unit file rather than measured. The
    second reason is closed: P0-003's apex secret migrate reads the old broker's plaintext files, carries their
    per-project grants, verifies by use and removes them, with a keyring-backed record named rather than deleted
    because it holds no value to carry.
