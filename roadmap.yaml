  evidence: >-
    APEX Remote pairing and device management. CRITERIA 1, 3 AND 5 DONE, landed on apex-shell roadmap/v2.2
    2026-09-12 as merge a36f1a4 (cc0115e): the QR pairing page and the paired-device page. THE QR ENCODER FOUND
    ITS OWN ORACLE TO BE WRONG, and the safeguards are the reason that claim is trustworthy. A 526-line encoder
    and 36 segno fixtures existed with NO TEST. Written, the test failed 21 of 36: alignmentPositions used
    Math.ceil where the specification truncates, so EVERY VERSION FROM 7 UP - including both pairing offers - laid
    its alignment patterns in the wrong columns. Four cases still failed after that fix and segno was the one at
    fault: its write_padding_bits quotes ISO/IEC 18004 section 7.4.10 in a comment ('if the bit stream does not
    end at a codeword boundary') while the code has no such condition, so it appends a spurious 0x00 where the
    0xec/0x11 pad codewords belong. Rather than reproduce a bug to make a test pass, the generator applies a one-
    line correction, and three things stop that being 'fix the oracle to match me': it builds every case TWICE and
    DERIVES the corrected list by diffing; the test pins that list at exactly four, so a spreading correction OR
    an upstream fix turns it red; and section 7.4.10 is asserted directly off the codewords, so those assertions
    survive deleting every fixture. The other 32 fill their symbol to capacity and provably cannot be reached -
    asserted, not stated. A SECOND DEFECT THE SUITES CAUGHT THAT READING DID NOT: the pairing page asked for a
    code from onOnScreenChanged while the ServiceRef beside it raises refCount from a binding on the same
    property, and QML orders neither - the handler won, requestCode saw an inactive service, and THE PAGE SHOWED
    NO CODE AT ALL. Fixed on both paths. 202 new assertions with EXACT green counts rather than floors, which
    caught two of the agent's own counts being wrong; 12 mutants all red with a green control. The page draws
    NOTHING when it has no offer, and that phase's central assertion is negative, because a placeholder QR looks
    fine in a screenshot and is exactly the failure the feature exists to prevent. STAYS PARTIAL, AND MUST NOT BE
    CLOSED FROM HERE: --origin-policy remote stays refused until the device key lives in Android Keystore with
    setUserAuthenticationRequired, plus a per-approval challenge and attestation. That is p1-053a's work, and
    p0-014's CTAP2 verifier is its desktop half.
