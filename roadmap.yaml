    edk2-ovmf-20250812-18.fc43's 4M secboot build gives 17 passed / 0 failed, exit 0, FinishedAt 21:22:24 checked.
    The volume stays open across S3; a mapper created AFTER the resume reads the marker back, so the plaintext
