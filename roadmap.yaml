  evidence: >-
    Policy landed on task/p0-013-request-origin, not wired, and it cannot be until apex-shell changes. LockState
    has four answers with Unreadable treated as locked and NoDisplaySession as unlocked, since a headless box has
    no screen and answering locked there stops everything rather than protecting anything. LockPolicy::default is
    section 7 verbatim and decide is checked over 8 policies by 7 origins by 4 states. There is no reader because
    there is nothing to read: APEX Shell locks with ext-session-lock and never calls SetLockedHint, so logind
    reports LockedHint no on a session locked for an hour exactly as on one nobody has touched. A control-socket
    verb was considered and rejected, logind accepts the hint only from the session owner and the daemon cannot
    tell the shell from a managed session running as the same user. Dispatched as fix/locked-hint in apex-shell.
    Criterion 2 also has no subject yet, both SystemAccess::Session and Unsafe are refused today so no short-lived
    root grant exists to revoke, which is P0-006 and P0-007.
- id: P0-016
  title: Add Agent Settings page with password-gated Always Unrestricted toggle
  priority: P0
  status: done
  area: agent-settings
  depends_on:
  - P0-004
  - P0-005
  acceptance:
  - Config contains a clear Agent Settings page.
  - A single 'Always unrestricted agents' toggle controls the default APEX sandbox for newly started managed agents.
  - OFF restores the normal default APEX protection policy while preserving the agent's native permission mode such as
    Claude bypassPermissions.
  - Enabling ON requires a real local Polkit/PAM password or configured strong local authentication outside the agent
    PTY.
  - Disabling the toggle is immediate and does not require authentication.
  - The setting persists across reboot/login.
  - The UI states plainly that this removes the APEX user-level project sandbox but does not automatically grant root
    or raw brokered secrets.
  - Current running sessions display their actual mode; changing the default does not lie about already-running sessions.
  - A visible warning/status indicator appears while Always Unrestricted is enabled.
  gates:
  - tests
  - stop_slop
  evidence: >-
    Landed on roadmap/v2.2. A new Agent Settings page in Config with one Always Unrestricted toggle, persisted to
    ~/.config/apex/agent.json, which is the runtime's own file rather than the shell's, so the same default
    applies to 'a' from a terminal with no shell running; written atomically under umask 077 with JSON passed
    positionally so a value cannot become shell syntax. OFF moves only the sandbox dimension and leaves the native
    permission mode alone, and is immediate with no authentication. ON goes through a real polkit action. The
    load-bearing find: the polkit action file was not valid XML, because it quoted a pkcheck command line inside
    an XML comment and every flag starts with two hyphens, which an XML comment may not contain; polkitd silently
    never registers an action it cannot parse, so pkcheck exited 127 forever and the toggle could never have been
    enabled, with no other symptom. xmllint is red on the committed file and green on the fixed one. Running
    sessions read their own recorded mode rather than the current default, so changing the toggle cannot relabel
    an agent already running. The copy was also corrected against the code, an earlier draft warned that a warm
    sudo timestamp is reachable from an unconfined agent and it is not, because PR_SET_NO_NEW_PRIVS is set for
    every dimension except break-glass with a negative-control test. check-agent-settings.sh 65/0 with 13 mutants
    all caught. Outstanding, the granted authentication path needs a human to type a password once.
