    cards and a dispatch brief recorded as "all at the 0.85 factor, the 1366x768 bucket" are nothing of the kind:
    NAV_GEOMETRY_VERBOSE=1 names them as ONE page - Firewall - at all four page scales and both pane widths, 8
    points x 2 assertions. Every row on that page is behind a FirewallService condition, the service polls only
    while a ServiceRef is held, and the page's own ref is active:onScreen, which a Loader in a test never set. So
