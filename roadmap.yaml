- id: P1-014
  title: Cloudflare environment protection policies
  priority: P1
  status: done
  area: cloudflare-deploy
  depends_on:
  - P1-013
  acceptance:
  - Preview/staging can be unattended
  - Production approval is default
  - Owner may explicitly enable unattended production
  gates:
  - tests
  - stop_slop
  evidence: >-
    Cloudflare environment protection policies, landed from task/p1-014-cf-environments (a67eb704 the feature,
    4d987517 the race-test rewrite), merged to roadmap/v2.2 as 514d46a3. Recorded now rather than then because the
    agent that built it was killed by a session limit before it could run this script; the work was already on the
    tip. PREVIEW/STAGING CAN BE UNATTENDED: UNATTENDED_BY_DEFAULT, and it is the whole list — everything else is
    protected whatever it is called, so prod, live and production-eu get no free pass by being spelled
    differently. The environment comes from binding::Worker's own field, not from parsing a name. PRODUCTION
    APPROVAL IS DEFAULT: a one-shot owner approval, a new store table, a protocol verb and an Approved/Withdrawn
    pair of audit events distinct from Granted — a grant keeps standing, an approval is spent by the next matching
    operation and expires on its own, and a trail that spelled both 'granted' would make 'the owner allows this'
    and 'the owner allowed this once' the same sentence. Consumed inside use_capability AFTER the pin and the
    creates check and BEFORE the value is read: refusing for a host mismatch after spending the one approval they
    gave would make the owner give another. Spent on commit, not on success — refunding a failed perform would let
    an agent retry until something worked, and they approved one deployment rather than one successful deployment.
    Guarded by a mutex because apex-secretd serves one thread per connection and an approval is single-use. OWNER
    MAY EXPLICITLY ENABLE UNATTENDED PRODUCTION: unattended = true under [cloudflare.<env>], a compatible
    extension since unknown keys there were ignored. Gated operations are the ones that change what a protected
    worker SERVES — worker.deploy, worker.rollback, wrangler.deploy — and deliberately NOT worker.upload-version,
    because section 13.7 puts the upload before the approval point and gating it would force approval at step one
    of a five-step flow. approval_policy gains two distinct words: approval-required on the refusal, owner when
    one is spent. Bound gains approval: Approval, which closes half of the 'Bound carries no provider payload'
    framework gap generally rather than for Cloudflare. NOT DONE, with the reason: apex cf status does not print
    which environments are unattended by RULE, only the key as the file states it — the rule lives in the provider
    inside the daemon and the CLI cannot reach it, and a second copy of the list in the CLI crate would be two
    lists that drift. The fix, if wanted, is a daemon verb that answers 'what does this project bind', not a
    copied constant. 2821 -> 2848 passed, 0 failed. Eight mutations, each biting a named test; the list is in
    4d987517's message. Clippy --all-targets clean.
