- id: P1-001
  title: Create generic capability provider framework
  priority: P1
  status: done
  area: capabilities
  depends_on:
  - P0-002
  - P0-004
  acceptance:
  - Provider/operation/resource/project/session/origin/expiry/constraints modeled
  - Provider plugins can be added without changing agent core
  gates:
  - tests
  - stop_slop
  evidence: >-
    Landed on roadmap/v2.2 (a141cee). A provider supplies four things and no policy: which operations exist, what
    a resource name means, how a credential is presented, and how to mint a short-lived one. The framework fixes
    the rest in order, each step able to refuse: peer uid from SO_PEERCRED, the operation exists, its arguments
    are the declared ones, expiry, project, section 7 origin labels, the grant, the host pin, reading the value
    once, scrubbing, and the audit line. The load-bearing choice is that bind and perform are separate calls
    because the host pin sits between them; a provider that both resolved a name and acted on it would have to be
    trusted to check where it was sending the credential, and the framework cannot re-derive that, since knowing
    what my-bucket means is the provider's job. Split, the pin is an invariant for every provider written later,
    and bind runs after the grant check so an ungranted request never forks a child in a caller-controlled repo.
    Section 13.2's vocabulary is generic: OperationId parses provider.class.verb and the first segment routes, so
    there is no operation-to-provider table, and a test runs the whole 32-name list through the parser asserting
    each routes to cloudflare without any Cloudflare stub existing. An undeclared parameter is refused rather than
    ignored. Two providers exercise it, git shipped and proven end to end against a loopback smart-HTTP server
    that refuses without an Authorization header, and a test-only bearer-token HTTP provider that proves what git
    cannot, that mint works, that the framework scrubs a minted credential too, and that the pin applies to a
    provider that did nothing to earn it. 1477 tests, clippy clean. P1-002 adds Cloudflare as one module and one
    register call, with nothing changing in apex-agent-core, apex-agentd or the CLI.
- id: P1-002
