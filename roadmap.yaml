    Landed on roadmap/v2.2. The reported overlap was not in the horizontal top navigation at all, which is why an
    earlier headless screenshot at 1280x720 found nothing: it is the vertical settings column, which spaced nine
    rows with (height minus n times rowHeight) divided by (n minus 1) and no floor, so the gap goes negative on
    arithmetic no compositor has any input to. Reproduced on both of Andre's real modes at the scale the shell
    derives for them, 2560x1080 and 1920x1200, at gaps of -19.9px and -39.9px, and it is not Hyprland-specific.
    Strategy is compact labels dropped for the whole bar at once rather than an overflow menu or scrolling,
    because six tabs is a small fixed set, hiding one behind a second click makes 'which page am I on' a two-step
    question, and a row where one tab is spelt out and another is a bare icon reads as a rendering fault. The pill
    is hard-clamped to its slot, which makes an overlap unrepresentable rather than unlikely, and the dashboard
    width yields to the output with a floor. 3918 assertions across 12 compositor and resolution runs, zero
    failures, and reverting the fix gives 140 failures across 6 distinct assertions. A second regression fix on
    the branch had no test, so one was added and proven. Keyboard navigation of the tab bar is absent in both the
    old and new versions and was left out of scope.
- id: P0-018
  title: Fix transactional monitor Apply / Keep / Revert flow
  priority: P0
  status: done
  area: display-settings
  depends_on: []
  acceptance:
  - Clicking Apply on staged monitor changes always applies the temporary configuration or reports an actionable error.
  - A visible 15-second confirmation dialog always appears after a successful temporary apply.
  - The dialog remains reachable after monitor layout/scale/primary-output changes and is shown on a safe active output.
  - Keep persists the configuration.
  - Revert or timeout restores the exact pre-apply configuration.
  - If APEX Shell, the dialog, compositor adapter, or output transaction fails during the countdown, recovery logic reverts
    safely.
  - Failed apply does not discard the user's staged values.
  - Automated tests cover confirm, timeout, manual revert, invalid mode, disconnected output, and shell restart during
    transaction.
  gates:
  - tests
  - stop_slop
  evidence: >-
    Done on task/p0-018-display-finish (4419e89..a153b02), on top of the first half at 8f47bd7. The five scenarios
    the roadmap recorded as uncovered were in fact covered by run-display-transaction-test.sh, which passes 41 of
    41 against a headless labwc with two virtual outputs — the evidence below was written from the branch state,
    not from a run. What was genuinely missing was criterion 5's word "exact" and criterion 6's recovery path, and
    testing those honestly needed outputs that can be created and destroyed, which labwc cannot do.
    run-display-unplug-test.sh uses headless sway's create_output and `output <name> unplug`, 17 assertions, and
    found two defects. First: the guard wrote `state reverted` whether or not the restore had worked, so an engine
    that failed during the countdown left the machine on an unconfirmed layout with a record saying it had been
    put back, and reconcile at the next start believed it. It records revert-failed now, retries, and the Display
    page says the screen was never confirmed. Second: a rollback naming an output unplugged during the countdown
    made wlr-randr reject the whole invocation, so EVERY other output kept the unconfirmed layout; restore now
    prunes the rollback against a fresh enumeration first. Criterion 5 is a whole-enumeration comparison across
    four fields and two outputs, not one scale value. The watchdog is apex-display-guard.sh, spawned by _begin()
    BEFORE the engine is called, so a dialog that fails to construct cannot affect it. Still open, and not fixable
    from this repository: the compositor dying mid-countdown. apex-display-apply persists on every apply —
    measured, one temporary apply writes kanshi/config and apex-display.conf with the unconfirmed layout — so a
    session that dies comes back on it. That needs `apply --no-persist` in apex-os; spelled out with the
    measurement in ROADMAP/design/P0-018-display-recovery.md.
