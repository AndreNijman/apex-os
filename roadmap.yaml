    and the reasoning, next to the paragraph about the old shared root it belongs with. COUNTS: workspace 3347 ->
    3354 passed / 0 failed / 2 ignored; clippy --locked --workspace --all-targets -D warnings exit 0;
    tests/test-agent-inject.sh 48 -> 49 passed / 0 failed; shellcheck coverage 165 discovered / 0 known-failing /
    0 newly failing; suite coverage 75 / 71 in CI / 4 exempt / 0 unrun and undeclared; doc verbs 191 documented /
    114 declared undocumented / 0 undocumented and undeclared / 0 stale; no conflict markers. NOT DONE AND NOT
    CLAIMED: fast user switching, a standard account offered at install time, and a kiosk session actually booted
    are all still open, exactly as this evidence listed them. Nothing here was run on a second logind session; the
    second account in the measurement is nobody under sudo, which is enough for the ownership question and is not
