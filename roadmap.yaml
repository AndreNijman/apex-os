- id: BASE-018
  title: Preserve Boot v2 experimental path
  priority: P0
  status: done
  area: foundation
  depends_on: []
  acceptance:
  - systemd-boot + signed UKI + composefs path remains testable
  - Legacy GRUB production path remains intact
  - Boot counting/rollback remains functional
  gates:
  - tests
  - stop_slop
  evidence: >-
    CLOSED 2026-09-11 (round 10), landed on roadmap/v2.2 in merge 65bd5c7 of task/base-partials (d385c96). The
    boot half was already green: test-boot-v2.sh 60/60 structural and 85/85 --with-binary, plus CI booting signed,
