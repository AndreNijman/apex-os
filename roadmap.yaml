  evidence: >-
    CLOSED 2026-09-11 (round 10), landed on roadmap/v2.2 in merge 65bd5c7 of task/base-partials (cf7df30). The
    live half was already proven: apex disposable run with --copy-in and --copy-out executed in a real container
