    with the link's own connection counter as the evidence. WHAT WAS NOT DONE: TerminalScreen and
    TerminalController were deliberately LEFT OUT of the on-device Compose suite rather than stubbed. They are
    driven by a controller that owns a PTY attachment, and half a controller would make an accessibility or layout
    check assert something no user ever sees; Screens.kt says so in as many words. So nothing here observes ANSI
    rendering, scrollback, selection or the accessory row on a real display - those remain covered by :core's
    terminal suite (TerminalTest, ScreenTest, ViewportTest, TuiCompatibilityTest, KeysTest) and by no device
    evidence. C3's 'orientation changes' is covered for every OTHER screen: each composes in landscape inside a
    host activity carrying MainActivity's exact configChanges, so the rotation is handled rather than recreated -
    which is what the app does and therefore what is worth asserting. A terminal in landscape is the one that
    matters most and is the one still untested.
- id: P1-056
  title: Android Projects, Workspaces, Worktrees, Tasks and Review UX
  priority: P1
  status: partial
  area: android
  depends_on:
  - P1-054
  - P1-036
  acceptance:
  - Browse projects/workspaces/worktrees and active tasks.
  - View changed files, diff summary, test status, conflicts, checkpoints, and PR readiness.
  - Open/focus an agent associated with a task.
  - Checkpoint/undo actions show consequences before execution.
  gates:
  - tests
  - stop_slop
  evidence: >-
    LANDED on apex-os task/p1-053b-android-ux 2026-09-12, six commits (abf76451, fdf31ace, a5f1d459, 183b6a34,
    e6f60563, merge 274b52b6); the first three of the branch were already merged to roadmap/v2.2 as c2ca4ea6.
    PARTIAL, and the unmet criterion is named: 'Checkpoint/undo actions show consequences before execution' is NOT
    MET and cannot be met from a phone against this protocol. Verified headless, NO device and NO emulator: 383
    core JVM tests (was 347), 27 app JVM tests (was 10), a debug APK, via ./gradlew :core:test
    :app:testDebugUnitTest :app:assembleDebug with JAVA_HOME=/usr/lib/jvm/java-21-openjdk
    ANDROID_HOME=/var/tmp/android-sdk; plus 746 apex-agent-core Rust tests. android/tools/check-agent-state.sh and
    no-second-write-path.sh both pass. THE STARTING CONSTRAINT WAS FALSE AND IS NOW SETTLED BY A COMPILER.
    p1-053a's card and P1-054's evidence recorded that apex-agent-core has no worktrees verb; that was read off
    request.rs's Verb, the PRIVILEGED OPERATION vocabulary (install/remove/pkg-*/pin/rollback/update), not off
    protocol.rs's Request, which is the wire and has 28 verbs. Worktrees { project: Option<String> } has been at
    protocol.rs:723 since 473b7f60 (2026-09-08), apex-agentd/src/main.rs:906 dispatches it with no origin gate,
    and apex-remoted's control() is a DENYLIST OF EXACTLY ONE VERB (attach), so a paired phone reaches it. Round 3
    of p1-053a had built the request and its parser correctly and then deleted both. Because arguing this from
    reading is what went wrong twice, it is now a test: android/core/src/test/resources/requests.json holds every
    request this app builds; AgentdRequestWireTest asserts the Kotlin builders produce it, and
    apexd/apex-agent-core/tests/android_requests_wire.rs deserializes each entry into Request and asserts the
    variant. A verb that does not exist fails to deserialize; one spelled wrong fails too. MET: browse projects,
    worktrees and the work in them — WorktreesScreen groups the flat worktrees reply into projects, preferring
    WorktreeStatus.slug (added this unit, aa-style additive with serde(default)) and falling back to the daemon's
    emission order, with rows that had no main tree before them going to an explicit UNGROUPED bucket rather than
    being attributed to the wrong project; a test asserts no row is ever dropped, because a user cannot see a
    worktree that is not on the screen. MET: diff summary, test status, conflicts and readiness per worktree —
    changed-file COUNT (the daemon sends no file names, so 'view changed files' is the count plus line totals and
    a file list would have to be invented), insertions/deletions, ahead/behind/unpushed, merge state, the last
    test run APEX watched, and ready-to-propose. Three rules that would have failed silently are tested: a merge
    state this app has never heard of renders as itself and is NOT clean (the daemon's own status() starts every
    worktree at Unknown because Clean is 'the one wrong answer here that costs somebody a broken merge');
    unobserved/running/passed/failed stay four different things; and the label is 'ready to propose', NEVER 'PR
    ready', because ready_to_propose is a local judgement from local facts and nothing asks GitHub anything. MET:
    open/focus an agent associated with a task — followed from WorktreeStatus.sessions, never guessed from a path,
    and the row is tappable only when this phone actually holds that session. ALSO MET AND NOT ASKED FOR: 'nothing
    came back' is drawn as THREE answers, not one — no projects, a machine whose APEX predates the verb
    (Agentd.isTooOld, since bad_request is also what a refusal returns), and a failed request. That is not
    hypothetical: the L16's image is 2026-09-05 against a verb that landed 2026-09-08, so too-old is the ONLY
    answer obtainable here. NOT MET, stated as the reason and not as caution: there is NO checkpoint verb on this
    socket — not list, not restore, not undo. checkpoint::list and checkpoint::restore exist in apex-agent-core
    and their only non-test callers are in apexd/apex/src/agent.rs, the CLI, operating on the local filesystem
    directly. The whole wire surface is RunRequest.checkpoint (take one before starting) and
    SessionInfo.checkpoint (the id of the one taken), neither of which reads or reverses anything. Both were
    missing from Kotlin and were added, so the phone can now ASK for a checkpoint with a toggle that states what
    it does and does not do before it is chosen, and can show 'apex agent undo --checkpoint <id>' on the session.
    But what a restore would change is computed on the machine from the checkpoint's tree and none of it crosses
    this wire, so a consequences summary here would be describing a destructive operation from the wrong data. The
    screens say that rather than implying a capability. DEFECT FOUND AND FIXED: connect to a second machine kept
    the first machine's worktrees, grants and pending approvals — it copied the agents block instead of rebuilding
    it, and sessions were replaced wholesale by the next poll so nothing showed, but the three new blocks are
    fetched only on request. Also: every slow loader could write into a machine the user had left, since each
    captures its machine and hands a request to Dispatchers.IO with a five-minute Mux deadline. NOT VERIFIED:
    every Compose behaviour, including both new screens and the checkpoint toggle — no device, no emulator, no
    Robolectric, and assembleDebug compiles code it never runs; and the worktrees happy path against a real
    daemon, because the L16's image predates the verb. What WAS done instead is the read-only audit this codebase
    learned the hard way: all twelve link.* calls in the view model were listed and each confirmed inside
    withContext(Dispatchers.IO), because StrictMode.enableDeathOnNetwork() is installed for every app targeting
    API 11+, is not a flag, and is not relaxed by a debug build. Mutation-checked: 23 mutations across Reply,
    Notifications, Alerts, Agentd, protocol.rs, ApprovalsScreen and the UI state each turn a NAMED test red; every
    file restored byte-identical with plain cp (never mv, never cp -p), the Rust restore confirmed by an empty git
    diff. One mutation attempt did not compile and is recorded rather than dropped. ON A DEVICE 2026-09-19
    (task/p1-053d-device). WorktreesScreen - the Projects screen this item's C1 asks for - composes on a Pixel 7a
    for the first time, passes the Accessibility Test Framework with AOSP TalkBack bound, carries a name for every
    control a screen reader could activate, and lays out with nothing collapsed at font scale 2.0 and in
    landscape. That is the whole of what a device can add here, and it is worth saying what it is not: it is
    evidence that the screen WORKS, not that its content is right, because the state it composes with is a fixture
    rather than a live worktrees reply. C4 IS UNCHANGED AND STILL UNMET FOR THE STRUCTURAL REASON ALREADY ON
    RECORD: 'checkpoint/undo actions show consequences before execution' needs a wire surface that does not exist
    - checkpoint::list and checkpoint::restore have only CLI callers on the local filesystem, and
    RunRequest.checkpoint plus SessionInfo.checkpoint are the entire wire surface. The Start screen's checkpoint
    switch says what it does and what it does not in the same breath, which is as close as this app can get; the
    device round changed nothing about that except that the switch NOW HAS A NAME - it had none, its words being
    in a sibling Column, so TalkBack announced it as 'off, switch'. Found by walking the semantics tree on the
    phone; the Accessibility Test Framework passes that screen, because an unnamed switch is not one of its rules.
- id: P1-057
  title: Android remote capability and deployment approvals
  priority: P1
  status: partial
  area: android
  depends_on:
  - P1-054
  - P0-014
  - P1-014
  acceptance:
  - Cloud/GitHub/preview capability requests can be approved/denied from Android according to project policy.
  - Production deployment approvals are clear and auditable.
  - Root/system-access and unsafe-everything remain local-approval-only by default.
  - If optional remote high-risk approval is enabled, it requires strong device/WebAuthn/FIDO-equivalent authentication
    and explicit owner configuration.
  gates:
  - tests
  - stop_slop
  evidence: >-
    LANDED 2026-09-19 (round 33): task/p1-053e-device @ 9231f72a is on apex-os roadmap/v2.2 as merge 859cbb2b
    (7f647470 -> 859cbb2b, --no-ff, six commits, 914 insertions over 12 files). Rust changed in this merge, so the
    workspace was actually rebuilt ON THE MERGED TIP rather than trusted from the branch: cargo test --locked
    --workspace --no-fail-fast 3407 passed / 0 failed / 2 ignored across 57 targets, cargo clippy --workspace
    --all-targets --locked -D warnings exit 0 with zero warnings, check-no-conflict-markers.sh PASS. Pushed with
    --force-with-lease. C3 MEASURED FROM A REAL PHONE, 2026-09-19 (task/p1-053e-device @ 9231f72a,
    android/app/src/androidTest/.../ApprovalsOnDeviceTest.kt). "Root/system-access remain local-approval-only by
    default" had been a property of source that nothing had ever tried to violate from a device. It has now been
    tried. A Pixel 7a, paired over Wi-Fi with a real apex-remoted, built the decide frame BY HAND — Agentd has no
    builder for it and Approvals.kt records that as deliberate — and sent it down its own link against a REAL
    pending request filed at the computer. The daemon answered permission_denied, naming claude-remote-control and
    §7, and the request was still pending afterwards. The same frame for request 999999 got the IDENTICAL refusal,
    which is the part worth keeping: privilege.rs puts the origin check before the lookup, so a local caller is
    told no_such_request and a phone is told permission_denied, and the refusal cannot be used as an oracle for
    which request ids exist on somebody's computer. The asymmetry Approvals.kt documents is measured too: revoke
    and revoke_system_grant carry no origin check because they only ever remove authority, and from the phone they
    answer no_such_request for something absent rather than permission_denied — "I looked and there was nothing"
    instead of "you may not ask". C1 IS SEEN FROM THE PHONE AS FAR AS IT GOES: a privilege request filed at the
    computer reaches the phone with its verb, its packages, its reason and a local request_origin intact, and a
    decision taken at the computer is visible from the phone. Approving from the phone is not a policy setting
    anywhere in this codebase and C1's "according to project policy" cannot be met for any root verb —
    request.rs:290 maps all eight to Capability::RootCapability. C4 unchanged and still needs a hardware-enrolled
    FIDO2 credential. LANDED on apex-os task/p1-053b-android-ux 2026-09-12 (abf76451, fdf31ace, a5f1d459,
    183b6a34, e6f60563). PARTIAL, and TWO of the four criteria are NOT MET because there is nothing on the wire
    for them. Verified headless, NO device and NO emulator: 383 core JVM tests, 27 app JVM tests, a debug APK, 746
    apex-agent-core Rust tests; both android gates pass. THE GOVERNING FACT, measured rather than assumed: A PHONE
    CAN NEVER APPROVE OR DENY A PRIVILEGE REQUEST, AND NO SETTING CHANGES THAT. apex-agentd/src/privilege.rs:1176
    refuses decide from any non-local origin unconditionally, and the check sits BEFORE the pending check, so a
    paired device cannot even DENY. Request::Decide carries no second_factor field and decide never consults
    OriginPolicy — the remote_elevation_allowed opt-in gates system-access grant ISSUANCE, a different path.
    apex-remoted declares the origin claude-remote-control (proxy.rs:128), which is not local, and
    origin::may_declare forbids narrowing back towards local. Pinned upstream by
    apex-agentd/tests/request_origin.rs:369. AND EVERY VERB IN THE VOCABULARY IS ROOT: request.rs:290 maps all
    eight to Capability::RootCapability, deliberately, because the vocabulary was chosen to be exactly apex's
    root-only subcommands — so there is no non-root approvable object on this socket at all. NOT MET, criterion 1
    (cloud/GitHub/preview capability requests approved or denied from Android): impossible against this build.
    Capability NEVER APPEARS ON THE WIRE — GitHubPush, CloudflarePreviewDeploy and ProductionDeploy exist only as
    rows in section 7's table (origin.rs:842) with no serde derive, and nothing in this build performs them. NOT
    MET, criterion 2 (production deployment approvals clear and auditable): production-deploy approval DOES exist,
    on a DIFFERENT daemon — apex-secretd, tag key 'op', kebab-case, apex-secret-core/src/protocol.rs — and
    apex-remoted NEVER CONNECTS TO IT: grep finds no secretd socket path anywhere in its sources. A phone cannot
    reach it. MET, criterion 3 (root/system-access and unsafe-everything remain local-approval-only by default):
    met by the runtime, and this unit's contribution is to not undermine it. ApprovalsScreen has NO Approve and NO
    Deny button, and renders PrivilegeRequest.DECIDE_IS_LOCAL_ONLY verbatim where they would sit, so the sentence
    the user reads is the sentence they would get if the button existed and they pressed it. There is no decide
    builder in :core and both halves of the shared request fixture assert there is none — adding it is the obvious
    move on seeing a list of pending approvals, and it would be refused every time it was pressed. NOT MET,
    criterion 4 (optional remote high-risk approval requiring WebAuthn/FIDO-equivalent and explicit owner
    configuration): the only path in this build with the right shape is RenewSystemGrant with a SubmittedFactor
    (remote_elevation_allowed plus a UV-verified key), and reaching it from Android is a SEPARATE UNIT, not an
    Android round. SubmittedFactor.assertion is 'the four lines fido2-assert -G printed, verbatim'; enrolment is
    fido2-cred -M -t es256 run on the machine and pasted into apex agent key add (apexd/apex/src/agent.rs:4173).
    An Android phone would have to act as a FIDO2 authenticator producing that exact libfido2 text format and be
    enrolled out of band. AppLock is a local Keystore biometric and is NOT a registered authenticator for the
    daemon. Named on the card so it is not folded into an Android round by mistake. WHAT WAS BUILT, and it is the
    honest thing rather than the asked-for thing: the phone lists pending and decided privilege requests,
    per-project standing grants and live system-access grants, and can REVOKE both kinds. The asymmetry is the
    point and is the daemon's own reasoning: privilege.rs:1289 applies NO origin check to revoke, because
    revocation only ever removes authority, so a device that cannot grant anything can still take it back. Revoke
    is not retried — a lost reply after a wide revoke would have the retry answer no_such_request, reporting
    failure for something that succeeded — and every confirmation dialog says so before the press rather than
    after. TWO DISTINCTIONS THE ROWS KEEP, both tested and both mutation-checked: allow_for_project does NOT mean
    the operation ran (request.rs:410 — execution still goes through the approving human's own privilege at the
    machine), so a row says 'allowed, but not run yet' and never 'done'; and an absent exit_code is not a zero, so
    a request that ran with none recorded is not claimed to have succeeded. An empty capabilities list on a system
    grant means EVERY root operation (break-glass) and is rendered as such, not as 'no operations', which would be
    exactly backwards. NOT VERIFIED: every Compose behaviour on this screen, including the revoke confirmation
    dialog — no device, no emulator, no Robolectric, and assembleDebug compiles code it never runs; and no revoke
    has been performed against a live daemon. Mutation-checked: decisionLine reading an allowance as done,
    treating an absent exit code as a zero, and describing a wide revoke as a narrow one each turn a NAMED
    ApprovalsTest red; files restored byte-identical with plain cp. C3 OBSERVED FROM THE INSIDE ON A REAL DEVICE,
    2026-09-19 (task/p1-053d-device). 'Root/system-access and unsafe-everything remain local-approval-only by
    default' now has a measurement taken from the phone rather than from a daemon test: a session started BY THE
    PHONE, over a Noise session through a real apex-remoted into a real apex-agentd, is recorded by the daemon as
    request_origin=claude-remote-control and actor=<this device's id>, asserted by reading SessionInfo back over
    the same link. That is the property the refusal rests on - a phone cannot be mistaken for a human at the
    keyboard - and it is asserted positively rather than by watching one refusal. ApprovalsScreen also composes on
    the phone for the first time, passes the Accessibility Test Framework with TalkBack bound, and lays out at
    font scale 2.0 and in landscape with nothing collapsed. WHAT IS STILL NOT DONE, SAID PLAINLY: no approve/deny
    round trip was driven from the device, because there is nothing to drive - `decide` is refused from any
    non-local origin before the pending check (privilege.rs:1176) and is deliberately absent from the shared
    requests.json fixture, so the phone has no builder for it and a device test would be a test of a request that
    is always refused. C1's 'approved/denied from Android according to project policy' therefore remains what it
    was. C4 is unchanged and remains a separate unit: it needs RenewSystemGrant plus a hardware-enrolled FIDO2
    credential.
- id: P1-058
  title: Android push notifications and input-needed workflow
  priority: P1
  status: partial
  area: android
  depends_on:
  - P1-053
  - P1-022
  acceptance:
  - Working-complete, failed, input-needed, permission/capability request, test failure, and deployment notifications
    are supported.
  - Notification content is encrypted/minimized so push infrastructure does not receive sensitive prompt/code content.
  - Tapping a notification opens the exact task/session.
  - Duplicate Claude/APEX notifications are deduplicated.
  gates:
  - tests
  - stop_slop
  evidence: >-
    LANDED on apex-os task/p1-053b-android-ux 2026-09-12 (abf76451, fdf31ace, a5f1d459, 183b6a34, e6f60563).
    PARTIAL, and the unmet parts are named: the encryption criterion is VACUOUS on this runtime and is stated as
    such rather than claimed as built, deployment notifications have nothing on the wire to fire from, and the
    whole feature works only while a poll loop is alive. Verified headless, NO device and NO emulator: 383 core
    JVM tests, 27 app JVM tests, a debug APK, 746 apex-agent-core Rust tests; both android gates pass. THERE IS NO
    PUSH TRANSPORT ANYWHERE IN APEX, measured not assumed: no FCM, Firebase, UnifiedPush or ntfy reference in this
    repository, android/ included; no subscribe, watch or follow verb on apex-agentd's socket (attach is the only
    long-lived one and it streams raw PTY bytes, not typed state); the relay is a stateless byte-copier that has
    NEVER BEEN DEPLOYED (relay/README.md:11), both ends dial out to it, and apex-remote-core's Frame enum has no
    notification tag. So an alert is derived from POLLING A CONNECTION THE PHONE OPENED, and every claim below is
    bounded by that. MET: working-complete, failed, input-needed, permission/capability-request and test-failure
    notifications. The vocabulary is Alert.Kind with six members. One of them carries a runtime fact worth
    recording: 'working complete' is effectively UNREACHABLE for an interactive agent — AgentState::Complete comes
    only from the process exiting 0 (session.rs:493) and the claude adapter runs claude interactively, so the end
    of a turn publishes waiting_for_user via the stop hook. A separate 'finished' alert would never fire, and
    WAITING carries both. NOT MET: deployment notifications. Nothing in this build performs a deployment reachable
    from this socket (see P1-057: Capability never appears on the wire, and apex-remoted never connects to
    apex-secretd), so there is no event to raise one from. MET WITH A NARROW WINDOW, stated plainly: test-failure
    alerts are raised from a worktrees poll, but worktrees is deliberately NOT on the four-second timer (answering
    it runs git in every remembered project with merge-tree --write-tree), so the watcher is handed the last
    explicitly-fetched list each poll and sees no transition between polls. A TEST_FAILED alert therefore fires
    only across two Projects-screen refreshes that straddle the change. True, but the delivery window is that
    narrow and nobody should read 'supported' as 'timely'. CRITERION 2 IS VACUOUS AND IS SAID TO BE: 'notification
    content is encrypted/minimized so push infrastructure does not receive sensitive prompt/code content' — NO
    PUSH INFRASTRUCTURE RECEIVES ANYTHING, BECAUSE THERE IS NONE. What survives of the criterion is 'minimized',
    which is real and is enforced: a phone on a table shows its lock screen to whoever is in the room.
    NotificationContent (in :core, where a test can reach it) renders from fixed strings, an adapter name and a
    machine name and from nothing else. SessionInfo.detail never reaches it — hook::detail_for (hook.rs:437)
    copies Bash command lines, file paths, grep patterns, fetched URLs, task descriptions and Claude's own
    notification text VERBATIM, clipped to 120 characters, and it is the field a notification would most naturally
    want. Nor do cwd, project, worktree, args or telemetry.branch. NotificationsTest drives the assertion through
    the WHOLE path — a session record carrying a password in detail, a project name, a worktree name, a path and a
    prompt argument, through AlertWatcher, through NotificationContent.of — and asserts none of it appears;
    against a hand-built Alert the assertion would be VACUOUS, since Alert has no field to put a secret in. The
    mutation that proves it load-bearing (AlertWatcher putting s.detail in the alert) turns that named test red.
    MET: tapping a notification opens the exact task/session. The intent carries (machine, session) and NOT just a
    number, because SessionInfo.id is a per-daemon counter that is REUSED after a prune (registry.rs:441) and is
    not unique across machines either — two paired laptops both have a session 1. When the session is gone the tap
    lands on the Agent Center rather than on whatever now holds that number. MET: duplicates are deduplicated, and
    the duplicate is NOT Claude-versus-APEX as the criterion assumes — it is INTERNAL TO APEX. Four independent
    paths publish waiting_for_user for one turn (the notification hook, the stop hook, the PTY BEL/OSC scanner,
    and the ten-second idle rule) and Session::set_state (registry.rs:163) has NO same-state early return, so a
    poller keying on 'saw waiting_for_user' fires up to four times seconds apart. SessionInfo carries no field
    naming the hook event, so the four are not distinguishable at the client even in principle. Dedup is therefore
    on the TRANSITION EDGE, which is the only rule available and happens to be the right one; the notification id
    is derived from (machine, session, kind) via String.hashCode, which the JVM SPECIFIES, so a re-raised alert
    REPLACES rather than stacks even across an app restart. Two further rules are tested: the first poll of a
    machine raises nothing (six sessions waiting since yesterday are not six things that just happened, and an
    empty map is also the state after a process restart, which is when the burst would be worst), and a pruned
    session is dropped from the map so a recycled id is not diffed against a stranger's state. BEYOND THE CRITERIA
    — THE INPUT-NEEDED WORKFLOW IS NOW ACTIONABLE. Request::Input { id, data } exists (protocol.rs, dispatched at
    apex-agentd/src/main.rs:710) and A PHONE MAY USE IT: privilege::refuse_input (privilege.rs:326) refuses
    exactly two callers, a connection that IS a managed session and one whose origin could not be classified, and
    apex-remoted is neither. Unlike decide this is not a verb a phone is refused, and the asymmetry is the
    daemon's own reasoning — section 7 reserves AUTHORISING ROOT for a human at the machine, and typing a sentence
    at an agent is not that; what the gate prevents is an agent typing at another agent. So a notification can now
    be answered without attaching a PTY. Two rules carry it, both tested and mutation-checked: the daemon appends
    NOTHING (session::write_input writes raw bytes), so a reply sent as typed sits unsubmitted on the agent's
    input line looking exactly like nothing having happened — Reply.bytes appends CR, which is what a terminal
    delivers for the return key, and strips the newline Android's IME adds, which would otherwise submit the reply
    AND a bare return that many agents read as accepting the default; and a session id is NOT an identity, so
    Reply.Target carries started (written once at spawn) and check compares it BEFORE liveness, because a reply
    composed from a notification and sent after the id was recycled would type the user's sentence into a
    different agent's terminal. DEFECT FOUND AND FIXED IN REVIEW: replyToSession caught every exception with 'The
    reply may already have been delivered', which is the opposite of what protocol.rs guarantees and the worst
    possible message here — told it might have landed, the user does not resend and the agent waits for ever. An
    AgentError means the daemon ANSWERED and nothing was typed; only a transport failure is genuinely ambiguous.
    The catches are split, and Agentd.isTooOld gets its own sentence. NOT VERIFIED: every Compose behaviour; the
    POST_NOTIFICATIONS permission dialog; whether a notification is actually posted, grouped or replaced by
    Android; notification tap routing; and the input happy path against a real daemon — Request::Input landed
    2026-09-08 (8c3958df), the same day as Worktrees, and the L16's image is 2026-09-05, so this machine takes the
    too-old path every time. No relay leg either, so LAN only. Mutation-checked: eleven mutations across Reply,
    Notifications, Alerts, Agentd and protocol.rs each turn a NAMED test red, including a Rust one (renaming
    Request::Input's data field on the wire turns android_requests_wire red); every file restored byte-identical
    with plain cp, the Rust restore confirmed by an empty git diff. ON A DEVICE 2026-09-19 (task/p1-053d-device),
    and GrapheneOS INVERTED THE PREMISE THIS ITEM HAS BEEN CARRYING. Six instrumented assertions now run against
    Android's real NotificationManager: the channel is really created, an alert really reaches the shade, the same
    session alerted twice occupies one line and two sessions occupy two (C4's deduplication as ANDROID resolves
    it, by notification id, not by anything this code decides afterwards), a posted notification carries a real
    tap target, and every one of the six Alert.Kinds renders text containing no code fence, no shell prompt, no
    path, no URL and no token shape. C2 ('encrypted/minimized so push infrastructure does not receive sensitive
    prompt/code content') HAS BEEN RECORDED AS VACUOUSLY MET BECAUSE APEX HAS NO PUSH TRANSPORT, AND THAT WAS
    EXPECTED TO BE CONFIRMED BY A PHONE WITHOUT PLAY SERVICES. THE OPPOSITE HAPPENED AND IT IS A STRONGER RESULT:
    this GrapheneOS phone HAS Google Play services - com.google.android.gms 26.29.32,
    installerPackageName=app.grapheneos.apps, the sandboxed Play build, installed and enabled. FCM is available on
    this device and the app still does not use it. The minimisation is therefore unconditional rather than an
    accident of the platform: these notifications are built on the phone, from state the phone already holds, and
    nothing about them leaves it. The APK carries no Firebase or messaging component (checked with aapt2 over the
    built manifest) and no crash-reporting SDK. TWO THINGS MEASURED BEFORE ANY OF THAT COULD BE ASSERTED: (a)
    POST_NOTIFICATIONS ungranted is COMPLETELY SILENT - NotificationManagerCompat.notify accepts the call,
    returns, and the shade stays empty, with no exception and no log line. That silence is exactly why
    UiState.notificationsEnabled is on the screen rather than assumed. The suite grants it through UiAutomation,
    the only way a test can, since the dialog is the user's and no instrumentation can press it. (b) notify is
    ASYNCHRONOUS - two posts then an immediate read of activeNotifications returns one, so every assertion polls
    to a deadline instead of reading the next line. C1 AND C3 ARE COVERED FOR THE PATH THAT EXISTS, AND THE PATH
