    single-GPU or an all-AMD machine and nothing about 10de:249d hardcoded; it lives in apexd-core
    gpu::choose_display, surfaced as `apex gaming --gamescope-device-args`, consumed by apex-gaming-session. Every
    path that cannot answer records a problem the session prints, because a silent fallback to the iGPU IS the
    defect; it is deliberately not fatal, since refusing to start would regress every single-GPU machine. 6.2
    FIXED by stopping the false claim: gamescope gates on CAP_SYS_NICE and never reads RLIMIT_RTPRIO, so --rt is
