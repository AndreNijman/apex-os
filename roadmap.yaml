- id: P2-016
  title: Multi-user, guest, kiosk and shared-machine support
  priority: P2
  status: partial
  area: multi-user
  depends_on:
  - P0-002
  - P0-009
  acceptance:
  - Standard vs administrator accounts, fast switching, per-user agents/secrets/profiles, and session isolation work.
  - Guest sessions can be disposable.
  - Kiosk/shared-device policy is possible without weakening ordinary desktop use.
  - Remote agent permissions are bound to the owning user/session.
  gates:
  - tests
  - stop_slop
  evidence: >-
    LANDED on apex-os roadmap/v2.2 2026-09-12 as merge 5eca2402. ROUND 2, five commits on apex-os
    task/p2-016-multiuser-2, all pushed (344bd8fd, 5d74649e, 6f7c6db1, 0caec419, 8c14dbf9), branched from
    roadmap/v2.2 at 2aa9ed45; round 1's five are already merged at 1d1c6fb3. No apex-shell change was needed in
    either round. Workspace 2998 -> 3007 passed / 0 failed, clippy --locked --workspace --all-targets -D warnings
    clean. tests/test-apex-shared-machine.sh 39 -> 60 / 0. tests/test-apex-user.sh 57 / 0 (new, wired into CI and
    Containerfile.base). tests/check-containerfile-assertions.sh 76 -> 88 checked / 0 failed. Every apex user verb
    is documented, so nothing was added to the doc-verb debt list. THE ROUND'S POINT: round 1 named five things it
    could not check because this machine has exactly one account at or above uid 1000. Round 2 created a real
    second account (apex-fx-guest, uid 1042, home under /var/tmp, not in wheel, password locked), used it, and
    REMOVED it; four of the five are now measured and the fifth (a kiosk session actually booted) is not. Verified
    after removal: getent passwd shows only andre at or above 1000, wheel is byte-identical (wheel:x:10:andre),
    /var/lib/apex-greet/last-user matches its pre-round sha, and /etc/apex, /var/lib/apex-secretd,
    /usr/local/libexec/apex-guest-wipe, the unit, its .wants directory, /tmp/apex-agent-1042 and every fixture
    directory are gone, with systemctl --failed empty. One inert artefact remains and needs no action: logind
    session record 21 is stuck in State=closing, a session whose leader died without logind reaping it, which
    loginctl terminate-session cannot remove; it names a uid that is no longer an account, holds no processes or
    units, and goes at the next boot. CRITERION 1 - PARTIAL, and closer. apex user is new: list (no root needed),
    add, rm, guest enable/disable/status, over a shipped engine at /usr/libexec/apex-user with a clap surface
    whose argv is pinned by tests. ADD MAKES A STANDARD ACCOUNT and --admin is the opt-in, which is deliberately
    the opposite of the installer, whose line 570 is -G wheel unconditionally and which is NOT changed, because a
    first account outside wheel is a machine nobody can administer. Proved live by creating apex-fx-std (uid 1043,
    not in wheel, sudo answers 'a password is required') and apex-fx-adm (uid 1044, in wheel) through the engine
    and removing both, wheel byte-identical afterwards. Administrator means wheel because that is what the running
    machine resolves to, read rather than recalled: polkit's 50-default.rules addAdminRule returns
    unix-group:wheel and sudoers has %wheel ALL=(ALL) ALL. rm refuses uid 0, a system account, the account you are
    running as, a still-configured guest, and THE LAST ADMINISTRATOR - the one refusal with no recovery path from
    inside a running system. Per-user agents, secrets and session isolation are now MEASURED rather than argued:
    every test binary in the workspace, run by the second account inside its own logind session, gives the owner's
    result (4339 passed, and the same 8 failures, which fail identically for uid 1000). Run OUTSIDE a session it
    is 35 failures, all /run/user/<uid> and loginctl show-user, because an account with no session has no runtime
    directory. Round 1's scratch-root defect demonstrated live: as uid 1042, mkdir /tmp/apex-agent/9042 is
    Permission denied while /tmp/apex-agent-1042/1 succeeds - and mkdir -p /tmp/apex-agent/1 SUCCEEDS for the
    second account because session ids restart at 1 and the directory is already there, owned by andre at 0700, so
    the old failure lands on the chmod. THE HONEST BLOCKER IS FAST SWITCHING, WHICH HAS NO SURFACE AT ALL. Round 1
    equated it with polkit allow_inactive=no, which is the isolation half and not the switching half. Measured:
    zero hits for any switch-user string across apex-os, and apex-shell's PowerMenu.qml offers Shutdown, Reboot,
    Windows, Gaming, Log Out, Lock and Suspend and nothing else; greetd runs one session on one VT. Written into
    docs/multi-user.md as a gap rather than left implied. CRITERION 2 - MET for the session-end path. Round 1
    shipped the wipe engine with nothing to run it (apex-guest-wipe@.service is After=user-%i.slice, which orders
    and never fires). apex-guest-session@.service is the trigger, verified on the real second account both
    directions: allowlist names the guest -> home cleared 12 entries to 0, /var/lib/apex-secretd/users/1042 gone,
    unit deactivated successfully; allowlist emptied -> nothing removed, unit FAILED with status=2/INVALIDARGUMENT
    and the journal line refusing: ... is not listed in /etc/apex/guest-accounts. THE OBVIOUS WIRING DOES NOT WORK
    AND FAILS SILENTLY: BindsTo=user-%i.slice never fires, because logind does not stop the user slice - it stops
    user@<uid>.service and user-runtime-dir@<uid>.service, and the slice then goes by garbage collection, which a
    unit that BindsTo it prevents. Measured twice: with the hook installed user-1042.slice stayed active
    indefinitely after logout, and was collected within seconds once the hook was removed. So the hook prevented
    the event it was waiting for. The two units also differ in what a refusal MEANS and that is why they are
    separate files: the boot sweep keeps SuccessExitStatus=0 2 because refusing on a machine with no guest is
    normal, and the session hook has none, because a refusal there is a guest whose credentials were not cleared.
    That was not a hunch - with the value copied across, the emptied-allowlist run reported success and systemctl
    status was green over an untouched guest home. A third live cycle earned a third finding: a logind record
    stuck in State=closing still counts as a session, so fence 4 refused, the unit went red and nothing was wiped
    - the correct conservative answer, and visible only because the unit is loud. The boot sweep is the documented
    backstop. CRITERION 3 - PARTIAL, unchanged and the trap still avoided. Nothing is enabled, nothing about
    ordinary desktop use is weakened, and the absence assertion is still fed a config that HAS an auto-login
    stanza so it can fail. apex user guest enable now does the README's manual steps as one command and was run
    for real against systemd. STILL OPEN, and it is the same gap as round 1: no kiosk or guest session has ever
    been BOOTED; everything about kiosk is shape assertions on shipped files, and no greetd config on any machine
    was touched to try. CRITERION 4 - MET. Round 1 closed the origin-classification hole; round 2 found and closed
    an asymmetry nothing had looked at. apex-remoted's control socket checked the caller for Pair and for nothing
    else: Status, Devices and Revoke went straight to the state, on the argument that the socket is in a 0700
    directory inside XDG_RUNTIME_DIR - the same argument the pairing check dismisses one line above with 'checked
    anyway: it costs one syscall'. Measured with the second account and BOTH filesystem fences opened by hand (the
    directory mode and the socket mode - connect(2) needs write, so srwxr-xr-x alone stops another account), so
    that the refusal under test was the daemon's and not the filesystem's: before, uid 1042 got the owner's
    machine key, LAN addresses and rendezvous id from Status, the owner's paired-device list from Devices, and
    reached the owner's device STORE through Revoke, which answered 'no paired device' - it had looked, and would
    have revoked one whose name matched; only Pair said no. After, all four are refused and the owner is
    unaffected on the same widened socket. The account half now applies to every request and the
    human-at-the-keyboard half stays on Pair alone, because apex remote devices from a script is reasonable and
    pairing a phone from one is not. There is no sudo path to keep open, unlike apex-agentd, whose
    peer::is_own_user doc comment claimed to be a gate when it is a classification branch that deliberately lets
    sudo apex request approve through as uid 0; that comment is corrected here. TWELVE MUTATIONS ACROSS THE FOUR
    COMMITS, every one caught by a named test and every file restored byte-identical and checked with sha256sum
    -c. FOR THE INTEGRATOR: tests/check-doc-verbs.sh --reverse is RED on roadmap/v2.2 itself - apex lid and its
    six subverbs landed at 2401a57c/2aa9ed45 documented nowhere and declared nowhere. That is not from this
    branch, which touched no debt list. Follow-ups on ROADMAP/state/agents/p2-016.md, in value order: fast user
    switching (the named criterion-1 gap, and not small - greetd has no second seat, so it means a greeter on a
    spare VT plus loginctl activate, and the chvt half cannot be tested on Andre's machine without taking his
    screen); a standard account offered at install time; a kiosk session actually booted; ensure_private_dir still
    does not check ownership.
- id: P2-017
  title: APEX Online Accounts and brokered cloud identity layer
  priority: P2
  status: partial
  area: online-accounts
  depends_on:
  - P1-001
  - P0-002
  acceptance:
  - Architecture supports providers such as Nextcloud, Google, Microsoft, WebDAV and S3/R2 without spraying credentials
    across user config.
  - Apps/services receive scoped capabilities or standard portal/account integrations where possible.
  - Account removal revokes local capabilities cleanly.
  gates:
  - tests
  - stop_slop
  evidence: >-
    APEX Online Accounts. Landed on task/p2-f (10 commits off roadmap/v2.2 4b1e797f), NOT yet merged. The
    decision: an online account is a ServiceInfo in the store apex-secretd already owns, named
    account.<provider>.<name> — no accounts daemon, no second store, no second write path, because P0-002 already
    put credentials in /var/lib/apex-secretd/users/<uid>/ root-owned 0700 where the user's own uid cannot read one
    at rest, and P2-016 measured what a second write path costs. Five providers over THREE transports in
    apex-secret-core/src/account.rs (nextcloud and webdav both route into webdav: P1-001 routes on an operation
    id's first segment, so two spellings would need two registry entries that drift). apex account
    providers/scopes/add/list/grant/revoke/rm in apexd/apex/src/account.rs; docs/online-accounts.md. CRITERION 2
    IS MEASURED FOR WEBDAV ONLY, AND ONLY DAEMON-DIRECT: a new webdav provider (list/read/write) in apex-secretd,
    proven end to end against a loopback server that 401s a request carrying no credential — the app password
    arrives as Basic base64(me:<token>) at /dav/documents/notes.md, i.e. the caller's path UNDER the pinned base
    path, the caller gets the body, and the token is in no reply, no output and no audit line. The tests call
    Request::Use on secretd directly; the apex-agentd forwarding path a confined session would use was NOT
    exercised, though a grep of apex-agent-core/src/policy.rs and apex-agentd/src/main.rs finds no provider
    enumeration there, so there is nothing for webdav to be missing from. CRITERION 3 IS MEASURED: removing the
    account makes the same Use that succeeded a moment earlier fail, the grant is gone from the table rather than
    merely unmatched, and a walk of the whole store finds the sentinel nowhere. CRITERION 1 IS NOT MET FOR THREE
    OF THE FIVE PROVIDERS NAMED IN IT: the RFC 8628 device-code flow is not wired to Google or Microsoft
    (apex/src/cloudflare.rs has a complete implementation to reuse, including its best idea — the refresh token
    under a SEPARATE service pinned to a different host so the endpoint pin makes it unspendable as an API token),
    nothing refreshes any token including Cloudflare's, and S3/R2 has no SigV4 signer, which is the wall P1-011's
    temporary.rs already hit. Also not built: no gvfs/file-manager integration. Gates: cargo clippy --locked
    --workspace --all-targets -D warnings clean; cargo test --locked --workspace 48 suites 0 failed;
    tests/test-secret-broker.sh 66/0; tests/check-doc-verbs.sh 235 valid, 0 undocumented-and-undeclared, 0 stale;
    tests/test-apex-verbs.sh 64/0 (it had been failing its own reverse pass 59/1 before this branch — lid,
    permissions, user and vm were unlisted). TWO MUTATIONS BOTH BIT: presentation() always returning
    HttpAuth::Header sent the raw sentinel where Basic belonged and reddened both the unit test and the end-to-end
    one; broker::webdav_url's valid_path guard deleted took apex-secretd from 252/0 to 250/2. Both restored with
    plain cp, cmp silent. THREE DEFECTS FOUND AND FIXED IN THIS BRANCH'S OWN WORK: apex account grant keyed on the
    CURRENT DIRECTORY where apex secret grant keys on the project ROOT, so a grant made from any subdirectory was
    allowed, reported and silently inert; add took an empty --username for a Basic provider, which would have sent
    the password as a bare Authorization header and read back as a wrong password; and the Nextcloud default path
    was the bare /remote.php/dav/files prefix, where Nextcloud serves files at /remote.php/dav/files/<username>/ —
    so EVERY Nextcloud account this branch could have stored would have 404d on every file, in a way that also
    reads like a wrong password. Provider::path_for composes it, in the core crate so a second caller cannot get
    it wrong differently. NOT VERIFIED: nothing was run against a real Nextcloud, Google, Microsoft or S3
    endpoint.
- id: P2-018
  title: Guaranteed Safe Graphics / desktop failover mode
  priority: P2
  status: partial
  area: recovery-graphics
  depends_on:
  - BASE-015
  - BASE-018
  acceptance:
  - A graphics/compositor/shell failure can enter a conservative recovery desktop or safe graphical session.
  - User can inspect failure, roll back deployment/driver, collect diagnostics, and reach files/network.
  - Recovery does not depend on the broken normal compositor configuration.
  gates:
  - tests
  - stop_slop
  evidence: >-
    Guaranteed Safe Graphics. Landed on task/p2-f, NOT yet merged. APEX Safe Graphics is a labwc session started
    as 'labwc -C /usr/share/apex/safe-graphics' — a config DIRECTORY, which is the whole of criterion 3: the
    compositor never opens ~/.config/labwc, the file apex-input-apply splices a libinput element into with
    ElementTree and apex-labwc-keybinds generates into, and the file labwc falls back from SILENTLY when it will
    not parse. -C rather than XDG_CONFIG_HOME on purpose, so the CLIENTS keep their own config; a file manager
    with no config directory cannot save a bookmark. Software rendering forced (pixman, llvmpipe,
    LIBGL_ALWAYS_SOFTWARE, no hardware cursors) and __GLX_VENDOR_LIBRARY_NAME / GBM_BACKEND /
    MESA_LOADER_DRIVER_OVERRIDE actively UNSET, because a broken GPU setup is often a broken vendor selection.
    WLR_BACKENDS is deliberately not set: unset it is DRM for a person and headless for a test, which is the only
    way this is exercised without taking the live display away. CRITERION 3 IS MEASURED, NOT INSPECTED:
    tests/test-apex-safe-graphics.sh plants an unparseable rc.xml plus an autostart that would exit the compositor
    exactly where the user's live, starts the real session under WLR_BACKENDS=headless in a private
    XDG_RUNTIME_DIR, and requires a wayland socket and a live compositor afterwards. 59 passed, 0 failed, and it
    now runs in CI, in the pr-validation job that already installs labwc for the keybind-reload suite — it was in
    no workflow when first written, which in this repo means it would have run on no machine unless somebody typed
    it. MUTATION: deleting -C from the exec line takes it to 42/2, failing both the structural check and 'the
    recovery session came up over a broken user configuration', because the compositor then read the planted
    config and went away. Restored with plain cp, cmp silent. CRITERION 2 IS STRUCTURAL, NOT EXERCISED: the menu
    names apex recover status, apex doctor, apex-safe-graphics diagnose, sudo apex rollback (which IS the driver
    rollback here, since a driver is image content), thunar and nmtui, and the build refuses if any is missing
    from it — but none was RUN from inside the session. diagnose is exercised: it writes a tar.gz in which no file
    is ever empty, and all THREE cases now name themselves — a missing command, a non-zero exit, and a command
    that exits 0 printing nothing, which is the one that used to leave an empty file reading as 'nothing to
    report'. CRITERION 1 IS THE HALF-MET ONE AND THE VERB IS THE PROBLEM: two routes ship, the greeter entry and a
    virtual console (Ctrl+Alt+F2, documented in docs/recovery.md, which nothing in either repo said anywhere
    before — it matters because the greeter is itself a wlroots compositor on VT 1 and a machine with no working
    GL may never paint the picker). But NOTHING DETECTS A FAILURE: greetd is a stock Fedora unit with no Restart=,
    no StartLimitBurst, no OnFailure= and no drop-in in the repo, apex-boot-health's two units are inert on every
    published image because both carry ConditionPathExists on LoaderBootCountPath and every APEX image boots GRUB,
    and no failure counter was built — deliberately, because the only wiring points are the boot-critical
    apex-greet-session and apex-shell-autostart and a counter that can strand somebody at a login screen is worse
    than none. A user enters this session; a failure does not. Also not done: GreetContext.qml:185 writes
    last-session on every launch, so picking Safe Graphics once makes it the preselected default forever — an
    apex-shell QML change that could not be run from here. NO recovery boot entry, deliberately and stated in the
    doc: AGENTS.md boot-path rule 1 forbids a shipped helper writing the ESP or an EFI variable and
    tests/test-boot-v2.sh scans for exactly that. Containerfile.base carries the build refusals (the -C flag, the
    three render variables, WLR_BACKENDS not pinned, an autostart that does not start APEX Shell, each menu
    remedy) written as if-then-echo FATAL-exit 1. HONEST ABOUT THE CHECKER: those refusals are in
    check-containerfile-assertions.sh's UNRESOLVED set and NOT in its 106 checked, so 'still 106 checked / 0
    failed / 0 inert' means the new stage broke nothing, not that it is covered. The RUN body was therefore
    extracted and executed locally with paths substituted: every assertion ran, including grep -q on the -C flag
    whose escaping has to survive Dockerfile then sh then grep, and against a copy of the tree with -C removed it
    prints its FATAL and exits 1. tests/test-apex-greet-sessions.sh 41/0, test-apex-greet-layout.sh 25/0,
    test-apex-greet-a11y.sh 5/0. shellcheck -S warning -x clean on every shell file touched, and both new helpers
    plus the suite are now inside pr-validation's hard shellcheck gate. NOT VERIFIED: no image was built, so
    nothing here has run on a real boot; the session was never started on real hardware or on a real GPU failure,
    only headless; and thunar and nmtui are on the menu and present on the L16 but are not asserted at build time,
    because this branch could not confirm which layer installs them.
- id: P2-019
  title: Design APEX Fleet / managed-device architecture
  priority: P2
  status: partial
  area: fleet
  depends_on:
  - BASE-007
  - P1-046
  acceptance:
  - Blueprint/policy/update-ring architecture can scale from one machine to managed fleets.
  - Design covers enrollment, inventory, compliance, update rings, managed secrets/certificates, app policy, remote health
    and recovery.
  - Enterprise/fleet support remains optional and does not turn personal APEX installs into managed devices by default.
  gates:
  - tests
  - stop_slop
  evidence: >-
    APEX Fleet architecture. docs/fleet.md on task/p2-f (commit 9779e443), NOT yet merged. A DESIGN item and a
    design is what landed: no fleet daemon, no apex fleet verb, no server, and the document says so in its first
    two sentences with every section marked built, partly built or not built. Criterion 2's list is covered
    section by section: enrolment (one root-owned record under /var/lib/apex-fleet/, the existing Noise pairing
    exchange rather than a second device identity, refused from inside a managed agent session the way
    apex-secretd already refuses Add/Remove/Grant/Approve, and authorisation as a match over EVERY verb with a
    table-driven test because that is the defect P2-016 found in apex-remoted), inventory, compliance, update
    rings, managed secrets and certificates, app policy, remote health and recovery. Criterion 3 is the FIRST
    section rather than the last, because it constrains everything else: an unenrolled machine has no fleet code
    path to disable, and leaving works from the keyboard. The one genuinely new contribution is where the
    staged-rollout pointer lives — docs/update-channels.md records that a ramp needs a number that changes between
    builds and an OCI label is baked once, so a ring is (channel, slot ceiling) served by a fleet endpoint, with
    an unenrolled machine keeping today's behaviour exactly. Two sections exist because leaving them out is how
    this gets built wrong: five things that must never be built (remote exec, a fleet that can approve a privilege
    request, silent enrolment, telemetry from unenrolled machines, fleet-owned user accounts) and five the design
    does not settle. PARTIAL AND NOT DONE because two of those five are criterion 1's own subject matter: the
    TRANSPORT is undecided (relay/ is an undeployed Noise_IK rendezvous, and whether a client polls, holds a
    connection or is pushed to changes the threat model) and THERE IS NO SERVER-SIDE DESIGN AT ALL — everything is
    written from the machine's point of view, and the operator's own access control is where a fleet's
    multi-tenancy lives. Also unsettled: what a ring ceiling costs to serve against docs/update-cost.md, whether
    the fleet-assigned machine id can be rotated, and the evidence standard for compliance, which really wants
    attestation and therefore depends on L-001's TPM work being partial. Gates: tests/check-doc-verbs.sh 235
    valid, 7 deliberate, 0 not a command, 0 undocumented and undeclared, 0 stale — the four apex fleet verbs went
    into tests/doc-verbs-allow, which is the file for commands a doc names on purpose because they do not exist,
    and three entries left tests/doc-verbs-undocumented because this document names them.
