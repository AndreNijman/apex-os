- id: P2-017
  title: APEX Online Accounts and brokered cloud identity layer
  priority: P2
  status: partial
  area: online-accounts
  depends_on:
  - P1-001
  - P0-002
  acceptance:
  - Architecture supports providers such as Nextcloud, Google, Microsoft, WebDAV and S3/R2 without spraying credentials
    across user config.
  - Apps/services receive scoped capabilities or standard portal/account integrations where possible.
  - Account removal revokes local capabilities cleanly.
  gates:
  - tests
  - stop_slop
  evidence: >-
    APEX Online Accounts. Landed on task/p2-f (10 commits off roadmap/v2.2 4b1e797f), NOT yet merged. The
    decision: an online account is a ServiceInfo in the store apex-secretd already owns, named
    account.<provider>.<name> — no accounts daemon, no second store, no second write path, because P0-002 already
    put credentials in /var/lib/apex-secretd/users/<uid>/ root-owned 0700 where the user's own uid cannot read one
    at rest, and P2-016 measured what a second write path costs. Five providers over THREE transports in
    apex-secret-core/src/account.rs (nextcloud and webdav both route into webdav: P1-001 routes on an operation
    id's first segment, so two spellings would need two registry entries that drift). apex account
    providers/scopes/add/list/grant/revoke/rm in apexd/apex/src/account.rs; docs/online-accounts.md. CRITERION 2
    IS MEASURED FOR WEBDAV ONLY, AND ONLY DAEMON-DIRECT: a new webdav provider (list/read/write) in apex-secretd,
    proven end to end against a loopback server that 401s a request carrying no credential — the app password
    arrives as Basic base64(me:<token>) at /dav/documents/notes.md, i.e. the caller's path UNDER the pinned base
    path, the caller gets the body, and the token is in no reply, no output and no audit line. The tests call
    Request::Use on secretd directly; the apex-agentd forwarding path a confined session would use was NOT
    exercised, though a grep of apex-agent-core/src/policy.rs and apex-agentd/src/main.rs finds no provider
    enumeration there, so there is nothing for webdav to be missing from. CRITERION 3 IS MEASURED: removing the
    account makes the same Use that succeeded a moment earlier fail, the grant is gone from the table rather than
    merely unmatched, and a walk of the whole store finds the sentinel nowhere. CRITERION 1 IS NOT MET FOR THREE
    OF THE FIVE PROVIDERS NAMED IN IT: the RFC 8628 device-code flow is not wired to Google or Microsoft
    (apex/src/cloudflare.rs has a complete implementation to reuse, including its best idea — the refresh token
    under a SEPARATE service pinned to a different host so the endpoint pin makes it unspendable as an API token),
    nothing refreshes any token including Cloudflare's, and S3/R2 has no SigV4 signer, which is the wall P1-011's
    temporary.rs already hit. Also not built: no gvfs/file-manager integration. Gates: cargo clippy --locked
    --workspace --all-targets -D warnings clean; cargo test --locked --workspace 48 suites 0 failed;
    tests/test-secret-broker.sh 66/0; tests/check-doc-verbs.sh 235 valid, 0 undocumented-and-undeclared, 0 stale;
    tests/test-apex-verbs.sh 64/0 (it had been failing its own reverse pass 59/1 before this branch — lid,
    permissions, user and vm were unlisted). TWO MUTATIONS BOTH BIT: presentation() always returning
    HttpAuth::Header sent the raw sentinel where Basic belonged and reddened both the unit test and the end-to-end
    one; broker::webdav_url's valid_path guard deleted took apex-secretd from 252/0 to 250/2. Both restored with
    plain cp, cmp silent. THREE DEFECTS FOUND AND FIXED IN THIS BRANCH'S OWN WORK: apex account grant keyed on the
    CURRENT DIRECTORY where apex secret grant keys on the project ROOT, so a grant made from any subdirectory was
    allowed, reported and silently inert; add took an empty --username for a Basic provider, which would have sent
    the password as a bare Authorization header and read back as a wrong password; and the Nextcloud default path
    was the bare /remote.php/dav/files prefix, where Nextcloud serves files at /remote.php/dav/files/<username>/ —
    so EVERY Nextcloud account this branch could have stored would have 404d on every file, in a way that also
    reads like a wrong password. Provider::path_for composes it, in the core crate so a second caller cannot get
    it wrong differently. NOT VERIFIED: nothing was run against a real Nextcloud, Google, Microsoft or S3
    endpoint. LANDED 2026-09-14 (round 25): apex-os 13d53c01 -> fdf0a8e6 carries task/p2-f-3 (c224eea7) - A SCOPE
    MAY NOT NAME AN OPERATION NO PROVIDER OFFERS. The defect the S3 landing exposed: apex account grant google
    files.read recorded a grant for gdrive.file.read, and no provider in default_registry() offers gdrive.* or
    msgraph.*, while S3_SCOPES named s3.object.list which the S3 provider does not offer either (it has
    s3.object.read and s3.object.write). apex-secret-core cannot see the registry, but apex-secretd depends on
    apex-secret-core, so the cross-crate gate lives there. Both mutants run and red. cargo test --locked
    --workspace on the landed tip: 3189 passed, 0 failed, 2 ignored. LANDED 2026-09-14 (round 26): apex-os
    roadmap/v2.2 fdf0a8e6 -> 2219ef75 carries task/p2-f-3 9e0a8c7d, the OAuth table a daemon-side refresh is
    routed BY. apex cloudflare connect has always stored a refresh token that nothing could spend, because the
    daemon had no way to find a token endpoint that was not 'ask the caller' -- and a caller who names a token
    endpoint is a caller who chooses where a credential gets sent. The table is OAuth{device_url, token_url,
    auth_host, scopes, client_secret, client_id}, one row per authorisation server, reached only through
    oauth_for_auth_host(), which takes the host the credential was ALREADY PINNED TO and nothing the caller said;
    there is no request shape that can aim a refresh elsewhere. It lives in apex-secret-core because two binaries
    need it and neither links the other (apex runs the device grant, apex-secretd runs the refresh), and the CLI's
    AUTH_HOST, WRANGLER_CLIENT_ID and Endpoints::cloudflare() now read off it instead of repeating its literals --
    RFC 6749 section 6 requires a refresh to present the same client the grant was issued to, and those halves run
    in different processes, so two copies is one copy that can drift. Provider::validate holds the table to four
    rules that were each otherwise a silent failure. +577 in apex-secret-core/src/account.rs, +25/-6 in
    apex/src/cloudflare.rs. Verified on the landed tip: cargo test --locked --workspace 3218 passed / 0 failed / 2
    ignored. ROUND 27 (2026-09-14): LANDED as merge de78631e - 862d1c37 (an operation declares whether it may
    supersede a stored credential) and 306e79e1 (the framework half of a refresh), 908 insertions across 10 files
    with apexd/apex-secretd/src/service.rs +634. supersedes_credentials is mandatory on OperationSpec with no
    Default, Bound::replaces is a Vec (RFC 6749 section 6 lets the server rotate the refresh token, so a refresh
    replaces BOTH the access credential and the rotated refresh), and Replaced carries value only - no host,
    scheme or username - so a refresh structurally cannot repoint a credential's pin. The oauth PROVIDER itself is
    the next commit and was still uncommitted in the worktree at landing time; it is snapshotted to refs/wip and
    handed to round 27's fresh agent as its first action. ROUND 28 (2026-09-18), on task/p2-f-3, five commits
    PUSHED, NOT yet merged: eeaf08ac, 202ee465, 5b153599, bda510ed, 8f60dd5e. CRITERION 1'S OAUTH HALF IS BUILT.
    apex account add google.work --client-id <id> runs RFC 8628 and files both halves; apex account refresh
    <account> spends the refresh token through the oauth provider that landed in round 27. THE DEVICE GRANT MOVED
    out of apex/src/cloudflare.rs into apex/src/oauth_device.rs and takes what varies as arguments:
    Endpoints::for_oauth(&OAuth) off the shared table, OAuthClient{id, secret}, the scope list, and Prompt{label,
    retry} so the printed line names a provider a person recognises and an expiry names the command they actually
    ran rather than apex cf connect. THREE INTEROP DEFECTS FIXED THAT NO LOOPBACK DOUBLE COULD HAVE CAUGHT,
    because a double answers what it was written to answer: Google's device endpoint returns verification_url and
    RFC 8628 3.2 says verification_uri, so reading only the standard key would have failed EVERY real Google
    sign-in with 'no verification address' while the double stayed green; the poll had no slot for a client_secret
    at all, which Google lists as required there, so the flow could not have completed at Google; and the token
    cap was 4096, a number Cloudflare never approaches and a Microsoft JWT with a normal claim set does - it is
    the daemon's 8192 now, held under SecretValue::MAX_BYTES by a const _: () = assert!() at compile time.
    --client-id IS REQUIRED AND THERE IS NO DEFAULT, which is the decision rather than a gap: APEX registers no
