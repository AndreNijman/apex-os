- id: P0-013
  title: Track request_origin for privilege/capability requests
  priority: P0
  status: done
  area: remote-control
  depends_on:
  - P0-004
  acceptance:
  - Local, Remote Control, MCP, subagent, scheduled and cloud origins are distinguishable
  - Policies can differ by origin
  - Audit graph records origin
  gates:
  - tests
  - stop_slop
  evidence: >-
    Landed on roadmap/v2.2 (720c1f8). All three criteria met. Origin is established rather than asserted: an
    unsessioned peer is classified from /proc/<pid>/cgroup and its controlling terminal, where session-N.scope is
    a login and user@N.service is a scheduled job with nobody present, and a process can choose neither; a
    connection belonging to a session inherits that session's origin, since re-observing would answer local-
    terminal for every Remote Control agent; and a client may declare only a narrower origin, with local-terminal
    and apex-shell undeclarable. The narrowing rule is stated over both properties policy reads rather than a
    trust rank, because mcp is less trusted for elevation and more permitted on lock, so one rank would let a
    Remote Control session redeclare itself mcp and buy back the lock rule it was denied, asserted over all 49
    pairs. Fail-closed, a /proc read that fails is refused with the path rather than defaulted to local. Carried
    on SessionInfo, PrivilegeRequest and both audit logs beside origin_source, so a record saying claude-remote-
    control also says whether the daemon observed it or a client asked. PROTOCOL_VERSION 3, and the brittle
    assert_eq between it and the dimensions version was replaced by a guard that pins each version to a revision
    that exists. 1255 tests on the integration branch.
