    prior MCP test showed that nothing on APEX's side put the token where a session could reach it, which is a
    test that nobody handed it over, not that nobody CAN. Section 13.12 is about the other direction: a remote MCP
    server is somebody else's code and an MCP client's job is to show the model its reply. The fixture now echoes
    the Authorization header it received into its JSON-RPC result, in both plain-JSON and event-stream framing,
    and the test asserts three things — the server really received Bearer <sentinel>, the caller's output does not
    contain it, and the redaction marker IS present, which is what stops a fixture that quietly stopped echoing
    from passing. Two independent scrubs cover that path (broker's HTTP reader and the framework's scrub_all after
    perform), so neither alone bites; removing both turns the test red. A second test smuggles a url and an
    endpoint into the body — the one field a session controls, since mcp.request declares no resource and no
    parameters — pointing at a second live server on loopback, and measures at both: the stored server got the
    message with the fields intact and inert, the other was never contacted. A mutation that took the
    destination's port out of the body DOES reach the other server, which records a real limit worth knowing: the
    framework's pin compares scheme and host and NOT port, so what protects this path is that perform builds the
    request from the stored record itself and never from bound.endpoint. THE GAP THIS ROUND CLOSED, and the reason
    P1-017 was not already met: apex mcp list classified a remote server with no Authorization header as
    Credential::None, agent_readable() false — so section 13.12's exact case, 'the MCP server supports OAuth',
    read as the criterion being met. It is an absence inferred from a file that would not mention it either way: a
    remote server either needs no credential or the AGENT authenticates to it, and a token the agent's own runtime
    obtained is agent-readable by construction because the agent is what sends it. New variant
    Credential::AgentAuthenticates, agent_readable() true, '"where": "agent"' in the JSON so a consumer can tell
    'nothing to protect' from 'the model holds it', and the printed way out is apex mcp connect <name>. Stdio
    keeps None. Connecting such a server now also reports that it replaced a credential, which it previously
    denied. CHECKED, NOT ASSUMED: Cloudflare's remote MCP servers (mcp.cloudflare.com,
    bindings.mcp.cloudflare.com, docs., observability. and a dozen more) accept a Cloudflare API token as
    Authorization: Bearer — their own agents docs say so for CI and automation, user and account tokens both — so
    apex mcp connect can route them. They are a DIFFERENT host from api.cloudflare.com and therefore need their
    own stored credential with its own pin; the existing cloudflare credential cannot be reused. No hostname is
    hardcoded anywhere: the rule is about remote servers and a list of Cloudflare's would go stale. NOT DONE,
    deliberately: no live connect was run against a real Cloudflare MCP endpoint, because it would rewrite the
    user's ~/.claude.json and spend the real token; the connect flow is driven against a temporary home instead.
    Nine mutations (M13b, M13c, M14, M18, M19, M20, M21 and the budget ones that gate mcp.request), each biting a
    named test. Workspace 2906 -> 2910 passed, 0 failed. Clippy --locked --workspace --all-targets -D warnings
    clean. The branch was then merged with roadmap/v2.2 @ 882a7176, whose as_json grew a second argument; on the
    merged tree (tip 92e937cd) the workspace is 2918 passed, 0 failed, clippy clean. MEASURED rather than
    inferred: tests/test-secret-broker.sh is 63 passed / 2 failed on 4ed092b8, this branch's base, and 64 / 1
    here; the shared failure asserts 'cloudflare.dns.delete' is not an operation, which P1-008 made false. Neither
    failure is this branch's.
