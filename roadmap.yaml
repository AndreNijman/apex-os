    shell, so the OS-side CLI cannot disagree with the shell about a manifest. Enforcement is dual-layer and was
    called for real, a load-time import scan refuses an undeclared Quickshell.Io reach (forbidden-import) and the
    runtime gate refuses an undeclared network call and a path traversal outside the plugin directory. Crash
