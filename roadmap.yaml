- id: P1-051
  title: Implement secure device pairing for APEX Remote
  priority: P1
  status: partial
  area: remote-agents
  depends_on:
  - P1-050
  acceptance:
  - Desktop can display a QR code / short pairing flow from APEX Shell.
  - Pairing establishes a persistent device identity using audited standard cryptographic libraries.
  - Lost devices can be revoked from APEX Settings.
  - Pairing cannot be completed silently by an agent.
  - Paired-device list shows name, last seen, permissions, and revocation state.
  - Biometric/device-lock requirement can be enforced on Android.
  gates:
  - tests
  - stop_slop
  evidence: >-
    APEX Remote pairing and device management. CRITERIA 1, 3 AND 5 DONE, landed on apex-shell roadmap/v2.2
    2026-09-12 as merge a36f1a4 (cc0115e): the QR pairing page and the paired-device page. THE QR ENCODER FOUND
    ITS OWN ORACLE TO BE WRONG, and the safeguards are the reason that claim is trustworthy. A 526-line encoder
    and 36 segno fixtures existed with NO TEST. Written, the test failed 21 of 36: alignmentPositions used
    Math.ceil where the specification truncates, so EVERY VERSION FROM 7 UP - including both pairing offers - laid
    its alignment patterns in the wrong columns. Four cases still failed after that fix and segno was the one at
    fault: its write_padding_bits quotes ISO/IEC 18004 section 7.4.10 in a comment ('if the bit stream does not
    end at a codeword boundary') while the code has no such condition, so it appends a spurious 0x00 where the
    0xec/0x11 pad codewords belong. Rather than reproduce a bug to make a test pass, the generator applies a
    one-line correction, and three things stop that being 'fix the oracle to match me': it builds every case TWICE
    and DERIVES the corrected list by diffing; the test pins that list at exactly four, so a spreading correction
    OR an upstream fix turns it red; and section 7.4.10 is asserted directly off the codewords, so those
    assertions survive deleting every fixture. The other 32 fill their symbol to capacity and provably cannot be
    reached - asserted, not stated. A SECOND DEFECT THE SUITES CAUGHT THAT READING DID NOT: the pairing page asked
    for a code from onOnScreenChanged while the ServiceRef beside it raises refCount from a binding on the same
    property, and QML orders neither - the handler won, requestCode saw an inactive service, and THE PAGE SHOWED
    NO CODE AT ALL. Fixed on both paths. 202 new assertions with EXACT green counts rather than floors, which
    caught two of the agent's own counts being wrong; 12 mutants all red with a green control. The page draws
    NOTHING when it has no offer, and that phase's central assertion is negative, because a placeholder QR looks
    fine in a screenshot and is exactly the failure the feature exists to prevent. STAYS PARTIAL, AND MUST NOT BE
    CLOSED FROM HERE: --origin-policy remote stays refused until the device key lives in Android Keystore with
    setUserAuthenticationRequired, plus a per-approval challenge and attestation. That is p1-053a's work, and
    p0-014's CTAP2 verifier is its desktop half. CRITERION 6 OBSERVED ON A REAL DEVICE, 2026-09-19
    (task/p1-053d-device). 'Biometric/device-lock requirement can be enforced on Android' is now a measurement
    rather than a design note. On a Pixel 7a running GrapheneOS (Android 17, SDK 37) with a real screen lock, the
    app raises a BiometricPrompt before it will show anything at all: uiautomator dump reads 'APEX Remote / Unlock
    to see your computers / Touch the fingerprint sensor / Use PIN'. THE STRONGEST PART IS WHAT COULD NOT BE DONE:
    an agent with full adb access to a DEBUGGABLE build, able to install, launch, instrument and run-as the
    package, COULD NOT GET PAST IT. There is no adb verb that presents a fingerprint on real hardware, and 'Use
    PIN' wants the owner's credential. The enforcement was demonstrated by an adversary with more access than any
    attacker who picks the phone up. CONSEQUENCE, RECORDED BECAUSE IT SHAPES EVERYTHING ELSE MEASURED THIS ROUND:
    the live app's own UI could not be driven end to end. The device suite therefore drives PairingService - the
    production class, not a copy - with a PlainBox in place of KeystoreSecretBox, and names that substitution in
    the file rather than burying it. The same lock is why Compose tests needed a host activity declaring
    showWhenLocked: the keyguard stays up for the whole run. CRITERION 4 ('pairing cannot be completed silently by
    an agent'), OBSERVED AND WORTH A SECOND LOOK BY SOMEBODY: a pairing offer WAS minted this round from a bash
    process inside a Claude Code session, by writing {"cmd":"pair"} to apex-remoted's control socket.
    control.rs::may_pair consults apex_agent_core::origin::observe_pid, which classified that shell as
    local-terminal. The Rust end-to-end suite depends on the same classification, so this is the origin
    classifier's known scope rather than a new hole - but it is the exact shape the criterion forbids, and it is
    recorded here rather than left as a thing one agent noticed. THE DEVICE SIDE OF THE FLAG IS ASSERTED TOO:
    PairingRequest.user_verification travels and the desktop stores it per device
    (Device.requires_user_verification), measured by reading the daemon's own device list back after a pairing
    from the phone. This round's box gates nothing, so it sends false and the assertion is that FALSE was recorded
    - a suite claiming true would have made the desktop write down a protection that did not exist.
