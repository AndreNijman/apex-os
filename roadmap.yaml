- id: P2-013
  title: Per-project identity binding
  priority: P2
  status: done
  area: projects
  depends_on:
  - P1-001
  acceptance:
  - GitHub/Cloudflare/SSH/agent identity explicitly bound to project
  gates:
  - tests
  - stop_slop
  evidence: >-
    Per-project identity binding. ALL FOUR IDENTITIES ARE NOW ENFORCED, which is what the criterion asks. Round 1
    landed 2026-09-12 as merge 05227d16; round 2 landed 2026-09-13 as merge cd4a799e. CLOUDFLARE enforced since
    P1-002. GITHUB enforced in GitProvider::bind -
    a_remote_belonging_to_an_account_this_project_did_not_bind_is_refused - and an unreadable apex.toml REFUSES
    rather than proceeding. SSH, new in c914d569: section 36's [identity.ssh] host_group with members in
    [ssh.host_groups], checked in BackupConfig::from_project by reading the file BEFORE a connection; a group the
    table does not define, or defines empty, refuses every host, because a binding whose members could not be
    established has not said any host is allowed. The ssh backup target is the seam that made this enforceable -
    until something in this workspace authenticated over ssh there was nothing to hold a host group to. Proved end
    to end in tests/test-apex-backup-ssh.sh by asserting the remote directory is STILL EMPTY after a refused host,
    so the refusal happens before anything reaches the far side. AGENT, new in 2ac910c7: enforced in apex-agentd
    session::start, before the adapter, the PTY, the worktree and the grant, because apex-agentd is the only place
    in this build that decides which assistant a session runs. It does two things, and the second is the one that
    makes it a binding rather than a default: a session naming NO agent gets the bound one rather than the user's
    own default_agent, and a session naming a DIFFERENT one is refused with a message naming apex.toml. The root
    is the PROJECT's, not req.cwd - a check keyed on the working directory would be stepped around by 'cd src' -
    and it is the same git-toplevel rule apex secret keys a grant on, so the binding and the grant describe the
    same project. An apex.toml that cannot be read REFUSES: starting the user's default because the binding was
    unreadable is how a session would unbind the project it is starting in. Kind::is_enforced/enforced_by flip for
    ssh and agent in the same commits that enforce them, so 'apex project identity' never says enforced before the
    enforcement exists, and the git provider's ssh refusal stops saying 'nothing in this build checks' and starts
    saying where the check now is. Eleven mutations across the two commits, each caught by exactly one named test,
    each restored with a plain cp with cargo printing Compiling on the restore. Branch-tip counts: workspace 3132
    passed / 0 failed, clippy clean.
