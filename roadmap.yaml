- id: P1-016
  title: Cloudflare cost guardrails
  priority: P1
  status: done
  area: cloudflare
  depends_on:
  - P1-002
  acceptance:
  - Per-task/project budget supported
  - Operation caps supported
  - Usage visible in task audit
  gates:
  - tests
  - stop_slop
  evidence: >-
    Cloudflare cost guardrails, landed from task/p1-014-cf-guardrails (tip 32b96c8). Section 13.14 is now a
    reader, an enforcement point and a report, none of them Cloudflare-specific: the keys read cloudflare_daily
    because 13.14 spells them that way, but the prefix is the stored credential's own name. PER-TASK/PROJECT
    BUDGET: [agent.budget] in a project's apex.toml, read by Budget::read_or_unbudgeted. A task bound to a
    worktree spends the worktree's apex.toml, because the trail records the directory the agents ran in and the
    daemon matches a root exactly, never as a prefix — so a worktree's budget IS the per-task budget and no second
    mechanism in tasks.toml was invented. OPERATION CAPS: operations_daily across all credentials,
    [agent.budget.operations] per operation id, and [agent.budget.price] with a <credential>_daily money cap.
    Enforced at step 7 of use_capability, before the provider touches the caller's machine and before the section
    13.8 approval can be spent — an over-budget request must not burn an approval given for a deployment. USAGE
    VISIBLE IN TASK AUDIT: apex task audit <id> (section 15's own verb) over a new read-only daemon verb
    Request::Usage, plus a spend field on every audit line (within/over/unmeasurable/no-budget/not-checked). Five
    words because 'no cap', 'inside the cap' and 'nobody looked' are three different facts. TWO HONEST LIMITS,
    both in the code's docs and not only here: (1) section 13.14 names 'R2 upload volume' and nothing in this
    build measures bytes, so r2_bytes_daily is REFUSED when the file is read rather than accepted and ignored; (2)
    this build cannot price a Cloudflare operation — prices are not in the API and depend on a plan the machine
    cannot see — so a money budget with no price for something that ran is Spend::Unmeasurable and REFUSES. 'I
    cannot tell what this costs' is not 'it is within budget'. Also refused: a cap on an operation no provider
    implements, including one spelled as a grant alias, which names the canonical spelling. Usage is counted from
    the WHOLE trail, never audit::tail's window — a budget counted from the last N lines is one a busy machine can
    hide an operation from. A reservation held from the check until the trail line is written closes the TOCTOU
    that one-thread-per-connection opens: without it a cap of one is spent twice, measured by a named test with
    two concurrent sockets and a slow far side. An unreadable apex.toml refuses rather than counting as no budget
    — an agent that can chmod 000 its own budget file must not thereby lift its own cap. Twelve mutations, each
    biting a named test, listed in the four commit messages. Workspace 2880 -> 2906 passed, 0 failed. Clippy
    --locked --workspace --all-targets -D warnings clean. A THIRD LIMIT, found in review and named here rather
    than left to be discovered: a budget is per ROOT, and a worktree is its own root. A worktree is a checkout of
    the same repository, so it carries the same checked-in apex.toml — which means operations_daily = 200 gives
    the project root 200 a day AND each worktree its own 200. Per-task is genuinely met, because a worktree is its
    own pool, which is the shape 13.14 asks for; a cap over a project INCLUDING its worktrees is not implemented,
    and an agent that can start a session per worktree escapes the project's cap by the number of worktrees.
    Summing them would reverse P1-015's exact-match rule for one reader, so it is a design decision rather than an
    oversight and is recorded on the agent card as its own task. The branch was then merged with roadmap/v2.2 @
    882a7176, whose as_json grew a second argument; on the merged tree (tip 92e937cd) the workspace is 2918
    passed, 0 failed, clippy clean, and tests/test-apex-task.sh is 71/0 with the new apex task audit verb. Two
    test assertions that measured this laptop rather than the code were corrected before landing: the race test
    asserted the trail's ORDER, which is a fact about thread timing and would fail on a loaded runner, and the
    unreadable-budget test relied on mode bits, which mean nothing to root, so it now leads with a budget that
    does not parse and guards the permission arm on getuid. MEASURED rather than inferred:
    tests/test-secret-broker.sh is 63 passed / 2 failed on 4ed092b8, this branch's base, and 64 / 1 here; the
    shared failure asserts 'cloudflare.dns.delete' is not an operation, which P1-008 made false. Neither failure
    is this branch's.
