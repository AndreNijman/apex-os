  - stop_slop
  evidence: >-
    ROUND 29 (2026-09-18) - STATUS UNCHANGED, still blocked; this records what exists toward it so the next reader
    does not re-derive it. THE ACCEPTANCE IS 'does not strand users across qualified hardware/recovery cases', and
    the case that had no scenario at all now has one: apex-os task/later-2 adds luks-no-tpm to
    files/scripts/boot-v2/run-scenarios, 16 passed / 0 failed / 1 could-not-run, container later-r7-notpm ExitCode
    0. One volume booted twice with the TPM DEVICE as the only difference: with it, tpm-unlock=SUCCESS and
    plaintext-marker=written; without it, tpm-device=absent, tpm-unlock=REFUSED, recovery-unlock=SUCCESS and
    recovery-marker=found, so the recovery key returns the same plaintext the TPM path wrote. The qemu exit status
    is asserted, because a guest that hangs on a missing TPM strands the user as surely as one that refuses. THE
    TPM IS EMULATED (swtpm), and the run does not model a machine that NEVER had a TPM - such a volume could not
    carry a systemd-tpm2 token at all. THREE THINGS STILL BLOCK THIS, none of them fixed by that scenario. (1)
    L-001's acceptance word 'Real' is unmet: no silicon TPM has done an enrol-and-recover cycle, and
    state/queue.json makes L-002 wait on it. (2) THE INSTALLER CANNOT ENCRYPT AT ALL - re-verified round 28: every
    crypto_LUKS branch in installer/apex-install is a refusal to overwrite an existing header (:920-925), never a
    path that creates one, and the same at apex-installer-gui:170. There is no in-place path either. (3) The
    supporting details are unresolved: the initramfs keymap is always 'us' (Containerfile.core:2104-2107),
    plymouth's message() is a no-op (apex-os.script:230), and cryptsetup is an unpinned transitive dependency
    asserted nowhere. Two SHIPPED files already assert LUKS2+TPM2 as settled fact (apex-session-select:18-22 and
    its sudoers :9-12), which is a defect regardless of when this lands. docs/boot-v2.md carries the five-run
    hardware procedure that would satisfy (1). LANDED round 30 (2026-09-19): merge c6bc990a carries round 29's
    boot-v2 work; nothing on this item changed and nothing here was re-verified. STAYS BLOCKED on L-001, and the
    dispatch unit `later` is closed to dispatch from this round for the reason recorded on L-001 - the remainder
    is Andre's five-run hardware procedure in docs/boot-v2.md, not an agent's. ROUND 31 (2026-09-19) - STATUS
    UNCHANGED, still blocked, but ONE of the three blockers is now smaller and a FOURTH has appeared. Real silicon
    was finally available (MSI Katana GF76 12UG, Intel PTT fTPM, INTC/ADL fw 0x2580012); see L-001 ROUND 31 and
    ROADMAP/evidence/L-001-katana-tpm-20260919.md. BLOCKER (1) NARROWS: the acceptance is 'does not strand users
    across qualified hardware/recovery cases', and the enrol-and-recover cycle itself now passes on real hardware
    - a LUKS2 volume with one systemd-tpm2 token and one systemd-recovery token unlocked through the TPM in 0.29 s
    and through the recovery key in 0.032 s, returning the same plaintext both ways, and survived a real
    suspend/resume with a fresh unseal afterwards. What is still unqualified on silicon is the TPM CLEAR (not run
    - a live Windows install owns katana's TPM and a clear costs Andre's Windows Hello PIN; it needs his yes, not
    a machine, and the two-command PPI procedure is written down) and the TPM-REMOVED case (could-not-run - PPI
    Disable is reachable but re-enabling needs somebody in firmware setup). BLOCKER (2) IS UNCHANGED AND UNTOUCHED
    BY THIS ROUND: the installer still cannot encrypt a disk at all - every crypto_LUKS branch in
    installer/apex-install is a refusal to overwrite an existing header, never a path that creates one. Nothing on
    katana was encrypted either; the whole run was on loopback files, deliberately, because katana's system disk
    must not become encrypted. BLOCKER (3) unchanged: initramfs keymap always 'us', plymouth message() a no-op,
    cryptsetup an unpinned transitive dependency. NEW BLOCKER (4), and it is squarely in this item's subject
    matter: `systemd-cryptenroll --tpm2-device=auto` ON SYSTEMD 258.10 BINDS TO NO PCRs AT ALL - tpm2-hash-pcrs
    empty, tpm2-pcr-bank n/a, tpm2-policy-hash 32 zero bytes, measured on katana. A 'LUKS2 by default' built on
    that default would seal the volume key to the SRK and nothing else, so any OS booted on the same hardware
    could unseal it. Whatever turns encryption on must pass --tpm2-pcrs= or --tpm2-public-key-pcrs= explicitly,
    and a test must assert the enrolled token actually carries a policy rather than that the command exited 0.
- id: L-003
  title: Enable TPM auto-unlock by default where safe
  priority: Later
  status: blocked
  area: boot-security
  depends_on:
  - L-001
  - L-002
  acceptance:
  - Measured boot + TPM unlock + recovery path validated
  gates:
  - tests
  - stop_slop
  evidence: >-
    ROUND 32 (2026-09-20), unit `luks-enroll`, branch task/luks-enroll off roadmap/v2.2 303221d5, PUSHED and NOT
    landed. STATUS UNCHANGED - still blocked, and deliberately: the acceptance is 'Measured boot + TPM unlock +
    recovery path validated' and it depends on L-002, whose installer is another unit's. WHAT NOW EXISTS is the
    thing an installer calls: files/system/libexec/apex-luks-enroll, shipped by Containerfile.base as
    /usr/libexec/apex-luks-enroll, interface `--device DEV --recovery-out PATH`. Full record:
    ROADMAP/evidence/L-003-enrolment-20260920.md. A RECOVERY KEY IS ENROLLED FIRST ON EVERY PATH and the exit
    status is 0 in every declined case, so an installer cannot read 'no TPM slot' as a failed install. THE BINDING
    IS CHOSEN, NOT HARDCODED: policy_select is a best-first table (signed-pcr11, then pcr7) and each probe tests
    its own preconditions, so the bootloader pivot to systemd-boot needs no restructure - probe_signed_pcr11 is
    written and reachable, requiring an sd-stub boot (StubInfo efivar), a published key at
    /run/systemd/tpm2-pcr-public-key.pem and a PCR 11 that is measurably non-zero, and IT HAS NEVER BEEN EXERCISED
    because nothing in the lab boots the shipped script under sd-stub. On a machine today that means: Secure Boot
    on -> a TPM slot bound to PCR 7 with a non-zero policy hash; Secure Boot off -> no TPM slot, recovery key, and
    prose naming Secure Boot, what to change, where, and the command to re-run; no TPM -> no TPM slot, recovery
    key, and the PTT/fTPM firmware settings to look for. Also tested: setup-mode (SecureBoot reads 1 with no
    platform key) and pcr-uninitialised (Secure Boot claims on but PCR 7 was never extended - the slot is created
    and then REMOVED again). MEASURED IN THE BOOT LAB ON KATANA, swtpm only, no real disk encrypted and katana's
    TPM neither cleared nor touched: (1) a bare systemd-cryptenroll --tpm2-device with no PCR selection writes
    tpm2-pcrs [], NO tpm2-pcr-bank field at all and a 64-zero policy hash, and exits 0 - L-001's silicon finding
    now reproduced in the lab; (2) --tpm2-pcrs=7 against an unextended PCR 7 produces a PERFECTLY GOOD-LOOKING
    NON-ZERO POLICY HASH while printing 'PCR policy effectively unenforced' on stderr, so the policy-hash
    assertion CANNOT catch that case and both checks are needed; (3) --unlock-tpm2-device succeeds only on a real
    unseal and refuses once PCR 7 moves, so the security property is testable with no guest and no device-mapper;
    (4) cryptsetup open --test-passphrase --key-file needs no device-mapper; (5) the TPM2 PIN env var is NEWPIN,
    not NEWPASSWORD; (6) tpm2-tools falls back to /dev/tpmrm0 when TPM2TOOLS_TCTI is unset and prints
    TPM2_PT_MAX_AUTH_FAIL on ONE line on 5.7; (7) podman drops CAP_MKNOD so the TPM-node fixture is a symlink to
    /dev/null; (8) tpm2-tools reaches the image only as a dependency of clevis and is pinned by no line in
    Containerfile.core. GATES: four new scenarios in run-scenarios' DEFAULT set (enroll-sb-on, enroll-sb-off,
    enroll-no-tpm, enroll-bare-policy) at 75 passed / 0 failed / 0 could-not-run; tests/test-boot-v2.sh 120 passed
    / 0 failed with a new static section that runs on every PR with no lab; check-containerfile-assertions 197
    checked / 0 failed / 0 inert; shellcheck coverage clean; doc-verbs 194 documented / 0 undocumented and
    undeclared / 0 stale. THE NEGATIVE CONTROL IS THE POINT: enroll-bare-policy enrols a volume WITHOUT the
    production script, verifies the control is known-bad rather than assuming it, and requires --check to exit 2.
    Three Containerfile.base build assertions (no PCR 0, no TPM2 device named without a PCR selection beside it,
    no boot-path command) were each run against a mutant and against a comment-only control before being
    committed. MUTATION SWEEP, each mutant restored with plain cp and verified byte-identical by sha256, baseline
    green before and after: dropping the Secure Boot clause from probe_pcr7, binding PCR 0, enrolling with no PCR
    selection, making --check always exit 0, faking the recovery key, removing the TPM device-node check, and
    binding PCR 7 AND 11 were ALL CAUGHT. A HARNESS DEFECT FOUND AND FIXED, MEASURED TWICE: systemd-cryptenroll
    --tpm2-with-pin=yes blocked the harness for seven minutes on a terminal prompt, and then for THIRTY-SIX
    MINUTES with stdin on /dev/null and no terminal at all, because systemd falls back to its ask-password SOCKET
    protocol and waits for an agent that never comes; every invocation is now bounded by timeout(1). THE ONE
    CLAUSE OF THE ORCHESTRATOR'S DIRECTION NOT FOLLOWED, stated rather than quietly worked around: signed PCR 11
    is still gated on Secure Boot. A signed policy is PolicyAuthorize over a PolicyPCR digest; the signature ships
    in the UKI's .pcrsig section and is PUBLIC, PCR 11 starts at zero every boot, tpm2_pcrextend 11 works from
    plain root (tpm2_pcrreset 11 answers 'bad locality'), and every digest that composes the signed value is a
    hash of public material - so an attacker who can boot any kernel replays the extends and unseals without
    APEX's private key, and building our own kernel does not change it because they need our PCR VALUE and not our
    kernel. L-001 s3.1 and the lab script's own header say the same thing. Overruling it is one clause in one
    probe; --with-pin is the honest route for a machine that will not enable Secure Boot. WHAT IS STILL OPEN: the
    in-BOOT half of the PCR 7 binding is UNPROVEN - the scenarios prove what the header holds and that the slot
    unseals and stops unsealing when PCR 7 moves, all host-side, while luks-tpm boots a real guest only against
    the lab's signed PCR 11 policy; a guest scenario for a PCR-7-bound volume needs a staged APEX root and belongs
    in STAGED. No image build was run, probe_signed_pcr11 has never been taken, and the installer is L-002's.
    ROUND 29 (2026-09-18), STATUS UNCHANGED, still blocked; recorded so the reason lives in the item rather than
    only in an agent card. THE ACCEPTANCE IS 'Measured boot + TPM unlock + recovery path validated', and all three
    are validated in a VM against swtpm. apex-os files/scripts/boot-v2/run-scenarios covers measured boot and TPM
    unlock (luks-tpm), a TPM clear with recovery in the same boot (luks-tpm-clear, 22/0, re-measured round 29
    after the shared guest probe changed, and strengthened to assert the recovery key returns the same plaintext),
    both halves of a firmware change (luks-firmware-change moves PCR 7, 18/0/1; luks-firmware-code moves PCR 0,
    22/0/1, new this round), suspend and resume (luks-s3, 17/0 on edk2-20250812), and a missing TPM with recovery
    in the same boot (luks-no-tpm, 16/0/1, new this round). IT CANNOT BE TURNED ON BY DEFAULT FOR THE SHIPPED
    IMAGE, and the measurement that says so is not about policy: PCR 11 IS ALL ZEROS ON THE L16 (measured
    2026-09-13, read-only). The shipped image boots GRUB through bootupd and only sd-stub extends PCR 11, so the
    signed PCR 11 policy that boot-v2 chose has nothing to bind to on a default install. 'Where safe' is therefore
    nowhere until a machine boots the UKI and sd-stub path, which is the human enrolment procedure in
    docs/boot-v2.md. Depends on L-001, where no silicon TPM has done an enrol-and-recover cycle, and on L-002,
    where the installer cannot encrypt a disk in the first place. NOTE FOR WHOEVER RECORDS AGAINST THIS ITEM NEXT:
    ROADMAP/set-status.py could not write evidence to the LAST task in roadmap.yaml at all. Its body regex ran to
    the next '- id: ' line, which for the final task means it swallowed the global_agent_rules block and produced
    a file that does not parse; the guard refused to write, so nothing was corrupted and nothing could be
    recorded. Fixed this round to capture the run of indented lines instead, verified by checking that both
    expressions capture identical bodies for all 127 other tasks. LANDED round 30 (2026-09-19): merge c6bc990a;
    nothing on this item changed and nothing here was re-verified. STAYS BLOCKED on L-001 and L-002. The dispatch
    unit `later` is closed to dispatch from this round - see L-001. ROUND 31 (2026-09-19) - STATUS UNCHANGED,
    still blocked, and the reason is now MEASURED ON HARDWARE rather than inferred. The acceptance is 'Measured
    boot + TPM unlock + recovery path validated'. On real silicon (MSI Katana GF76 12UG, Intel PTT, INTC/ADL fw
    0x2580012) TPM unlock and the recovery path are now validated - see L-001 ROUND 31 - and so, for the first
    time outside swtpm, is the SIGNED PCR 11 POLICY this item depends on: correct key unlocks, wrong key refused
    on the fingerprint, a FORGED signature refused by the part itself (Esys_VerifySignature 0x2db =
    TPM_RC_SIGNATURE), a moved PCR 11 refused, a re-signature for the new value accepted. The mechanism is sound
    on Intel PTT. IT STILL CANNOT BE TURNED ON BY DEFAULT, and round 29's reason - PCR 11 is all zeros on a GRUB
    machine - is now both confirmed on a SECOND machine (katana reads 64 zeros exactly as the L16 does, shim ->
    GRUB, no sd-stub) and SUPERSEDED BY A WORSE ONE. `systemd-pcrextend` REFUSES TO RUN ON A GRUB MACHINE AND
    EXITS 0 WHILE DOING SO: 'Kernel stub did not measure kernel image into PCR 11, skipping userspace measurement,
    too.', PCR 11 unchanged, exit status 0, for enter-initrd, leave-initrd and sysinit alike. So the four
    boot-phase policies `systemd-measure sign --current` signs by default are unreachable on a default APEX
    install, and a machine enrolled that way would fail to unlock AT BOOT rather than at enrolment - the silent
    kind of failure this repository keeps finding. 'Where safe' is therefore still nowhere until a machine boots
    the UKI/sd-stub path, and turning Secure Boot on does NOT change this: the blocker is the stub, not the Secure
    Boot switch. ALSO MEASURED, and it is an argument for the UKI path made from hardware: a zero PCR 11 is a
    local denial-of-service. tpm2_pcrextend 11 succeeds from plain root and tpm2_pcrreset 11 answers 'bad
    locality', so any root process can deny every PCR-11-bound unlock until the next reboot; after sd-stub has
    extended PCR 11 an attacker can no longer choose the value. AND ONE MORE THING THIS ITEM MUST ACCOUNT FOR
    BEFORE IT SHIPS: on real Intel PTT, MAX_AUTH_FAIL is 32, LOCKOUT_INTERVAL 7200 s, LOCKOUT_RECOVERY 86400 s,
    and a successful authorisation does NOT clear the counter - so if 'where safe' ever includes --tpm2-with-pin,
    32 mistypes over any span of time lock the TPM for up to a day, and on a machine whose lockoutAuth another OS
    holds, APEX cannot reset it. Depends on L-001, where the TPM clear is now one decision rather than an absent
    machine, and on L-002, where the installer still cannot encrypt a disk in the first place.
global_agent_rules:
- Inspect the current APEX-OS and APEX Shell source before changing anything.
- Verify an existing implementation before reimplementing it.
- Preserve upstream TUI agent interfaces; APEX supervises and secures them rather than replacing them.
- Never collapse agent-native bypass, APEX sandboxing, root/system grants, secret access, network policy, or remote-origin
  policy into one switch.
- 'Every task MUST run `/stop-slop` before it can be marked done. Apply it to all human-facing prose changed by the task:
  UI copy, help, docs, errors, notifications, READMEs, release notes, comments intended for humans, PR/commit text prepared
  by the agent. Do not rewrite code identifiers, commands, paths, logs, config keys, or machine protocols merely to satisfy
  prose style.'
- Do not mark a task done without tests/evidence satisfying its acceptance criteria.
