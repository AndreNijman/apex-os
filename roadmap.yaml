    the roadmap recorded as uncovered were in fact covered by run-display-transaction-test.sh, which passes 41 of
    41 against a headless labwc with two virtual outputs — the evidence below was written from the branch state,
    not from a run. What was genuinely missing was criterion 5's word "exact" and criterion 6's recovery path, and
    testing those honestly needed outputs that can be created and destroyed, which labwc cannot do.
    run-display-unplug-test.sh uses headless sway's create_output and `output <name> unplug`, 17 assertions, and
    found two defects. First: the guard wrote `state reverted` whether or not the restore had worked, so an engine
    that failed during the countdown left the machine on an unconfirmed layout with a record saying it had been
    put back, and reconcile at the next start believed it. It records revert-failed now, retries, and the Display
    page says the screen was never confirmed. Second: a rollback naming an output unplugged during the countdown
    made wlr-randr reject the whole invocation, so EVERY other output kept the unconfirmed layout; restore now
    prunes the rollback against a fresh enumeration first. Criterion 5 is a whole-enumeration comparison across
    four fields and two outputs, not one scale value. The watchdog is apex-display-guard.sh, spawned by _begin()
