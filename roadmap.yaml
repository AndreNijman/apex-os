    asked for actually ARRIVED, so a one-screen run cannot pass by comparing nothing. A SHARED PER-FACTOR REGISTRY
    WAS BUILT AND DOES NOT WORK: a ThemeSet handed out by a singleton evaluates to undefined at the call site with
    no TypeError and no ReferenceError (1641 "Unable to assign [undefined] to int"), bisected one variable at a
    time - the only thing that changed the outcome was WHERE THE OBJECT IS CONSTRUCTED - reverted in 57111a0, with
    the measurement written into src/theme/OutputScale.qml so the next person to have the idea gets the result
    instead. It is guarded by a named runner and not only by that comment: ThemeSet.fs() mutated to return
    undefined takes run-settings-pages-test.sh to "a settings page failed to build", which is the exact string a
