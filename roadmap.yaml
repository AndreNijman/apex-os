  - P1-051
  acceptance:
  - Native Android app uses a maintainable modern architecture and first-party APEX design language.
  - Onboarding pairs a computer by QR and explains trust clearly.
  - Supports multiple APEX computers.
  - App lock supports Android biometrics/device credential.
  - Dark/light/dynamic-color behavior is polished and accessible.
  - No secrets, private keys, or session plaintext are written to insecure app storage.
  gates:
  - tests
  - stop_slop
  evidence: >-
    APEX Remote Android app foundation. LANDED on apex-os roadmap/v2.2 2026-09-12 as merge a1420b01
    (task/p1-053a-android-2, five commits plus a merge). The app lives in android/ inside apex-os by orchestrator
    decision: apex-android does not exist as a repository and creating one would mean a new main, which this
    program forbids until final integration. BUILDS HEADLESS, no device and no emulator: 87 core JVM tests, 6 app
    JVM tests, a 42 MB debug APK. THE LAST CRITERION - no secrets, private keys or session plaintext in insecure
    app storage - is tested HOSTILELY rather than asserted: the suite pairs for real against a live Noise
    responder on a thread, saves, reloads, unseals, opens a session with the PINNED desktop key, pushes distinct
    plaintext both ways, writes again, then walks every file in the storage directory hunting the device secret,
    the pairing token and both strings in every encoding. Six mutations each turn a NAMED test red (raw secret
    stored; save copying instead of renaming; the scan's raw-byte window deleted; Session.close made a flush; the
    naive last-colon split restored; the session run against an unpinned key), and two of them found bugs in the
    test itself - an assertion held up by the rename rather than the cleanup, and an unpinned-key mutation that
    hung for ten minutes reporting no test name until a timeout and a bounded join made it a 70-second named
    failure. THREE DEFECTS SETTLED FROM PRIMARY SOURCES, each already coded wrong: KeyGenParameterSpec's
    user-authentication gate applies to secret keys too, so sealing is gated and seal() would have thrown on a
    real phone at the end of pairing after the token was burnt; androidx.biometric refuses crypto-based
    device-credential auth before API 30; and the biometric prompt ran AFTER the handshake, so a cancelled prompt
    left the desktop paired to a phone whose key had just died. Also fixed: a socket leak on failed handshakes, an
    unlock prompt firing before the phone's capability was known, invalidated-key errors surfacing as AEAD tag
    mismatches, an IPv6 parse bug turning 2001:db8::1 into host 2001:db8: port 1, and a deep link that crashed on
    cold launch and lost its payload. The CI path classifier was RUN rather than read: android/app/** selects
    android alone, noise-vectors.json selects rust AND android, docs/android/notes.md selects neither. NOT
    VERIFIED and recorded rather than glossed: every keystore and BiometricPrompt behaviour is unverified on a
    device; the CI android job had never executed before this landing; there is no relay leg, so a phone off the
    LAN reaches nothing; all UI strings are hardcoded.
- id: P1-054
  title: Android Agent Center parity
  priority: P1
  status: partial
  area: android
  depends_on:
  - P1-053
  - P1-020
  acceptance:
  - Shows agent graph, provider/model, project/workspace, mode, current activity, context/quota where available, elapsed
    time, and status.
  - Can start a new agent with selected profile/project/worktree.
  - Can pause/stop/reconnect/attach supported sessions.
  - Agent state/colors match desktop semantics.
  gates:
  - tests
  - stop_slop
  evidence: >-
    CORRECTION 2026-09-12 by the orchestrator: the central claim below is HALF WRONG, and it propagated from
    p1-053a's card into a dispatch brief and into this evidence field. Worktrees IS a variant of pub enum Request
    in apexd/apex-agent-core/src/protocol.rs (enum at line 531, variant at 723) and of Response (1138/1172), and
    has been since 2026-09-08. p1-053a read apexd/apex-agent-core/src/request.rs instead, whose Request is a
    VALIDATION-ERROR enum (UnknownVerb, NoPackages, TooManyPackages, BadPackageName, BadReason,
    UnexpectedArguments), not the wire protocol. The real vocabulary is 28 verbs: Attach Decide DeclareOrigin
    ElevationChallenge Event Grants Hello Info Inject Input List Logs PrivilegeRequest Prune Remove
    RenewSystemGrant RequestExecuted Requests Resize Revoke RevokeSystemGrant Run SecretUse Signal SystemGrants
    Telemetry ToolCheck Worktrees. So round 3's worktrees request and its parser were CORRECT and were deleted for
    a bad reason; p1-053b restored them in ca453ea3, landed as merge c2ca4ea6. WHAT IS STILL TRUE: Profile and
    Projects are genuinely absent from the protocol Request, so the picker gap is real for those two only. Read
    the rest of this field with that split in mind. LANDED on apex-os roadmap/v2.2 2026-09-12 as merge 4ae4cf22.
    PARTIAL, corrected from done: this item's own evidence names an unmet criterion (no profile/projects/worktrees
    verb on the socket), and done was overstated. Android Agent Center parity. Six commits on
    task/p1-053a-android-4 plus a merge of roadmap/v2.2. Verified headless, NO device and NO emulator: 295 core
    JVM tests, 10 app JVM tests, a 43 MB debug APK, via ./gradlew :core:test :app:testDebugUnitTest
    :app:assembleDebug with JAVA_HOME=/usr/lib/jvm/java-21-openjdk ANDROID_HOME=/var/tmp/android-sdk. MET: the
    list and detail screens show agent graph, provider/model, project/worktree/branch, the flattened policy,
    current activity, context gauge, elapsed time and status; pause/resume/interrupt/stop are the daemon's own
    signals (SIGSTOP/SIGCONT/SIGINT/SIGTERM, spelled out on screen, since there is no pause verb); attach opens a
    real PTY; reconnect is PtyAttachment's. COLOURS MATCH THE DESKTOP AND A TEST SAYS SO IN BOTH HALVES:
    AgentStateAgreementTest parses vendored agentstate.js for state->token and the new ToneColoursTest parses a
    vendored Colors.qml for token->colour, both verbatim from apex-shell 6e74101, and tools/check-agent-state.sh
    diffs both against a live checkout (it did: identical, branch roadmap/v2.2). Three desktop semantics carried
    rather than invented: live is exit_code==null && exit_signal==null and NOT !isTerminal(state) — state is
    whatever was last PUBLISHED, including by the agent through the open Event verb, so sorting on it would let an
    agent hold the top of the list for ever; a finished session's elapsed clock stops at its last activity,
    because a session that failed an hour ago did not take an hour; darkSurface is luminance(background)<0.18 read
    off the surface rather than a theme flag, which matters because Material You can hand a dark theme a pale
    surface. NOT MET, and the gap is the runtime's: 'start with profile/project/worktree' is PARTIAL.
    apex-agent-core's Request has NO profile verb (profile.rs is unreachable through it), NO projects verb and NO
    worktrees verb — read out of the enum, not remembered. Round 3 had built {"cmd":"worktrees"} and a parser for
    the answer; nothing could have parsed it and the phone would have shown an error where it offered a picker.
    Removed, with the test kept and inverted so it cannot come back. What is offered instead: the adapter from
    Hello.agents, a directory derived from what the daemon has already reported, and a worktree NAME
    (RunRequest.worktree does exist), and the screen says why on screen rather than implying a picker. P1-056 must
    start from this constraint. ALSO NOT VERIFIED: every Compose behaviour (assembleDebug is the only gate a
    machine with no phone has); no relay leg, so LAN only; the CI android job has still never run, though its path
    classifier was RUN against this branch's own diff (android=true rust=true, the rust selection being
    over-selection from android/core/src/test/resources/ which the workflow's own comment block justifies leaving
    alone). A DEFECT THIS ROUND ALSO FOUND, recorded here because it hit both items: every socket write was on the
    MAIN THREAD — Android's StrictMode.enableDeathOnNetwork() is on for every app targeting API 11 or later, so a
    signal button and the first keystroke would each have killed the process, and locking the app closed sockets
    on the UI thread. Found by reading rather than by any gate. Fixed: the terminal's io goes to a single-thread
    executor and the view model's closes go to Dispatchers.IO. Mutation-checked: 8 mutations on the Agent Center
    model each turn a NAMED test red (live from published state, a finished clock that keeps running, a sort
    without live-first, a zero gauge for a session that never reported, an orphan dropped with both safety nets
    removed, the cycle net alone removed, every request retried including signals, a stop during connect ignored);
    every file restored byte-identical with plain cp. ON A DEVICE 2026-09-19 (task/p1-053d-device), and it found a
    criterion that could not work. C2 ('can start a new agent with selected profile/project/worktree') WAS
    UNREACHABLE FOR ONE OF THE SIX ADAPTERS: Hello.agents lists 'generic' on every runtime, so the Start screen
    offered it, and choosing it could only fail - the Generic adapter carries no program of its own, apex-agentd
    takes req.args.first() as its program (session.rs:135) and refuses the session when there is none, and
    Agentd.run had no way to send args at all. The button's only possible outcome was the daemon's refusal after a
    round trip. Measured against a real apex-agentd from the phone; it is the class of gap a JVM test cannot see,
    because both halves are individually correct - the picker shows what the daemon lists and the builder sends
    every field it knows about. Fixed: Agentd.run gains args (appended only when non-empty, so a daemon predating
    the field still parses the request), Agentd.commandIsRequired pins on the adapter ID because that is literally
    what the daemon branches on, MachineLink.run refuses the combination before the wire with a sentence about the
    missing program rather than about `--` (a flag that does not exist on a phone), and the Start screen grows a
    Command field shown only for that adapter with Start disabled until it is filled. startIsPossible and
    commandArguments are top-level functions, not expressions inside the button, because a rule in a lambda is a
    rule no test can reach. run_generic_with_args is in the shared requests.json fixture and asserted from BOTH
    ends - Kotlin that the builder produces exactly it, Rust that RunRequest parses it with the program FIRST. C1
    AND C4 CONFIRMED ON THE PHONE: AgentCenterScreen composes with real sessions on a real display and passes the
    Accessibility Test Framework with TalkBack bound; the agent lifecycle (run, list, info, input, stop) was
    driven end to end from the device against a real daemon over Wi-Fi. C3's pause/resume/stop ride the same
    signal verb that stop used. A LAYOUT DEFECT ON THIS SCREEN WAS FOUND THE SAME WAY: at font scale 2.0 the
    four-button action row did not fit across a Pixel 7a, and a Row resolves that by measuring the last child
    ('Guide') at width ZERO - present, occupying nothing, unreachable. Now a FlowRow. Mutation-tested: reverting
    it makes the assertion red naming that exact button.
- id: P1-055
