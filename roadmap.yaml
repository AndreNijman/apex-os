  - stop_slop
  evidence: >-
    Cloudflare DNS capability set. LANDED on apex-os roadmap/v2.2 2026-09-12 as merge 4f80746e (9d14bac0), four
    operations. TWO OF THREE CRITERIA DONE. Read/create/update/delete are four separate grants
    (the_four_dns_verbs_are_four_grants). Bound zone and record constraints hold, including the label boundary
    that a naive prefix check would get wrong: a_name_outside_the_bound_zone_never_reaches_cloudflare proves
    notexample.com is NOT inside example.com, and
    a_project_that_narrows_itself_to_some_records_cannot_touch_the_others. CRITERION 3 PARTIAL FOR A STRUCTURAL
    REASON: 'registrar/nameserver/DNSSEC-root changes require elevated class' cannot be met because NO ELEVATED
    CLASS EXISTS in apex-secret-core to require. What ships instead is the safe half, proven rather than asserted:
    NS, DS, DNSKEY and SOA are refused outright on create, update and delete - reading one is allowed, since
    section 13.9 reserves CHANGES - and registrar, dnssec and custom_ns are never declared at all, proven by
    changing_a_delegation_or_a_dnssec_record_is_refused_as_an_elevated_shape with all four verbs granted and the
