    Pushed with --force-with-lease. TWO CORRECTIONS FROM A REAL PHONE, 2026-09-19 (task/p1-053e-device @
    9231f72a), and the status is left at done deliberately — see the second. (1) THE DESKTOP BOUND IPv4 ONLY, AND
    WIDENING IT WOULD HAVE MISLABELLED EVERY RELAYED SESSION. main.rs had bound 0.0.0.0 with a comment naming the
    regression that stopped it being widened, and the regression was real: a :: listener hands every IPv4 peer to
    accept(2) as ::ffff:a.b.c.d, and Ipv6Addr::is_loopback is FALSE for ::ffff:127.0.0.1 — it answers only for
    ::1. A relay splice reaches this daemon over loopback, so State::path_of would have called every relayed
    session a LAN one and Path::disclosure would have told the owner nobody else was on the path. Measured before
    anything changed: arrived_by_relay extracted from path_of so the rule can be asserted without a State, then
    a_v4_mapped_relay_splice_is_a_relay_session FAILED on [::ffff:127.0.0.1]:41000 with that port armed.
    to_canonical() on both sides of the seam — once at the boundary where serve.rs reads peer_addr(), so the
    stored peer, apex remote status and the key unregister matches see one spelling, and once inside the rule so a
    later caller cannot forget — makes it pass; the lies in the other direction (loopback on an unarmed port, a
    LAN phone written ::ffff:192.168.1.98) are asserted to stay LAN. The bind falls back to 0.0.0.0, because a
    machine booted ipv6.disable=1 has no AF_INET6 and a daemon that refused to start there would be worse than the
    bug. The firewall needs nothing: apex-firewall's table is inet, both families — checked. MEASURED ON THE
    PHONE: the pairing code now carries ["192.168.1.232:44219", "[fd00:12b:83b0:c4de:a38b:4ef2:b234:3d31]:44219"]
    where it carried only the first, and LanEndToEndTest's
    every_address_the_offer_advertises_can_actually_be_dialled — which dials each through the app's own
    splitHostPort — passes with both. On an IPv6-only network this daemon was unreachable. ALSO: the port
    advertised was the port REQUESTED, not the port bound, so with --port 0 the daemon advertised :0 in the
    pairing code, published port 0 over mDNS and dialled 127.0.0.1:0 for every relay splice; both halves now come
    off listener.local_addr(). (2) NO CLIENT ON ANY PHONE CAN USE THE RELAY, so C2 and C3 are true of the desktop
    half and of the Rust suite and of nothing a user holds. PairingService says it in its own error text — "and no
    relay client has been written yet" — :core has no WebSocket code at all, core/build.gradle.kts carries
    bouncycastle and kotlinx-serialization and nothing else, and Help.kt tells the user the relay has no
    deployment. The status is NOT changed here because the desktop half genuinely is done and is covered end to
    end by apex-remoted/tests/relay.rs against an independent double; what is missing is P1-052's ANDROID half —
    an RFC 6455 client in :core, a PairingService fallback on Rendezvous.path, a relay double the phone can dial
    standing in run-device-suite.sh, apex-remoted --relay carried through the broker's restart_remoted, a device
    test that makes the LAN unreachable so the relay is the leg under test, and HelpParityTest's inverse list
    moved off the no-deployment claim. That is a unit of work and is recommended as its own card; a half relay
    client on a test branch would be worse than none. It is also the ONLY thing left between P1-060 C1 and met.
    APEX Remote relay, reconnect, mDNS discovery and connection quality — AND THE CLIENT CAN NOW DIAL IT. LANDED
    on apex-os roadmap/v2.2 2026-09-12 as merges b79838a4 (the relay, reconnect, mDNS, connection quality) and
    9b15ce3c (TLS), with the apex-shell pages at merge a36f1a4. The relay's server side is a Worker with a Durable
    Object room plus relay/test/room.test.mjs; apex-remote-core 83 tests, apex-remoted 35+3+10+8, clippy clean.
    THE wss:// BLOCKER IS CLOSED. apex-remoted refused a wss:// relay by name because nothing in the workspace
    spoke TLS, and *.workers.dev is HTTPS-only, so the Worker was reachable by a browser and not by this client.
    Andre delegated the choice ('you pick for relay, figure it out yourself'); the orchestrator chose rustls in
    apex-remote-core over an openssl s_client child (the curl precedent it leans on is for ONE-SHOT requests,
    while a relay connection is long-lived and must reconnect, so every reconnect becomes a process-lifecycle
    problem) and over a custom domain on ws:// (TLS to the relay hides the rendezvous id and traffic pattern from
    an ON-PATH OBSERVER, a different party from the relay operator the disclosure already names, and cleartext
    contradicts a project that pins a Sigstore root and refuses an unverified image). ROOT STORE:
    rustls-native-certs, the machine's own, NOT a vendored bundle - because what is being verified differs. APEX
    pins the Sigstore root where the thing verified IS the OS image, so a store shipped inside that image cannot
    be the authority on it; a relay dial happens afterwards on an already-trusted machine, where the machine IS
    the authority. An admin who runs update-ca-trust to remove a CA means it everywhere, and a vendored bundle
    would keep trusting what was deleted; and a private deployment behind an internal CA is unreachable from a
    vendored bundle. The cost is paid openly: an empty store is a NAMED refusal printing /etc/pki/tls/certs,
    SSL_CERT_FILE and SSL_CERT_DIR, never a silent fall back, because falling back would re-trust exactly the CA
    just removed. COST MEASURED: 178 -> 193 crates, 15, matching the design doc's prediction; only 9 compile on
    Linux; ring needs a C compiler at image-build time and Containerfile.core:1396-1406 puts gcc/clang/make/cmake
    in the FINAL core image, checked rather than assumed. THE REFUSALS ARE THE TEST, since a TLS client that
    accepts anything also connects: asserted by variant AND by message against a CA minted per run and served from
    a loopback rustls listener - untrusted issuer is UnknownIssuer, a certificate for other.test asked for as
    relay.test is not-valid-for-name with both names in the message, and one expired in 2020 is refused with its
    dates. Seven mutants, including one that collapses the message and reddens all three 'says so' tests while the
    variant-only ones stay green, one that downgrades wss:// to plaintext, and one that violates a lock invariant
    and DEADLOCKS. RUNNING THE WORKER FOR THE FIRST TIME FOUND A DEFECT IN IT: under wrangler dev --local, 'Can't
    call WebSocket send() after close()' - ctx.getWebSockets() keeps returning sockets the object has already
    closed, which would also have let waiting() hold a room forever, the exact 409-forever failure the design
    claims to have removed. Fixed with an isOpen() guard. HOW IT WAS CAUGHT IS THE LESSON: against the pre-fix
    Worker the Rust suite reported 8 passed / 0 failed THREE TIMES while wrangler logged two exceptions, because a
    Worker that throws still leaves the socket closed and only its own log sees it. A green suite was hiding a
    server-side defect until the real server ran. Six of eight suites now run against the real Worker including
    pairing and a live session end to end; the two that do not print SKIP-EXTERNAL and say why. DEPLOYMENT IS NOW
    A THREE-LINE OPERATION FOR ANDRE and nothing is deployed: cd relay && npx wrangler login && npx wrangler
    deploy, then systemctl --user edit apex-remoted to point ExecStart at --relay wss://..., then restart and apex
    remote status. --user is verified against Containerfile.base:207. UNCHANGED CAVEAT: the relay is still
    unauthenticated and unrate-limited, so a public URL wants a token or Cloudflare Access first.
- id: P1-053
  title: Create polished first-party APEX Remote Android app foundation
  priority: P1
  status: done
  area: android
  depends_on:
