    '--settings breaks plugins'; and those keep runs calibrate the 30-second window, which is otherwise
    indistinguishable from a removal. ROUND 4's FOUR OTHER FINDINGS. (1) 6d3ce356: round 3 shipped a fail-open.
    plugins was in AgentPolicy::dimensions() but not in the version table, and check_daemon_understands maps every
    name it does not recognise onto POLICY_DIMENSIONS_VERSION - revision 2. Config::policy copies the field
    straight through, so plugins = none in agent.toml reached that path with no CLI flag at all: the check passed,
    the daemon dropped the key, and the session loaded every plugin and ran every SessionStart hook with nothing
    anywhere saying so. PROTOCOL_VERSION 7 -> 8, PLUGIN_POLICY_VERSION = 8, and the table split out as
    settings_a_daemon_could_drop so it can be asserted without a socket - none of it could be, before. (2)
    6e3d17aa: --plugins, at all four sites a dimension has to appear at; forward_argv is the one that matters,
    because a remote run that loses a REMOVAL gives the far end more than was asked for, and --connectors was in
    forward_argv but not in the test guarding it. (3) 86a64ee9: apex provenance show told a reader their hooks get
    no sandbox and stopped there, on a tip that had the remedy - the mirror of the defect round 2 spent a commit
    deleting. One clause naming --plugins none and --plugins curated, plus removableByPluginPolicy in the JSON
    beside unconfinedExecutableContent, and deliberately NOT offered for a plugin whose only content is an MCP
    server, because leg 1 already handles that. (4) d542c1f8: five more string literals that lost a backslash and
    print fourteen to eighteen spaces mid-sentence. WHERE THIS APPLIES, stated as scope rather than as a
    shortfall, because no build could close it: all three legs exist where APEX starts the session - through apex
    agent, and leg 1 additionally only on an adapter that can be told to ignore every other MCP configuration,
    which is claude alone today (Adapter::strict_mcp, read rather than hard-coded). Type the agent's own name in a
    terminal and APEX is not in the path at all. The readouts say this in the same sentence as the word sandbox
    and the JSON carries it as appliesOnlyToSessionsStartedBy, because the consumer most likely to over-claim is
    the one that never reads the prose. WHAT WAS NOT VERIFIED, plainly. The live removal test is #[ignore]d and
    ran on the L16 ONLY: CI installs no claude, so tests/test-apex-skill.sh --with-binary prints a '----'
    could-not-run line there and counts it separately from PASS. CI has never held that check - it has only ever
    reported that it could not run it. And nothing has exercised --plugins through the DAEMON end to end: the
    running apex-agentd on this laptop answers its handshake with protocol 1 (probed read-only on its own socket),
    so apex agent run --plugins none is refused with 'the running agent runtime speaks protocol 1 and would ignore
    --plugins' and no session starts - which is the version guard working, but means the session.rs -> document
    wiring is unit-tested only. Restarting apex-agentd is Andre's call, not an agent's. Counts: apexd workspace
    3054 -> 3057 passed, 0 failed (the live test is #[ignore]d and counts in neither); tests/test-apex-skill.sh
    73/0 -> 96/0 with --with-binary and 38/0 structural; clippy --locked --workspace --all-targets -D warnings
    clean; shellcheck -S warning -x clean. Nine mutations this round, each watched red on a NAMED test and
    restored byte-identical with plain cp: 'plugins' dropped from the version filter prints [(plugins, 2),
    (--plugins, 8)], which IS the defect that was on the tip; --plugins pushed at CONNECTOR_POLICY_VERSION prints
    [(--plugins, 7)]; PROTOCOL_VERSION back to 7 reddens protocol.rs's
    every_version_guard_names_a_revision_that_exists; the resolve_policy arm deleted gives AsConfigured where
    NoPlugins was asked for; the forward_argv row deleted reddens
    a_remote_run_carries_every_dimension_it_was_given; curate's NoPlugins arm returning true is RED LIVE - a real
    agent started and the hook observed running - on a_removed_plugins_hook_is_observed_not_to_run; settings_json
    dropping the enabledPlugins assignment is red live on the curated-keep document; removable_content widened to
    include mcp reddens the MCP-only case; the remedy clause made unreachable reddens the hooks case. Measured
    live here: apex provenance show over the real home reports 7 plugins, 1 of them (codex) carrying content only
    removal reaches, and it now prints the remedy beside the shortfall while the other six correctly do not.
