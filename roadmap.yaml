meta:
  title: APEX-OS Agent-First Roadmap
  version: '2.2'
  date: '2026-09-06'
  canonical: true
  markdown_companion: ROADMAP.md
  status_values:
  - verify_existing
  - partial
  - todo
  - blocked
  - done
  priority_order:
  - P0
  - P1
  - P2
  - Later
  source_snapshot:
    apex_os_repo: https://github.com/AndreNijman/apex-os
    apex_os_public_commit_count_observed: 377
    apex_shell_repo: https://github.com/AndreNijman/apex-shell
    apex_shell_public_commit_count_observed: 364
    observed_date: '2026-09-06'
    note: Agents must inspect the live repository before implementation; this snapshot is context, not a substitute for
      current code.
agent_profile_assumptions:
  claude_default_permission_mode: bypassPermissions
  remote_control: true
  voice_push_to_talk: true
  push_notifications: true
  remote_mcp_memory: true
  codex_inside_claude: true
  large_local_skill_library: true
  statusline_quota_and_context_telemetry: true
security_invariants:
- Agent-native bypass must not implicitly disable the APEX sandbox.
- Unrestricted user access must not implicitly grant root.
- Root/system grants must not implicitly export raw brokered secrets.
- Managed agents should use capability-backed secrets instead of long-lived environment variables where practical.
- Remote-origin capability requests must be distinguishable from local requests.
- Unsafe-everything must remain an explicit owner-controlled break-glass mode with authentication, TTL, audit, and visible
  warning state.
- Kernel/container isolation remains authoritative even when agent hooks provide additional policy.
tasks:
- id: BASE-001
  title: Preserve atomic bootc update and rollback architecture
  priority: P0
  status: done
  area: foundation
  depends_on: []
  acceptance:
  - Atomic update path works
  - Previous deployment rollback works
  - System extensions do not mutate base deployment unexpectedly
  gates:
  - tests
  - stop_slop
  evidence: >-
    Ran live. sudo apex update --check on katana did a real GHCR round-trip; sudo apex rollback ran twice on
    katana and bootOrder flipped default to rollback and back, with the machine byte-identical afterward. On L16,
    /proc/mounts shows a composefs root with a sysext overlay stacking above /usr, and bootc status reports
    incompatible false with 20 sysext packages merged, so extensions do not mutate the base deployment. guard_rpms
    refuses kernel, glibc, systemd, bootc and ostree (files/system/libexec/apex-pkg:104). Not rebooted into the
    rollback slot, since katana's rollback is a two-week-old pre-unification image.
- id: BASE-002
  title: Preserve upstream TUI agent PTY runtime
  priority: P0
  status: done
  area: foundation
  depends_on: []
  acceptance:
  - Claude/OpenCode/Codex/Gemini can run as native TUIs
  - Attach/detach/persistence works
  - Direct agent binaries remain usable
  gates:
  - tests
  - stop_slop
  evidence: >-
    CLOSED 2026-09-11 (round 10), landed on roadmap/v2.2 in merge 65bd5c7 of task/base-partials. The live half was
    already proven: attach, detach and persistence on an isolated daemon on katana and the L16, a marker typed
    into a detached session replayed exactly on reattach and survived a daemon kill and relaunch; claude,
    opencode, codex and kimi all resolve to real upstream binaries through npm paths rather than an apex shim. The
    two defects that held this open were STALE EVIDENCE, not open work - the roadmap's line numbers
    (adapter.rs:50-56, registry.rs:173-178) are origin/main's, not this lineage's. 4b85f24 lets opencode and codex
    start in a confined sandbox and 48a3872 stops a daemon restart overwriting the last sessions; both carry named
    regression tests. cargo test -p apex-agent-core -p apex-agentd 671 passed / 0 failed, including
    adapter::tests::a_symlinked_agent_reaches_the_package_its_bin_entry_points_at and
    registry::tests::a_restart_neither_reuses_an_id_nor_overwrites_the_record_at_it. Mutation-proved both:
    removing .local/lib/node_modules from TOOLCHAIN_RO reddens the first; restoring main's allocator reddens FIVE
    registry tests. NOTE: the fix is .local/lib/node_modules and NOT .local/lib - adapter.rs asserts the wider
    path is absent by design. Do not widen it.
- id: BASE-003
  title: Preserve project/strict/unrestricted sandbox modes
  priority: P0
  status: done
  area: foundation
  depends_on: []
  acceptance:
  - Project mode confines filesystem correctly
  - Strict mode removes network as designed
  - Unrestricted remains explicit
  gates:
  - tests
  - stop_slop
  evidence: >-
    Ran live. Project mode confines correctly, the project is writable while the real HOME marker is invisible,
    ~/.ssh is unreachable, /usr is read-only, /run is masked to the resolver bind, /proc shows 5 processes against
    the host's hundreds and no /dev/video or /dev/snd. The fail-closed path holds too, --cwd on the home itself is
    refused before any process starts. Strict removes network for real, curl reaches 1.1.1.1 and DNS resolves
    under project and both fail under strict, with --unshare-net applied only under Strict (sandbox.rs:436-438).
    Unrestricted stays explicit, the only config writer sets default_agent and never sandbox, so no CLI path makes
    it a silent default. Minor cosmetic drift, /sys/class/net still lists host interface names under strict
    because sysfs arrives through the --ro-bind, though no route or address exists in the namespace.
- id: BASE-004
  title: Preserve Projects, worktrees, checkpoints, and undo
  priority: P0
  status: done
  area: foundation
  depends_on: []
  acceptance:
  - Project restore works
  - Parallel worktree creation works
  - Checkpoint/undo restores intended task state
  gates:
  - tests
  - stop_slop
  evidence: >-
    Ran live. Project registry persisted across a real daemon kill and relaunch with a new pid, and project info,
    project list and agent list --all all reported identical prior state. Two worktree sessions launched truly
    concurrently landed on distinct branches with each session attributed to its own tree. Checkpoint and undo
    restored a mutated file, a new untracked file and a deleted tracked file, and unwound an intervening commit,
    so undo reverts agent commits and not just files; undo is itself undoable, verified directly rather than taken
    from the docs. Minor defect, racing two runs against the same worktree name makes one lose the git lock race
    and fail hard instead of reattaching, which is what the docs promise for a sequential re-run.
- id: BASE-005
  title: Preserve APEX Capsules and development environments
  priority: P0
  status: done
  area: foundation
  depends_on: []
  acceptance:
  - Managed dev environments remain isolated from immutable host
  - GPU/device profiles work where supported
  - GUI export does not break host isolation
  gates:
  - tests
  - stop_slop
  evidence: >-
    CLOSED 2026-09-11 (round 10), landed on roadmap/v2.2 in merge 65bd5c7 of task/base-partials (2c77182). The one
    outstanding qualification was that the amd and hw device profiles were argv-pinned and never hardware-
    verified. Closed on the L16, which HAS the hardware (Radeon 780M, /dev/kfd present, the engine reads the
    machine as amd). New tests/test-apex-env-devices-live.sh sources the SHIPPED files/system/libexec/apex-env and
    calls gpu_flags, so a profile change changes the test, then hands exactly those flags to real rootless podman
    and reads back whether each node is present and OPENABLE: 14 passed / 0 failed / 2 skipped. /dev/kfd and
    /dev/dri/renderD128 both open inside the container with the amd profile's six arguments and both ABSENT
    without them (negative control on every device assertion); /dev/bus/usb arrives for hw and not otherwise; none
    adds nothing. The two skips are named: keep-groups is unverifiable here because amdgpu leaves /dev/kfd mode
    0666, and nvidia has no device on this machine. Mutation-proved four ways, including that collapsing
    gpu_flags' two printf lines FAILS the shape assertion rather than skipping past it. A DEFECT IN ITS OWN FIRST
    COMMIT was found and fixed at 8a74816: the 'no container was left behind' assertion filtered podman ps -a on
    the disposable engine's ^disp- prefix and could not fail - proven vacuous (five exited containers present,
    suite still green) before being fixed. Standing qualification, unchanged and recorded rather than open:
    capsule isolation is the read-only OS layer, not a security boundary - a capsule shares the real HOME and gets
    /run/host read-write as the user. tests/test-apex-env.sh 265/0 on the landed tip.
- id: BASE-006
  title: Preserve universal package abstraction
  priority: P0
  status: done
  area: foundation
  depends_on: []
