    and apex-os task/p1-063-2 (three commits, e799422b..51c00e0a). THE APEX-SHELL SURFACE, WHICH WAS THE LAST
    GENUINELY-BUILDABLE PIECE, IS NOW WRITTEN AND DRAWN. src/services/lid.js is a pure parser over apex lid
    status/report --json; LidService.qml polls status then report one after the other, refcounted so a page nobody
    is looking at spawns nothing, and runs apex lid pin only on an explicit press; LidPage.qml is registered in
