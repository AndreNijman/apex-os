    system daemon's socket, so a root lab would have tested the daemon apex-vm refuses to use). Final run on the
    L16, 6 verified / 1 could-not-run / 0 failed. create verified (13 observations): libvirt defined and started
    it, the guest reached userspace with the command line the UKI was SIGNED with, powered itself off, and rm left
    no domain and no directory. Secure Boot verified (8): the same signed UKI boots against the APEX variable
    store reporting SecureBoot=1 SetupMode=0 from inside the guest, is REFUSED by libvirt's own enrolled-keys
    store (Microsoft's db), and boots in SETUP MODE against a key-free store - which is what shows the refusal was
    about keys rather than a broken image. TPM verified (5): /sys/class/tpm/tpm0 with tpm_version_major=2 inside
    the guest, and absent under --no-tpm. snapshot verified (10): a tally the guest keeps on its own ESP goes 1,
    snapshot, 2, revert, 2 - not 3 - and qemu-img snapshot -l shows the snapshot in BOTH disk.qcow2 and
    nvram.qcow2, which is the disk-and-varstore-together claim. share verified (16): two virtiofs devices, the
    guest mounts both tags, reads the host's file, its write appears ON THE HOST, and the read-only share refuses
    it; virtiofsd is wrapped with --sandbox none because its default namespace sandbox cannot nest inside the lab
    container's user namespace (measured three ways: namespace fails MountProc EPERM also under
