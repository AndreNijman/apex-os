    shell's RecoveryService.qml reads it and two shell suites pin the bare strings). The reason string stays out
    of the human line because it is an efivarfs path plus an OS error, one token past the 96-column budget the
    rendered report is measured against. cargo test -p apex 412 passed / 0 failed with 4 new tests; test-apex-
    recover.sh --with-binary 201/0 (194 before), including a CHECKED seal - the suite walks mode 000 as root
    first, so it proves the refusal is real before asserting through it.
- id: P0-001
  title: Qualify current integrated image on real hardware
  priority: P0
  status: partial
  area: qualification
  depends_on: []
  acceptance:
  - Daily and Gaming images build cleanly
  - Fresh install and upgrade succeed
  - Rollback succeeds
  - Hyprland/niri/Floating boot and basic workflows pass
  - NVIDIA/AMD/Intel baseline tested
  - Suspend/resume, Wi-Fi, Bluetooth, audio, multi-monitor, portals, Steam and recovery tested
  notes: Do not add large new architecture until the currently merged image is proven.
  gates:
  - tests
  - stop_slop
  evidence: >-
    Probed on both machines 2026-09-06, evidence in ROADMAP/evidence/P0-001-hardware-qualification.md. Both boot
    digest sha256:308127d9 from different tags with the same ostree checksum, which is direct evidence the one-
    image collapse and tag promotion work on real hardware; zero failed units on either; all three GPU vendors
    clean at driver level, with the Optimus pair live on katana; WiFi, Bluetooth, audio and portals all working;
    Steam and gamescope correctly absent, since the one-image design installs them on demand. Outstanding and
    honestly so: fresh install needs a wipe and cannot be attempted; multi-monitor needs physical displays; per-
