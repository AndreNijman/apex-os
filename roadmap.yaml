  gates:
  - tests
  - stop_slop
  evidence: >-
    LANDED on apex-os roadmap/v2.2 2026-09-12 as merge 4ae4cf22. PARTIAL, corrected from done: this item's own
    evidence names an unmet criterion (three of four TUIs; no gemini fixture), and done was overstated. Android
    full PTY/TUI remote terminal. Six commits on task/p1-053a-android-4 plus a merge of roadmap/v2.2. Verified
    headless, NO device and NO emulator: 295 core JVM tests, 10 app JVM tests, a 43 MB debug APK, via ./gradlew
    :core:test :app:testDebugUnitTest :app:assembleDebug with JAVA_HOME=/usr/lib/jvm/java-21-openjdk
    ANDROID_HOME=/var/tmp/android-sdk. MET: real PTY output with ANSI 16/256/truecolor and attributes —
    term/Palette.kt fills the hole Colour.resolveCube documents and leaves, and render() is the whole SGR decision
    (bold brightens, inverse swaps AFTER resolution so an inverted default cell swaps the theme's two defaults
    rather than two nulls, dim blends towards what is actually behind the ink, hidden wins over everything). Text
    input plus Ctrl/Esc/Tab/arrows/function keys through onPreviewKeyEvent, with modifiers that ARM rather than
    send (there is no chord on a touchscreen) and a hidden permanently-EMPTY text field — empty because an IME
    with text in it tries to EDIT that text, and the consequence is that backspace then arrives only as a key
    event, so a build handling only onValueChange ships a terminal you cannot correct a typo in. A CONFIGURABLE
    accessory row stored on MachineStore and never in a preferences file, because a second write path into app
    storage is one InsecureStorageTest's walk never looks at. Scrollback, search, selection and copy/paste in
    term/Viewport.kt, with every position held as dropped+index rather than an absolute index, because Screen
    evicts and a viewport remembering 'line 300' would creep through the output at the rate the scrollback
    overflows. Orientation through one onSizeChanged that a rotation, a keyboard and a split-screen resize all
    reach. THE LAST CRITERION IS TESTED HOSTILELY, NOT ASSERTED: a reconnect test that passes because the
    connection was politely closed has proved nothing. A phone does not get a FIN — it goes into a lift, and
    soTimeout is deliberately zero after the handshake, so the socket sits in read for hours while every layer
    above sees exactly what an idle terminal looks like. FrameChannel.lastFrameNanos tells them apart (the desktop
    pings every 15s and pings are consumed inside the channel, so the question is 'has any FRAME arrived' and it
    can only be answered below the multiplexer); the watchdog closes after three missed pings, and answers null
    for a transport that cannot report liveness so the attachment emits WatchdogUnavailable rather than arming
    over nothing — a watchdog watching nothing being the exact failure it exists to prevent. LowBandwidthTest: a
    17-byte-per-frame trickle paints the same screen as an unthrottled link with the throttle ASSERTED to have
    applied (130 frames where an unthrottled link uses 1); one byte per frame still answers ESC[6n and ESC[c; a
    silent machine is abandoned and re-attached; a PINGED silent machine is left alone; a link that trickles AND
    drops recovers the identical screen. THREE DEFECTS FOUND. (1) PtyAttachment SILENTLY DROPPED the terminal's
    answers to a replay's opening frames: the listener read the field meaning 'attached', which the attaching
    thread sets after openChannel returns, while apex-agentd starts replaying the instant it answers — so a TUI's
    ESC[6n was computed and thrown away and the TUI waited for ever, a remote terminal that hangs with nothing in
    any log, against three of the four TUIs this criterion names. It raced, passing on an idle machine and failing
    as a 20s timeout only under the full suite. Its regression test FORCES the ordering (the channel holds the
    attaching thread inside send(Open)); twenty-five attachments went on passing against the reverted defect on a
    quiet box. (2) SIX OF THE SIXTEEN ANSI COLOURS were the same hex as their normal twin — Catppuccin's own
    mapping, deliberate there — so the app rendered TEN distinct colours where the criterion says sixteen and
    git's 31 and 91 would have looked identical. Found because deleting the bold-brightening rule changed nothing
    any test could see. (3) EVERY SOCKET WRITE WAS ON THE MAIN THREAD: Android installs
    StrictMode.enableDeathOnNetwork() for every app targeting API 11 or later, not a flag and not relaxed by a
    debug build, so the FIRST KEYSTROKE would have thrown NetworkOnMainThreadException and killed the process; a
    rotation reached Mux.request, a blocking round trip with a 15s deadline, an ANR even without the throw.
    'Supports normal text input' was FALSE on the target platform while every gate this project has was green.
    Found by READING, because nothing here can find it — no JVM test reaches a Compose callback and assembleDebug
    compiles code it never runs. Fixed with a single-thread executor (single because keystrokes must stay ordered;
    a pool delivers ls as sl). Also fixed: start() guarded on thread.isAlive, and a FINISHED thread is also not
    alive, so a second start threw IllegalThreadStateException; stop() during connect() had nothing to close, so a
    screen left while connecting attached anyway; the renderer allocated a Cell and an Ink per cell per frame. NOT
    MET: 'works with Claude/OpenCode/Codex/Gemini TUIs' is THREE OF FOUR — there is still no gemini fixture,
    because gemini is not installed on this machine. NOT VERIFIED: every Compose behaviour, assembleDebug being
    the only gate a machine with no phone has, and the IME path in particular (composition and suggestion
    behaviour against a permanently-empty field is reasoned from the API, not observed); no relay leg, so LAN
    only. Mutation-checked: 17 mutations across the terminal, viewport, palette, watchdog and fixtures each turn a
    NAMED test red; every file restored byte-identical with plain cp.
