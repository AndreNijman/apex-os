  evidence: >-
    LANDED 2026-09-14 (round 25): apex-os roadmap/v2.2 13d53c01 -> fdf0a8e6 carries task/later-tpm-qualification
    (d362e952 lab machinery, 378d8ddd the three scenarios). lib.sh gains swtpm_session() (a software TPM the HOST
    can drive over mssim TCP on the SAME state dir qemu attaches through its unix control socket, which is what
    permits a real TPM2_Clear and a real systemd-cryptenroll re-enrolment), swtpm_owner_primary_name() (a clear is
    confirmed by the owner primary key's NAME changing, because tpm2_clear exiting 0 proves a command was accepted
    and not that a seed rotated), and cannot() (COULD-NOT-RUN as its own word, never a pass and never a failure).
    Three scenarios added: luks-tpm-clear (4 boots, one UKI throughout so a refusal cannot be the PCR policy in
    disguise), luks-firmware-change (a second volume on /dev/vdc bound BY VALUE to PCR 7 as the control, changed
    with Fedora's real DBXUpdate blob via virt-fw-vars), luks-s3 (mutation runs FIRST with qemu's S3 off, two
    non-colluding observers: the guest's suspend_stats and qemu asked over QMP). THE HONEST LIMIT, MEASURED NOT
    ASSUMED: the three NEW scenarios have never been executed - the predecessor's run was SIGTERM'd at 08:34:51 on
    2026-09-13 (scratch-later/run1.log holds the signal-15 forward) and the agent died with it. What WAS verified
    before landing: the shared-fixture extraction did not regress the pre-existing scenario - luks-tpm re-run on
    the branch tip in localhost/apex-bootlab against the real staged APEX root gives 21 passed, 0 failed, exit 0
    (scratch-later/orch-v3.log). All four luks scenarios are in STAGED, which run-scenarios keeps OUT of ALL, so a
    default CI run cannot silently skip them and still report success - and landing them therefore cannot turn
    boot-v2.yml red. LANDED 2026-09-14 (round 26): apex-os roadmap/v2.2 fdf0a8e6 -> 2219ef75 carries
    task/later-tpm-qualification e2345ed7, the FIRST EXECUTION of luks-tpm-clear and the three real defects it
    found. THE HEADLINE IS A SYSTEMD BEHAVIOUR, NOT A TEST BUG: after a genuine TPM2_Clear the documented
    one-command recovery, `systemd-cryptenroll --wipe-slot=tpm2 --tpm2-device=... --tpm2-public-key=... VOLUME`,
    prints 'This PCR set is already enrolled, executing no operation' and EXITS 0 -- measured on systemd
    258.10-1.fc43. systemd de-duplicates against the token already in the header before acting on the wipe, so on
    a cleared TPM the whole invocation is a success-reporting no-op: the header keeps a blob sealed to a seed that
    no longer exists and the next boot fails exactly as before the 'recovery' (guest said Esys_Load rc 0x1df, 'Key
    enrolled in superblock most likely does not belong to this TPM'; tokens byte-identical before and after).
    Wiping in its own invocation FIRST, then enrolling, produces a new blob and a working unlock -- that is now
    what the scenario does and what a user has to do. The control that missed it is fixed in the same commit:
    every existing header assertion (exactly one systemd-tpm2 token, public-key policy, PCR 11) held true of the
    no-op character for character, so the sealed BLOB is now compared before and after and an unchanged blob is a
    named failure. RUN STATUS, STATED HONESTLY: the re-run with the fixes reached 17 assertions passed / 0 failed
    through boot1-unlock, TPM2_Clear, boot2 tpm-unlock=REFUSED + recovery-unlock=SUCCESS in the same boot, and
    re-enrolment against the cleared TPM -- then was killed part-way through boot 3 of 4 when the laptop lid
    closed at 09:45:17 AWST and the machine suspended. It has still never completed end to end, and
    luks-firmware-change and luks-s3 have still never been executed once. Log
    /var/tmp/apex-work/scratch-later/r2-clear.log. ROUND 27 (2026-09-14): LANDED as merge 654fa854 (13be81a8,
    c84b2f83). THE CARD'S NEXT WAS STALE IN THE OTHER DIRECTION THIS TIME - it said later-r4-luks-s3 'IS RUNNING'
