    Loader and the shell and every other plugin stay alive. test-apex-plugin.sh 117/0, plugin-host-test.qml 94/0.
    Qualifier stated in the source itself (PluginService.qml:30-49), this is not a sandbox and does not confine a
    plugin written to defeat the textual scan.
- id: BASE-013
  title: Preserve compositor abstraction
  priority: P0
  status: done
  area: foundation
  depends_on: []
