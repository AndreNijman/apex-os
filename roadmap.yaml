    luks-s3 ran twice, r3 at 4 passed / 1 failed (finished 11:43:21) and r4 at 6 passed / 0 failed / 1
    COULD-NOT-RUN (finished 11:53:15), the could-not-run being 'the guest reported no s3 field at all'. So two of
    the three scenarios the card calls outstanding are in fact complete, and only the QMP waker path in luks-s3
