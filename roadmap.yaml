    the symlink's target was chmodded from 0755 to 0700 - another account choosing which of this user's
    directories gets its mode changed and where the session's build output lands. 0755 is the only mode an
    attacker would not choose. The cause is the one the module already knew about the OLD shared root, repeated
    one level down: ensure_private_dir is called on the LEAF, so create_dir_all made the root along the way under
    the umask and nothing ever looked at it - which also left the root at 0755 in /tmp in the NORMAL case, enough
    for another account to list a user's session ids. fs.protected_symlinks is 1 on this machine and stops a
    symlink planted directly in sticky /tmp, but an attacker-owned root is not sticky, so the symlink planted
    INSIDE it is followed: row 2 is what buys row 4. THE FIX IS TWO PARTS AND BOTH ARE NEEDED. 0c8acd53 makes
    ensure_private_dir stat with symlink_metadata rather than metadata (which FOLLOWS the link), refuse a symlink,
    refuse a directory this account does not own, and create every component 0700 with DirBuilder::mode rather
