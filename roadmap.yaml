- id: P2-003
  title: Accessibility baseline
  priority: P2
  status: partial
  area: accessibility
  depends_on: []
  acceptance:
  - Screen reader/magnifier/high-contrast/reduced-motion/keyboard-only installer validated
  gates:
  - tests
  - stop_slop
  evidence: >-
    Accessibility baseline. ROUND 19 on apex-os+apex-shell task/p2-b-round19, pushed, not yet merged (round 3
    landed as merge b6920252; this branch carries a merge of the moved v2.2 as 3541603d). THREE THINGS THAT WERE
    ASSERTIONS OF ABSENCE ARE NOW ASSERTIONS OF PRESENCE. (1) THE GREETER HAD NO SESSION BUS, so its correct
    accessibility markup reached nobody - Qt's AT-SPI bridge resolves org.a11y.Bus on the SESSION bus and the
    greet session had none, so a login screen a reader can read AND operate under test published ZERO nodes in
    production. greetd now runs /usr/libexec/apex-greet-session: a session bus with an EMPTY service directory,
    at-spi-bus-launcher and at-spi2-registryd execed beside it (activation is refused by SELinux here, measured
    again), then EXEC of the compositor so greetd still holds the compositor's own pid. Every step is optional and
    the only unconditional line is the exec, asserted by taking each piece away - no dbus-daemon, no writable
    runtime dir, no runtime dir at all - and requiring the greeter to start anyway. (2) ORCA COULD NOT BE STARTED:
    /usr/libexec/apex-screen-reader plus SUPER+ALT+S on all three desktop sessions, generated into Hyprland Lua,
    niri KDL and labwc XML from one apex-shell KeybindService default and proved by RUNNING each generator, and on
    BOTH greeter hosts - the one key a user who cannot see the screen can press. (3) THE AT-SPI WALK RAN ON ONE
    LAPTOP: apex-greet-atspi 31 passed 0 failed on this laptop, in a bare fedora:43 container, and ON THE GITHUB
    RUNNER. SUITES: tests/test-apex-greet-atspi.sh 31 (8/8 mutants), tests/test-apex-greet-session-bus.sh 37
    (13/13 mutants), tests/test-apex-a11y-stack.sh 24 (8/8 mutants), tests/test-apex-greet-a11y.sh 22,
    tests/test-apex-greet-layout.sh 25, tests/test-labwc-keybinds.sh 39, installer/test-installer-a11y.sh 51 local
    and 47 in CI (8/8 mutants), plus apex-shell run-a11y-controls-test.sh 21, check-reduce-motion.sh 12,
    run-niri-keybinds-test.sh 5+14, run-hypr-configerrors-test.sh 17, check-push-to-talk.sh 42. FOUR FINDINGS
    NOTHING WAS LOOKING FOR: Qt DOES gate on org.a11y.Status and this laptop could not show it (a live desktop has
    both flags already true, so 'the property cannot be pushed false' and 'Qt does not consult it' were artefacts
    of one machine; in a bare container both start false and Qt publishes nothing); a pgrep claim THIS BRANCH made
    was false and its own mutant found it by surviving (Linux takes comm from the SCRIPT basename, so pgrep -x
    orca works after all - corrected in three places rather than the mutant softened); the shipped labwc rc.xml
    seed had lost push-to-talk's W-A-v since P1-023 and the suite could not see it because it silently measured
    the INSTALLED shell whenever the repos are not siblings; and an unrelated red step (Run virtualization
    assertions, red on roadmap/v2.2 itself) had silently switched off ALL FOUR accessibility suites in CI, since
    GitHub stops a job at its first failure - fixed with if-not-cancelled, which still fails the job. TWO CAUGHT
    IN REVIEW BEFORE SHIPPING: sway -C cannot run inside an image build at all (rc=126, cap_sys_nice=ep outside
    the bounding set, same code for a good config and a broken one) so that build-time check was removed and lives
    in the suite; and the wrapper execs, so nothing was left to clean up after it - a watcher now kills exactly
    the pids it recorded. TWO MORE CI FOUND: the pid assertion was measuring which /bin/sh the runner has rather
    than the wrapper, and the installer page-advance check read the accessibility bus one frame too early. STAYS
    PARTIAL, named not implied: nothing has run orca AS THE greetd USER (writable HOME, speech-dispatcher with no
    audio session) and whether SELinux permits that context to exec gnome_atspi_exec_t is unproven here - if
    refused the wrapper degrades safely, so it is a silent no-reader rather than a broken login; greeter audio is
    unconfigured; the Tab ring is walked on one installer page; the text-entry pair is measured on this laptop
    only; magnifier, sticky keys, slow keys, mouse keys and the on-screen keyboard are absent; high-contrast is a
    Hyprland shader rather than an accessibility feature. Production note for the next measurer: nothing at the
    greeter sets ScreenReaderEnabled until a reader connects, and Qt gates on it, so a fresh greeter publishes an
    empty tree until the key is pressed - correct, not a regression.
- id: P2-004
  title: Internationalisation baseline
  priority: P2
  status: partial
  area: i18n
  depends_on: []
  acceptance:
  - Keyboard layout before password, IME/CJK/RTL/locales/timezones supported
  gates:
  - tests
  - stop_slop
  evidence: >-
    Internationalisation baseline. ROUND 20 on apex-shell task/p2-b-round19 (tip eb97b40), pushed, not yet merged.
    THE NAMED GAP MOVED FROM A GREP TO A MEASUREMENT, AND A CLAIM THIS UNIT HAD CARRIED SINCE ROUND 1 TURNED OUT
    TO BE FALSE. (1) THE TRANSLATOR GAP IS IN THE HOST, NOT src/. Every round before this recorded it as "no
    QTranslator anywhere in src/" - a grep over QML. The observation was right and the spelling invited the wrong
    repair, because it reads like an omission a line of QML could fix. It cannot: QTranslator is a C++ class and
    is not a QML type. Asked of the binaries instead, with the positive control in the same run because "nm
    printed nothing" and "the binary contains no such call" look identical from outside: libQt6QuickTest - the
    host the suite has just watched translate - calls QTranslator 4 times; /usr/bin/quickshell, the host the shell
    really runs in, calls it 0 times and installTranslator 0 times; libQt6Qml DOES carry an automatic route
    (QQmlApplicationEngine plus its translation loader, which installs a .qm found beside the root QML file with
    no code at all) and quickshell constructs a bare QQmlEngine, so that route is not taken either - the
    engine-constructor count being non-zero is the control for that one. Closing the row needs a translator
    installed INTO the engine: upstream in quickshell, or a QML extension module on the import path whose
    initializeEngine() does it. Not attempted - a compiled artefact in a repository of QML and shell scripts, and
    it changes the image build. Trap recorded: undefined symbols only. libQt6Qml both defines QTranslator's caller
    and is linked by every QML host, so a scan of the LINK CLOSURE reports "found" for a host that never calls it.
    (2) "THE SHELL WILL TOFU ON CJK" WAS NEVER RUN AND IS FALSE. The ledger carried it from round 1 to round 19:
    ~45 sites hardcode font.family "JetBrains Mono", that family has no CJK coverage, therefore tofu. Both
    premises are true and the conclusion does not follow - QFontEngineMulti asks fontconfig for a font that owns
    the glyph. Measured through the real engine at pixelSize 32, with the monospace premise asserted FIRST because
    the whole discriminator rests on it (every glyph JetBrains Mono draws advances 19.1875): CJK 32, Arabic
    19.265625 (DejaVu Sans Mono), Hebrew 21.390625 (DejaVu Sans), Thai 19.75 (Droid Sans Thai), Devanagari
    24.453125 (Droid Sans Devanagari) - each matched against a family fontconfig says covers that codepoint, each
    required not to be covered by JetBrains Mono itself. So THE RTL ROW'S "the image cannot render it" IS ALSO
    WRONG. What is still absent there is LAYOUT: 0 LayoutMirroring and 0 layoutDirection in src/, re-checked.
    Fonts were never the blocker. (3) THE SUITE NOW RUNS ON A SECOND MACHINE, AND CI HAD NEVER RUN IT.
    run-i18n-test.sh is 23 assertions here, 0 failed, 0 skipped; on the GitHub Arch runner 15 passed, 0 failed, 5
    skipped (run 34700588997). Every earlier round had it on one laptop. Two reasons it had never run there, both
    fixed on this branch: the step installed its Qt tools with apt-get inside an archlinux container, and the
    job's shellcheck step above it ran without -x and failed tests/test-headless-lib.sh, which stops the job
    before this step - an SC2034 about a test fixture switching off the measurement below it. WHAT THE SECOND
    MACHINE DOES NOT COVER, named rather than implied: section 4's quickshell probe SKIPS there (no quickshell) so
    the host measurement is ONE LAPTOP ONLY, and the Arabic/Hebrew/Thai/Devanagari rows SKIP because that
    container has no font covering them - the suite fails on a missing font only where /run/ostree-booted says the
    font set being measured IS the image's, which is the round-19 lesson about asserting on the runner instead of
    the product. Only the CJK row has two machines (Noto Sans CJK HK, advance 32, the same number). MUTATION:
    T1-T4 over the host probe, 4 applied 4 CAUGHT 0 survived; F1-F5 over the font section, 5 applied 5 CAUGHT 0
    survived, re-run after the ostree gate changed and still 5/5. Tree matches HEAD after every mutate and
    restore. F3-F5 were first reported SURVIVED and that was the harness grepping for a sentence the failure does
    not contain - the same shape as I2 and B2 before them; the expectation was corrected, not the mutant. STILL
    PARTIAL, each with its reason: no user sees a translated word until item (1) is closed, so the ~200-string
    AgentHelpContent conversion is parked deliberately - 200 unseen strings is the weaker increment; the locale
    picker is still BLOCKED because Containerfile.core installs glibc-langpack-en only, so a free picker degrades
    silently to C.UTF-8; the translated installer is GTK4/Python and needs gettext, a separate pipeline; RTL
    layout mirroring does not exist; IME/fcitx5 ships but no suite asserts it; per-user language does not exist;
    and the recovery flow still applies no layout. Keyboard layout before password and timezone remain DONE and
    measured on a second machine (CI run 34661483871, "cage started de: the same physical keys now produce the
    GERMAN letters"); installer-keymap 43 and installer-locale 26 both green on the runner again in run
    34701797842.
