    only ever graded 720p. tests/lib/headless.sh has the same hole under THIRTEEN runners plus a comment asserting
    it does not ("the default headless output is 1920x1080" - measured false); left alone deliberately and written
    up as its own item. (3) QuickControl centred its panel on root.screen.height - the other monitor's height on a
    mixed desk, 540px out - the POSITION half of the popup bug round two fixed the SIZE half of; it reads its
    anchor's screen now and scaling-test asserts anchor.rect.y per output. FIFTEEN MUTATION PAIRS across the three
    rounds - six in round one, one in round two, eight in round three - every restore a plain cp, verified by git
    status coming back empty, which is stronger than a sha256 of one file because it proves nothing else moved
