    out of the bundle and never into it, and any credential-named key has its value emptied. Anything the table
    does not name is machine-local and is not carried, so the exclusion survives a Claude release nobody has read.
    Verified against the real profile, 428 files and 1.9 MiB round-tripped onto a second home, and the doctor
    reports model, permissions, statusline, hooks, 2 commands, 33 skills, 7 enabled plugins, 3 marketplaces and
    both MCP servers. A real leak was found doing it, described in the evidence.
- id: P0-010
  title: Create read-only profile mounts and runtime overlays
  priority: P0
  status: done
  area: agent-profile
  depends_on:
  - P0-009
  acceptance:
  - Claude config/skills/commands can be mounted read-only
  - Writable session/plugin state is isolated
  - Managed Claude works with project sandbox enabled
  gates:
  - tests
  - stop_slop
  evidence: >-
    Landed on roadmap/v2.2 (884d0ca). Config, skills and commands mount read-only from the same table that decides
    what is exportable, so exportable-here cannot be writable-there. The writable overlay needs no bind at all:
    HOME is a tmpfs and bwrap creates its own mount points, so ~/.claude is an empty writable directory with only
    the listed entries mounted in, and anything unlisted is writable, session-private and gone at exit. Missing
    writable directories are created before the session starts, because a --ro-bind-try of a missing path is a no-
    op and the writes would silently vanish. Verified with real claude 2.1.261 under --sandbox project on katana,
    reporting from inside its own namespace that skills, commands, CLAUDE.md and settings.json are read-only while
    projects, todos and plugins/cache are writable, with 18 skills visible, no access to the real home and ~/.ssh
    absent. What Claude writes at runtime was measured with find -newermt rather than assumed, and every path it
    touched is a listed writable entry.
