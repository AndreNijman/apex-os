    TPM is explicitly off-limits to this program, so this cannot be closed from here - it needs a machine someone
    is willing to clear the TPM on. Gates green: shellcheck 165 discovered / 0 known-failing / 0 newly failing;
    suites 75 / 71 in CI / 4 exempt; doc verbs 246 valid / 0 undocumented and undeclared / 0 stale. ROUND 28
    ADDENDUM, two corrections to the above rather than new claims. (a) The signal fix is now verified IN SITU and
    carries a regression test: the real harness in a real container, killed with `podman kill -s TERM` mid-boot,
    ends `8 passed, 1 failed` with the named FAIL line and ExitCode 143
    (scratch-later/r6-trapcheck-sigterm-proof.log), and tests/test-boot-v2.sh (985ae69a) lifts the trap block out
    of run-scenarios itself and asserts a SIGTERM'd run names the signal and does not end `N passed, 0 failed`.
    Mutation-tested both ways: removing the three signal traps makes the new assertions fail and reproduces `1
    passed, 0 failed`; restored byte-identical with cp, confirmed by sha256. The assertion that did NOT move is
    exit 143 - bash re-raises regardless - so the exit status was never the problem and the LOG was. test-boot-v2
    is 78 passed / 0 failed. (b) AN OVERCLAIM IN 8ad79870 IS WITHDRAWN: it said all three edge cases show the
    recovery path failing before it works. True of the TPM clear and of the PCR 7-bound control volume, which both
    refuse the TPM unlock and then open with the recovery key in the same boot. NOT true of S3 - scenario_luks_s3
    contains no reference to a recovery key at all; its negative arm is the same run with qemu's S3 support off,
    and what it proves is that the volume stays open across the suspend. docs/boot-v2.md now says so. ROUND 29
    (2026-09-18), on task/later-2 as 18a015ec, PUSHED, NOT yet merged. THE PCR 0 LIMIT IS GONE - ON AN EMULATED
    TPM, and that qualifier belongs in the same sentence as the result. New scenario luks-firmware-code, 22 passed
    / 0 failed / 1 could-not-run, exit 0, container later-r7-fwcode State.ExitCode 0 and State.FinishedAt checked,
    and the 22 ok lines in the log counted against the summary line. Two Fedora OVMF builds differing in edk2
    revision and nothing else - edk2-d46aa46c8361 (20250812, supplied through the new $APEX_BOOTLAB_FW_ALT) and
    edk2-2970e5699ba6 (20260812, the lab image's) - both Secure Boot, both 4 MB, all three boots from a fresh copy
    of ONE varstore template. PCR 0 moved 0FA5AE84ABAB76C8D4752C359795F141212F883176F9ACFFF0E77743EBF0643F ->
    0E33803144670784CA0F2EF208108CC8DEA8D23D2A06FE7D7AF5D1109B75BFFB; PCR 11 stayed
    22C006FB6217982C06A57DFDDBEEA0419F54200D9C3AF216143D9BE62A1E6B3A throughout; APEX's signed PCR 11 policy still
    unlocked; a control volume bound BY VALUE to PCR 0 refused in that same boot; and the 512-byte plaintext
    marker written under the OLD firmware was read back under the NEW one. AN UNPLANNED FINDING WORTH THE RUN: PCR
    7 is IDENTICAL across the two revisions (933DE452FF745C293B21C2F5D2DC9473751040495200B46A0EF345B42D948C31), so
    an edk2 version change moves the code register and leaves the Secure Boot policy register alone; the scenario
    reports PCR 7 and deliberately asserts nothing about it, because that is a fact about edk2 and not about APEX.
    THE SUPPLIED FIRMWARE IS NOT TRUSTED: its revision is read out of the binary (grep -a for the rpm build path,
    no binutils in the lab image) and it must REFUSE AN UNSIGNED UKI before anything rests on it - without that, a
    build with Secure Boot compiled out would move PCR 0 for the obvious reason and the run would report that a
    firmware update had not broken the policy, about a firmware that had stopped checking signatures. That trap is
    real and sits in this unit's own scratch dir as a non-secboot build named OVMF_CODE_4M.secboot.fd. The honest
    boundary is recorded IN THE RUN as a could-not-run: an OVMF binary swap is not a vendor UEFI capsule - no
    microcode, no ACPI tables, no option ROMs, no management-engine firmware. SECOND NEW SCENARIO, luks-no-tpm, 16
    passed / 0 failed / 1 could-not-run, container later-r7-notpm ExitCode 0: one volume booted twice with the TPM
