- id: P0-008
  title: Add agent network modes
  priority: P0
  status: done
  area: network-policy
  depends_on:
  - P0-004
  acceptance:
  - Supports open/allowlist/brokered/offline
  - Strict mode remains fail-closed
  - Destination policy is testable
  - Cloud provider operations can work through broker
  gates:
  - tests
  - stop_slop
  evidence: >-
    Landed on roadmap/v2.2. Four modes. Three share one kernel fact, bwrap --unshare-net gives a namespace with no
    route, resolver or address, and differ in what apex-agentd offers over a Unix socket afterwards, since AF_UNIX
    is a filesystem object a network namespace does not touch. open enforces nothing; offline offers nothing;
    brokered is offline plus the capability broker; allowlist adds a CONNECT proxy in the daemon whose bridge is
    the session's parent inside the sandbox. The allowlist is not bypassable from inside, proxy variables only let
    a client find the bridge and a session that unsets all six gets Could not resolve host, measured. Destination
    policy is two pure functions in destination.rs, default deny, wildcards excluding the apex, and loopback,
    RFC1918, link-local, ULA, CGNAT and multicast refused including the IPv4-mapped IPv6 form, with the daemon
    connecting to an address it checked rather than re-resolving. strict still forces offline as a floor, now
    asserted in the argv over the whole value set, and validate, build_argv and the unconfined path each refuse a
    mode with no namespace. Verified behaviourally against an isolated daemon, allowed host 200, unlisted host
    403, and a name allowed by policy refused after it resolved to 127.0.0.1. 1202 tests, clippy clean. Honest
    limits recorded in the docs, a CONNECT tunnel is opaque so volume to an allowed host is unbounded, and non-
    HTTP traffic fails outright rather than being filtered.
