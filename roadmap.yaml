- id: P2-018
  title: Guaranteed Safe Graphics / desktop failover mode
  priority: P2
  status: partial
  area: recovery-graphics
  depends_on:
  - BASE-015
  - BASE-018
  acceptance:
  - A graphics/compositor/shell failure can enter a conservative recovery desktop or safe graphical session.
  - User can inspect failure, roll back deployment/driver, collect diagnostics, and reach files/network.
  - Recovery does not depend on the broken normal compositor configuration.
  gates:
  - tests
  - stop_slop
  evidence: >-
    Guaranteed Safe Graphics. Landed on task/p2-f, NOT yet merged. APEX Safe Graphics is a labwc session started
    as 'labwc -C /usr/share/apex/safe-graphics' — a config DIRECTORY, which is the whole of criterion 3: the
    compositor never opens ~/.config/labwc, the file apex-input-apply splices a libinput element into with
    ElementTree and apex-labwc-keybinds generates into, and the file labwc falls back from SILENTLY when it will
    not parse. -C rather than XDG_CONFIG_HOME on purpose, so the CLIENTS keep their own config; a file manager
    with no config directory cannot save a bookmark. Software rendering forced (pixman, llvmpipe,
    LIBGL_ALWAYS_SOFTWARE, no hardware cursors) and __GLX_VENDOR_LIBRARY_NAME / GBM_BACKEND /
    MESA_LOADER_DRIVER_OVERRIDE actively UNSET, because a broken GPU setup is often a broken vendor selection.
    WLR_BACKENDS is deliberately not set: unset it is DRM for a person and headless for a test, which is the only
    way this is exercised without taking the live display away. CRITERION 3 IS MEASURED, NOT INSPECTED:
    tests/test-apex-safe-graphics.sh plants an unparseable rc.xml plus an autostart that would exit the compositor
    exactly where the user's live, starts the real session under WLR_BACKENDS=headless in a private
    XDG_RUNTIME_DIR, and requires a wayland socket and a live compositor afterwards. 59 passed, 0 failed, and it
    now runs in CI, in the pr-validation job that already installs labwc for the keybind-reload suite — it was in
    no workflow when first written, which in this repo means it would have run on no machine unless somebody typed
    it. MUTATION: deleting -C from the exec line takes it to 42/2, failing both the structural check and 'the
    recovery session came up over a broken user configuration', because the compositor then read the planted
    config and went away. Restored with plain cp, cmp silent. CRITERION 2 IS STRUCTURAL, NOT EXERCISED: the menu
    names apex recover status, apex doctor, apex-safe-graphics diagnose, sudo apex rollback (which IS the driver
