  - tests
  - stop_slop
  evidence: >-
    OS half landed on roadmap/v2.2. APEX shipped with no firewall at all, firewalld absent and nftables present
    with an empty ruleset, so every bound port was reachable, seventeen of them on the L16 including a model
    server and a Steam remote-play socket. files/system/nftables/apex.nft drops inbound, permits outbound and
