- id: P1-061
  title: Extend APEX capabilities to normal application permissions
  priority: P1
  status: done
  area: app-security
  depends_on:
  - P1-001
  acceptance:
  - Design unifies or brokers filesystem, camera, microphone, screen capture, USB/device, network, sensitive-directory,
    and secret access where Linux/portal primitives permit.
  - Flatpak/native apps can be represented without pretending they have identical enforcement mechanisms.
  - Settings -> Privacy & Permissions shows effective capabilities and origin.
  - Revocation behavior is explicit and tested.
  gates:
  - tests
  - stop_slop
  evidence: >-
    LANDED 2026-09-13: apex-os merge 84ffb84f, apex-shell merge e068271, both on roadmap/v2.2;
    tests/check-no-conflict-markers.sh PASS on both trees after the merge. Round 2's branch heads 44503bfb and
    a47bc25 named in the text below are now contained in those merges. ROUND 2 2026-09-12 closed both criteria
    round 1 left open. Pushed: apex-os task/p1-061-app-permissions @44503bfb, apex-shell @a47bc25, both merged up
    from roadmap/v2.2 first. apex-shell CI GREEN on the branch (run 34703203629). ROUND 1 (landed as apex-os merge
    5ba789a5, apex-shell bdfb056) stands unchanged for C1 and C2. C1 DESIGN docs/app-permissions.md, measured on
    l16 not assumed: the portal interface set is a property of the SESSION (Usb/Secret/RemoteDesktop absent under
    Hyprland's default=hyprland;gtk, present under niri's gtk;gnome); no microphone portal exists in any
    xdg-desktop-portal; /dev/video0 is root:video 0660 with a logind uaccess ACL and the user in neither group.
    Brokers camera/location/notifications/files/secrets where primitives permit; USB and RemoteDesktop stay
    NoPrimitive on the default session by a documented decision not to add gnome to Hyprland's list, which is what
    'where primitives permit' scopes. C2 DONE apex-perm-core: four independent fields (state, enforcer, origin,
    revocation) with revocation derived so it can never exceed its enforcer, asserted over the whole enforcer x
    state product; the axis is per-capability, not Flatpak-vs-native - io.github.cosmic_utils.camera carries
    devices=all and lands on the same logind ACL as a native binary, com.spotify.Client is the portal-brokered
    control. C3 NOW DONE - the page has been instantiated, laid out and RASTERISED under a compositor, which round
    1 said plainly it had not. Running it found, in the first second, a defect qmllint, node and
    check-privacy-ui.sh had all missed: parseList returned session:null for an unreadable report, PrivacyPage
    binds session.desktop at line 122 and session.brokered at line 176, and a binding inside a section whose
    visible is false is still evaluated, so the page threw TWICE ON EVERY LOAD (report is seeded with
    parseList('',0)). Fixed in the model - the failure branch returns sessionView(null) so the report has one
    shape on every path - not by a guard in the page. New tests/run-privacy-page-test.sh +
    tests/privacy-page-test.qml: the page built through PageRegistry inside a FloatingWindow on a headless labwc
    with a stub apex answering from the fixture, 73 assertions in three phases. fixture: 3 apps, 30 rows, origin
    line AND enforcer line each counted 30 times (the criterion is 'and origin', so per-row not per-page), 15
    controls in three labels and ZERO on the native program's ten rows, the devices=all Flatpak reads identically
    to the native binary while the portal-brokered one differs, pressing Never runs exactly 'apex permissions
    revoke com.spotify.Client camera', revoke on an unrevokable row returns false and runs nothing. unreadable:
    apex fails, the page must say nothing could be READ and must not throw - the phase the defect went red on.
    pixels: grabToImage through the scene graph, 980x692 PNG, 14536 distinct pixel values, read back by
    tests/lib/png-ink.py. A TypeError in any phase log is a hard failure because that defect class leaves no other
    trace. Mutant: session:sessionView(null) -> session:null turns 4 new node assertions and all 4 render-phase
    TypeError assertions red; restored byte-identical with cp. C4 NOW DONE - the one unmeasured timing is measured
    and the answer is NO. A permission-store change does NOT reach an already-running PipeWire client.
    tests/measure-permission-store-reach.sh + tests/permission-store-client.c: private session bus, private
    PipeWire, private WirePlumber on a no-hardware profile, private XDG_DATA_HOME, so the grant taken away belongs
    to an application id that does not exist - round 1 believed measuring this meant revoking on Andre's live
    machine and it does not. The negative is worth something because every other link was verified working in the
    same run: the client is recorded pipewire.access=portal on socket pipewire-0 with app_id and
    media_roles=Camera; WirePlumber granted it (pw-cli get-permissions shows rwxm- on the client and the Camera
    node, access-portal.lua:87 logged 'setting permissions: true'); the store reads back ['no']; gdbus monitor
    caught Changed('devices','camera',false,<byte 0x00>,{app:['no']}); and the module answers lookup calls. Six
    seconds after the write the client still held rwxm- on every object and access-portal.lua logged nothing.
    Where the chain breaks, between the store's Changed and access-portal.lua:123, is deliberately NOT claimed. So
    Timing::NextRequest is the correct statement rather than the merely cautious one, Timing::Immediate stays
    unreachable, and nothing_claims_a_revocation_is_immediate is now backed by evidence; docs/app-permissions.md
    2.4 and 6 and the Timing doc comment all changed from 'not verified' to what was found. Also now read off the
    running process rather than a config file: libwireplumber-module-portal-permissionstore.so is in the L16
    session WirePlumber's mapped modules. C4's original half unchanged: tests/test-apex-permissions.sh 10/10 (+1
    needs --with-binary) runs the real xdg-desktop-portal and xdg-permission-store on a private bus and calls
    AccessCamera from a bwrap caller with a /.flatpak-info - store=no is refused WITHOUT reaching the dialog,
    no-entry reaches it, the same harness still grants, and the native counter-test opens /dev/video0 and asserts
    it SUCCEEDS. LIMITS OF EVIDENCE, stated rather than buried: the render evidence is from ONE machine, this L16
    - CI has no quickshell or labwc so run-privacy-page-test.sh SKIPs there (confirmed in run 34703203629), and
    the same is true of measure-permission-store-reach.sh, which needs pipewire-utils and pipewire-devel that are
    not in the image (its header says how to run it without installing them). The rasterised page is washed out
    because the private HOME has no colors.json, so nobody has yet seen this page in the palette a user gets. And
    the store-change finding is an outcome, not a diagnosis. Gates: clippy --locked --workspace --all-targets -D
    warnings clean; cargo test --locked --workspace all green; shellcheck -S warning -x clean on both new scripts
    and tests/check-shellcheck-coverage.sh 141 discovered 0 newly failing; check-doc-verbs.sh 208 valid 0
    undocumented-undeclared; check-containerfile-assertions.sh and check-no-conflict-markers.sh green; apex-shell
    check-privacy-ui.sh 35/35 with 7/7 mutants, permissions-test.js 35/35, check-headless-runners.sh 28/28,
    run-popup-smoke.sh clean (it is the suite that first reported the TypeError), run-privacy-page-test.sh 73/73;
    stop_slop docs/app-permissions.md 44.0 slopcheck hits per 1000 words, between recovery.md 32.0 and
    update-cost.md 45.6.
- id: P1-062
  title: Build destructive chaos/torture reliability test infrastructure
  priority: P1
  status: done
  area: testing
  depends_on:
  - P0-001
  acceptance:
  - Automated tests simulate power loss during update, full disk, network loss, shell/apexd crashes, expired cloud token,
    killed agent during checkpoint, monitor hot-unplug, suspend during work, and failed rollback.
  - Boot/update/install/rollback loops run continuously in VMs.
  - Failures produce reproducible diagnostics and do not silently corrupt the installation.
  gates:
  - tests
  - stop_slop
  evidence: >-
    Destructive chaos/torture reliability test infrastructure. LANDED on apex-os roadmap/v2.2 2026-09-12 as merge
    a0341a50 (six commits) plus 23783fb7, the schedule criterion 2 actually needed. FIVE CASES, NO STUBS, each
    running its subject against a fault proven present by an observation the injector did not make:
    power-loss-during-update truncates the update record at a seeded byte and proves the remainder is a strict
    prefix AND that a JSON parser refuses it; failed-rollback chmods the deploy dir 0000 and, as root, correctly
    reports COULD-NOT-INJECT rather than passing, because the mode is ignored and the read succeeds; network-loss
    uses a netns with a DOWN loopback and requires connect() to get ENETUNREACH specifically rather than merely
    fail; full-disk fills a tmpfs to the last byte in a mount namespace after verifying the mountpoint IS a tmpfs;
    reboot-loop stages a +3-0 entry nothing can bless, boots five OVMF guests, and reads the ESP out of the FAT to
