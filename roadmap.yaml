- id: BASE-012
  title: Preserve APEX Shell plugin platform and permissions
  priority: P0
  status: done
  area: foundation
  depends_on: []
  acceptance:
  - Plugin API remains versioned
  - Permissions are enforced
  - Plugin failures do not take down core shell where isolation exists
  gates:
  - tests
  - stop_slop
  evidence: >-
    Ran headless nested on katana. API_VERSION 1.1 with an apiCompatible gate, and a future-apiVersion plugin is
    refused live with reason api-version-unsupported. apex-plugin-verdict.js reuses the same manifest.js as the
    shell, so the OS-side CLI cannot disagree with the shell about a manifest. Enforcement is dual-layer and was
    called for real, a load-time import scan refuses an undeclared Quickshell.Io reach (forbidden-import) and the
    runtime gate refuses an undeclared network call and a path traversal outside the plugin directory. Crash
    isolation proved live, a plugin that passes static checks then fails inside the QML engine is caught by the
    Loader and the shell and every other plugin stay alive. test-apex-plugin.sh 117/0, plugin-host-test.qml 94/0.
    Qualifier stated in the source itself (PluginService.qml:30-49), this is not a sandbox and does not confine a
    plugin written to defeat the textual scan.
- id: BASE-013
  title: Preserve compositor abstraction
  priority: P0
  status: done
  area: foundation
  depends_on: []
  acceptance:
  - Floating/labwc, Hyprland, and niri use shared APEX settings model
  - Generated config does not drift
  - Compositor names remain implementation details for normal users
  gates:
  - tests
  - stop_slop
  evidence: >-
    Preserve compositor abstraction. LANDED 2026-09-12 in both repos (apex-os merge 59245497, apex-shell merge
    cd324ec). The shared model and adapter confinement were already proven (48/0 facade under real labwc, 36/0
    adapter confinement with a negative control, no config drift). WHAT REMAINED WAS CRITERION 3, AND IT WAS A
    REAL DEFECT RATHER THAN A MISSING TEST: the greeter and Settings named the compositor PROJECT where the user
    sees a mode - the session picker read raw Name= values, and labwc was missing from the Settings compositor
    control ENTIRELY, so a Floating user could not pin their own compositor. Both fixed (836df42f, ea83d21).
    PROVED TWO WAYS BECAUSE ONE WAS NOT ENOUGH: tests/check-compositor-naming.sh 42/0 at source level, plus 8 new
    engine assertions in compositor-facade-test.qml at 60/0 under real headless labwc. Seven mutation pairs; the
    decisive one is an argument typo, presentedName(root.nam), which leaves the grep checker 42 passed / 0 failed
    and BLIND while the facade goes 58/2 - that same mutant also proves the harness really resolves labwc rather
    than silently falling back to another adapter. Settings-pages 17/0, popup-smoke 0 errors. RE-VERIFIED ON THE
    CURRENT TIP (round 13, 2026-09-12, apex-os 4ae4cf22 / apex-shell bdfb056, several unrelated merges later):
    check-compositor-naming.sh 42 passed 0 failed, compositor-facade-test.qml 60 passed 0 failed under real
    headless labwc, check-compositor-backends.sh 47 passed 0 failed. No drift. STILL OPEN AND IT IS ANDRE'S CALL,
    NOT AN AGENT'S: 'Floating' is ratified at ROADMAP.md:1031, but 'Scrolling' (niri) and 'Tiling' (Hyprland) are
    an agent's reading of ROADMAP.md:91 and are new user-visible words on the login carousel and in Settings. They
    live in one map plus one option list in apex-shell and two .desktop files plus one Containerfile sed in
    apex-os, so changing them is cheap. SECOND-MACHINE EVIDENCE, NEW THIS ROUND (round 13, 2026-09-12). Until now
    every roadmap suite in apex-shell had run on exactly one laptop: ci.yml triggers only on push/PR to main and
    dev, and its own comment says so - 'nothing here has run for any of it'. That comment also claims
    workflow_dispatch 'does nothing for the branch that adds it', and THAT IS WRONG: `gh workflow run ci.yml
    --repo AndreNijman/apex-shell --ref roadmap/v2.2` was accepted and produced run 34688615921, because the
    workflow is registered at that path from main while the dispatched ref's own copy declares the trigger. In
    that run, on an archlinux:latest container - a different distro, bash and Qt from the developer's Fedora
    laptop - this item's suites pass unchanged: 'Compositor adapter invariants' passed=47 failed=0, 'What Settings
    is allowed to call the compositor' (check-compositor-naming.sh) passed=42 failed=0, 'Whether the power menu
    may offer Gaming Mode' passed=12 failed=0. The facade test reported 'SKIP: quickshell not installed', which is
    the honest outcome its harness is built for and leaves the 60/0 engine run laptop-only. The run failed
    overall, on a step that is NOT this item's - see the card for the stale TopBar.qml greps.
- id: BASE-014
  title: Preserve modern Floating/labwc visual integration
  priority: P0
  status: done
  area: foundation
  depends_on: []
  acceptance:
  - APEX theme, Material palette, rounded SSD/shadows, modern switcher, context UI and keybind reload work
  - Emergency fallback menu remains available
  gates:
  - tests
  - stop_slop
  evidence: >-
    Preserve modern Floating/labwc visual integration. LANDED on apex-os roadmap/v2.2 2026-09-12 as merge 59245497
    (eb26c072). Theme wiring, cornerRadius and shadow config, the matugen pipeline, a real screenshot with accent
    border and the emergency fallback were already proven at 18/0. THE LAST ASSERTION - 'the rebound key fires
    after labwc --reconfigure' - HAD NEVER EXISTED IN EITHER REPOSITORY, and the machinery to write it did not
    either: test-labwc-keybinds.sh never starts labwc (every apply passes --no-reload, deliberately, so it cannot
    touch the developer's own rc.xml), test-labwc-session.sh reloads a live nested labwc but never presses a key,
    and there is no wtype or ydotool anywhere in either repo. It exists now: tests/test-labwc-keybind-reload.sh,
    18/0, a NEW file rather than a section in test-labwc-session.sh - that suite nests on the PARENT display (the
    agent's environment carried the developer's own wayland-1) and is in no workflow at all. The new one runs
    under WLR_BACKENDS=headless, asserts isolation as FOUR HARD FAILURES BEFORE the first keypress, and unsets the
    inherited LABWC_PID - labwc --reconfigure SIGHUPs whatever that names. It reproduces the original bug in-suite
    (--no-reload: the new key is dead and the old one still alive) and then proves the criterion. Four mutation
    pairs, two of them against the product rather than the test. THE ITEM'S ONE REMAINING QUALIFICATION IS NOW
    CLOSED (round 13, 2026-09-12). The recorded gap was that nobody knew whether a GitHub runner could start labwc
    headless, because the branch could not push to the branch pr-validation.yml triggers on - so the suite might
    only ever have SKIPPED in CI. It did not skip. The landing merge's own run 34635660418, job 'Package engine',
    step 'Run the keybind reload assertions', printed 'labwc-keybind-reload: 18 passed, 0 failed, 0 SKIPPED' on
    ubuntu-24.04, including 'PASS THE REBOUND KEY FIRES AFTER --reconfigure' and 'PASS THE REBOUND KEY FIRES AFTER
    THE TOOL'S OWN RELOAD'. The runner started labwc under WLR_BACKENDS=headless (pid 6162), passed all four
    isolation assertions, and wtype drove real keypresses through virtual-keyboard-unstable-v1. Re-run locally on
    tip 4ae4cf22 as well: 18 passed, 0 failed, 0 skipped. That job did fail overall, but on
    tests/test-agent-inject.sh, which is apex-agentd's and not this item's. THE REST OF THIS CRITERION IS ASSERTED
    AT CONFIG LEVEL ONLY, AND SAYING SO IS OVERDUE. The round-8 record listed four open qualifications; round 12
    closed the fourth ('the rebound key after --reconfigure') and called it 'the last open assertion', while the
    other three left the record without anyone deciding them. They are: rounded SSD corners are not visible at
    headless output size, the drop shadow is indistinguishable against black, and the window switcher and context
    menus need a real click. So 'rounded SSD/shadows and modern switcher work' rests on rc.xml carrying
    cornerRadius 10, dropShadows yes, keepBorder no, maximizedDecoration titlebar and a thumbnail windowSwitcher -
    the settings are pinned, the pixels are not. KEPT AT done DELIBERATELY rather than inherited: rc.xml is what
    APEX ships and what APEX can regress, and labwc honouring its own documented config is labwc's contract, not
    this repo's. If Andre reads the criterion as 'the corners are visibly round on a real screen', this is a
    partial and the missing piece is a pixel test on a non-headless output, which no assertion in either repo
    currently makes.
- id: BASE-015
  title: Preserve recovery/doctor/factory-reset workflow
  priority: P0
  status: done
