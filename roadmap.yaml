- id: P1-061
  title: Extend APEX capabilities to normal application permissions
  priority: P1
  status: partial
  area: app-security
  depends_on:
  - P1-001
  acceptance:
  - Design unifies or brokers filesystem, camera, microphone, screen capture, USB/device, network, sensitive-directory,
    and secret access where Linux/portal primitives permit.
  - Flatpak/native apps can be represented without pretending they have identical enforcement mechanisms.
  - Settings -> Privacy & Permissions shows effective capabilities and origin.
  - Revocation behavior is explicit and tested.
  gates:
  - tests
  - stop_slop
  evidence: >-
    LANDED on apex-os roadmap/v2.2 2026-09-12 as merge 5ba789a5, and on apex-shell roadmap/v2.2 as merge bdfb056.
    Both halves pushed: apex-os task/p1-061-app-permissions @16a37751, apex-shell @d1f5a6f. C1 DESIGN
    docs/app-permissions.md, measured on l16 not assumed: portal interface set is a property of the SESSION
    (Usb/Secret/RemoteDesktop absent under Hyprland's default=hyprland;gtk, present under niri's gtk;gnome); no
    microphone portal exists in any xdg-desktop-portal; no devices table in the store (nothing ever asked about
    the camera); /dev/video0 is root:video 0660 with a logind uaccess ACL and the user in neither group. Brokers
    camera/location/notifications/files/secrets where primitives permit; USB and RemoteDesktop stay NoPrimitive on
    the default session by a documented decision not to add gnome to Hyprland's list. C2 DONE apex-perm-core: four
    independent fields (state granted/denied/never-asked/no-primitive, enforcer
    portal-store/portal-prompt/document-portal/sandbox-context/logind-acl/nothing, origin, revocation) with
    revocation derived so it can never exceed its enforcer, asserted over the whole enforcer x state product. The
    axis is per-capability, not Flatpak-vs-native: io.github.cosmic_utils.camera carries devices=all and lands on
    the same logind ACL as a native binary, com.spotify.Client is the control and is portal-brokered. 22 unit
    tests on real manifests. C3 PARTIAL Settings page exists and is wired (PageRegistry, qmldir, IPC, popup-smoke
    list) and renders state+enforcer+origin+timing per row with NO control where nothing can be revoked - but it
    has never been instantiated under a compositor; qmllint proved syntax with a broken copy as negative control,
    node proved logic 31/31, check-privacy-ui.sh proved wiring 35 checks + 7 mutants each watched to go red. C4
    DONE-WITH-ONE-GAP tests/test-apex-permissions.sh 17/17 runs the real xdg-desktop-portal and
    xdg-permission-store on a private D-Bus session and calls AccessCamera from a bwrap caller with a
    /.flatpak-info: store=no is refused WITHOUT reaching the dialog, no-entry reaches it, and the same harness
    still grants - so the refusal is the store's, not the dialog's. Two mutants watched to fail. Native
    counter-test opens /dev/video0 and asserts it SUCCEEDS. apex permissions revoke exits non-zero with three
    distinct sentences for three reasons. GAP: whether a store change reaches an already-RUNNING PipeWire client
    was not measured (would mean revoking on the live machine), so Timing::Immediate is unreachable and a test
    holds it so. ALSO fixed: Hyprland, the default session, had no Secret portal; naming a backend overrides
    UseIn= was proven on a private bus before shipping the pin. Gates: clippy --locked --workspace --all-targets
    -D warnings clean; cargo test --locked --workspace 3022 passed 0 failed (tip 2998); shellcheck clean;
    check-doc-verbs.sh clear for apex permissions (7 apex lid verbs remain, pre-existing P1-063); stop_slop 41
    slopcheck hits/1000 words vs 33.3 recovery.md and 45.6 update-cost.md, shell files below their landed
    equivalents; check-color-tokens/check-scale-tokens/check-headless-runners/check-containerfile-assertions all
    green.
- id: P1-062
  title: Build destructive chaos/torture reliability test infrastructure
  priority: P1
  status: done
  area: testing
  depends_on:
  - P0-001
  acceptance:
  - Automated tests simulate power loss during update, full disk, network loss, shell/apexd crashes, expired cloud token,
    killed agent during checkpoint, monitor hot-unplug, suspend during work, and failed rollback.
  - Boot/update/install/rollback loops run continuously in VMs.
  - Failures produce reproducible diagnostics and do not silently corrupt the installation.
  gates:
  - tests
  - stop_slop
  evidence: >-
    Destructive chaos/torture reliability test infrastructure. LANDED on apex-os roadmap/v2.2 2026-09-12 as merge
    a0341a50 (six commits) plus 23783fb7, the schedule criterion 2 actually needed. FIVE CASES, NO STUBS, each
    running its subject against a fault proven present by an observation the injector did not make:
    power-loss-during-update truncates the update record at a seeded byte and proves the remainder is a strict
    prefix AND that a JSON parser refuses it; failed-rollback chmods the deploy dir 0000 and, as root, correctly
    reports COULD-NOT-INJECT rather than passing, because the mode is ignored and the read succeeds; network-loss
    uses a netns with a DOWN loopback and requires connect() to get ENETUNREACH specifically rather than merely
    fail; full-disk fills a tmpfs to the last byte in a mount namespace after verifying the mountpoint IS a tmpfs;
    reboot-loop stages a +3-0 entry nothing can bless, boots five OVMF guests, and reads the ESP out of the FAT to
    find a pair only a staged-and-never-blessed deployment makes. THE VERDICT HAS A COULD-NOT-INJECT ARM AND IT
    FIRES: three mutations land on it rather than on a pass, including one that empties the serial log so the
    failure is caught at EXPOSURE rather than at injection. That arm is the point: a harness reporting no
    corruption when it never injected the fault is the worst version of permission-denied-is-not-absence. THREE
    SOURCE DEFECTS, each caught red by a case before it was fixed: channel.rs read_record returned Option, so a
    torn record printed nothing-recorded-yet for a machine that had just updated; apex doctor collapsed
    ENETUNREACH and ECONNREFUSED into one sentence, a claim about apexd from a syscall that never left the box;
    and qualify::save left a 0644 temp file on a full disk because the chmod sits between the create and the
    rename. DIAGNOSTICS per case: verdict.json, seed, env.txt with probed capabilities and the binary sha256,
    inject/prove/observe/exposed/baseline, expectations, state before/after/diff; run-chaos --replay reproduces
    from seed plus revision and chaos-loop keeps every iteration's bundle with a cursor. CRITERION 2 is met by a
    weekly schedule (Sunday 18:00 UTC, three iterations) rather than the dispatch input defaulting to 0 that was
    landed: GitHub runs schedule from the default branch only, so it begins firing when roadmap/v2.2 reaches main,
    and the step's condition names the schedule event explicitly because a scheduled run carries no inputs and a
    skipped step counts as success. GATES: clippy clean, cargo test 2888 passed 0 failed, chaos self-test 63/0,
    the harness itself 4 survived 0 failed 0 could not inject, shellcheck clean, project-layout 23/0.
- id: P1-063
  title: Lid-closed continuous operation
  priority: P1
  status: partial
  area: power
  depends_on:
  - P0-015
  acceptance:
  - Closing the lid while work is live does not suspend the machine; agent sessions, their child processes and their
    network connections keep running.
  - An active VPN survives a lid close and stays connected for the whole closed period.
  - Everything not needed for that work is powered down - display, keyboard backlight, Bluetooth, discretionary user
    services - and the machine draws measurably less than it does with the lid open.
  - With no live work, a lid close suspends exactly as it does today.
  - Thermal and battery guards suspend or hibernate anyway rather than cook the machine in a bag or die mid-task, and
    say which guard fired.
  - The owner can pin keep-working on or off, and can see why the machine did what it did after reopening.
  gates:
  - tests
  - stop_slop
  evidence: >-
    LANDED on apex-os roadmap/v2.2 2026-09-12 as merge ebce9b46. Lid-closed continuous operation. Round 2 on
    apex-os task/p1-063-lid-2, SIX commits pushed. tests/test-apex-lid.sh 60/0, tests/test-apex-lid-live.sh 13
    passed with one honest could-not-run, clippy --locked --workspace --all-targets -D warnings clean. ROUND 1
    SHIPPED A POLICY AND A DRIVER NOTHING EVER RAN: no unit, no Containerfile stanza, so on a built image every
    criterion was unmet however green the suites were. apex-lid.service now exists and is enabled. FIVE PRODUCT
    DEFECTS FOUND AND FIXED THIS ROUND, all mutation-proved, every file restored byte-identical. (1) A DROPPED VPN
    WAS REPORTED AS ONE THAT HELD - read_vpn has no memory, so a tunnel that went away answered None, identical to
    never having had one, and vpn_held scored the timeline as an unordered set: Up Up None None printed 'the VPN
    held'. VpnState::Down was UNREACHABLE from the driver, so criterion 2 COULD NOT FAIL. Fixed in the driver
    (note_vpn carries the tunnel name forward) and in vpn_held (reads the timeline in order), with the converse
    guarded too - a tunnel brought up midway is not retroactively a drop. Same function also returned the moment
    nmcli was unavailable, so sing-box, APEX's OWN shipped VPN and a tun device NetworkManager never lists, was
    never asked about. (2) THE KEYBOARD BACKLIGHT WAS NEVER ZEROED - kbd_backlights returned an already-re-rooted
    path that apply_sysfs re-rooted again; write_abs created the whole tree and reported ok. Planning and
    describing were right; only the write was wrong. (3) A GUARD FIRING ON THE FIRST POLL LEFT NO RECORD -
    GuardSuspend opens no keep-working period, so ended_by was written only if one happened to exist. A laptop put
    away hot reaches its limit immediately, so the common case is the one with no period: the owner reopens and is
    shown the PREVIOUS close with ended_by null. (4) THE UNIT DISABLED THE FEATURE IT SHIPPED - ProtectHome=yes
    makes /run/user inaccessible AND EMPTY, and that is where the driver finds every live session and every
    owner's home; measured with systemd-run, ls /run/user returned nothing under it and '0 1000 1042' without.
    Zero sessions for ever, pin=auto never activates, the owner's ~/.config/apex/lid.toml never read - the
    silent-pin defect 2aa9ed45 fixed in code, reintroduced by a unit file. PrivateTmp=yes hid the worktrees the
    guards' checkpoint runs in (0 entries against 407). runuser could not open a session at all without
    CAP_SYS_RESOURCE, bisected: CAP_AUDIT_WRITE, CAP_CHOWN, CAP_FOWNER and CAP_SYS_ADMIN each fail alone. (5)
    EVERY '! grep' REFUSAL IN THE BUILD STANZA WAS INERT - bash does not apply errexit to a pipeline inverted with
    '!', verified, so the KillMode, ProtectSystem=strict, ProtectKernelTunables and static-HandleLidSwitch guards
    could never fail a build. All rewritten as if-grep-then-FATAL-exit-1, and the suite now asserts no lid refusal
    is spelled '! grep'. NOTE FOR ANOTHER UNIT: the pre-existing '! grep -q apex-remote' in the firewall stanza
    has the same defect, and check-containerfile-assertions.sh does not catch this class. CRITERION 2 IS ASSERTED
    LIVE ON THE L16: a real WireGuard tunnel (real keys, real handshake, two netns with the veth created INSIDE
    one so neither end ever exists in the root namespace and NetworkManager cannot auto-create a saved profile)
    carried 47 of 47 pings with 0 percent loss across a REAL SW_LID close, rx 500 to 6004 bytes DURING the closed
    window, peer still handshaken after; NM's nine saved connections identical before and after. The lid event was
    real: uinput device tagged power-switch by udev, logind said 'Watching system buttons on /dev/input/event21',
    logged 'Lid closed.' and 'Lid opened.', flipped its own LidClosed property, and no suspend or sleep line
    appeared in the journal. WHAT IS NOT MET. Criterion 1 lacks CAUSATION ONLY: the machine did not suspend, but
    THE L16 IS DOCKED (Docked=b true, card1-DP-1 connected) and logind consults HandleLidSwitchDocked, default
    ignore, BEFORE any inhibitor - so the lid would have done nothing with or without the lock. The live suite
    reports that as COULD-NOT-RUN rather than banking a pass it did not earn; re-running with the external display
    unplugged closes it and is the single outstanding assertion for this item. That finding is now surfaced in
    apex lid status, which says which of the two is keeping the machine awake, with 'could not be established' as
    a third answer that is not 'yes'. Criterion 3's 'draws measurably less' COULD NOT BE MEASURED HERE: measuring
    it means applying the real power-down to Andre's live desktop - blanking his panel, blocking his bluetooth,
    stopping his timers - which the standing rules forbid; the power-down and its exact restore are asserted over
    a fixture, and the two ways it could kill a VPN with the machine awake are closed by name against the SHIPPED
    defaults with eleven forbidden units active in the fixture so the assertion can actually fail. Criterion 4 is
    asserted as 'the driver does nothing, so today's behaviour stands' and not by observing a real suspend, which
    is forbidden here. Criteria 5 and 6 are met. The apex-shell tile is still unwritten; status --json now carries
    everything it needs including a logind object (docked, external_displays, block_inhibited, acts_on_lid), and
    apex lid pin needs no privilege by design, so the tile is a read plus one exec with no polkit anywhere.
    Unrelated pre-existing flake recorded on the card: provenance.rs's a_git_status_that_could_not_run test fails
    about one run in three in parallel and never with --test-threads=1; provenance.rs is untouched by this branch.
