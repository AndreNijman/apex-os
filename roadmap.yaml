- id: BASE-009
  title: Preserve Gaming Mode and Performance Lab
  priority: P0
  status: partial
  area: foundation
  depends_on: []
  acceptance:
  - Controller-first gaming path works where supported
  - Desktop/Gaming transitions work
  - Performance metrics remain accurate
  gates:
  - tests
  - stop_slop
  evidence: >-
    Preserve Gaming Mode and Performance Lab. THREE REACHABLE STRANDS CLOSED AND LANDED 2026-09-12 (apex-os merge
    59245497, apex-shell merge cd324ec), and both of the fixes are product defects rather than test gaps. (1) The
    gamingmode argv is now pinned, taking the backends suite 42 -> 47/0. (2) THE GREETER LOCKOUT: a remembered
    session that no longer exists made the picker fall back to SORT ORDER, so a machine whose last session was
    gone could land on a different desktop than the user chose - fixed at 541c9505, greet-sessions 34 -> 41/0, and
    restoring the return prints the lockout verbatim: 'want [hyprland] got [apex-labwc]'. (3) THE POWERMENU GATE:
    Gaming Mode was offered without honouring the same TryExec gate the greeter honours, so it appeared on
    machines with no gamescope at all - fixed at c035671, 12/0. Perf metric accuracy was already proven live (vram
    matched nvidia-smi; frame time honestly unmeasurable). MISSING, NAMED RATHER THAN FAKED, and it is hardware
    and not effort: the live Desktop->Gaming switch and the controller-first path. apex-session-select --switch IS
    loginctl terminate-user, so exercising it ends the session running the test, and this laptop has neither
    gamescope nor steam installed. The gaming machine is off-limits by Andre's instruction of 2026-09-11, so this
