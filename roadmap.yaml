  - stop_slop
  evidence: >-
    Ran live. test-apex-pkg.sh 78/78 and test-apex-resolve.sh 88/88 against the shipped apex-pkg, plus a real
    merged sysext of 20 packages and 15 Flatpaks on L16. Atomic invariants hold, the booted deployment reports
    incompatible false with the sysext merged and apex-pkg never touches rpm-ostree. Advanced selection is live.
    Two defect classes found and fixed since the first pass: unprivileged reads of 0700 state reported as absence,
    and multilib, where apex install steam could not work at all because the guard deleted every i686 library,
    REFUSE_RE rejected the rest, resolution never asked for the 32-bit closure, /lib content never reached a
