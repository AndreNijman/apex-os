    so the other six that fixture APEX_AGENT_SCRATCH_ROOT and start a real agentd were run too, each alone rather
    than in a loop (this repository's suites interfere in a sequential loop and a spurious red there has cost
    rounds before): test-agent-disposable 58/0, which is the interesting one because it swaps the scratch root
    mid-run to a SECOND daemon's; test-agent-worktrees 61/0; test-shell-agent 58/0/0; test-privilege-requests
    39/0; test-project-layout 23/0; test-mux-layouts 47/0/0. 286 assertions, 0 failed. ensure_private_dir_as is
    now pub(crate) rather than pub: its doc comment said 'production callers never reach this', and every other
    crate in the workspace links apex-agent-core, so a pub entry point letting a caller choose which account an
