    rather than inferred from a BUILD SUCCESSFUL line. Pushed with --force-with-lease. TWO DEFECTS FOUND IN REVIEW
    AFTER THAT AND FIXED IN c1ac18e1, both invisible to the tests that already passed: (1) every relayed session
    LEAKED ITS SOCKET - Session.close releases a connection by closing its output then its input, and on the LAN
    leg either closes the socket underneath, but RelayInput/RelayOutput inherited the default no-op close(), so a
    phone held one TCP connection to Cloudflare per session for the life of the process and the desktop kept a
    splice alive for a peer that had gone; RelayLink.close is now idempotent and both adapters reach it (buffered
    bytes, then a Close frame so the relay can free the room, then the socket). (2) the NOISE HANDSHAKE ON THE
    RELAY LEG HAD NO DEADLINE - dial() cleared soTimeout before returning while claiming in its own comment to be
    doing what the LAN leg does; the LAN leg keeps it THROUGH the handshake and clears it after, so a guest joined
    to a host whose splice never answers would have blocked in Client.openSession for ever behind a pairing screen
    with nothing to cancel. Both mutated to check the new gates bite. FINAL TIP c1ac18e1, seven commits. THE RELAY
    LEG NOW EXISTS ON ANDROID AND IS PROVEN THROUGH THE REAL DEPLOYED RELAY (2026-09-19, round 33,
