    debug APK, via ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug with
    JAVA_HOME=/usr/lib/jvm/java-21-openjdk ANDROID_HOME=/var/tmp/android-sdk. MET: real PTY output with ANSI
    16/256/truecolor and attributes — term/Palette.kt fills the hole Colour.resolveCube documents and leaves, and
