    Encrypted backup framework. ALL THREE CRITERIA NOW DONE. Round 1 landed 2026-09-12 as merge 05227d16; round 2
    landed 2026-09-13 as merge cd4a799e (task/p2-a-backup, five commits). CRITERION 1, the one that was open, IS
