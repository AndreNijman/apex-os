  evidence: >-
    Lock-state policy for autonomous sessions. LANDED on apex-os roadmap/v2.2 2026-09-12 as merge 24472b64; the
    shell half landed earlier at apex-shell 665a3cc. Criterion 1 (the user controls whether agents and Remote
    Control continue on lock) closed by 4501f620: 6/0 through lock_tick, and the assertion is made ON THE KERNEL -
    /proc/<pid>/stat - rather than on info.paused, which is only the daemon agreeing with itself. LockState and
    LockPolicy were already section 7 verbatim, decided over 8 policies by 7 origins by 4 states, with Unreadable
    treated as locked and NoDisplaySession as unlocked. The reader is tested too: 8d081ff had landed
    LockedHintService and the Lockscreen line that drives it with no test of any kind, and with the gap a
    change-signal always has - onSecureStateChanged fires on a CHANGE, so a shell restarted while logind believed
    the session locked left LockedHint reading yes until somebody locked and unlocked by hand, and apex-agentd
    polls exactly that property. Criterion 2 ('short-lived root grants revoke on lock by default') is satisfied
    now that P0-007 provides a grant with a lifetime to revoke - it had no subject at all while
    SystemAccess::Session and Unsafe were both refused. REOPENED 2026-09-12->2026-09-19 (round 30): done ->
    PARTIAL, on a defect measured by another unit and then VERIFIED AGAINST THE SOURCE by the integrator rather
    than taken on report. p2-b's round-30 mutation runs hit a 2-in-9 flake and named it:
    src/services/system/LockedHintService.qml's `_succeeded()` ends with `root._pump()` and `_failed()` does NOT -
    it logs, sets `_busy = false`, and returns. Read the pump protocol next to it (lines 44-100 on apex-shell
    8eccbfa) and the consequence is exact: `setLocked()` issued WHILE a chain is in flight only updates
    `_desired`, because `_pump()` returns early on `_busy`; the in-flight chain is chasing the older `_target`. If
    that chain then FAILS, `_failed()` clears `_busy` without pumping, so the newer `_desired` is never acted on
    and never will be until some later lock or unlock calls `setLocked()` again. THE EXISTING COMMENT DOES NOT
    COVER THIS. It argues, correctly, against retrying a step that just failed - 'the next real lock/unlock calls
    setLocked() again on its own' - but the dropped request here is not the failed one, it is a NEWER one that
    arrived meanwhile and has never been tried at all. WHY THIS IS A CRITERION AND NOT A NIT: apex-agentd polls
    logind's LockedHint, which is this service's only output, so a lock silently not reported is agents continuing
    to run through a lock the user engaged - which is criterion 1, 'user controls whether agents/Remote Control
    continue on lock'. Reporting a lock seven times in nine is not that criterion being met. Criterion 2 is
    unaffected. The fix is one line plus the test that fails without it; p2-b deliberately did not make it,
    because it belongs to this item and not to the accessibility unit. Everything recorded above this paragraph
    still stands and was not re-measured this round. ROUND 31 (2026-09-19), THE REOPEN ANSWERED AND MEASURED:
    partial -> DONE. CRITERION 1 IS MET AGAIN, ON AN ASSERTION THAT FAILS WITHOUT THE FIX, BUT THE FIX IS NOT YET
    LANDED - it is apex-shell task/p0-015-repump (f6928d9 fix+test, 8b02b60 the CI step's description, f523a0b the
    stale account in the suite that found it), cut from roadmap/v2.2 @ 8eccbfa, and 8eccbfa still carries the drop
    until the orchestrator merges it. This done is on the strength of a measurement, not of a merge. THE DEFECT IS
    REAL AND IT IS NARROWER THAN THE REOPEN SAID, and the narrowing is what decides the fix. _pump() has a SECOND
    guard, _desired === _confirmed. The state is a boolean, so once _confirmed is a defined bool, a newer _desired
    that differs from the failed _target NECESSARILY EQUALS _confirmed - logind already holds it, and dropping it
    costs nothing. The drop is only observable while _confirmed === undefined, before the service has ever
    successfully reached logind. That is shell startup, exactly when logind's Display session is most likely to be
    missing, and Lockscreen.qml's initial sync already depends on _confirmed starting undefined so that first call
    is never suppressed. A lock engaged in that window was never reported and never would be - criterion 1
    verbatim, since apex-agentd polls LockedHint and this service is its only writer. THE COROLLARY DECIDES THE
    SHAPE: an unconditional re-pump in _failed() is not merely inelegant in that same window, it is an INFINITE
    LOOP, because undefined !== false keeps _pump()'s guard open forever. So the fix makes the distinction in
    code, not in prose: _failed() re-pumps only when _desired !== _target - _target being the value the dead chain
    carried, that test IS 'something newer arrived and was never tried'. It cannot storm structurally rather than
    by promise: the only thing that can make _desired differ from the _target that just failed is another
    setLocked() from OUTSIDE, so a failure can never generate work for itself; N external calls bound the
    follow-ups at N. Deferred with Qt.callLater because _failed() runs inside a Process's onExited and _pump()
    re-arms showUserProc, which on a step-1 failure is that same Process mid-emission; whether Quickshell
    tolerates that was NOT tried and is NOT claimed to fail - the deferred form does not need it to, and what is
    measured is that the follow-up chain launches and delivers on a step-1 failure. THE TEST RUNS QUICKSHELL
    TWICE, and the second run is not padding: its assertions need a service that has never succeeded, and no
    process whose startup sync worked can be put back into that state. New scenario startup-drop ($HINT_SCENARIO)
    in tests/locked-hint-test.qml, new stub mode slow-fail-showuser that sleeps BEFORE it fails so switching the
    control file back to ok mid-sleep rescues only the follow-up chain and not the one already running. Both
    directions: the untried lock must be delivered, and a failure with nothing newer asked for must sit still.
    Premises are asserted rather than assumed (_busy at the moment the newer request arrives, _desired === true &&
    _target === false, _confirmed === undefined). MEASURED, sway headless in a private XDG_RUNTIME_DIR: unmutated
    main 31/0 + startup-drop 10/0 = 41/0 exit 0. MUTANT A, the condition forced to false (the pre-fix _failed):
    startup-drop 7 passed / 3 failed, exit 1, logging 'note: 1 calls: [loginctl show-user ...]' - the lock never
    reached logind - AND main STAYED 31/0, which is the measured answer to whether the existing suite was enough:
    it was not and could not have been. MUTANT B, forced to true (the naive unconditional re-pump): startup-drop
    8/2 with the negative control reading 'note: 342 calls in 1.2s', and main also red at 20/7. Restored with git
    checkout --, sha256sum -c OK against 4c3715f1697fa837ccd24b4492e0f6d96cf268220d42ba065543f4ee97559aec, tree
    clean, re-run 41/0 exit 0. AND THE 2-IN-9 FLAKE IS THIS WINDOW, on primary-source evidence rather than
    inference, correcting what this paragraph first said: the flake is in tests/run-lockscreen-atspi-shim.sh, not
    in the locked-hint suite, and that file's own comment at lines 274-289 names the mechanism - its loginctl stub
    exits 0 with no stdout, so step 1 always fails and _confirmed never leaves undefined, and a setLocked(true)
    arriving during the failing startup chain was dropped because _failed() did not re-pump. The shim closed it
    with a WAIT rather than a fix. NOT RE-RUN THIS ROUND and the 2-in-9 rate is not re-measured; what is measured
    is the mechanism, in tests/locked-hint-test.qml's startup-drop scenario. That stale shim comment is corrected
    by f523a0b, which also measures the whole atspi suite against the fix: tests/run-lockscreen-atspi.sh 17 passed
    / 0 failed / 6 skipped exit 0 on labwc headless, including 'labwc acknowledged ext-session-lock' and 'an
    ENGAGED lock still asks logind for nothing' - the lock's own setLocked(true) finds the service idle, its chain
    fails at step 1, _desired === _target, and the new path correctly does nothing.
    tests/check-headless-runners.sh 28/0. Also fixed in passing, in the runner being edited anyway: two `echo
    "$out" | grep -q` gradings became `[[ == * ]]`, because under set -o pipefail a grep -q that MATCHES can
    return 141. NO APEX-OS CHANGE WAS NEEDED OR MADE and no empty task/p0-014-repump branch was created; criterion
    2 was untouched this round and is not re-claimed. Everything recorded above this paragraph still stands and
    was not re-measured. LANDED round 30 (2026-09-19): task/p0-015-repump tip f523a0b merged onto apex-shell
    roadmap/v2.2 as f068f24 - three commits, 296 insertions over 5 files - no conflicts,
    check-no-conflict-markers.sh PASS, pushed with --force-with-lease. So the fix is now ON the integration
    branch; the agent correctly noted at hand-off that it was not yet. RE-RUN BY THE INTEGRATOR ON THE MERGED TIP
    f068f24 rather than inherited from the branch: tests/run-locked-hint-test.sh 41 passed / 0 failed over both
    scenarios (main 31/0, startup-drop 10/0, exit 0) with the new line 'a lock asked for during a chain that then
    FAILED still reaches logind' present, and the three no-retry negative controls still passing;
    tests/check-headless-runners.sh 28/0; check-suites-run-in-ci.sh 66 suites / 66 reachable / 0 exempt; the
    ci.yml structure-check REQUIRED list 112 paths / 0 missing; ci.yml parses. A CORRECTION TO THIS ITEM'S OWN
    REOPEN PARAGRAPH, kept rather than quietly edited because the reopen is what dispatched the fix: the
    orchestrator's reopen said the drop applied whenever a newer setLocked() arrived during a failing chain. IT IS
    NARROWER THAN THAT, and the narrowing is what decided the shape of the fix. _pump() has a SECOND guard,
    _desired === _confirmed. The state is boolean, so once _confirmed is a defined bool a newer _desired that
    differs from the failed _target necessarily EQUALS _confirmed and there is nothing to send. The drop is only
    observable while _confirmed === undefined - before the service has ever reached logind, which is shell
    startup, which is exactly when logind's Display session is most likely missing. The same fact is why an
    unconditional re-pump would have been an INFINITE LOOP there (undefined !== false keeps the guard open),
    measured as mutant B's '342 calls in 1.2s'. The landed fix re-pumps only when _desired !== _target, which
    cannot storm structurally rather than by promise: the only thing that can make _desired differ from the
    _target that just failed is another setLocked() from OUTSIDE, so a failure can never generate work for itself
    and N external calls bound the follow-ups at N. Criterion 1 is met again, and on an assertion that fails
    without the change: mutant A - the pre-fix _failed - leaves main at 31/0 and takes startup-drop to 7/3, which
    is the measured answer to whether the existing suite could ever have caught this. It could not.
- id: P0-016
  title: Add Agent Settings page with password-gated Always Unrestricted toggle
  priority: P0
