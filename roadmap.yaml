- id: P0-004
  title: Split native bypass, sandbox, root, secret, network, and origin policy
  priority: P0
  status: done
  area: agent-security
  depends_on: []
  acceptance:
  - Each policy dimension is independently configurable
  - bypassPermissions does not disable APEX sandbox
  - unrestricted-user does not imply root
  - root grant does not imply secret export
  gates:
