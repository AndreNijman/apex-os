global_agent_rules:
- Inspect the current APEX-OS and APEX Shell source before changing anything.
- Verify an existing implementation before reimplementing it.
- Preserve upstream TUI agent interfaces; APEX supervises and secures them rather than replacing them.
- Never collapse agent-native bypass, APEX sandboxing, root/system grants, secret access, network policy, or remote-origin
  policy into one switch.
- 'Every task MUST run `/stop-slop` before it can be marked done. Apply it to all human-facing prose changed by the task:
  UI copy, help, docs, errors, notifications, READMEs, release notes, comments intended for humans, PR/commit text prepared
  by the agent. Do not rewrite code identifiers, commands, paths, logs, config keys, or machine protocols merely to satisfy
  prose style.'
- Do not mark a task done without tests/evidence satisfying its acceptance criteria.
