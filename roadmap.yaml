- id: P1-028
  title: Separate local and cloud-side connector trust planes
  priority: P1
  status: done
  area: agent-security
  depends_on:
  - P0-004
  acceptance:
  - Security UI distinguishes local vs remote connectors
  - Hardened profiles can reduce cloud-side tools/connectors
  gates:
  - tests
  - stop_slop
  evidence: >-
    Separate local and cloud-side connector trust planes. Both criteria met. CRITERION 1 DONE: the security
    surface distinguishes local from remote connectors, measured live on this laptop at 1 local and 2 cloud.
    apexd/apex/src/connector.rs's Plane is three-valued - Local, Cloud, and Unknown for a definition with neither
    a command nor a url, because calling that local would say something specific and false about what confines it
    - and apex mcp list prints the plane beside every server, apex mcp planes groups by it, and the two get
    different mitigations named in the same breath: a local program is confined by bubblewrap via apex mcp run, a
    cloud endpoint has no local process at all and its credential is the boundary. ROUND 2 IS WHAT MAKES THAT
    STAND UP RATHER THAN JUST EXIST. The readout was written when the per-connector switch was a remainder and
    still said so in five places on a tip that had built it - 'there is no per-server switch', 'the only way to
    stop a single one today is to disable the whole plugin that defines it', perConnectorSwitch: false, and a
    closing sentence naming sidecar.rs's unbuilt --strict-mcp-config path. A security readout that tells a person
    a control does not exist is worse than one that never mentioned it, so 93ea60f4 replaced the prose with
    measurement. CRITERION 2 DONE, and no longer in the coarse sense the previous evidence correctly refused to
    overclaim. ConnectorPolicy (dimension 7, protocol 7, landed round 1 as 564fffd5) is as_configured | local_only
    | curated | none: local_only removes the cloud plane WITHOUT removing the network, which the sandbox route
    cannot do, and curated keeps only the connectors named in connector_allow - in the RUNTIME's configuration,
    not in the request, for the reason network_allow lives there: a list the confined thing gets to write is not a
    boundary. validate_for refuses a curated session against an empty list rather than starting it with everything
    removed, because 'nobody filled this in' and 'reach nothing' are different statements and --connectors none
    already makes the second. The table in apex mcp planes is RUN, not written: Launch::measure calls the real
    mcpconf::curate once per ConnectorPolicy value over this machine's real definitions, with the same approvals
    and the same connector_allow apex-agentd reads in install_mcp_config, so a row that started describing a
    policy the launcher no longer applies fails a named test instead of being printed to somebody making a
    security decision. Measured live here: 1 local (memory, the user's own definition, not sandboxed), 2 cloud
    (claude-memory, plugin:github:github, both with agent-readable credentials); connector_allow is EMPTY so
    --connectors curated is REFUSED rather than run and the report says that instead of printing a row of zeroes;
    --connectors local_only would drop 2 of the 3. THE QUALIFIER, recorded rather than buried: every one of those
    numbers is about a session started through apex agent, on an adapter that can be told to ignore every other
    MCP configuration - claude alone today, read off Adapter::strict_mcp rather than hard-coded. Start the agent
    yourself and you get every connector on the machine, unreduced. The readout says that in words and the JSON
    carries it as appliesOnlyToSessionsStartedBy, because the consumer most likely to over-claim is the one that
    never reads the prose. ON THE WORD 'UI': the security surface here is the CLI, which is where every other APEX
    security readout lives - apex mcp policy, apex provenance show, apex verify. apex-shell has NO connector
    surface of any kind: grep -rl mcp over apex-shell/src returns nothing, and AgentCenter.qml answers 'what is
    running, what needs me, and take me to it' rather than anything about trust. A dashboard section would be the
    shell's FIRST security surface, which is a shell feature rather than the unmet half of this criterion; if it
    is wanted it goes on task/p1-025-plugin-trust-shell in an apex-shell worktree, reading apex mcp planes --json,
    beside AgentCenter.qml. That is stated here so nobody has to infer it from silence. Counts: apexd workspace
    2880 -> 2888 passed, 0 failed; clippy --locked --workspace --all-targets -D warnings clean. Mutations for this
    item, each watched red on a NAMED test and restored byte-identical with plain cp: decide's Curated arm made
    unconditional takes apex 12/0 -> 11/1 on a_connector_policy_row_is_the_curators_own_answer with (2,1,0) not
    (0,1,2), proving the table is the curator's answer and not a copy of it; confinement_line's AtLaunch arm
    returning the InDefinition sentence takes 12/0 -> 11/1 on
    the_report_says_where_the_reduction_applies_and_where_it_stops. A FIFTH commit, e48234fb, gives this criterion
    its first shell-level guard: tests/test-apex-skill.sh had nothing at all about the per-connector switch. Six
    assertions added - that the --connectors table is printed, that it names local_only, that the readout says
    where the selection applies and where it stops, that the JSON carries perConnectorSwitch with its scope and a
    row per policy value, and that an empty connector_allow prints a refusal rather than a row of zeroes.
    Fixture-driven: the suite's run() sets XDG_CONFIG_HOME into the fixture, so the empty list asserted is the
    fixture's and not this machine's. tests/test-apex-skill.sh --with-binary: 73/0 on the tip -> 82/0 on this
    branch. Branch task/p1-025-plugin-trust-2 (cbcacfc3, 93ea60f4, 4ac67153, 7f0038d3, e48234fb), pushed, unmerged
    at the time of writing; round 1 is merged as 564fffd5. ROUND 4 (branch task/p1-025-plugin-trust-4, pushed,
    unmerged at the time of writing) does not change this answer; round 2's branch has since landed. Two updates
    of fact. First, the counts: tests/test-apex-skill.sh is now 96 passed / 0 failed with --with-binary rather
    than 82/0, and apexd workspace 3057 passed / 0 failed rather than 2888. Second, the trust planes gained a
    sibling that the readout now names: dimension 8 (plugin policy, protocol 8), which REMOVES a plugin where
    dimension 7 confines its MCP servers, because a plugin's hooks are spawned by the agent itself and no MCP
    document reaches them. apex provenance show prints that remedy beside the shortfall and the JSON carries
    removableByPluginPolicy - see P1-026. The shell half of criterion 1 is unchanged: apex-shell still has no
    connector surface, and a dashboard section would be its first security surface rather than the unmet half of
    this criterion.
